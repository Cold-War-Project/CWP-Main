l_english:
# Cold War Project: vanilla 1.15.1 builds revolt names as "Revolutionary [ConcatIfNeitherEmpty('$PREFIX|q$',' ')]$NAME$".
# When the engine does not pass PREFIX (seen for revolts in Danish Greenland), the literal word "PREFIX" leaks
# into the name ("Revolutionary PREFIX Greenland"). Revolt names here drop the overlord prefix.
 REVOLUTION_COUNTRY_NAME: "Revolutionary $NAME$"
 REVOLUTION_COUNTRY_ADJECTIVE: "Revolutionary $ADJECTIVE$"
