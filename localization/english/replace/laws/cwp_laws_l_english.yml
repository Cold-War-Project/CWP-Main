# Cold War corporatism and council laws (restored from vanilla 1.15 and recast):
  law_corporate_state: "State Corporatism"
  law_corporate_state_desc: "The state licenses employers' associations, unions and professional bodies as official corporations and governs above them, banning independent parties and strikes in the name of national harmony. This was the model of Salazar's Estado Novo, Franco's Spain and, in a populist form, Perón's Argentina."
  law_corporatized_unions: "State-Controlled Unions"
  law_corporatized_unions_desc: "Unions are licensed and directed by the state or the ruling party, as with the Soviet trade unions, Franco's vertical syndicates or the Peronist CGT. They deliver welfare and discipline rather than independent bargaining."
  law_factory_councils: "Workers' Self-Management"
  law_factory_councils_desc: "Elected workers' councils run their own enterprises and share in their income, as in Yugoslavia after 1950 or the Hungarian and Polish councils of 1956. The state sets the plan's frame, but management answers to the workforce."
  law_council_republic_desc: "Sovereignty formally rests with elected councils, or soviets, of workers and peasants. In practice the ruling party nominates every candidate and decides policy, and the councils ratify it."
