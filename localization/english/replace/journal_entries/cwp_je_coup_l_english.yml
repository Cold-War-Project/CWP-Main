l_english:
# Journal Entries:
  je_coup: "Coup!"
  je_coup_reason: "The [SCOPE.sCharacter('coup_character_leader').GetCustom('ordered_personality_traits_loc')|l] [SCOPE.sCharacter('coup_character_leader').GetRankName] [SCOPE.sCharacter('coup_character_leader').GetFullName], a figure respected amongst the [SCOPE.gsInterestGroup('coup_interest_group').GetName], has begun to maneuver towards seizing state power through force of arms.\n\nWhilst this [concept_journal_entry] is active, the rate at which the $concept_coup$ will #tooltippable;tooltip:[GetPlayer.GetTooltipTag],coup_progress_factors_tt advance#! or #tooltippable;tooltip:[GetPlayer.GetTooltipTag],coup_regress_factors_tt deplete#! will be determined by [SCOPE.sCharacter('coup_character_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('coup_character_leader').GetLastName]'s [concept_coup_strength] ([SCOPE.sCharacter('coup_character_leader').MakeScope.Var('monthly_cached_commander_coup_strength').GetValue|v2]) subtracted by [ROOT.GetCountry.GetName]'s [concept_coup_resistance] ([SCOPE.ScriptValue('country_coup_resistance')|v2]). If #b Progress#! reaches #v 100%#!, and [SCOPE.sCharacter('coup_character_leader').GetLastNameNoFormatting] is able to launch [SCOPE.sCharacter('coup_character_leader').GetHerHis] [concept_coup], there is a risk of our government being overturned."

# Progress Bars:
  je_coup_progress_bar: "Coup"
  je_coup_progress_bar_desc: "Progress: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/120)"

# Tooltips:
  je_coup_progress_bar_add_50_tt: "The #v $je_coup$#! #b progress bar#! will advance by #v 50#!"
