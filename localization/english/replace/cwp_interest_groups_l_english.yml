l_english:
 # Interest group renames (Jack, November 2026): Defense Establishment, Big Business, Agrarians, Middle Class, Technocrats, Organized Labor. Keys unchanged.
 ACHIEVEMENT_DESC_achievement_euphoric:0 "Pass the State Atheism Law and have the Technocrats be Powerful"
 ACHIEVEMENT_DESC_achievement_military_junta:0 "Have a Commander affiliated with the Defense Establishment coup the government"
 academics_desc:0 "Researchers, doctors, lawyers and other educated professionals studying and teaching in academic institutions. Politically, they are at the forefront of the Technocrats."
 achievement_military_junta.tt:0 "Have a Commander affiliated with the Defense Establishment coup the government"
 balkan_wars_surplus_armed_forces_boost_mod:0 "Rewarded Defense Establishment"
 bureaucrats_desc:0 "Officials responsible for administration of government functions and infrastructure. Politically, they tend to align with the Technocrats or Middle Class."
 clerks_desc:0 "Lower-ranking office workers performing administrative tasks in government, infrastructure and shops. Commonly part of the Middle Class, although some join Organized Labor."
 conservative_intelligentsia:0 "Conservative Technocrats"
 cultural_renaissances_events.5.d:0 "A surge in interest for the culture and lifestyle of the peasantry has taken hold among the Polish and Ukrainian Technocrats, spending time among Ukrainian peasants in particular and championing their culture."
 decree_agricultural_rural_folk_attraction:0 "Agrarian Accomplishment"
 decree_manufacturing_industrialist_attraction:0 "Big Business Accomplishment"
 decree_manufacturing_petty_bourgeoisie_attraction:0 "Middle Class Accomplishment"
 decree_resource_industrialists_attraction:0 "Big Business Accomplishment"
 engineers_desc:0 "Inventors and designers of technical solutions, working with advanced machinery in sectors like manufacturing, mining and construction. Some support Big Business or Middle Class, while others join Organized Labor."
 farmers_desc:0 "Sharecroppers, smallholders and others who make a stable but scant living producing food or growing cash crops. Most see their interests represented as the Agrarians."
 from_early_rural_folk:0 "Limited Suffrage for Agrarians"
 from_no_rural_folk_in_party:0 "Lack of Agrarian Backing"
 from_powerful_capitalists_other:0 "Stronger Big Business Interest Group"
 from_powerful_unions:0 "Powerful Organized Labor"
 historical_agitators.1.d:0 "Freshly returned after a three-year exile in Siberia, [SCOPE.sCharacter('historic_agitator_scope').GetFullName] has met with colleagues in Organized Labor to discuss his next move."
 historical_agitators.17.d:0 "Echoing sentiments across the Defense Establishment, [SCOPE.sCharacter('historic_agitator_scope').GetFullName] has called for revenge against [SCOPE.sCountry('revenge_country').GetName] to thunderous applause."
 historical_agitators.22.d:0 "A Chartist march in Newport turned to bloody violence. Defense Establishment personnel captured the throng, including one of its commanders, John Frost."
 ig_armed_forces:0 "Defense Establishment"
 ig_industrialists:0 "Big Business"
 ig_intelligentsia:0 "Technocrats"
 ig_intelligentsia_desc:0 "Engineers, managers, administrators, scientists and other credentialed professionals: a class whose standing rests on expertise rather than property or birth, and which expects to run the modern state and economy."
 ig_petty_bourgeoisie:0 "Middle Class"
 ig_rural_folk:0 "Agrarians"
 ig_trade_unions:0 "Organized Labor"
 ig_urbanization_industrialists:0 "Favored Big Business"
 industrialist_tax:0 "Big Business Tax"
 industrialists_rejected_modifier:0 "Rejected Big Business Liquor Demands"
 intelligentsia_doubly_grieved:0 "Technocrat Grievances"
 je_strike_break_reason:0 "Ongoing strikes are hindering productivity. Big Business has asked us to resolve the matter in their favor."
 je_strike_promise_reason:0 "We have promised striking Organized Labor that we will pass specific legislation within ten years. If we do not fulfill this promise, we can expect a disastrous General Strike."
 je_strike_promise_status:0 "Pass the law or expand the institution that was promised to Organized Labor."
 je_tp_tsar_crown_of_perfection_button_1_name:0 "Patronize the Technocrats"
 laborers_desc:0 "Day laborers, farmhands and others with little to no employment security, performing whatever work is available throughout society. They are usually not engaged in politics, but may get involved through Organized Labor."
 labour_associations_events.3.t:0 "The Commission on Organized Labor"
 lands_of_anarchy_armed_forces_tribal_leader_mod:0 "Tribal Defense Establishment Leader"
 lands_of_anarchy_rural_folk_tribal_leader_mod:0 "Tribal Agrarian Leader"
 machinists_desc:0 "Manual workers with stable employment operating machinery in manufacturies, mines, mechanized farms and other sectors. Politically, they tend to be a driving force in Organized Labor."
 modifier_art_silk_research:0 "Big Business Patronized"
 modifier_bonapartist_armed_forces_modifier:0 "Defense Establishment Patronized"
 modifier_collective_antagonism_funds:0 "Big Business Coercion Funds"
 modifier_corporate_state_industrialists_bias:0 "Corporate State: Favored Big Business"
 modifier_corporate_state_intelligentsia_bias:0 "Corporate State: Favored Technocrats"
 modifier_corporate_state_trade_unions_bias:0 "Corporate State: Favored Organized Labor"
 modifier_egalitarian_workers_movement:0 "Egalitarian Organized Labor"
 modifier_favorable_trade_union_report:0 "Favorable Report on Organized Labor"
 modifier_hostile_trade_union_report:0 "Hostile Report on Organized Labor"
 modifier_industrialists_rebuffed_advance:0 "Rebuffed by Big Business"
 modifier_intelligentsia_plan_thwarted:0 "Technocrats Split"
 modifier_orleanist_industrialist_modifier:0 "Big Business Patronized"
 modifier_republican_intelligentsia:0 "Radicalized Technocrats"
 modifier_simple_town_pro_intelligentsia:0 "Protected Technocrats"
 modifier_trade_union_conflicts:0 "Divided Organized Labor"
 modifier_yellow_trade_unions:0 "Yellow Organized Labor"
 officers_desc:0 "Commissioned officers commanding the nation's military forces in the army and navy. Politically, they represent the upper echelons of the Defense Establishment."
 portuguese_failed_armed_forces_blamed_pink_map_campaign_mod:0 "Blamed Defense Establishment for Failure"
 samurai_rename.tt:0 "The Samurai Interest Group will be reorganized into the Defense Establishment"
 shopkeepers_desc:0 "Owners and managers of stores, selling wares to customers in cities. They usually fall within the Middle Class politically."
 sided_with_capitalists_over_scrips:0 "Sided with Big Business in Credit Matter"
 soldiers_desc:0 "Soldiers and sailors making up the bulk of the nation's military personnel. They commonly align politically with their role as part of the Defense Establishment."
 strike_negotiate_tooltip:0 "We will have to pass a [concept_law] or expand an [concept_institution] favorable to Organized Labor"
