l_english:
 # Interest group names (Jack, November 2026; American spelling): Defense Establishment, Business Interests, Agrarian Communities, Petty Bourgeoisie, Educated Professionals, Organized Labor, Religious Groups, Rural Landowners, Bureaucratic Apparatus. Keys unchanged.
 ACHIEVEMENT_DESC_achievement_euphoric:0 "Pass the State Atheism Law and have the Educated Professionals be Powerful"
 ACHIEVEMENT_DESC_achievement_military_junta:0 "Have a Commander affiliated with the Defense Establishment coup the government"
 academics_desc:0 "Researchers, doctors, lawyers and other educated professionals studying and teaching in academic institutions. Politically, they are at the forefront of the Educated Professionals."
 achievement_military_junta.tt:0 "Have a Commander affiliated with the Defense Establishment coup the government"
 balkan_wars_surplus_armed_forces_boost_mod:0 "Rewarded Defense Establishment"
 bureaucrats_desc:0 "Officials responsible for administration of government functions and infrastructure. Politically, they tend to align with the Educated Professionals or Petty Bourgeoisie."
 character_events.4.t:0 "Religious Scandal"
 clergymen_desc:0 "Priests, scholars and other religious leaders tending to the spiritual needs of the rural population. Politically, they are the backbone of the Religious Groups."
 clerks_desc:0 "Lower-ranking office workers performing administrative tasks in government, infrastructure and shops. Commonly part of the Petty Bourgeoisie, although some join Organized Labor."
 conservative_intelligentsia:0 "Conservative Educated Professionals"
 cultural_renaissances_events.5.d:0 "A surge in interest for the culture and lifestyle of the peasantry has taken hold among the Polish and Ukrainian Educated Professionals, spending time among Ukrainian peasants in particular and championing their culture."
 decree_agricultural_devout_attraction:0 "Religious Accomplishment"
 decree_agricultural_rural_folk_attraction:0 "Agrarian Accomplishment"
 decree_manufacturing_industrialist_attraction:0 "Business Accomplishment"
 decree_manufacturing_petty_bourgeoisie_attraction:0 "Petty Bourgeoisie Accomplishment"
 decree_resource_industrialists_attraction:0 "Business Accomplishment"
 engineers_desc:0 "Inventors and designers of technical solutions, working with advanced machinery in sectors like manufacturing, mining and construction. Some support Business Interests or Petty Bourgeoisie, while others join Organized Labor."
 farmers_desc:0 "Sharecroppers, smallholders and others who make a stable but scant living producing food or growing cash crops. Most see their interests represented as the Agrarian Communities."
 from_early_rural_folk:0 "Limited Suffrage for Agrarian Communities"
 from_no_rural_folk_in_party:0 "Lack of Agrarian Backing"
 from_powerful_capitalists_other:0 "Stronger Business Interest Group"
 from_powerful_unions:0 "Powerful Organized Labor"
 from_relevant_landowners:0 "From Significant Rural Landowners"
 government_conflicts.2.b:0 "Rural Landowners must accept the power of the workers."
 historical_agitators.1.d:0 "Freshly returned after a three-year exile in Siberia, [SCOPE.sCharacter('historic_agitator_scope').GetFullName] has met with colleagues in Organized Labor to discuss his next move."
 historical_agitators.17.d:0 "Echoing sentiments across the Defense Establishment, [SCOPE.sCharacter('historic_agitator_scope').GetFullName] has called for revenge against [SCOPE.sCountry('revenge_country').GetName] to thunderous applause."
 historical_agitators.22.d:0 "A Chartist march in Newport turned to bloody violence. Defense Establishment personnel captured the throng, including one of its commanders, John Frost."
 ig_armed_forces:0 "Defense Establishment"
 ig_bureaucrats:0 "Bureaucratic Apparatus"
 ig_bureaucrats_desc:0 "Civil servants and administrative officials who run the institutions of the state and stay at their desks as governments come and go."
 ig_devout:0 "Religious Groups"
 ig_industrialists:0 "Business Interests"
 ig_intelligentsia:0 "Educated Professionals"
 ig_intelligentsia_desc:0 "Engineers, managers, administrators, scientists and other credentialed professionals: a class whose standing rests on expertise rather than property or birth, and which expects to run the modern state and economy."
 ig_landowners:0 "Rural Landowners"
 ig_petty_bourgeoisie:0 "Petty Bourgeoisie"
 ig_rural_folk:0 "Agrarian Communities"
 ig_trade_unions:0 "Organized Labor"
