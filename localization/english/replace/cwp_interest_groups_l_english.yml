l_english:
 # Interest group renames (team politics dev, November 2026). Keys unchanged; every vanilla English string that names these groups is overridden here.
 ACHIEVEMENT_DESC_achievement_euphoric:0 "Pass the State Atheism Law and have the Professional Managerial Class be Powerful"
 ACHIEVEMENT_DESC_achievement_military_junta:0 "Have a Commander affiliated with the Defence Establishment coup the government"
 academics_desc:0 "Researchers, doctors, lawyers and other educated professionals studying and teaching in academic institutions. Politically, they are at the forefront of the Professional Managerial Class."
 achievement_military_junta.tt:0 "Have a Commander affiliated with the Defence Establishment coup the government"
 balkan_wars_surplus_armed_forces_boost_mod:0 "Rewarded Defence Establishment"
 bureaucrats_desc:0 "Officials responsible for administration of government functions and infrastructure. Politically, they tend to align with the Professional Managerial Class or Petty Bourgeoisie."
 clerks_desc:0 "Lower-ranking office workers performing administrative tasks in government, infrastructure and shops. Commonly part of the Petty Bourgeoisie, although some join Organised Labor."
 conservative_intelligentsia:0 "Conservative Professional Managerial Class"
 cultural_renaissances_events.5.d:0 "A surge in interest for the culture and lifestyle of the peasantry has taken hold among the Polish and Ukrainian Professional Managerial Class, spending time among Ukrainian peasants in particular and championing their culture."
 decree_agricultural_rural_folk_attraction:0 "Rural Lower Class Accomplishment"
 decree_manufacturing_industrialist_attraction:0 "High Bourgeois Accomplishment"
 decree_manufacturing_petty_bourgeoisie_attraction:0 "Petty Bourgeoisie Accomplishment"
 decree_resource_industrialists_attraction:0 "High Bourgeois Accomplishment"
 engineers_desc:0 "Inventors and designers of technical solutions, working with advanced machinery in sectors like manufacturing, mining and construction. Some support the High Bourgeois or Petty Bourgeoisie, while others join Organised Labor."
 farmers_desc:0 "Sharecroppers, smallholders and others who make a stable but scant living producing food or growing cash crops. Most see their interests represented as the Rural Lower Class."
 from_early_rural_folk:0 "Limited Suffrage for Rural Lower Class"
 from_no_rural_folk_in_party:0 "Lack of Rural Lower Class Backing"
 from_powerful_capitalists_other:0 "Stronger High Bourgeois Interest Group"
 from_powerful_unions:0 "Powerful Organised Labor"
 historical_agitators.1.d:0 "Freshly returned after a three-year exile in Siberia, [SCOPE.sCharacter('historic_agitator_scope').GetFullName] has met with colleagues in the Organised Labor to discuss his next move."
 historical_agitators.17.d:0 "Echoing sentiments across the Defence Establishment, [SCOPE.sCharacter('historic_agitator_scope').GetFullName] has called for revenge against [SCOPE.sCountry('revenge_country').GetName] to thunderous applause."
 historical_agitators.22.d:0 "A Chartist march in Newport turned to bloody violence. Defence Establishment personnel captured the throng, including one of its commanders, John Frost."
 ig_armed_forces:0 "Defence Establishment"
 ig_industrialists:0 "High Bourgeois"
 ig_intelligentsia:0 "Professional Managerial Class"
 ig_intelligentsia_desc:0 "Engineers, managers, administrators, technocrats and credentialed professionals, together with the writers and academics who lead the nation's debates: a class whose standing rests on expertise rather than property or birth."
 ig_petty_bourgeoisie:0 "Petty Bourgeoisie"
 ig_rural_folk:0 "Rural Lower Class"
 ig_trade_unions:0 "Organised Labor"
 ig_urbanization_industrialists:0 "Favored the High Bourgeois"
 industrialist_tax:0 "High Bourgeois Tax"
 industrialists_rejected_modifier:0 "Rejected High Bourgeois Liquor Demands"
 intelligentsia_doubly_grieved:0 "Professional Managerial Class Grievances"
 je_strike_break_reason:0 "Ongoing strikes are hindering productivity. The High Bourgeois have asked us to resolve the matter in their favor."
 je_strike_promise_reason:0 "We have promised the striking Organised Labor that we will pass specific legislation within ten years. If we do not fulfill this promise, we can expect a disastrous General Strike."
 je_strike_promise_status:0 "Pass the law or expand the institution that was promised to the Organised Labor."
 je_tp_tsar_crown_of_perfection_button_1_name:0 "Patronize the Professional Managerial Class"
 laborers_desc:0 "Day laborers, farmhands and others with little to no employment security, performing whatever work is available throughout society. They are usually not engaged in politics, but may get involved through Organised Labor."
 labour_associations_events.3.t:0 "The Commission on Organised Labor"
 lands_of_anarchy_armed_forces_tribal_leader_mod:0 "Tribal Defence Establishment Leader"
 lands_of_anarchy_rural_folk_tribal_leader_mod:0 "Tribal Rural Lower Class Leader"
 machinists_desc:0 "Manual workers with stable employment operating machinery in manufacturies, mines, mechanized farms and other sectors. Politically, they tend to be a driving force in the Organised Labor."
 modifier_art_silk_research:0 "High Bourgeois Patronized"
 modifier_bonapartist_armed_forces_modifier:0 "Defence Establishment Patronized"
 modifier_collective_antagonism_funds:0 "High Bourgeois Coercion Funds"
 modifier_corporate_state_industrialists_bias:0 "Corporate State: Favored High Bourgeois"
 modifier_corporate_state_intelligentsia_bias:0 "Corporate State: Favored Professional Managerial Class"
 modifier_corporate_state_trade_unions_bias:0 "Corporate State: Favored Organised Labor"
 modifier_egalitarian_workers_movement:0 "Egalitarian Organised Labor"
 modifier_favorable_trade_union_report:0 "Favorable Report on Organised Labor"
 modifier_hostile_trade_union_report:0 "Hostile Report on Organised Labor"
 modifier_industrialists_rebuffed_advance:0 "Rebuffed by High Bourgeois"
 modifier_intelligentsia_plan_thwarted:0 "Professional Managerial Class Split"
 modifier_orleanist_industrialist_modifier:0 "High Bourgeois Patronized"
 modifier_republican_intelligentsia:0 "Radicalized Professional Managerial Class"
 modifier_simple_town_pro_intelligentsia:0 "Protected Professional Managerial Class"
 modifier_trade_union_conflicts:0 "Divided Organised Labor"
 modifier_yellow_trade_unions:0 "Yellow Organised Labor"
 officers_desc:0 "Commissioned officers commanding the nation's military forces in the army and navy. Politically, they represent the upper echelons of the Defence Establishment."
 portuguese_failed_armed_forces_blamed_pink_map_campaign_mod:0 "Blamed Defence Establishment for Failure"
 samurai_rename.tt:0 "The Samurai Interest Group will be reorganized into the Defence Establishment"
 shopkeepers_desc:0 "Owners and managers of stores, selling wares to customers in cities. They usually fall within the Petty Bourgeoisie politically."
 sided_with_capitalists_over_scrips:0 "Sided with High Bourgeois in Credit Matter"
 soldiers_desc:0 "Soldiers and sailors making up the bulk of the nation's military personnel. They commonly align politically with their role as part of the Defence Establishment."
 strike_negotiate_tooltip:0 "We will have to pass a [concept_law] or expand an [concept_institution] favorable to the Organised Labor"
 the_grand_collapse_desperate_measures_armed_forces:0 "Lobbied Defence Establishment"
 the_grand_collapse_desperate_measures_industrialists:0 "Lobbied High Bourgeois"
 the_grand_collapse_desperate_measures_intelligentsia:0 "Lobbied Professional Managerial Class"
 the_grand_collapse_desperate_measures_rural_folk:0 "Lobbied Rural Lower Class"
 the_grand_collapse_desperate_measures_trade_unions:0 "Lobbied Organised Labor"
 ukrainophile_intelligentsia:0 "Ukrainophile Professional Managerial Class"
