 industrialist_tax:0 "Business Tax"
 industrialists_rejected_modifier:0 "Rejected Business Interests' Liquor Demands"
 intelligentsia_doubly_grieved:0 "Educated Professionals' Grievances"
 invite_exile_devout_tt:0 "Religious Groups [Concept('concept_character', '$concept_characters|q$')] must have our [concept_state_religion]"
 je_strike_break_reason:0 "Ongoing strikes are hindering productivity. Business Interests have asked us to resolve the matter in their favor."
 je_strike_promise_reason:0 "We have promised striking Organized Labor that we will pass specific legislation within ten years. If we do not fulfill this promise, we can expect a disastrous General Strike."
