l_english:
# Coup Pulse Events
  coup_pulse_events.1.t: "General Accused of Plot"
  coup_pulse_events.1.d: "[SCOPE.sCharacter('accused_general').GetFullName], a general associated with the [SCOPE.gsInterestGroup('accused_general_ig').GetName], has been accused of grave disloyalty. [SCOPE.sCharacter('accused_general').GetFullName] claims that this is nothing but a plot by subversive elements to remove a barrier to their rule."
  coup_pulse_events.1.f: ""I assure you, gentlemen, I have no knowledge of any of the actions detailed in these alleged letters of mine. If you must go through my personal effects to exonerate me, I welcome you to.""
  coup_pulse_events.1.a: "We cannot take chances with the loyalties of our generals."
  coup_pulse_events.1.a.tt: "[SCOPE.sCharacter('accused_general').GetFullName] will be retired."
  coup_pulse_events.1.b: "Who, exactly, made this accusation?"

  coup_pulse_events.2.t: "A Growing Split"
  coup_pulse_events.2.d: "The [SCOPE.gsInterestGroup('conflicted_loyalty_ig').GetName], despite being closely associated with [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetLastName]'s [SCOPE.sParty('conflicted_loyalty_party').GetName], object to the notion of overturning the government by force."
  coup_pulse_events.2.f: ""What reason is there to continue our partnership? First you grow distant, and now there is talk of opposing the very foundations of state order itself. I request that you explain these allegations immediately, lest the next motion on the floor be my resignation.""
  coup_pulse_events.2.a: "Claiming good intentions can sway even the purest soul."
  coup_pulse_events.2.b: "Their love is unnecessary. Their compliance is all that matters."

  coup_pulse_events.3.t: "Critical Support"
  coup_pulse_events.3.d: "A group representing the usual opposition forces of the [SCOPE.gsInterestGroup('critical_support_ig').GetName], has approached the government to propose cooperation against "forces that would subvert the government in [ROOT.GetCountry.GetName]"."
  coup_pulse_events.3.f: ""We must, indeed, all hang together or, most assuredly, we shall all hang separately."\n\n— Benjamin Franklin"
  coup_pulse_events.3.a: "Accept their well-wishes... for now."
  coup_pulse_events.3.b: "We will not embolden their own plot against us."

  coup_pulse_events.4.t: "Fear Amongst Investors"
  coup_pulse_events.4.d: "With concerns about national stability in [ROOT.GetCountry.GetName] spreading, investors affiliated with the [SCOPE.gsInterestGroup('investor_ig').GetName] have threatened to withdraw their investments from several factories in [SCOPE.sState('investor_affected_state').GetName]."
  coup_pulse_events.4.f: "Terror could be seen throughout the streets, spreading through the passersby like a poisonous fog. Their walks were brisk, their eyes furtive, their conversations quiet.\n\nThe man in the top hat turned to his colleague, who was still gazing out the window of the restaurant.\n\n"This is no way to run a country, and no country to run a business in.""
  coup_pulse_events.4.a: "Appease the [SCOPE.gsInterestGroup('investor_ig').GetName] by accepting an interest rates increase."
  coup_pulse_events.4.b: "If they were truly concerned, they would stand for [ROOT.GetCountry.GetName]."

  coup_pulse_events.5.t: "The Smoky Backroom"
  coup_pulse_events.5.d: "Figures aligned with [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetLastName] and the [SCOPE.gsInterestGroup('coup_interest_group').GetName] have approached elements of the [SCOPE.gsInterestGroup('approached_ig').GetName], looking for support in a hypothetical plot against the government."
  coup_pulse_events.5.f: ""I am well aware that our relations have been tense in the past, but I would hope that the radical threat facing our nation, and the need for decisive action, is enough to bring us together on this momentuous occasion...""
  coup_pulse_events.5.a: "A partnership could be fruitful for both parties."
  coup_pulse_events.5.b: "The [SCOPE.gsInterestGroup('approached_ig').GetName] are uninterested in these plots."

  coup_pulse_events.6.t: "Crowded Streets"
  coup_pulse_events.6.d:1 "As rumors build of a plot to overthrow the sitting administration, the [SCOPE.gsInterestGroup('pro_government_ig').GetName] has rallied support for the elected government. Demonstrators proclaiming their support for the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] have filled the streets of [SCOPE.sState('protest_state').GetCityHubName]."
  coup_pulse_events.6.f: ""Stand for your principles, you cowards, before you have nothing to hide behind!""
  coup_pulse_events.6.a: "They have taken a position at the fore of justice."
  coup_pulse_events.6.b: "A riotous morass of base humanity."

  coup_pulse_events.7.t: "A Shot in the Dark"
  coup_pulse_events.7.d: "A prominent functionary and supporter of the [SCOPE.gsInterestGroup('assassination_ig').GetName] has been shot in broad daylight, in the streets of [SCOPE.sState('assassination_state').GetCityHubName]. The local police seem uninterested in investigating any further."
  coup_pulse_events.7.f: "The officer standing on the corner tried not to flinch as the shot split the air, and the screams of onlookers begun to resonate across the streets. In the end, he reassured himself, the new and hefty weight in his coin purse was more than enough to make up for any of his doubts."
  coup_pulse_events.7.a: "Justice must be done."
  coup_pulse_events.7.b: "We stand above a chasm, and must not fall in."

  coup_pulse_events.8.t: "The Enemy's Enemy"
  coup_pulse_events.8.d: "[SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetLastName]'s allies in the diplomatic corps have offered to reach out to the [SCOPE.sCountry('coup_sponsor_country').GetAdjective] government for support in their bid for power, in return for certain future obligations."
  coup_pulse_events.8.f: ""They say nothing gets done around here without the [SCOPE.sCountry('coup_sponsor_country').GetAdjectiveNoFormatting] giving approval. I- like to think that isn't true. But if we want to ensure that things proceed as planned..."\n\nThe man in the suit gave a slow nod to the stuttering functionary.\n\n"And what of their proposal?""
  coup_pulse_events.8.a: "This arrangement is acceptable for the moment."
  coup_pulse_events.8.b: "When has [SCOPE.sCountry('coup_sponsor_country').GetAdjective] meddling ever gone well?"

  coup_pulse_events.9.t: "The Informant"
  coup_pulse_events.9.d: "A member of [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetLastName]'s staff has fallen out of the window of a [SCOPE.sBuilding('informant_building').GetName] in [SCOPE.sState('informant_state').GetName], being severely injured on impact. He has offered the government information in exchange for his safety."
  coup_pulse_events.9.f: "There was a yelp, a shriek, and the sound of something heavy hitting the cobbled road. In the hastily-opened window, one could almost see a shape turn and stalk away. Where before there had been only worn-down stones, now lay a figure in a pool of spreading crimson."
  coup_pulse_events.9.a: "He could be an invaluable asset."
  coup_pulse_events.9.b: "He will not live to tell the tale."

  coup_pulse_events.10.t: "Up In Arms"
  coup_pulse_events.10.d: "[SCOPE.sBuilding('barracks_theft_building').GetName] in [SCOPE.sState('barracks_theft_state').GetName] have been reporting a large amount of mysterious losses of firearms as of late."
  coup_pulse_events.10.f: ""The Army wastes enough ammunition to outfit a regiment on the range every day. What is a hundred rounds, compared to that monstrous expenditure? What is a thousand?"\n\n"The difference is, on the range we can be sure it's not flying towards us.""
  coup_pulse_events.10.a: "The [SCOPE.gsInterestGroup('armed_forces_ig').GetName] have their own needs."
  coup_pulse_events.10.b: "This is clearly evidence of some sort of plot."

# Coup Aftermath Events
  coup_aftermath_events.1.t: "The Legacy of Democracy"
  coup_aftermath_events.1.d:1 "A violent protest suspected to be arranged by the [SCOPE.gsInterestGroup('legacy_of_democracy_ig').GetName] in [SCOPE.sState('legacy_of_democracy_state').GetName] has broken out, demanding an end to [SCOPE.sCharacter('coup_leader').GetFullName]'s rule, and the restoration of democracy in [ROOT.GetCountry.GetName]."
  coup_aftermath_events.1.f: "As she saw the square slowly filling with bright-eyed men and women who seemed to hold all of the hope and fury in the world, she could not help but feel a pit in her stomach.\n\nHow many of them would be left alive or unimprisoned at week's end?"
  coup_aftermath_events.1.a: "Another holdout of a dead government to sweep aside."
  coup_aftermath_events.1.b: "They will burn themselves out quickly."

  coup_aftermath_events.2.t: "In Harsh Contrast"
  coup_aftermath_events.2.d: "A radical group representing the [SCOPE.gsInterestGroup('harsh_contrast_ig').GetName], who initially opposed our coup, have split from their former associates, condemning them as "beholden to a dead, illegitimate system". They have appealed to [SCOPE.sCharacter('coup_leader').GetFullName] to let them assist [SCOPE.sCharacter('coup_leader').GetHerHis] new government."
  coup_aftermath_events.2.f: ""We, as loyal citizens who have been supporting your efforts since the beginning, would like to humbly request you accept our petition to allow us to assist this new, more righteous government."\n\nAs the messenger spoke those words, he tried to banish all memory of the documents he had seen quietly burned not a day earlier."
  coup_aftermath_events.2.a: "The sooner we return to a state of order, the better."
  coup_aftermath_events.2.b: "Our government has no place for opportunists."

  coup_aftermath_events.3.t: "National Discontent"
  coup_aftermath_events.3.d: "A contingent of [SCOPE.sCulture('national_discontent_culture').GetName] people in [SCOPE.sState('national_discontent_state').GetName] have openly condemned the new government of [ROOT.GetCountry.GetName] as a threat to the [SCOPE.sCulture('national_discontent_culture').GetNameNoFormatting] nation."
  coup_aftermath_events.3.f: ""Our nation has met many hardships over the years of our subordination to the [ROOT.GetCountry.GetAdjectiveNoFormatting] state. This new regime shall not extinguish our resolve to secure the rights of all [SCOPE.sCulture('national_discontent_culture').GetNameNoFormatting] people...""
  coup_aftermath_events.3.a: "Their land is valuable, their opinions are not."
  coup_aftermath_events.3.b: "Send a representative to reassure them."

  coup_aftermath_events.4.t: "Sedition in Academia"
  coup_aftermath_events.4.d: "The faculty of the [SCOPE.sState('university_state').GetName] [SCOPE.sBuilding('university_state_building').GetName] have allowed their students to release numerous pamphlets spreading slander and calling for "democratic revolution" against [SCOPE.sCharacter('coup_leader').GetFullName]'s government. The identities of these students has been obscured by the university staff."
  coup_aftermath_events.4.f: ""Liberty cannot be preserved without a general knowledge among the people, who have a right... and a desire to know; but besides this, they have a right, and indisputable, unalienable, indefeasible, divine right to that most dreaded and envied kind of knowledge, I mean of the characters and conduct of their rulers.""
  coup_aftermath_events.4.a: "Shutter the [SCOPE.sState('university_state').GetName] [SCOPE.sBuilding('university_state_building').GetName] until the perpetrators come forward."
  coup_aftermath_events.4.b: "Confiscate the pamphlets wherever they are found."
