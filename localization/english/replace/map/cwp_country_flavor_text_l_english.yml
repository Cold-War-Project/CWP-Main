 YEM_FLAVOR_TEXT: "$MIDEAST_FLAVOR_TEXT$"
 BRZ_FLAVOR_TEXT: "Getúlio Vargas ruled Brazil from 1930, from 1937 as dictator of the Estado Novo. Brazil joined the Allies in 1942 and sent an expeditionary force to fight in Italy, and pressure for democracy at home grew as the war ended. In October 1945 the army removed Vargas, and that December voters elected General Eurico Gaspar Dutra president together with a Constituent Assembly to write a new constitution."
