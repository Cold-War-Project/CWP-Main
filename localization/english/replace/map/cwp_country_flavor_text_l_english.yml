 PHI_FLAVOR_TEXT: "$SOUTHASIA_FLAVOR_TEXT$"
 MEX_FLAVOR_TEXT: "The Mexican Revolution of 1910 was followed by two decades of rebellions and assassinations, until the official party founded in 1929, renamed the Party of the Mexican Revolution in 1938, gave the country a stable succession of presidents. President Lázaro Cárdenas distributed land to peasant ejidos and in 1938 nationalized the foreign oil companies. Mexico declared war on the Axis in 1942 and sent Squadron 201 to fight in the Philippines, and Mexican braceros worked on American farms and railroads."
 USA_FLAVOR_TEXT: "The United States ended the war with about half of the world's industrial output, a monopoly of the atomic bomb and armed forces of more than twelve million stationed from Germany to Japan. It led the founding of the United Nations and, at Bretton Woods in 1944, of the International Monetary Fund and the World Bank. At home racial segregation was the law across the South, where most Black citizens were kept from voting."
