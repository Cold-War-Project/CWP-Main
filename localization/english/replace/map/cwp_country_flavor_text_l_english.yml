l_english:
# Cold War Project: country flavor text from dev, overriding vanilla 1.15 keys.
 GBR_FLAVOR_TEXT: "Britain ended the war among the victors but close to bankrupt. It had sold overseas investments and run up large sterling debts to India, Egypt and other countries, Lend-Lease ended abruptly in August 1945, and in December Parliament approved an American loan of 3.75 billion dollars. The Labour government elected in July 1945 had promised to nationalize the Bank of England, coal and the railways and to create a National Health Service, while India pressed for independence."
 FRA_FLAVOR_TEXT: "France was defeated in 1940, and the Vichy regime collaborated with the German occupiers until the liberation of 1944. General Charles de Gaulle's provisional government restored the republic, and in October 1945 voters rejected a return to the Third Republic and elected a Constituent Assembly in which the Communists, the Socialists and the Christian democratic MRP were the largest parties. France meant to restore its authority across its empire, and the Brazzaville Conference of 1944 had promised the African colonies reforms but ruled out self-government."
 SPA_FLAVOR_TEXT: "General Francisco Franco won the Spanish Civil War in 1939 with German and Italian help and ruled as Caudillo, backed by the army, the Church and the single party of the Falange. Spain stayed out of the Second World War, though it sent the Blue Division to fight beside the Germans in Russia, and at Potsdam the Allies declared that they would not support its admission to the United Nations. Republican exiles formed a government in exile in Mexico in 1945, and guerrillas still fought in the mountains."
