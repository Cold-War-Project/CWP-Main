 EGY_FLAVOR_TEXT: "Britain occupied Egypt in 1882 and declared it independent in 1922, but kept troops in the Suez Canal Zone under the treaty of 1936. In February 1942 British tanks surrounded the Abdeen Palace to force King Farouk to appoint a government of Britain's choosing. Egypt was a founding member of the United Nations and the seat of the new Arab League, and Egyptian nationalists demanded that Britain revise the treaty and withdraw its troops."
 NEJ_FLAVOR_TEXT: "Abdulaziz ibn Saud conquered most of the Arabian Peninsula in the first quarter of the century and proclaimed the Kingdom of Saudi Arabia in 1932. Standard Oil of California found oil in commercial quantities at Dammam in 1938, and its concession passed to the Arabian American Oil Company, Aramco. In February 1945 the king met President Roosevelt aboard the USS Quincy in the Great Bitter Lake. Oil revenue was still modest, and the kingdom had little modern administration."
 TUR_FLAVOR_TEXT: "Mustafa Kemal Atatürk founded the Republic of Turkey in 1923 and remade it as a secular state. After his death in 1938 his successor, Ismet Inönü, kept Turkey neutral for most of the war and declared war on Germany only in February 1945. That year the Soviet Union renounced its treaty of friendship with Turkey and demanded bases on the Straits and the return of Kars and Ardahan. The Republican People's Party ruled alone, but in November 1945 Inönü said opposition parties would be allowed."
 PER_FLAVOR_TEXT: "Iran was never formally colonized, but Britain and Russia divided it into spheres of influence in 1907, and the British-owned Anglo-Iranian Oil Company ran its oil industry from Abadan. In August 1941 British and Soviet forces invaded, forced Reza Shah to abdicate in favor of his son Mohammad Reza and used the country as a supply route to the Soviet Union. The Allies promised to withdraw within six months of the war's end. In the Soviet-occupied north, a Soviet-backed government took power in Azerbaijan in December 1945."
