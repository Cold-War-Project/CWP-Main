 BST_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 NAM_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 OVM_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 DLA_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
