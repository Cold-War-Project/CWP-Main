 GENERIC_FLAVOR_TEXT: "The Second World War ended in 1945 with tens of millions dead, much of Europe and East Asia in ruins and the United States holding the atomic bomb. The victors founded the United Nations to keep the peace, but the wartime alliance between the Western powers and the Soviet Union was already strained over Poland, Germany and Iran. Across Asia and Africa, colonial peoples were pressing the old empires for independence."
 DECENTRALIZED_FLAVOR_TEXT: "If you see this text, something is broken. Decentralized states are currently not used in this mod."
