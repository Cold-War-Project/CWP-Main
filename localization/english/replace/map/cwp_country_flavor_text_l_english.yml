 SAF_FLAVOR_TEXT: "The Union of South Africa had been a self-governing dominion since 1910. Under Jan Smuts it joined Britain in the war in 1939 and sent its volunteer army to East Africa, North Africa and Italy. Political power lay with the white minority, divided between Afrikaners and English speakers over ties to Britain. The Black majority had no vote outside a few seats held by white representatives, and pass laws and the Natives Land Act of 1913 restricted where they could live, work and own land."
