 GERMAN_FLAVOR_TEXT: "After the unconditional surrender of May 1945, Germany and Austria were each divided into American, British, French and Soviet occupation zones, with Berlin and Vienna under joint four-power rule. At Potsdam the Big Three agreed on the denazification and demilitarization of Germany and on reparations, and at Nuremberg the leaders of the Nazi state were put on trial for crimes against peace and crimes against humanity. Austria, which the Allies had called the first victim of Hitlerite aggression, held free elections in November 1945."
 AUS_FLAVOR_TEXT: "$GERMAN_FLAVOR_TEXT$"
 RUS_FLAVOR_TEXT: "The German invasion of 1941 devastated the western Soviet Union and killed tens of millions of Soviet citizens. The Red Army fought its way to Berlin, and at the war's end Soviet troops held Eastern Europe, Manchuria and northern Korea. The Soviet Union kept the territories it had annexed in 1939 and 1940, from the Baltic states to Bessarabia, took the Kuril Islands and northern East Prussia, and held a permanent seat on the United Nations Security Council."
 POL_FLAVOR_TEXT: "$EASTBLOC_FLAVOR_TEXT$"
 HUN_FLAVOR_TEXT: "$EASTBLOC_FLAVOR_TEXT$"
 JAP_FLAVOR_TEXT: "Japan surrendered on September 2, 1945, after the atomic bombings of Hiroshima and Nagasaki and the Soviet declaration of war. Its cities were burned out, its empire in Korea, Taiwan and Manchuria was gone, and millions of soldiers and settlers waited to come home. Under General Douglas MacArthur, the Supreme Commander for the Allied Powers, the occupation released political prisoners, legalized trade unions and the Communist Party, and ordered land reform and the breakup of the zaibatsu conglomerates."
