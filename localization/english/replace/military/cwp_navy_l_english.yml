# Destroyers
  ship_type_destroyer: "Destroyer"
  ship_type_destroyer_desc: "A fast and maneuverable warship designed for escorting larger vessels and defending them against smaller, short-range attackers. Destroyers are equipped with a variety of weapons systems, sensors, and propulsion technologies to provide effective protection for the fleet and maintain control over the seas."


# Frigates
  ship_type_frigate: "Frigate"
  ship_type_frigate_desc: "A medium-sized warship designed for escorting larger vessels and conducting anti-submarine warfare. Frigates are equipped with a variety of weapons systems, sensors, and propulsion technologies to provide effective protection for the fleet and maintain control over the seas."
