l_english:
 ideology_cwp_destalinizer:0 "Socialist Legalist"
 ideology_cwp_destalinizer_desc:0 "#lore This leader seeks to end arbitrary terror and reform the security apparatus while preserving socialist planning and limits on public dissent.#!"
 ideology_cwp_reform_communist:0 "Reform Communist"
 ideology_cwp_reform_communist_desc:0 "#lore This leader seeks to renew socialism through political competition, open public debate, independent courts and economic decentralization.#!"
 ideology_cwp_eurocommunist:0 "Pluralist Communist"
 ideology_cwp_eurocommunist_desc:0 "#lore This leader seeks a democratic road to communism through elected institutions, political pluralism, civil liberties and freedom of conscience.#!"
 ideology_cwp_market_socialist:0 "Market Socialist"
 ideology_cwp_market_socialist_desc:0 "#lore This leader seeks faster development through markets, household farming and foreign economic exchange while preserving the leading role of the communist party.#!"
 ideology_cwp_castroist:0 "Welfare Communist"
 ideology_cwp_castroist_desc:0 "#lore This leader seeks a planned socialist economy under a unified revolutionary party, with universal public schooling and health care as central achievements.#!"
 ideology_cwp_guevarist:0 "Insurrectionary Socialist"
 ideology_cwp_guevarist_desc:0 "#lore This leader seeks revolutionary transformation through popular armed mobilization, collective farming and centralized socialist production.#!"
 ideology_cwp_hoxhaist:0 "Isolationist Communist"
 ideology_cwp_hoxhaist_desc:0 "#lore This leader defends uncompromising central planning, militant state atheism and economic isolation while suppressing ideological dissent.#!"
 ideology_cwp_juche:0 "Self-Reliant Socialist"
 ideology_cwp_juche_desc:0 "#lore This leader demands political independence and economic self-reliance under a single ruling party, backed by a mobilized national defense and a planned economy.#!"
 ideology_cwp_trotskyist:0 "Democratic Councilist"
 ideology_cwp_trotskyist_desc:0 "#lore This leader calls for workers councils and a socialist revolution against both capitalist power and bureaucratic one-party rule, with democratic rights for working people.#!"
 ideology_cwp_democratic_communist:0 "Democratic Communist"
 ideology_cwp_democratic_communist_desc:0 "#lore This leader seeks a humane socialist order through legal protections, freer debate, independent unions and reform of centralized economic management.#!"
 ideology_cwp_allendist:0 "Constitutional Socialist"
 ideology_cwp_allendist_desc:0 "#lore This leader seeks a constitutional road to socialism through democratic elections, nationalization of strategic industries and redistribution of large estates.#!"
 ideology_cwp_soviet_conservative:0 "Party-State Conservative"
 ideology_cwp_soviet_conservative_desc:0 "#lore This leader defends stable party control of the state, established administrative cadres and supervised mass organizations, treating organized dissent as a threat to socialist order.#!"
