l_english:
  # Return to Home Country Events

# Repatriation
  return_to_home_country_events.1.title: "Repatriation"
  return_to_home_country_events.1.desc: "[SCOPE.sCharacter('cwp_repatriated_scope').GetFullName] has returned from exile in [SCOPE.sCountry('repatriator_country_scope').GetName] with the support of their hosts' government. It seems that the [SCOPE.sCountry('repatriator_country_scope').GetNameNoFormatting] have reason to spread [SCOPE.sCharacter('cwp_repatriated_scope').GetIdeology.GetName] ideology in [ROOT.GetCountry.GetName]."
  return_to_home_country_events.1.flavor: "Second chances come rarely. The home once denied to [SCOPE.sCharacter('cwp_repatriated_scope').GetHerHim] now opens its doors with a foreigner’s support. They cast [SCOPE.sCharacter('cwp_repatriated_scope').GetHerHim] away before, preferring a false heaven of evermore tyrannical choirs. But a second chance for [SCOPE.sCharacter('cwp_repatriated_scope').GetHerHim] meant a second chance for the dream. For true brotherhood. Perhaps [SCOPE.sCharacter('cwp_repatriated_scope').GetHerHis] great work might bear fruit yet."
  return_to_home_country_events.1.a: "We exiled [SCOPE.sCharacter('cwp_repatriated_scope').GetHerHim] for good reason."
  return_to_home_country_events.1.b: "Welcome home!"
