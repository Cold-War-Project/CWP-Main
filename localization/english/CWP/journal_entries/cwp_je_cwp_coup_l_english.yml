l_english:

# Events:
  # cwp_coup_events.1
  cwp_coup_events.1.title: "[SCOPE.sCharacter('cwp_coup_character_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('cwp_coup_character_leader').GetLastName]'s Endeavor"
  cwp_coup_events.1.desc_1: "[SCOPE.sCharacter('cwp_coup_character_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('cwp_coup_character_leader').GetFullName], a prominent opponent of [SCOPE.sLaw('cwp_coup_current_law_scope').GetName], has begun to maneuver towards halting the enactment of the law by force. [SCOPE.sCharacter('cwp_coup_character_leader').GetHerHis|U] bid for power is backed by a faction of the [SCOPE.gsInterestGroup('cwp_coup_interest_group').GetName]."
  cwp_coup_events.1.desc_2: "A faction of the [SCOPE.gsInterestGroup('cwp_coup_interest_group').GetName], enraged by the sitting government's failure to realize their legislative agenda, has begun to conspire with [SCOPE.sCharacter('cwp_coup_character_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('cwp_coup_character_leader').GetFullName] to seize power over [ROOT.GetCountry.GetName]."
  cwp_coup_events.1.desc_3: "A faction of the [SCOPE.gsInterestGroup('cwp_coup_interest_group').GetName], enraged by the sitting government's betrayal of its commitment to them, has lost faith in the political process. They have approached [SCOPE.sCharacter('cwp_coup_character_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('cwp_coup_character_leader').GetFullName] with a plan to seize power over [ROOT.GetCountry.GetName]."
  cwp_coup_events.1.desc_4: "Sensing an opportunity to realize [SCOPE.sCharacter('cwp_coup_character_leader').GetHerHis] personal ambitions, the [SCOPE.sCharacter('cwp_coup_character_leader').GetCustom('personality_traits_loc')|l] [SCOPE.sCharacter('cwp_coup_character_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('cwp_coup_character_leader').GetFullName] has rallied [SCOPE.sCharacter('cwp_coup_character_leader').GetHerHis] supporters amongst the [SCOPE.gsInterestGroup('cwp_coup_interest_group').GetName] to seize power over [ROOT.GetCountry.GetName]."
  cwp_coup_events.1.desc_8: "The [SCOPE.sCharacter('cwp_coup_character_leader').GetCustom('personality_traits_loc')|l] [SCOPE.sCharacter('cwp_coup_character_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('cwp_coup_character_leader').GetFullName] has begun to make threatening moves towards seizing power over [ROOT.GetCountry.GetName]. [SCOPE.sCharacter('cwp_coup_character_leader').GetSheHe|U] is backed by a faction of the [SCOPE.gsInterestGroup('cwp_coup_interest_group').GetName]."
  cwp_coup_events.1.flavor: "Colonel [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting] lifted the tent flap, and slipped inside. The atmosphere was already heavy with smoke, and the other chairs filled. Maps were spread out across the table - terrain, government facilities, vital infrastructure. He saluted the [SCOPE.sCharacter('cwp_coup_character_leader').GetPrimaryRoleTitle] sitting at the end of the table, and took his seat.\n\nHe was not alone. Colonel [SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting] sat to his left, his pipe merrily contributing to the suffocating haze.\n\n"I apologize for my tardiness," [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting] began. "There was a new gate guard."\n\nThe [SCOPE.sCharacter('cwp_coup_character_leader').GetPrimaryRoleTitle] nodded. "Forgiven. Your report, please. Status of the Twenty-Fourth?""
  cwp_coup_events.1.a: "Godspeed, [SCOPE.sCharacter('cwp_coup_character_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('cwp_coup_character_leader').GetLastName]!"
  cwp_coup_events.1.b: "The present regime must survive."

  # cwp_coup_events.2
  cwp_coup_events.2.title: "Closing In"
  cwp_coup_events.2.desc: "[SCOPE.sCharacter('cwp_coup_character_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('cwp_coup_character_leader').GetFullName] has become aware of the state's efforts to reduce the amount of military forces available to [SCOPE.sCharacter('cwp_coup_character_leader').GetHerHim]. [SCOPE.sCharacter('cwp_coup_character_leader').GetSheHe|U] has accused the government of recklessly meddling in military affairs."
  cwp_coup_events.2.flavor: "[SCOPE.sCharacter('cwp_coup_character_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('cwp_coup_character_leader').GetLastNameNoFormatting] paced back and forth across the floor of [SCOPE.sCharacter('cwp_coup_character_leader').GetHerHis] tent. Assembled before [SCOPE.sCharacter('cwp_coup_character_leader').GetHerHim] were [SCOPE.sCharacter('cwp_coup_character_leader').GetHerHis] loyal lieutenants—those who had not yet been forced to relocate. He had not been able to outright refuse the orders that had suddenly arrived from [ROOT.GetCountry.GetCapital.GetCityHubName], reducing him to a skeleton crew of crucial headquarters staff.\n\nThe government was onto him. There was little other explanation. No other command had been targeted so heavily. Were he to recover his positions, he would need to respond. He indicated to two of the men in the front row.\n\n"Colonel [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting], Major [SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting]...""
  cwp_coup_events.2.a: ""...inform your men to take positions.""
  cwp_coup_events.2.b: ""...relay the news to our far-flung colleagues.""

  # cwp_coup_events.3
  cwp_coup_events.3.title: "Pronunciamento!"
  cwp_coup_events.3.desc_1: "[SCOPE.sCharacter('cwp_coup_character_leader').GetRankName] [SCOPE.sCharacter('cwp_coup_character_leader').GetFullName] has issued a pronunciamento from [SCOPE.sCharacter('cwp_coup_character_leader').GetHerHis] headquarters in [SCOPE.sState('cwp_pronunciamento_state').GetName]. The [SCOPE.sCharacter('cwp_coup_character_leader').GetCustom('getGeneralAdmiral')] and [SCOPE.sCharacter('cwp_coup_character_leader').GetHerHis] allies in the [SCOPE.sPoliticalLobby('relevant_lobby').GetName] have come into open opposition to our government."
  cwp_coup_events.3.desc_2: "[SCOPE.sCharacter('cwp_coup_character_leader').GetRankName] [SCOPE.sCharacter('cwp_coup_character_leader').GetFullName] has issued a pronunciamento from [SCOPE.sCharacter('cwp_coup_character_leader').GetHerHis] headquarters in [SCOPE.sState('cwp_pronunciamento_state').GetName]. The [SCOPE.sCharacter('cwp_coup_character_leader').GetCustom('getGeneralAdmiral')] and [SCOPE.sCharacter('cwp_coup_character_leader').GetHerHis] allies in the [SCOPE.gsInterestGroup('cwp_coup_interest_group').GetName] have come into open opposition to our government."
  cwp_coup_events.3.flavor_1: "Citizens,\n\nYears of gags! Years of outrages! Our nation scoffed at, pillaged, trampled upon! Wasn't that enough? No! Now hunger tears at the guts of the people! No more workshops! No more marriages! All of that is revolutionary. Nothing but palaces and prisons, convents and whorehouses!\n\nTo arms, people of [SCOPE.sState('cwp_pronunciamento_state').GetCityHubName]! Enough is enough! You received freedom from your fathers; you will not leave servitude to your sons.\n\nThe oppressors have filled the cup to the brim. To arms! Let punishment fall like lightning on their outrages. The hour of the great revolution of the people has sounded! Let us march!"
  cwp_coup_events.3.flavor_2: "Fellow citizens,\n\nThe regime in [ROOT.GetCountry.GetCapital.GetCityHubName] has proclaimed a death sentence for [ROOT.GetCountry.GetNameNoFormatting], and has deprived us of any hope of putting an end to civil discord. Nothing remains outside of an appeal to the people.\n\nMy countrymen! Hear the cry of the homeland! Close your ears to the suggestion of a regime which, in its spite and impotence, places all its hope in the disunity of the people and the army.\n\n[SCOPE.sState('cwp_pronunciamento_state').GetNameNoFormatting] Headquarters, [TimeKeeper.GetCurrentDate.GetString]\n[SCOPE.sCharacter('cwp_coup_character_leader').GetFullNameNoFormatting]"
  cwp_coup_events.3.a: "The military has spoken. Our mandate is done."
  cwp_coup_events.3.b: "We will not capitulate!"

  # cwp_coup_events.4
  cwp_coup_events.4.title: "For Lack of Interest"
  cwp_coup_events.4.desc: "The conspiracy to overthrow the sitting [ROOT.GetCountry.GetAdjective] government has lost all momentum amongst the [SCOPE.gsInterestGroup('cwp_coup_interest_group').GetName]. [SCOPE.sCharacter('cwp_coup_character_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('cwp_coup_character_leader').GetFullName]'s plot has been abandoned."
  cwp_coup_events.4.flavor: ""The trouble with you, [SCOPE.sCharacter('cwp_coup_character_leader').GetLastNameNoFormatting], is that just because you have succeeded in inducing a handful of half-wits to disfigure the [SCOPE.sState('capital_scope').GetCityHubName] scene by going about in black shorts, you think you're someone. You hear them shouting "Hail, [SCOPE.sCharacter('cwp_coup_character_leader').GetLastNameNoFormatting]!" and you imagine it is the Voice of the People. That is where you make your bloomer. What the Voice of the People is saying is: "Look at that frightful ass [SCOPE.sCharacter('cwp_coup_character_leader').GetLastNameNoFormatting] swanking about in footer bags! Did you ever in your puff see such a perfect perisher?"" # - P.G. Wodehouse
  cwp_coup_events.4.a: "Pray no one will find out what nearly transpired."
  cwp_coup_events.4.b: "We know what plans [SCOPE.sCharacter('cwp_coup_character_leader').GetSheHe] had in store. Justice will be served."

  # cwp_coup_events.5
  cwp_coup_events.5.title: "The [SCOPE.sCountry('coupist_lobby_country').GetAdjective] Scheme"
  cwp_coup_events.5.desc: "Spearheaded by [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetFullName], the [SCOPE.sPoliticalLobby('relevant_lobby').GetName] has begun to maneuver towards establishing a pro-[SCOPE.sCountry('coupist_lobby_country').GetAdjective] government in [ROOT.GetCountry.GetName] by force of arms. The scheme is backed by substantial foreign funding."
  cwp_coup_events.5.flavor: "Colonel [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting] lifted the tent flap, and slipped inside. The atmosphere was already heavy with smoke, and the other chairs filled. Maps were spread out across the table - terrain, government facilities, vital infrastructure. He saluted the [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] sitting at the end of the table, and took his seat.\n\nHe was not alone. Colonel [SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting] sat to his left, his pipe merrily contributing to the suffocating haze.\n\n"I apologize for my tardiness," [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting] began. "There was a new gate guard."\n\nThe [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] nodded. "Forgiven. Your report, please. Status of the Twenty-Fourth?""
  cwp_coup_events.5.a: "A [SCOPE.sCountry('coupist_lobby_country').GetAdjectiveNoFormatting] alignment could prove favorable."
  cwp_coup_events.5.b: "The present regime must survive."

  # coup_aftermath_events.1 
  cwp_coup_events.6.title: "The Legacy of Democracy"
  cwp_coup_events.6.desc:1 "A violent protest suspected to be arranged by the [SCOPE.gsInterestGroup('cwp_undo_coup_interest_group').GetName] in [SCOPE.sState('cwp_undo_coup_state').GetName] has broken out, demanding an end to [SCOPE.sCharacter('cwp_post_coup_leader').GetFullName]'s rule, and the restoration of democracy in [ROOT.GetCountry.GetName]."
  cwp_coup_events.6.flavor: "As she saw the square slowly filling with bright-eyed men and women who seemed to hold all of the hope and fury in the world, she could not help but feel a pit in her stomach.\n\nHow many of them would be left alive or unimprisoned at week's end?"
  cwp_coup_events.6.a: "Another holdout of a dead government to sweep aside."
  cwp_coup_events.6.b: "They will burn themselves out quickly."

  # coup_aftermath_events.2
  cwp_coup_events.7.title: "In Harsh Contrast"
  cwp_coup_events.7.desc: "A radical group representing the [SCOPE.gsInterestGroup('cwp_splitters_coup_interest_group').GetName], who initially opposed our coup, have split from their former associates, condemning them as "beholden to a dead, illegitimate system". They have appealed to [SCOPE.sCharacter('cwp_post_coup_leader').GetFullName] to let them assist [SCOPE.sCharacter('cwp_post_coup_leader').GetHerHis] new government."
  cwp_coup_events.7.flavor: ""We, as loyal citizens who have been supporting your efforts since the beginning, would like to humbly request you accept our petition to allow us to assist this new, more righteous government."\n\nAs the messenger spoke those words, he tried to banish all memory of the documents he had seen quietly burned not a day earlier."
  cwp_coup_events.7.a: "The sooner we return to a state of order, the better."
  cwp_coup_events.7.b: "Our government has no place for opportunists."

  # coup_aftermath_events.3
  cwp_coup_events.8.title: "National Discontent"
  cwp_coup_events.8.desc: "A contingent of [SCOPE.sCulture('national_discontent_culture').GetName] people in [SCOPE.sState('cwp_coup_discontent_state').GetName] have openly condemned the new government of [ROOT.GetCountry.GetName] as a threat to the [SCOPE.sCulture('national_discontent_culture').GetNameNoFormatting] nation."
  cwp_coup_events.8.flavor: ""Our nation has met many hardships over the years of our subordination to the [ROOT.GetCountry.GetAdjectiveNoFormatting] state. This new regime shall not extinguish our resolve to secure the rights of all [SCOPE.sCulture('national_discontent_culture').GetNameNoFormatting] people...""
  cwp_coup_events.8.a: "Their land is valuable, their opinions are not."
  cwp_coup_events.8.b: "Send a representative to reassure them."

  # coup_aftermath_events.4
  cwp_coup_events.9.title: "Sedition in Academia"
  cwp_coup_events.9.desc: "The faculty of the [SCOPE.sState('cwp_coup_university_state').GetName] [SCOPE.sBuilding('cwp_coup_university_state_building').GetName] have allowed their students to release numerous pamphlets spreading slander and calling for "democratic revolution" against [SCOPE.sCharacter('cwp_post_coup_leader').GetFullName]'s government. The identities of these students has been obscured by the university staff."
  cwp_coup_events.9.flavor: ""Liberty cannot be preserved without a general knowledge among the people, who have a right... and a desire to know; but besides this, they have a right, and indisputable, unalienable, indefeasible, divine right to that most dreaded and envied kind of knowledge, I mean of the characters and conduct of their rulers.""
  cwp_coup_events.9.a: "Shutter the [SCOPE.sState('cwp_coup_university_state').GetName] [SCOPE.sBuilding('cwp_coup_university_state_building').GetName] until the perpetrators come forward."
  cwp_coup_events.9.b: "Confiscate the pamphlets wherever they are found."


# Journal Entry:
  je_cwp_coup: "Coup!"
  je_cwp_coup_reason: "[ROOT.GetCountry.GetCustom('get_coup_je_text')], the [SCOPE.sCharacter('cwp_coup_character_leader').GetCustom('ordered_personality_traits_loc')|l] [SCOPE.sCharacter('cwp_coup_character_leader').GetRankName] [SCOPE.sCharacter('cwp_coup_character_leader').GetFullName] and [SCOPE.sCharacter('cwp_coup_character_leader').GetHerHis] allies amongst the [SCOPE.gsInterestGroup('cwp_coup_interest_group').GetName] have begun to maneuver towards seizing state power through force of arms.\n\nWhilst this [concept_journal_entry] is active, the rate at which the $concept_coup$ will #tooltippable;tooltip:[GetPlayer.GetTooltipTag],coup_progress_factors_tt advance#! or #tooltippable;tooltip:[GetPlayer.GetTooltipTag],coup_regress_factors_tt deplete#! will be determined by [SCOPE.sCharacter('cwp_coup_character_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('cwp_coup_character_leader').GetLastName]'s [concept_coup_strength] ([SCOPE.sCharacter('cwp_coup_character_leader').MakeScope.Var('monthly_cached_commander_coup_strength').GetValue|v2]) subtracted by [ROOT.GetCountry.GetName]'s [concept_coup_resistance] ([SCOPE.ScriptValue('country_coup_resistance')|v2]). If #b Progress#! reaches #v 100%#!, and [SCOPE.sCharacter('cwp_coup_character_leader').GetLastNameNoFormatting] is able to launch [SCOPE.sCharacter('cwp_coup_character_leader').GetHerHis] [concept_coup], there is a risk of our government being overturned."


