l_english:
 ideology_cwp_gaullist:0 "Presidential Developmentalist"
 ideology_cwp_gaullist_desc:0 "This character favors a strong elected presidency, national industrial champions, and state guidance of a mixed economy."
 ideology_cwp_social_market_liberal:0 "Social Market Liberal"
 ideology_cwp_social_market_liberal_desc:0 "This character seeks prosperity through competitive private enterprise, open trade, and a state strong enough to prevent monopolies."
 ideology_cwp_one_nation_conservative:0 "Welfare Conservative"
 ideology_cwp_one_nation_conservative_desc:0 "This character combines constitutional tradition and private enterprise with a practical commitment to pensions, public health, and social stability."
 ideology_cwp_nordic_social_democrat:0 "Universalist Social Democrat"
 ideology_cwp_nordic_social_democrat_desc:0 "This character seeks universal social provision, redistributive taxation, and independent trade unions with a voice in economic life."
 ideology_cwp_civil_rights_reformer:0 "Civil Rights Reformer"
 ideology_cwp_civil_rights_reformer_desc:0 "This character campaigns for equal citizenship, effective voting rights, peaceful protest, and fair treatment at work."
 ideology_cwp_liberation_theologian:0 "Liberation Theologian"
 ideology_cwp_liberation_theologian_desc:0 "This character understands Christian commitment as solidarity with the poor, supporting land reform, material security, and independent popular organization."
 ideology_cwp_green:0 "Green"
 ideology_cwp_green_desc:0 "This character advocates nonviolence, democratic participation, and limits on concentrated economic power as part of an ecological political vision."
 ideology_cwp_second_wave_feminist:0 "Civic Feminist"
 ideology_cwp_second_wave_feminist_desc:0 "This character seeks equal participation for women in education, employment, politics, and the protection of the law."
 ideology_cwp_libertarian:0 "Libertarian"
 ideology_cwp_libertarian_desc:0 "This character defends voluntary exchange, free expression, open trade, and an armed force staffed by volunteers rather than conscripts."
 ideology_cwp_dissident_democrat:0 "Dissident Democrat"
 ideology_cwp_dissident_democrat_desc:0 "This character opposes party monopoly and political repression, demanding public accountability, freedom of expression, and independent justice."
 ideology_cwp_solidarity_unionist:0 "Independent Unionist"
 ideology_cwp_solidarity_unionist_desc:0 "This character seeks independent trade unions, freedom of expression and conscience, and material guarantees for workers and their families."
 ideology_cwp_agrarian_reformer:0 "Agrarian Reformer"
 ideology_cwp_agrarian_reformer_desc:0 "This character seeks a modern republic of productive smallholders, breaking landed monopolies while promoting national economic development."
