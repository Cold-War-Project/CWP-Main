  law_manorialism:0 "Manorialism"
  law_manorialism_desc:0 "Agricultural land is controlled by hereditary estates, with tenants bound to customary duties and local obligations."
  law_politicized_bureaucrats:0 "Politicized Administration"
  law_politicized_bureaucrats_desc:0 "The state bureaucracy is closely fused with ruling political interests, trading administrative autonomy for discipline and ideological control."
  law_mercantilism:0 "Neomercantilism"
  law_latifundias:0 "Latifundias"
  law_latifundias_desc:0 "Agricultural land is dominated by vast estates worked by poorly paid rural laborers."
  law_expanded_latifundias:0 "Expanded Latifundias"
  law_expanded_latifundias_desc:0 "Large agricultural estates have been strengthened and formalized as the central structure of rural landholding."

