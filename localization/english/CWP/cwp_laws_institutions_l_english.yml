  law_frontier_colonization_desc:0 "The state supports controlled settlement and administration along colonial frontiers."
  lawgroup_colonization:0 "Colonization"

  lawgroup_corporate_affairs:0 "Corporate Affairs"
  law_no_corporate_regulation:0 "No Regulation"
  law_no_corporate_regulation_desc:0 "The state maintains no dedicated corporate regulatory apparatus, leaving company formation and privileges to ordinary commercial law."
  law_national_champions:0 "National Champions"
  law_national_champions_desc:0 "The state cultivates a smaller set of favored firms through charters, administrative support, and coordinated industrial policy."
  law_corporate_deregulation:0 "Corporate Deregulation"
  law_corporate_deregulation_desc:0 "The state loosens corporate oversight, allowing more companies to compete with fewer special charters and faster company expansion."
  law_antitrust_legislation:0 "Antitrust Legislation"
  law_antitrust_legislation_desc:0 "The state restrains concentrated corporate power, improving general market throughput while reducing the advantages of company-backed buildings."
