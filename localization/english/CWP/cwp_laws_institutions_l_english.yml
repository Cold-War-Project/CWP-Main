l_english:
  institution_voting:0 "Electoral Administration"
  institution_voting_desc:0 "The legal and administrative machinery used to conduct elections and translate votes into political legitimacy."
  INSTITUTION_FUNDING_LEVEL_voting:0 "Investment level for [GetInstitutionType('institution_voting').GetName]"
  NO_INSTITUTION_voting:0 "No [GetInstitutionType('institution_voting').GetName]"

  institution_citizenship:0 "Citizenship Administration"
  institution_citizenship_desc:0 "The state apparatus governing nationality, civic status, and the practical enforcement of citizenship law."
  INSTITUTION_FUNDING_LEVEL_citizenship:0 "Investment level for [GetInstitutionType('institution_citizenship').GetName]"
  NO_INSTITUTION_citizenship:0 "No [GetInstitutionType('institution_citizenship').GetName]"

  institution_church_and_state:0 "Religious Affairs"
  institution_church_and_state_desc:0 "The public offices, subsidies, and enforcement practices that shape the relationship between religious bodies and the state."
  INSTITUTION_FUNDING_LEVEL_church_and_state:0 "Investment level for [GetInstitutionType('institution_church_and_state').GetName]"
  NO_INSTITUTION_church_and_state:0 "No [GetInstitutionType('institution_church_and_state').GetName]"

  institution_economic_system:0 "Economic Administration"
  institution_economic_system_desc:0 "The public capacity used to administer market access, ownership rules, dividends, investment, and state economic policy."
  INSTITUTION_FUNDING_LEVEL_economic_system:0 "Investment level for [GetInstitutionType('institution_economic_system').GetName]"
  NO_INSTITUTION_economic_system:0 "No [GetInstitutionType('institution_economic_system').GetName]"

  institution_land_reform:0 "Land Reform"
  institution_land_reform_desc:0 "The legal and administrative effort to reshape agricultural landholding, subsistence farming, and rural property relations."
  INSTITUTION_FUNDING_LEVEL_land_reform:0 "Investment level for [GetInstitutionType('institution_land_reform').GetName]"
  NO_INSTITUTION_land_reform:0 "No [GetInstitutionType('institution_land_reform').GetName]"

  institution_corporate_affairs:0 "Corporate Affairs"
  institution_corporate_affairs_desc:0 "The state offices responsible for company registration, corporate charters, and the legal privileges of large firms."
  INSTITUTION_FUNDING_LEVEL_corporate_affairs:0 "Investment level for [GetInstitutionType('institution_corporate_affairs').GetName]"
  NO_INSTITUTION_corporate_affairs:0 "No [GetInstitutionType('institution_corporate_affairs').GetName]"

  institution_free_speech:0 "Public Expression"
  institution_free_speech_desc:0 "The legal and administrative capacity used to regulate speech, assembly, censorship, and public political activity."
  INSTITUTION_FUNDING_LEVEL_free_speech:0 "Investment level for [GetInstitutionType('institution_free_speech').GetName]"
  NO_INSTITUTION_free_speech:0 "No [GetInstitutionType('institution_free_speech').GetName]"

  institution_border_control:0 "Border Control"
  institution_border_control_desc:0 "The agencies responsible for migration quotas, entry controls, and the enforcement of migration law."
  INSTITUTION_FUNDING_LEVEL_border_control:0 "Investment level for [GetInstitutionType('institution_border_control').GetName]"
  NO_INSTITUTION_border_control:0 "No [GetInstitutionType('institution_border_control').GetName]"

  law_encourage_migration:0 "Encourage Migration"
  law_encourage_migration_desc:0 "The state actively encourages immigration through permissive quotas, migration incentives, and policies meant to attract new arrivals."

  law_manorialism:0 "Manorialism"
  law_manorialism_desc:0 "Agricultural land is controlled by hereditary estates, with tenants bound to customary duties and local obligations."
  law_latifundias:0 "Latifundias"
  law_latifundias_desc:0 "Agricultural land is dominated by vast estates worked by poorly paid rural laborers."
  law_expanded_latifundias:0 "Expanded Latifundias"
  law_expanded_latifundias_desc:0 "Large agricultural estates have been strengthened and formalized as the central structure of rural landholding."

  law_no_colonial_affairs:0 "No Colonial Affairs"
  law_no_colonial_affairs_desc:0 "The country does not maintain a formal colonial administration."
  law_frontier_colonization:0 "Frontier Colonization"
  law_frontier_colonization_desc:0 "The state supports controlled settlement and administration along colonial frontiers."
  lawgroup_colonization:0 "Colonization"

  lawgroup_corporate_affairs:0 "Corporate Affairs"
  law_no_corporate_regulation:0 "No Regulation"
  law_no_corporate_regulation_desc:0 "The state maintains no dedicated corporate regulatory apparatus, leaving company formation and privileges to ordinary commercial law."
  law_national_champions:0 "National Champions"
  law_national_champions_desc:0 "The state cultivates a smaller set of favored firms through charters, administrative support, and coordinated industrial policy."
  law_corporate_deregulation:0 "Corporate Deregulation"
  law_corporate_deregulation_desc:0 "The state loosens corporate oversight, allowing more companies to compete with fewer special charters and faster company expansion."
  law_antitrust_legislation:0 "Antitrust Legislation"
  law_antitrust_legislation_desc:0 "The state restrains concentrated corporate power, improving general market throughput while reducing the advantages of company-backed buildings."
