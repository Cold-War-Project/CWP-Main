l_english:
 ideology_cwp_baathist:0 "Secular Arab Socialist"
 ideology_cwp_baathist_desc:0 "This leader seeks Arab unity and social renewal through republican institutions, secular government, public economic direction, and land reform."
 ideology_cwp_kemalist:0 "Secular Republican"
 ideology_cwp_kemalist_desc:0 "This leader combines secular republican institutions and professional administration with state-led modernization."
 ideology_cwp_pan_africanist:0 "Pan-Africanist"
 ideology_cwp_pan_africanist_desc:0 "This leader seeks African solidarity and economic independence through inclusive citizenship, easier movement, coordinated development, and strategic public enterprise."
 ideology_cwp_african_humanist:0 "Communitarian Socialist"
 ideology_cwp_african_humanist_desc:0 "This leader emphasizes human dignity and communal responsibility, favoring public provision and state-led development under a unifying party."
 ideology_cwp_sankarist:0 "Revolutionary Egalitarian"
 ideology_cwp_sankarist_desc:0 "This leader links revolutionary land reform and collective development with mass education and the emancipation of women."
 ideology_cwp_guided_democrat:0 "Guided Democrat"
 ideology_cwp_guided_democrat_desc:0 "This leader favors a strong presidency that directs a coalition of organized political forces and state-led development in the name of national unity."
 ideology_cwp_islamic_republican:0 "Islamic Republican"
 ideology_cwp_islamic_republican_desc:0 "This leader seeks a republic whose elected institutions remain subordinate to clerical guardianship and an explicitly religious constitutional order."
 ideology_cwp_islamic_democrat:0 "Islamic Democrat"
 ideology_cwp_islamic_democrat_desc:0 "This leader pursues an Islamic political program through representative government, constitutional limits, and electoral competition."
 ideology_cwp_national_security_doctrine:0 "National Security Doctrine"
 ideology_cwp_national_security_doctrine_desc:0 "This leader treats political opposition as an internal security threat, favoring military executive authority, controlled courts, and the suppression of dissent."
 ideology_cwp_monarchic_modernizer:0 "Monarchic Modernizer"
 ideology_cwp_monarchic_modernizer_desc:0 "This leader seeks to preserve the crown through state-led modernization, land reform, and expanded legal and political rights for women."
 ideology_cwp_developmental_conservative:0 "Developmental Conservative"
 ideology_cwp_developmental_conservative_desc:0 "This leader prioritizes investment, strategic enterprise, a professional administration, and a strong security apparatus as foundations of national development."
 ideology_cwp_buddhist_socialist:0 "Buddhist Socialist"
 ideology_cwp_buddhist_socialist_desc:0 "This leader links parliamentary government and public welfare to Buddhist moral obligations and an honored place for Buddhism in national life."
