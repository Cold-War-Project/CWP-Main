l_english:
 cwp_military_global_power_projection: "Global Power Projection"
 cwp_military_global_power_projection_desc: "As the largest economy in the world, we keep forces, bases and fleets on every continent. Each formation costs far more to equip and sustain than it would for any other power."
 cwp_military_overseas_commitments: "Overseas Commitments"
 cwp_military_overseas_commitments_desc: "As one of the leading economies, we maintain garrisons, alliances and modern equipment abroad, which makes our forces more expensive to keep."
 cwp_military_labour_intensive_forces: "Labour-Intensive Forces"
 cwp_military_labour_intensive_forces_desc: "Our army relies on manpower rather than machines: older weapons, few vehicles and cheap supplies keep each formation far less costly than those of the industrial powers."
