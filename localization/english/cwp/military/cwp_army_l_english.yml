l_english:

# Land Combat Units
  # Infantry Units
  combat_unit_type_asymmetrical_forces: "Asymmetrical Forces"
  combat_unit_type_asymmetrical_forces_desc: "Irregular and guerrilla forces that avoid pitched battle and fight with light weapons, local knowledge and the support of the population. They lack heavy equipment but are hard to pin down."
  combat_unit_type_infantry_brigade: "Infantry Brigade"
  combat_unit_type_infantry_brigade_desc: "Riflemen with machine guns, mortars and light anti-tank weapons, moving on foot or by truck. Infantry remains the arm that takes and holds ground."
  combat_unit_type_armored_brigade: "Armored Brigade"
  combat_unit_type_armored_brigade_desc: "Tank battalions with supporting infantry, artillery and engineers, built to break through a defended line and exploit the gap. Armored formations such as the Soviet tank armies and the American armored divisions led the great offensives of 1943 to 1945."
  combat_unit_type_mechanized_brigade: "Mechanized Brigade"
  combat_unit_type_mechanized_brigade_desc: "Infantry carried in armored personnel carriers that move with the tanks and fight alongside them, from the vehicles or on foot."
  combat_unit_type_air_mobile_brigade: "Air Mobile Brigade"
  combat_unit_type_air_mobile_brigade_desc: "Infantry carried into battle by helicopter, able to land behind enemy lines or in terrain that ground vehicles cannot cross."
  combat_unit_type_tactical_brigade: "Tactical Brigade"
  combat_unit_type_tactical_brigade_desc: "Brigades of specialist light infantry trained and equipped for close combat in cities, counterinsurgency and raids."

  # Artillery Units
  combat_unit_type_wartime_artillery: "Wartime Artillery"
  combat_unit_type_wartime_artillery_desc: "Towed field guns and howitzers of the Second World War, such as the American 105 mm M2 and the Soviet 76 mm ZiS-3. They are still effective but slow to move and outranged by later designs."
  combat_unit_type_self_propelled_guns: "Self Propelled Guns"
  combat_unit_type_self_propelled_guns_desc: "Howitzers mounted on tracked or wheeled chassis that can keep pace with armored columns and move off before counter-battery fire arrives. The American M7 Priest of the Second World War was an early example."
  combat_unit_type_rocket_artillery: "Rocket Artillery"
  combat_unit_type_rocket_artillery_desc: "Multiple rocket launchers that fire salvos of unguided rockets to saturate an area in seconds, as the Soviet Katyusha did in the Second World War."
  combat_unit_type_airmobile_howitzers: "Airmobile Howitzers"
  combat_unit_type_airmobile_howitzers_desc: "Light howitzers that helicopters can carry slung beneath them, giving airmobile troops artillery support far from any road."
  combat_unit_type_tbm_launchers: "TBM Launchers"
  combat_unit_type_tbm_launchers_desc: "Mobile launchers for tactical ballistic missiles that strike airfields, depots and headquarters hundreds of kilometers behind the front."

  # Aircraft Units
  combat_unit_type_wartime_aircraft: "Wartime Aircraft"
  combat_unit_type_wartime_aircraft_desc: "Piston-engined fighters and bombers of the Second World War, such as the P-51 Mustang and the Il-2 Shturmovik. They are still useful against ground targets but no match for jet fighters."
  combat_unit_type_air_superiority_fighters: "Air Superiority Fighters"
  combat_unit_type_air_superiority_fighters_desc: "Jet fighters built to win control of the air by destroying enemy aircraft, first with guns and later with radar and air-to-air missiles."
  combat_unit_type_tactical_bombers: "Tactical Bombers"
  combat_unit_type_tactical_bombers_desc: "Jet bombers that strike troops, bridges, airfields and supply lines behind the front."
  combat_unit_type_fighter_bombers: "Fighter Bombers"
  combat_unit_type_fighter_bombers_desc: "Multirole jets that can fight for control of the air and attack ground targets on the same mission."
  combat_unit_type_stealth_aircraft: "Stealth Aircraft"
  combat_unit_type_stealth_aircraft_desc: "Aircraft shaped and coated to reduce their radar signature, so that they can penetrate air defenses and strike before they are detected."
