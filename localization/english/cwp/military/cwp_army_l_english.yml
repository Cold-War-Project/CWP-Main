l_english:

# Land Combat Units
  # Infantry Units
  combat_unit_type_asymmetrical_forces: "Asymmetrical Forces"
  combat_unit_type_asymmetrical_forces_desc: "Irregular forces that rely on unconventional tactics and guerrilla warfare to combat a stronger opponent, often lacking in heavy equipment but making up for it with mobility and surprise."
  combat_unit_type_infantry_brigade: "Infantry Brigade"
  combat_unit_type_infantry_brigade_desc: "The most basic and versatile unit type, Infantry Brigades are the backbone of any army, capable of holding ground and engaging in a variety of combat scenarios."
  combat_unit_type_armored_brigade: "Armored Brigade"
  combat_unit_type_armored_brigade_desc: "Equipped with tanks and armored vehicles, Armored Brigades excel in offensive operations and can break through enemy lines with their superior firepower and protection."
  combat_unit_type_mechanized_brigade: "Mechanized Brigade"
  combat_unit_type_mechanized_brigade_desc: "Combining the mobility of motorized infantry with the firepower of armored units, Mechanized Brigades are versatile and can adapt to various combat situations."
  combat_unit_type_air_mobile_brigade: "Air Mobile Brigade"
  combat_unit_type_air_mobile_brigade_desc: "Trained and equipped for rapid deployment by helicopters, Air Mobile Brigades can quickly respond to threats and conduct operations in difficult terrain where traditional vehicles may struggle."
  combat_unit_type_tactical_brigade: "Tactical Brigade"
  combat_unit_type_tactical_brigade_desc: "Specialized in urban and close-quarters combat, Tactical Brigades are trained to operate in complex environments and excel in clearing buildings and holding key positions."

  # Artillery Units
  combat_unit_type_wartime_artillery: "Wartime Artillery"
  combat_unit_type_wartime_artillery_desc: "Artillery units from the second world war, these guns provide essential fire support but lack the range and mobility of modern artillery."
  combat_unit_type_self_propelled_guns: "Self Propelled Guns"
  combat_unit_type_self_propelled_guns_desc: "Mounted on tracked or wheeled vehicles, self-propelled guns offer improved mobility and protection compared to towed artillery, allowing them to keep up with advancing forces."
  combat_unit_type_rocket_artillery: "Rocket Artillery"
  combat_unit_type_rocket_artillery_desc: "Rocket artillery units can deliver devastating barrages over a wide area, making them effective for suppressing enemy positions and disrupting formations."
  combat_unit_type_airmobile_howitzers: "Airmobile Howitzers"
  combat_unit_type_airmobile_howitzers_desc: "Lightweight howitzers that can be transported by helicopters, allowing for rapid deployment and fire support in remote or difficult terrain."
  combat_unit_type_tbm_launchers: "TBM Launchers"
  combat_unit_type_tbm_launchers_desc: "Tactical Ballistic Missile launchers provide long-range strike capabilities, allowing forces to target enemy infrastructure and command centers from a safe distance."

  # Aircraft Units
  combat_unit_type_wartime_aircraft: "Wartime Aircraft"
  combat_unit_type_wartime_aircraft_desc: "Monoplane fighters and bombers from WW2, they can hold their own against their kind but are outgunned by the dawn of jet aviation."
  combat_unit_type_air_superiority_fighters: "Air Superiority Fighters"
  combat_unit_type_air_superiority_fighters_desc: "Designed to dominate the skies, air superiority fighters are equipped with advanced radar and missiles to engage enemy aircraft at long range."
  combat_unit_type_tactical_bombers: "Tactical Bombers"
  combat_unit_type_tactical_bombers_desc: "Tactical bombers are designed for precision strikes against ground targets, using a variety of bombs and missiles to destroy enemy positions and infrastructure."
  combat_unit_type_fighter_bombers: "Fighter Bombers"
  combat_unit_type_fighter_bombers_desc: "Combining the capabilities of fighters and bombers, fighter bombers can engage both air and ground targets, providing flexibility in combat operations."
  combat_unit_type_stealth_aircraft: "Stealth Aircraft"
  combat_unit_type_stealth_aircraft_desc: "Stealth aircraft use advanced materials and design techniques to reduce their radar signature, allowing them to penetrate enemy defenses and strike with surprise."
