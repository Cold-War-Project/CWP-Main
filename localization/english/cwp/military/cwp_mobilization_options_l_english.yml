l_english:

  # Mobilization Option Groups
  army_supplies: "Army Supplies"
  army_rations: "Army Rations"
  army_battledress: "Army Battledress"
  army_luxuries: "Army Luxuries"
  army_logistics: "Army Logistics"
  army_communications: "Army Communications"
  army_support_weaponry: "Army Support Weaponry"
  army_medical_support: "Army Medical Support"

  # Mobilization Options
  mobilization_basic_supplies: "Basic Supplies"
  mobilization_basic_supplies_desc: "The minimum of ammunition, fuel and spare parts needed to keep an army in the field."
  mobilization_additional_supplies: "Additional Supplies"
  mobilization_additional_supplies_desc: "Reserve stocks are set aside to replace losses, so units stay at fighting strength for longer."
  mobilization_priority_supplies: "Priority Supplies"
  mobilization_priority_supplies_desc: "Reserve stocks are earmarked for these units and rushed forward to replace their losses first."
  mobilization_alchohol: "Alcohol"
  mobilization_alchohol_desc: "A ration of spirits, wine or beer, long issued by armies and navies to keep up morale."
  mobilization_tobacco: "Tobacco"
  mobilization_tobacco_desc: "Cigarettes, packed into many armies' field rations in the Second World War, steady the nerves at a cost to the soldiers' health."
  mobilization_chocolate: "Chocolate"
  mobilization_chocolate_desc: "Chocolate bars give a quick lift in energy and morale; the US Army's D ration bar was designed for exactly that."
  mobilization_entertainment: "Entertainment"
  mobilization_entertainment_desc: "Books, magazines, films and touring shows such as those of the USO break the monotony of service life."
  mobilization_radio_and_television: "Radio and Television"
  mobilization_radio_and_television_desc: "Forces broadcasting stations bring news, music and programs from home to soldiers wherever they serve."
  mobilization_basic_rations: "Basic Rations"
  mobilization_basic_rations_desc: "Bread, meat and staples cooked in field kitchens: simple, filling and monotonous."
  mobilization_canned_rations: "Canned Rations"
  mobilization_canned_rations_desc: "Canned rations, such as the American C ration, keep for years and can be eaten cold in the line."
  mobilization_mre_rations: "MRE Rations"
  mobilization_mre_rations_desc: "Lightweight, individually packed meals ready to eat, which soldiers can heat in the field without a kitchen."
  mobilization_catering_rations: "Catering Rations"
  mobilization_catering_rations_desc: "Refrigerated supply chains and mobile kitchens serve hot, varied meals close to the front."

  mobilization_no_standard_dress: "No Standard Dress"
  mobilization_no_standard_dress_desc: "No uniform is issued. Fighters wear their own clothes, perhaps with an armband or other mark."
  mobilization_webbing_and_helmets: "Webbing and Helmets"
  mobilization_webbing_and_helmets_desc: "Steel helmets against shell fragments, and load-carrying webbing for ammunition and kit."
  mobilization_flak_vests: "Flak Vests"
  mobilization_flak_vests_desc: "Body armor with steel or nylon plates that stops shell and grenade fragments, though not most rifle bullets."
  mobilization_ballistic_vests: "Ballistic Vests"
  mobilization_ballistic_vests_desc: "Kevlar vests that stop pistol rounds and fragments, with ceramic plates that can stop rifle bullets."

  mobilization_rail_logistics: "Rail Logistics"
  mobilization_rail_logistics_desc: "Supplies and reinforcements move to the front over the national railway network."
  mobilization_truck_logistics: "Truck Logistics"
  mobilization_truck_logistics_desc: "Truck columns carry supplies from the railheads to the units, wherever the roads go."
  mobilization_airborne_logistics: "Airborne Logistics"
  mobilization_airborne_logistics_desc: "Transport aircraft and helicopters deliver troops and supplies over long distances and to places no road reaches."

  mobilization_army_mail_system: "Army Mail System"
  mobilization_army_mail_system_desc: "Orders and reports travel by courier and dispatch rider: secure, but slow."
  mobilization_military_radios: "Military Radios"
  mobilization_military_radios_desc: "Field radios link units at once without wires that can be cut, though the enemy can listen in and jam them."
  mobilization_military_phone_network: "Military Phone Network"
  mobilization_military_phone_network_desc: "A protected military telephone and teleprinter network carries secure traffic between headquarters."
  mobilization_command_and_control_network: "Command and Control Network"
  mobilization_command_and_control_network_desc: "Satellite links and military data networks connect headquarters, units and sensors in a single command system."
  
  mobilization_rocket_propelled_grenades: "Rocket Propelled Grenades"
  mobilization_rocket_propelled_grenades_desc: "Shoulder-fired rocket launchers, descended from the bazooka and the Panzerfaust, give infantry a weapon against armored vehicles."
  mobilization_anti_tank_guided_missiles: "Anti-Tank Guided Missiles"
  mobilization_anti_tank_guided_missiles_desc: "Teams with wire-guided anti-tank missiles can destroy tanks at ranges of several kilometers."
  mobilization_manned_portable_air_defence: "Manned Portable Missiles"
  mobilization_manned_portable_air_defence_desc: "Shoulder-fired guided missiles let ground units defend themselves against helicopters and low-flying aircraft."

  mobilization_first_aid: "First Aid"
  mobilization_first_aid_desc: "Combat medics attached to each unit give life-saving treatment on the spot."
  mobilization_field_hospitals: "Field Hospitals"
  mobilization_field_hospitals_desc: "Field hospitals behind the lines, staffed by surgeons and nurses, treat wounds that the medics cannot."
  mobilization_medevac: "Medevac"
  mobilization_medevac_desc: "Helicopters and ambulances on standby carry the wounded from the battlefield to surgical care within hours."
