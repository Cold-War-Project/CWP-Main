l_english:

  # Mobilization Option Groups (CWP)
  support_weapons: "Support Weapons"
  support_weapons_desc: "Crew-served and guided weapons that give infantry the means to stop armor and aircraft."
  special_munitions: "Special Munitions"
  special_munitions_desc: "Incendiary, fuel-air and armor-piercing ammunition for targets that ordinary rounds cannot defeat."

  # Mobilization Options (CWP)
  mobilization_option_airborne_logistics: "Airborne Logistics"
  mobilization_option_airborne_logistics_desc: "Transport aircraft and helicopters deliver supplies straight to the units that need them, bypassing roads and railheads."
  mobilization_option_atgm_deployment: "ATGM Deployment"
  mobilization_option_atgm_deployment_desc: "Anti-tank guided missile teams let a handful of infantry hold their ground against an armored assault."
  mobilization_option_combat_drones: "Combat Drones"
  mobilization_option_combat_drones_desc: "Armed unmanned aircraft loiter over the battlefield and strike targets without risking a pilot."
  mobilization_option_depleted_uranium_munitions: "Depleted Uranium Munitions"
  mobilization_option_depleted_uranium_munitions_desc: "Penetrators of dense depleted uranium pierce modern tank armor; the toxic dust they leave behind makes them controversial."
  mobilization_option_helicopter_recon: "Helicopter Reconnaissance"
  mobilization_option_helicopter_recon_desc: "Scout helicopters map the ground ahead and spot enemy positions long before the column reaches them."
  mobilization_option_manpad_deployment: "MANPADS Deployment"
  mobilization_option_manpad_deployment_desc: "Shoulder-fired surface-to-air missiles give every company a way to keep enemy aircraft at a distance."
  mobilization_option_mobile_recon: "Mobile Reconnaissance"
  mobilization_option_mobile_recon_desc: "Light armored cars and jeeps range ahead of the main force to find the enemy and the routes around them."
  mobilization_option_motorization: "Motorization"
  mobilization_option_motorization_desc: "Trucks and jeeps move men and supplies at the speed of the road instead of the speed of the march."
  mobilization_option_napalm: "Napalm"
  mobilization_option_napalm_desc: "Jellied gasoline burns out entrenched positions and the jungle around them."
  mobilization_option_rail_logistics: "Rail Logistics"
  mobilization_option_rail_logistics_desc: "Dedicated military trains move whole divisions and their stores across the country in days."
  mobilization_option_recoilless_rifles: "Recoilless Rifles"
  mobilization_option_recoilless_rifles_desc: "Light, man-portable recoilless guns give infantry direct fire support against bunkers and light armor."
  mobilization_option_recon_drones: "Reconnaissance Drones"
  mobilization_option_recon_drones_desc: "Unmanned aircraft watch the battlefield around the clock and relay what they see in real time."
  mobilization_option_thermobaric_munitions: "Thermobaric Munitions"
  mobilization_option_thermobaric_munitions_desc: "Fuel-air explosives whose blast and pressure wave destroy bunkers, caves and buildings."

  # Combat Unit Groups (CWP)
  combat_unit_group_frontline_brigades: "Frontline Brigades"
  combat_unit_group_frontline_brigades_desc: "Infantry, armored and mechanized brigades that take and hold ground."
  combat_unit_group_fire_support: "Fire Support"
  combat_unit_group_fire_support_desc: "Artillery, rocket and missile units that break the enemy line before the brigades move in."
  combat_unit_group_aviation: "Aviation"
  combat_unit_group_aviation_desc: "Fighters and bombers that contest the skies and strike behind the front."
  combat_unit_group_escort_ships: "Escort Ships"
  combat_unit_group_escort_ships_desc: "Escort vessels that screen the fleet and protect convoys."
  combat_unit_group_capital_ship: "Capital Ships"
  combat_unit_group_capital_ship_desc: "The largest and most powerful vessels of the fleet."
  combat_unit_group_submarines: "Submarines"
  combat_unit_group_submarines_desc: "Submarines that hunt beneath the surface."

  # Ship Groups (CWP)
  ship_group_surface_combatants: "Surface Combatants"
  ship_group_surface_combatants_desc: "Cruisers, battleships and arsenal ships built to fight and win at sea."
  ship_group_escort_ships: "Escort Ships"
  ship_group_escort_ships_desc: "Destroyers, frigates and corvettes that screen the fleet and hunt submarines."
  ship_group_aviation_ships: "Aviation Ships"
  ship_group_aviation_ships_desc: "Carriers and aviation cruisers that take air power anywhere on the oceans."
  ship_group_auxiliary_ships: "Auxiliary Ships"
  ship_group_auxiliary_ships_desc: "Troopships and landing ships that carry the army across the sea."
  ship_group_submarines: "Submarines"
  ship_group_submarines_desc: "Diesel and nuclear submarines that stalk enemy fleets and shipping from below."
