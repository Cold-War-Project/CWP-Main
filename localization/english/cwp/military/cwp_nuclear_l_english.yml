l_english:
 je_cwp_atomic_monopoly: "The Atomic Monopoly"
 je_cwp_atomic_monopoly_reason: "Hiroshima and Nagasaki showed the world what [ROOT.GetCountry.GetName] alone can do. For now no other country has the bomb, and every capital knows it. The monopoly will last until someone else builds one; the scientists say a few years, the generals say longer."
 je_cwp_atomic_monopoly_goal: "Hold the monopoly as long as it lasts."
 je_cwp_atomic_monopoly_broken_desc: "Another power has tested an atomic bomb. The monopoly is over."
 cwp_nuc_another_power_tested_tt: "Another country has tested a nuclear weapon"

 je_cwp_nuclear_programme: "The Bomb"
 je_cwp_nuclear_programme_reason: "Somewhere in [ROOT.GetCountry.GetName], behind fences that appear on no map, physicists, engineers and conscript labourers are building the reactors, enrichment plants and test site needed for an atomic bomb. The programme swallows money, uranium and the best scientific talent in the country. When the material and the design are ready, the government must decide whether to test."
 je_cwp_nuclear_programme_goal: "Produce enough fissile material, complete a weapon design and test it."
 je_cwp_nuclear_programme_status: "The programme is still years from a weapon."
 je_cwp_nuclear_programme_status_ready: "The device is ready. Only the order to test is missing."
 je_cwp_nuclear_programme_success_desc: "[ROOT.GetCountry.GetName] is a nuclear power."
 je_cwp_nuclear_programme_abandoned_desc: "The nuclear weapons programme has been abandoned."

 cwp_nuc_fissile_bar: "Fissile Material"
 cwp_nuc_fissile_bar_desc: "Plutonium from the reactors and enriched uranium from the separation plants, enough for a first device."
 cwp_nuc_fissile_reactors_tt: "Reactors and separation plants"
 cwp_nuc_fissile_industry_tt: "A great power's industry"
 cwp_nuc_fissile_uranium_tt: "A secure uranium supply"
 cwp_nuc_espionage_factor_tt: "Stolen secrets"
 cwp_nuc_design_bar: "Weapon Design"
 cwp_nuc_design_bar_desc: "The physics and engineering of the implosion lens, the initiator and the bomb casing."
 cwp_nuc_design_physicists_tt: "The physicists' work"
 cwp_nuc_design_scientists_tt: "The intelligentsia in government backs the scientists"
 cwp_nuc_design_foreign_help_tt: "Help from a nuclear ally"

 cwp_nuc_start_programme_decision: "Build an Atomic Bomb"
 cwp_nuc_start_programme_decision_desc: "Order the construction of reactors, separation plants and a weapons laboratory, at a cost of about one per cent of national income a year, so that [ROOT.GetCountry.GetName] never again depends on another's bomb."
 cwp_nuc_start_programme_decision_tooltip: "Starts a nuclear weapons programme."
 cwp_nuc_bomb_exists_tt: "Some country has already shown that the bomb can be built"

 cwp_nuc_uranium_button: "Secure a Uranium Supply"
 cwp_nuc_uranium_button_desc: "Open mines at home and buy ore abroad, whatever it costs."
 cwp_nuc_uranium_tt: "Fissile material is produced faster. Costs extra money for five years."
 cwp_nuc_espionage_button: "Atomic Espionage"
 cwp_nuc_espionage_button_desc: "Our intelligence services have sources inside a rival's nuclear programme. Their reports could save years of work, if no one is caught."
 cwp_nuc_espionage_tt: "Both bars progress faster. There is a 30% chance the spies are discovered, souring relations with a nuclear power."
 cwp_nuc_foreign_help_button: "Ask a Nuclear Ally for Help"
 cwp_nuc_foreign_help_button_desc: "A friendly nuclear power could share designs, advisers and reactor technology."
 cwp_nuc_foreign_help_tt: "Weapon design progresses faster."
 cwp_nuc_friendly_nuclear_power_tt: "A nuclear power is at least friendly with us"
 cwp_nuc_test_button: "Test the Device"
 cwp_nuc_test_button_desc: "Detonate the first device at the test site and announce to the world that [ROOT.GetCountry.GetName] has the bomb."
 cwp_nuc_fissile_ready_tt: "Enough fissile material for a device"
 cwp_nuc_design_ready_tt: "The weapon design is complete"
 cwp_nuc_abandon_button: "Abandon the Programme"
 cwp_nuc_abandon_button_desc: "Close the laboratories and stop paying for a weapon we may never need."

 cwp_nuc_programme_cost: "Nuclear Weapons Programme"
 cwp_nuc_uranium_cost: "Uranium Procurement"
 cwp_nuclear_power: "Nuclear Power"
 cwp_atomic_monopoly: "Atomic Monopoly"
 cwp_nuc_rival_bomb_fear: "A Hostile Bomb"
 cwp_nuc_military_pride: "The Bomb Is Ours"

 cwp_nuc.1.t: "The First Test"
 cwp_nuc.1.d: "At dawn the device was raised on its tower. When it fired, the flash lit the desert for a hundred kilometres, and the cloud climbed higher than any mountain. The scientists embraced, then fell silent. [ROOT.GetCountry.GetName] has the bomb."
 cwp_nuc.1.d.RUS: "At Semipalatinsk on the Kazakh steppe, Kurchatov's team fired the first Soviet device from a tower surrounded by tanks, buildings and penned animals placed to measure the effects. The design followed the American one closely; the intelligence that made it possible will remain secret for decades. The American monopoly is over."
 cwp_nuc.1.d.GBR: "Off the Monte Bello Islands in Western Australia, a device sealed inside the hull of an old frigate was detonated in the shallow lagoon. Shut out of the American programme by the McMahon Act, Britain has built the bomb alone, and paid for it in a time of rationing."
 cwp_nuc.1.d.FRA: "In the desert near Reggane, France has detonated its first device, four times larger than the bomb at Hiroshima. Whatever the allies say, France will now make its own decisions on war and peace."
 cwp_nuc.1.d.CHI: "At Lop Nur, in the deserts of Xinjiang, Chinese scientists have fired their first device, built after the Soviet advisers left and took their blueprints with them. The imperialists and the revisionists alike must now reckon with a nuclear China."
 cwp_nuc.1.f: "\"Now I am become Death, the destroyer of worlds.\"\n- J. Robert Oppenheimer, recalling the Trinity test"
 cwp_nuc.1.a: "Announce it to the world."

 cwp_nuc.2.t: "Another Power Has the Bomb"
 cwp_nuc.2.d: "Seismographs and air samples confirm it: [SCOPE.sCountry('cwp_nuc_new_power').GetName] has tested an atomic weapon. Ministers who thought the bomb would stay in a few hands must think again, and generals redraw their plans for a war in which any city can vanish in a second."
 cwp_nuc.2.f: "The club had a new member, and every member made the world more dangerous."
 cwp_nuc.2.a: "This changes the balance of power."
 cwp_nuc.2.b: "A friend with the bomb is no threat to us."

 cwp_nuc.4.t: "The Atomic Project"
 cwp_nuc.4.d: "The order has been signed. A special committee will direct the project, answerable to the head of government alone. Sites are being chosen for reactors and laboratories, far from prying eyes, and the country's best physicists are receiving letters that tell them little except where to report."
 cwp_nuc.4.f: "Secrecy was the first thing the project built."
 cwp_nuc.4.a: "Spare no expense."
