l_english:
 je_cwp_atomic_monopoly: "The Atomic Monopoly"
 je_cwp_atomic_monopoly_reason: "In August 1945 American atomic bombs destroyed Hiroshima and Nagasaki. No other country has the bomb, and [ROOT.GetCountry.GetName] alone holds a weapon that can destroy a city with a single aircraft. The monopoly will last until another power builds one. Many of the scientists who built the bomb expect that within a few years; many officers and officials expect it to take much longer."
 je_cwp_atomic_monopoly_broken_desc: "Another power has tested an atomic bomb. The monopoly is over."
 cwp_nuc_another_power_tested_tt: "Another country has tested a nuclear weapon"

 je_cwp_nuclear_programme: "Nuclear Weapons Program"
 je_cwp_nuclear_programme_reason: "In [ROOT.GetCountry.GetName], behind fences that appear on no map, physicists and engineers are building the reactors, separation plants and laboratories an atomic bomb requires. The program consumes money, uranium and the country's best scientific talent. When there is enough fissile material and the design is finished, the government must decide whether to test."
 je_cwp_nuclear_programme_status: "The program is still years from a weapon."
 cwp_nuc_monopoly_tt: "No other country has tested a nuclear device"
 cwp_nuc_invalid_tt: "We became a subject before testing a device"
 cwp_nuc_has_territory_tt: "We have an incorporated state"
 cwp_nuc_tested_tt: "We have tested a nuclear device"
 cwp_nuc_abandoned_tt: "We have abandoned the program"
 je_cwp_nuclear_programme_status_ready: "The device is ready. Only the order to test is missing."
 je_cwp_nuclear_programme_success_desc: "[ROOT.GetCountry.GetName] is a nuclear power."
 je_cwp_nuclear_programme_abandoned_desc: "The nuclear weapons program has been abandoned."

 cwp_nuc_fissile_bar: "Fissile Material"
 cwp_nuc_fissile_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_nuc_fissile_bar_explain_tt Fissile material#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 cwp_nuc_fissile_bar_explain_tt: "Plutonium from the reactors and enriched uranium from the separation plants, enough for a first device."
 cwp_nuc_fissile_bar_second_desc: "First device at #v 100#!"
 cwp_nuc_fissile_reactors_tt: "Reactors and separation plants"
 cwp_nuc_fissile_industry_tt: "A great power's industry"
 cwp_nuc_superpower_tt: "A superpower's industrial base"
 cwp_nuc_fissile_uranium_tt: "A secure uranium supply"
 cwp_nuc_espionage_factor_tt: "Stolen secrets"

 cwp_nuc_start_programme_decision: "Build an Atomic Bomb"
 cwp_nuc_start_programme_decision_desc: "Order the construction of reactors, separation plants and a weapons laboratory, at a cost of about one percent of national income a year, so that [ROOT.GetCountry.GetName] does not depend on another power's bomb."
 cwp_nuc_start_programme_decision_tooltip: "Starts a nuclear weapons program."
 cwp_nuc_bomb_exists_tt: "Some country has already shown that the bomb can be built"

 cwp_nuc_uranium_button: "Secure a Uranium Supply"
 cwp_nuc_uranium_button_desc: "Open mines at home and buy ore abroad, whatever it costs."
 cwp_nuc_uranium_tt: "Fissile material is produced faster. Costs extra money for five years."
 cwp_nuc_espionage_button: "Atomic Espionage"
 cwp_nuc_espionage_button_desc: "Our intelligence services have sources inside a rival's nuclear program. Their reports could save years of work, if no one is caught."
 cwp_nuc_espionage_tt: "Fissile material comes faster and the weapon design is finished at once. There is a 30% chance the spies are discovered, souring relations with a nuclear power."
 cwp_nuc_foreign_help_button: "Ask a Nuclear Ally for Help"
 cwp_nuc_foreign_help_button_desc: "The leader of our bloc could share designs, advisers and reactor technology, if it trusts us."
 cwp_nuc_foreign_help_tt: "The weapon design is finished without waiting out the years of work."
 cwp_nuc_friendly_nuclear_power_tt: "Our overlord, or a friendly leader of our power bloc, has the bomb"
 cwp_nuc_test_button: "Test the Device"
 cwp_nuc_test_button_desc: "Detonate the first device at the test site and announce to the world that [ROOT.GetCountry.GetName] has the bomb."
 cwp_nuc_fissile_ready_tt: "Enough fissile material for a device"
 cwp_nuc_design_ready_tt: "The weapon design is finished: four years of work, or shortened by espionage or an ally's help"
 cwp_nuc_laboratory_tt: "A weapons laboratory: a university of at least level 4"
 cwp_nuc_test_site_ready_tt: "A test site has been chosen"
 cwp_nuc_test_site_button: "Choose a Test Site"
 cwp_nuc_test_site_button_desc: "Clear the emptiest corner of the country for the test: move the herders out, build the tower, the bunkers and the instrument lines."
 cwp_nuc_test_site_tt: "The least populated incorporated state becomes the test site."
 cwp_nuc_abandon_button: "Abandon the Program"
 cwp_nuc_abandon_button_desc: "Close the laboratories and stop paying for a weapon we may never need."

 cwp_nuc_programme_cost: "Nuclear Weapons Program"
 cwp_nuc_uranium_cost: "Uranium Procurement"
 cwp_nuclear_power: "Nuclear Power"
 cwp_atomic_monopoly: "Atomic Monopoly"
 cwp_nuc_rival_bomb_fear: "Rival Nuclear Capability"
 cwp_nuc_military_pride: "Nuclear Prestige"

 cwp_nuc.1.t: "The First Test"
 cwp_nuc.1.d: "The device was raised on its tower at the test site and fired at dawn. The flash lit the sky for many kilometers around, and the cloud climbed more than ten kilometers into the air. [ROOT.GetCountry.GetName] has the bomb."
 cwp_nuc.1.d.RUS: "At the test site, the [ROOT.GetCountry.GetAdjective] uranium project, begun under Igor Kurchatov in 1943, has fired its first device from a tower ringed with tanks, buildings and penned animals placed to measure the effects. [ROOT.GetCountry.GetName] has the bomb."
 cwp_nuc.1.d.GBR: "British scientists worked at Los Alamos under the Quebec Agreement of 1943. Now [ROOT.GetCountry.GetNameNoFlag] has built and fired a bomb of its own, at great cost to the treasury."
 cwp_nuc.1.d.FRA: "[ROOT.GetCountry.GetNameNoFlag] has fired its first atomic device, the work of the Commissariat à l'énergie atomique that de Gaulle's provisional government founded in October 1945. The country can now make its own decisions on nuclear war and peace, whatever its allies think."
 cwp_nuc.1.d.CHI: "[ROOT.GetCountry.GetNameNoFlag] has fired its first atomic device. Its physicists, many of them trained in Europe and the United States, have given the country the bomb."
 cwp_nuc.1.f: "\"It is an atomic bomb. It is a harnessing of the basic power of the universe.\"\n— Statement by the President of the United States, 6 August 1945"
 cwp_nuc.1.a: "Announce it to the world."
 cwp_nuc.1.b: "Say nothing; let their seismographs find it."
 cwp_nuc_secret_test_tt: "Half the prestige of an announced test, and no gloating to provoke the rivals."

 cwp_nuc.2.t: "Another Power Has the Bomb"
 cwp_nuc.2.d: "Seismographs and air samples confirm it: [SCOPE.sCountry('cwp_nuc_new_power').GetName] has tested an atomic weapon. Ministers who expected the bomb to stay in a few hands must think again, and general staffs are redrawing their plans for a war in which any city could be destroyed in a moment."
 cwp_nuc.2.f: "Aircraft sampling the upper air picked up the fallout thousands of kilometers downwind."
 cwp_nuc.2.a: "Revise the war plans."
 cwp_nuc.2.b: "A friend with the bomb is no threat to us."

 cwp_nuc.4.t: "The Atomic Project"
 cwp_nuc.4.d: "The order has been signed. A special committee will direct the project, answerable to the head of government alone. Sites are being chosen for reactors and laboratories, far from prying eyes, and the country's best physicists are receiving letters that tell them little except where to report."
 cwp_nuc.4.f: "\"Within four months we shall in all probability have completed the most terrible weapon ever known in human history, one bomb of which could destroy a whole city.\"\n— Henry L. Stimson, memorandum for President Truman, April 1945"
 cwp_nuc.4.a: "A crash program: spare no expense."
 cwp_nuc.4.b: "A steady program within the budget."
 cwp_nuc_steady_tt: "No extra cost, and no head start."
