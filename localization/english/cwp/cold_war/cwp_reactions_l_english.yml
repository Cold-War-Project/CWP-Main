l_english:
 # Cold War Project: reaction events (namespace cwp_rx). Voice: docs/agents/loc-style.md. See docs/agents/areas/reactions.md.

 ### A first atomic test
 cwp_rx.1.t: "[SCOPE.sCountry('cwp_rx_tester').GetName] Has the Bomb"
 cwp_rx.1.d: "Long-range air sampling has picked up fission products, and the analysts agree: [SCOPE.sCountry('cwp_rx_tester').GetName] has exploded an atomic device. The general staff wants a weapon a generation ahead, the hydrogen bomb that some physicists say can be built. The scientists advising the government call such a weapon a danger to humanity and urge a fresh approach on the international control of atomic energy."
 cwp_rx.1.f: "\"Thus far the chief purpose of our military establishment has been to win wars. From now on its chief purpose must be to avert them.\"\n— Bernard Brodie, The Absolute Weapon"
 cwp_rx.1.a: "Build the hydrogen bomb."
 cwp_rx.1.b: "Propose international control."

 cwp_rx.2.t: "Petitions Against the Bomb"
 cwp_rx.2.d: "The news that [SCOPE.sCountry('cwp_rx_tester').GetName] has the bomb is a gift to the communists of [ROOT.GetCountry.GetNameNoFlag]. Their newspapers call it the end of atomic blackmail, and party activists, union stewards and sympathetic clergy are collecting signatures for a petition to outlaw atomic weapons. Many who sign have never voted communist. The interior ministry asks whether the campaign may continue."
 cwp_rx.2.f: "Petition sheets pass from hand to hand in factories, parish halls and street markets."
 cwp_rx.2.a: "Ban the petition campaign."
 cwp_rx.2.b: "Let the petitions circulate."

 cwp_rx.3.t: "A New Nuclear Power"
 cwp_rx.3.d: "[SCOPE.sCountry('cwp_rx_tester').GetName] has tested an atomic weapon, and [ROOT.GetCountry.GetNameNoFlag] has none of its own. The service chiefs present two papers to the cabinet. One relies on diplomacy, or on the deterrent of a nuclear-armed ally where there is one. The other asks for more divisions, aircraft and air defense, paid for at the expense of housing and welfare."
 cwp_rx.3.a: "Rely on [SCOPE.sCountry('cwp_rx_patron').GetNameNoFlag]'s deterrent."
 cwp_rx.3.b: "Raise the defense budget."
 cwp_rx.3.c: "Call for an end to atomic tests."

 ### The Chinese civil war
 cwp_rx.10.t: "Who Lost China?"
 cwp_rx.10.d: "The Communists are masters of the Chinese mainland, and the opposition in [ROOT.GetCountry.GetNameNoFlag] wants to know who lost China. The China lobby, from missionary societies to newspaper publishers, blames the diplomats who reported that the Nationalist government was corrupt and doomed. The government can open loyalty investigations into the China specialists of the foreign service, or publish the record of its China policy and argue that the outcome was beyond its control."
 cwp_rx.10.f: "\"The unfortunate but inescapable fact is that the ominous result of the civil war in China was beyond the control of the government of the United States.\"\n— Dean Acheson, letter of transmittal, United States Relations with China"
 cwp_rx.10.a: "Investigate the China hands."
 cwp_rx.10.b: "Publish a white paper."

 cwp_rx.11.t: "The Chinese Revolution"
 cwp_rx.11.d: "Communist armies have won the civil war on the mainland, and the communists of [ROOT.GetCountry.GetNameNoFlag] study the victory closely. Their cadres circulate Mao's writings on people's war, and in the villages recruiters say that what worked in China will work here. The police ask for emergency regulations: detention without trial, a ban on the party press and the resettlement of villages that feed the guerrillas. The foreign ministry asks instead whether to recognize the new government in [SCOPE.sCountry('cwp_rx_prc').GetCapital.GetName]."
 cwp_rx.11.f: "\"Political power grows out of the barrel of a gun.\"\n— Mao Zedong, Problems of War and Strategy"
 cwp_rx.11.a: "Introduce emergency regulations."
 cwp_rx.11.b: "Recognize the new government."

 cwp_rx.12.t: "The Communists Defeated in China"
 cwp_rx.12.d: "The Nationalist government has destroyed the Communist state in China, and the communists of [ROOT.GetCountry.GetNameNoFlag] have lost their model and their likeliest patron. Party members drift away and some offer to inform. The army and the landowners want the party outlawed while it is weak. Others in the cabinet argue that an amnesty would bring the rank and file home and leave the leaders isolated."
 cwp_rx.12.f: "Party offices close quietly, and the posters come down."
 cwp_rx.12.a: "Outlaw the party."
 cwp_rx.12.b: "Offer an amnesty."

 ### War in Korea
 cwp_rx.20.t: "War in Korea"
 cwp_rx.20.d: "Fighting has broken out across the Korean peninsula, and the general staff in [ROOT.GetCountry.GetNameNoFlag] reads it as proof that the communist powers will use force where they think they can win. It asks for a rearmament program: more divisions, more aircraft, and factories turned over to war production. The treasury warns that the money will come from housing, health and pensions, and the unions will not accept charges on services they fought for."
 cwp_rx.20.f: "Defense orders pour into the shipyards and machine shops."
 cwp_rx.20.a: "Launch a rearmament program."
 cwp_rx.20.b: "Hold the budget."

 ### Independence of a great colony
 cwp_rx.30.t: "[SCOPE.sCountry('cwp_rx_new_state').GetName] Is Independent"
 cwp_rx.30.d.india: "India's transfer of power is complete, and the nationalists of [ROOT.GetCountry.GetNameNoFlag] take it as their own case won. Mass civil disobedience and years of negotiation brought the largest colony in the world to self-government. Nationalist leaders now ask [SCOPE.sCountry('cwp_rx_metropole').GetNameNoFlag] for a date for independence. Moderates in the legislative council prefer to press for each new constitution in turn."
 cwp_rx.30.d: "[SCOPE.sCountry('cwp_rx_new_state').GetName] has won its independence, and the nationalists of [ROOT.GetCountry.GetNameNoFlag] ask why they should wait any longer. They are demanding that [SCOPE.sCountry('cwp_rx_metropole').GetNameNoFlag] name a date. Moderates in the legislative council prefer to press for each new constitution in turn."
 cwp_rx.30.f: "\"They respect the right of all peoples to choose the form of government under which they will live.\"\n— The Atlantic Charter"
 cwp_rx.30.a: "Demand a date for independence."
 cwp_rx.30.b: "Work through the constitution."

 cwp_rx.31.t: "After [SCOPE.sCountry('cwp_rx_new_state').GetName]"
 cwp_rx.31.d.india: "India is independent, and nationalists in every colony of [ROOT.GetCountry.GetNameNoFlag] quote the transfer of power at their governors. The colonial office proposes a program of constitutional advance: elected majorities in the legislative councils and a promise of self-government. The army and the settlers' lobby call that the road to losing everything and urge the governors to hold firm."
 cwp_rx.31.d: "[SCOPE.sCountry('cwp_rx_new_state').GetName] is independent, and nationalists in the colonies of [ROOT.GetCountry.GetNameNoFlag] ask for the same. The colonial office proposes a program of constitutional advance. The army and the settlers' lobby urge the governors to hold firm."
 cwp_rx.31.a: "Promise constitutional advance."
 cwp_rx.31.b: "Hold firm."

 ### The Berlin blockade
 cwp_rx.40.t: "The Berlin Blockade"
 cwp_rx.40.d: "Soviet forces have cut the roads, railways and canals into the western sectors of Berlin, and the city depends on what can be flown in. In [ROOT.GetCountry.GetNameNoFlag] the communists blame the Western currency reform, but many voters see a city being starved into surrender. [SCOPE.sCountry('cwp_rx_west_leader').GetNameNoFlag] asks its friends for aircraft and crews. Others in the cabinet would rather press the occupying powers to negotiate a settlement for all of Germany."
 cwp_rx.40.f: "Transport aircraft land at Tempelhof around the clock."
 cwp_rx.40.a: "Contribute to the airlift."
 cwp_rx.40.b: "Urge a settlement over Germany."

 ### NATO
 cwp_rx.50.t: "Strikes Against the Atlantic Pact"
 cwp_rx.50.d: "The communist-led unions of [ROOT.GetCountry.GetNameNoFlag] have declared war on the North Atlantic Treaty. Dockers refuse to unload the first shipments of allied military aid, and railwaymen threaten to stop the trains that would carry it. The interior minister wants the police on the quays and strikebreakers on the cranes. The labor minister would rather negotiate with the federations, and let the deliveries wait."
 cwp_rx.50.f: "\"The Parties agree that an armed attack against one or more of them in Europe or North America shall be considered an attack against them all.\"\n— The North Atlantic Treaty, Article 5"
 cwp_rx.50.a: "Send in the police."
 cwp_rx.50.b: "Negotiate with the unions."

