l_english:
 # Cold War Project: the global Cold War (je_cwp_cold_war). See docs/agents/areas/cold-war.md.
 je_group_cwp_cold_war: "The Cold War"

 je_cwp_cold_war: "The Correlation of Forces"
 je_cwp_cold_war_reason: "Two camps have come out of the war, each sure that history is on its side. In Moscow they speak of the correlation of forces: the balance of economic weight, military power and political allegiance between socialism and capitalism, which they believe can only move one way. In Washington they speak of containment. Neither side will risk open war with the other, so the struggle is fought everywhere else: in elections and strikes, in aid budgets and arms shipments, and in revolutions from the Balkans to the Mekong. Every country that changes sides changes the balance.\n\nCommunist camp: #b [GetGlobalVariable('cwp_cw_east_count').GetValue|0]#! states, #b [GetGlobalVariable('cwp_cw_east_gdp').GetValue|K]#! GDP\nWestern camp: #b [GetGlobalVariable('cwp_cw_west_count').GetValue|0]#! states, #b [GetGlobalVariable('cwp_cw_west_gdp').GetValue|K]#! GDP\nNon-aligned: #b [GetGlobalVariable('cwp_cw_nonaligned_count').GetValue|0]#! states\nCommunist revolutions under way: #b [GetGlobalVariable('cwp_cw_revolutions').GetValue|0]#!\nFallen to communism since 1946: #b [GetGlobalVariable('cwp_cw_fallen_count').GetValue|0]#!, left the socialist camp: #b [GetGlobalVariable('cwp_cw_departed_count').GetValue|0]#!"
 je_cwp_cold_war_status_0: "The West ascendant"
 je_cwp_cold_war_status_1: "Containment holds"
 je_cwp_cold_war_status_2: "The balance is shifting"
 je_cwp_cold_war_status_3: "The tide favours socialism"
 je_cwp_cold_war_status_4: "The West is losing the Cold War"

 cwp_cw_correlation_bar: "Correlation of Forces"
 cwp_cw_correlation_bar_desc: "How the world looks now, from #b 0#! (the West dominant) to #b 100#! (socialism dominant). Recalculated each month:\n- the communist camp's share of the two camps' GDP: #b [GetGlobalVariable('cwp_cw_east_gdp').GetValue|K]#! against #b [GetGlobalVariable('cwp_cw_west_gdp').GetValue|K]#! (counts 60%)\n- its share of the two camps' states: #b [GetGlobalVariable('cwp_cw_east_count').GetValue|0]#! against #b [GetGlobalVariable('cwp_cw_west_count').GetValue|0]#! (counts 40%)\n- momentum from recent changes of side: #b [GetGlobalVariable('cwp_cw_momentum').GetValue|1]#! (+3 for each country that falls to communism, -3 for each that leaves it, fading over the years)\n- -5 while only the leader of the Western camp has the atomic bomb"

 je_cwp_cold_war_west_header: "The socialist camp collapses"
 je_cwp_cold_war_east_collapsed_tt: "No communist [concept_great_power] leads a [concept_power_bloc]"
 je_cwp_cold_war_west_desc: "The socialist camp has come apart. Its bloc is gone, its leaders have lost faith in the system or their power to hold it together, and the states that remain communist no longer claim to be building a different world. The Cold War is over, and the West has won it."
 je_cwp_cold_war_west_effect_tt: "Every country gets #b The End of History#! for 20 years (communist appeal -50%, fading). The Western camp is #b Victorious in the Cold War#! for 10 years; communist states suffer #b The God That Failed#! (legitimacy -15, fading)."
 je_cwp_cold_war_east_header: "The capitalist camp collapses"
 je_cwp_cold_war_west_collapsed_tt: "No non-communist [concept_great_power] leads a [concept_power_bloc]"
 je_cwp_cold_war_east_desc: "No great capitalist power is left to lead an alliance against socialism. What Moscow called the correlation of forces has tipped for good, and the world the Western powers built after the war is being taken apart."
 je_cwp_cold_war_east_effect_tt: "Every country gets #b The Wave of the Future#! for 20 years (communist appeal +50%, fading). Communist states are #b Victorious in the Cold War#! for 10 years; the Western camp suffers #b The Free World in Retreat#! (legitimacy -15, fading)."

 cwp_cw_map_east_core: "[SCOPE.sCountry('cwp_cw_map_country').GetName]: #b communist camp#!, in the leading socialist bloc"
 cwp_cw_map_east_outer: "[SCOPE.sCountry('cwp_cw_map_country').GetName]: #b communist#!, outside the leading socialist bloc"
 cwp_cw_map_west_core: "[SCOPE.sCountry('cwp_cw_map_country').GetName]: #b Western camp#!, in the leading Western bloc or alliance"
 cwp_cw_map_west_outer: "[SCOPE.sCountry('cwp_cw_map_country').GetName]: #b aligned with the West#!"
 cwp_cw_map_nonaligned: "[SCOPE.sCountry('cwp_cw_map_country').GetName]: #b non-aligned#!"
 cwp_cw_map_movement_support: "[SCOPE.sPoliticalMovement('cwp_cw_map_movement').GetName]: [Concept('concept_political_movement_support','$concept_political_movement_support_short|q$')] [SCOPE.sPoliticalMovement('cwp_cw_map_movement').GetSupport|%v]"
 cwp_cw_map_appeal_down: "Foreign aid is lowering the appeal of communism here"
 cwp_cw_map_appeal_up: "Foreign communists are backing the movement here"
 cwp_cw_map_revolution: "@warning! A #b communist revolution#! is under way"

 cwp_cold_war.1.t: "[SCOPE.sCountry('cwp_cw_fallen').GetName] Goes Red"
 cwp_cold_war.1.d: "[SCOPE.sCountry('cwp_cw_fallen').GetName] is now ruled by communists. Whether they came to power by revolution, by the ballot box or behind the guns of a friendly army, the country has changed sides in the struggle between the two camps. In one capital this is proof that history is moving as it should; in the other, it is a question of who lost [SCOPE.sCountry('cwp_cw_fallen').GetName], and who will be next."
 cwp_cold_war.1.f: "Communist states in the world: [GetGlobalVariable('cwp_cw_east_count').GetValue|0]"
 cwp_cold_war.1.a: "The balance shifts."
 cwp_cold_war.2.t: "[SCOPE.sCountry('cwp_cw_departed').GetName] Leaves the Socialist Camp"
 cwp_cold_war.2.d: "The communist government of [SCOPE.sCountry('cwp_cw_departed').GetName] is gone, and the country no longer counts itself among the socialist states. For one camp it is a breach in the wall; for the other, evidence that the tide can be turned back."
 cwp_cold_war.2.f: "Communist states in the world: [GetGlobalVariable('cwp_cw_east_count').GetValue|0]"
 cwp_cold_war.2.a: "The balance shifts."
 cwp_cold_war.3.t: "The Cold War Is Over"
 cwp_cold_war.3.d: "No communist great power leads a bloc any more. The socialist camp that once covered a third of the world has dissolved into states going their own ways, and the ideological struggle that shaped every crisis since the war has ended with the victory of the West. Some call it the end of history."
 cwp_cold_war.3.f: "Fallen to communism since 1946: [GetGlobalVariable('cwp_cw_fallen_count').GetValue|0]. Left the socialist camp: [GetGlobalVariable('cwp_cw_departed_count').GetValue|0]."
 cwp_cold_war.3.a: "A new world order."
 cwp_cold_war.4.t: "The Capitalist World Falls Apart"
 cwp_cold_war.4.d: "No great capitalist power leads a bloc any more. The alliances the West built after the war have broken up, and socialism now sets the terms of world politics. Its supporters call it the wave of the future."
 cwp_cold_war.4.f: "Fallen to communism since 1946: [GetGlobalVariable('cwp_cw_fallen_count').GetValue|0]. Left the socialist camp: [GetGlobalVariable('cwp_cw_departed_count').GetValue|0]."
 cwp_cold_war.4.a: "History has chosen."

 cwp_cw_economic_aid: "Extend Economic Aid"
 cwp_cw_economic_aid_action_name: "Extend Economic Aid"
 cwp_cw_economic_aid_action_propose_name: "Offer Economic Aid"
 cwp_cw_economic_aid_desc: "Pay a share of the target's tax income to its people, most of it to the poor, while the pact lasts. Poverty is communism's best recruiter: aid lowers the appeal of communist movements in the target by 25%."
 cwp_cw_economic_aid_action_notification_name: "Economic aid"
 cwp_cw_economic_aid_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has extended economic aid to us."
 cwp_cw_economic_aid_action_break_name: "End Economic Aid"
 cwp_cw_economic_aid_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] gives economic aid to [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]."
 cwp_cw_economic_aid_action_notification_break_name: "Economic aid ended"
 cwp_cw_economic_aid_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has ended its economic aid."

 cwp_cw_fraternal_support: "Fraternal Support"
 cwp_cw_fraternal_support_action_name: "Give Fraternal Support"
 cwp_cw_fraternal_support_action_propose_name: "Give Fraternal Support"
 cwp_cw_fraternal_support_desc: "Fund, train and arm the communists of the target country. Communist movements there gain 50% appeal while the pact lasts; their government will not thank us."
 cwp_cw_fraternal_support_action_notification_name: "Foreign communist support"
 cwp_cw_fraternal_support_action_notification_desc: "[INITIATOR_COUNTRY.GetName] is funding and arming the communists in our country."
 cwp_cw_fraternal_support_action_break_name: "End Fraternal Support"
 cwp_cw_fraternal_support_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] backs the communists of [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]."
 cwp_cw_fraternal_support_action_notification_break_name: "Foreign communist support ended"
 cwp_cw_fraternal_support_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] no longer backs the communists in our country."

 cwp_cw_target_not_communist_tt: "Target is not a communist state"
 cwp_cw_target_has_comrades_tt: "Target has a communist movement"

 country_cwp_cw_communist_appeal_mult: "Appeal of communism"
 country_cwp_cw_communist_appeal_mult_desc: "How strongly communist movements attract pops in this country, from foreign aid, foreign sponsorship and the state of the Cold War."
 CWP_CW_COMMUNIST_APPEAL: "The Cold War (aid and foreign backing)"

 cwp_cw_free_world_victorious: "Victorious in the Cold War"
 cwp_cw_free_world_victorious_desc: "We stood with the camp that won the Cold War."
 cwp_cw_end_of_history: "The End of History"
 cwp_cw_end_of_history_desc: "The socialist camp has collapsed, and few still believe communism is the future."
 cwp_cw_god_that_failed: "The God That Failed"
 cwp_cw_god_that_failed_desc: "The collapse of the socialist camp has shaken faith in our system."
 cwp_cw_socialist_camp_victorious: "Victorious in the Cold War"
 cwp_cw_socialist_camp_victorious_desc: "We stood with the camp that won the Cold War."
 cwp_cw_wave_of_the_future: "The Wave of the Future"
 cwp_cw_wave_of_the_future_desc: "The capitalist camp has collapsed, and communism looks like the future."
 cwp_cw_free_world_in_retreat: "The Free World in Retreat"
 cwp_cw_free_world_in_retreat_desc: "The collapse of the Western camp has shaken faith in our system."
