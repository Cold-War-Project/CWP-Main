l_english:
 # Cold War Project: the global Cold War (je_cwp_cold_war). See docs/agents/areas/cold-war.md.
 je_group_cwp_cold_war: "The Cold War"

 je_cwp_cold_war: "The Correlation of Forces"
 je_cwp_cold_war_reason: "The Second World War left two camps, each sure that history was on its side. Soviet writers speak of the correlation of forces: the balance of economic, military and political strength between socialism and capitalism, which Marxist theory holds must shift toward socialism. Western officials count the same things in their own terms: industrial output, bases, allies and votes in the United Nations. Neither side will risk open war with the other, so the contest is fought in elections and strikes, in loans and arms shipments, and in civil wars and revolutions far from Europe.\n\nCommunist camp: #b [GetGlobalVariable('cwp_cw_east_count').GetValue|0]#! states, #b [GetGlobalVariable('cwp_cw_east_gdp').GetValue|K]#! GDP\nWestern camp: #b [GetGlobalVariable('cwp_cw_west_count').GetValue|0]#! states, #b [GetGlobalVariable('cwp_cw_west_gdp').GetValue|K]#! GDP\nNon-aligned: #b [GetGlobalVariable('cwp_cw_nonaligned_count').GetValue|0]#! states\nCommunist revolutions under way: #b [GetGlobalVariable('cwp_cw_revolutions').GetValue|0]#!\nFallen to communism since 1946: #b [GetGlobalVariable('cwp_cw_fallen_count').GetValue|0]#!, left the socialist camp: #b [GetGlobalVariable('cwp_cw_departed_count').GetValue|0]#!"
 je_cwp_cold_war_status_0: "A Preponderance of Power"
 je_cwp_cold_war_status_1: "Bipolar Stability"
 je_cwp_cold_war_status_2: "Strategic Parity"
 je_cwp_cold_war_status_3: "A Shift in the Correlation of Forces"
 je_cwp_cold_war_status_4: "Socialist Preponderance"

 cwp_cw_correlation_bar: "Correlation of Forces"
 cwp_cw_correlation_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_cw_correlation_bar_explain_tt Correlation of forces#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#! (0 West, 100 East)"
 cwp_cw_correlation_bar_explain_tt: "How the world looks now, from #b 0#! (the West dominant) to #b 100#! (socialism dominant). Recalculated each month:\n- the communist camp's share of the two camps' GDP: #b [GetGlobalVariable('cwp_cw_east_gdp').GetValue|K]#! against #b [GetGlobalVariable('cwp_cw_west_gdp').GetValue|K]#! (counts 60%)\n- its share of the two camps' states: #b [GetGlobalVariable('cwp_cw_east_count').GetValue|0]#! against #b [GetGlobalVariable('cwp_cw_west_count').GetValue|0]#! (counts 40%)\n- momentum from recent changes of side: #b [GetGlobalVariable('cwp_cw_momentum').GetValue|1]#! (+1.5 for each country that falls to communism, -1.5 for each that leaves it, halving every two years)\n- -5 while only the leader of the Western camp has the atomic bomb"

 je_cwp_cold_war_west_header: "The socialist camp collapses"
 je_cwp_cold_war_east_collapsed_tt: "No communist [concept_great_power] leads a [concept_power_bloc]"
 je_cwp_cold_war_west_desc: "The socialist camp has dissolved: no communist great power leads a bloc, and the remaining communist states go their own ways. The Cold War has ended in victory for the West."
 je_cwp_cold_war_west_effect_tt: "Every country gets #b The End of History#! for 20 years (communist appeal -50%, fading). The Western camp is #b Victorious in the Cold War#! for 10 years; communist states suffer #b The God That Failed#! (legitimacy -15, fading)."
 je_cwp_cold_war_east_header: "The capitalist camp collapses"
 je_cwp_cold_war_west_collapsed_tt: "No non-communist [concept_great_power] leads a [concept_power_bloc]"
 je_cwp_cold_war_east_desc: "No capitalist great power leads a bloc any more, and the alliances the Western powers built after 1945 have broken up. The Cold War has ended in victory for the socialist camp."
 je_cwp_cold_war_east_effect_tt: "Every country gets #b The Wave of the Future#! for 20 years (communist appeal +50%, fading). Communist states are #b Victorious in the Cold War#! for 10 years; the Western camp suffers #b The Decline of the West#! (legitimacy -15, fading)."

 cwp_cw_map_east_core: "[SCOPE.sCountry('cwp_cw_map_country').GetName]: #b communist camp#!, in the leading socialist bloc"
 cwp_cw_map_east_outer: "[SCOPE.sCountry('cwp_cw_map_country').GetName]: #b communist#!, outside the leading socialist bloc"
 cwp_cw_map_west_core: "[SCOPE.sCountry('cwp_cw_map_country').GetName]: #b Western camp#!, in the leading Western bloc or alliance"
 cwp_cw_map_west_outer: "[SCOPE.sCountry('cwp_cw_map_country').GetName]: #b aligned with the West#!"
 cwp_cw_map_nonaligned: "[SCOPE.sCountry('cwp_cw_map_country').GetName]: #b non-aligned#!"
 cwp_cw_map_movement_support: "[SCOPE.sPoliticalMovement('cwp_cw_map_movement').GetName]: [Concept('concept_political_movement_support','$concept_political_movement_support_short|q$')] [SCOPE.sPoliticalMovement('cwp_cw_map_movement').GetSupport|%v]"
 cwp_cw_map_appeal_down: "Receives Western economic aid"
 cwp_cw_map_appeal_up: "Communists here receive fraternal support from abroad"
 cwp_cw_map_revolution: "@warning! A #b communist revolution#! is under way"

 cwp_cold_war.1.t: "[SCOPE.sCountry('cwp_cw_fallen').GetName] Goes Red"
 cwp_cold_war.1.d: "[SCOPE.sCountry('cwp_cw_fallen').GetName] now has a communist government and counts itself among the socialist states. Communist parties abroad hail the change as proof that history is on their side, and in Western capitals opposition politicians are already asking who lost [SCOPE.sCountry('cwp_cw_fallen').GetName]."
 cwp_cold_war.1.f: "Communist states in the world: [GetGlobalVariable('cwp_cw_east_count').GetValue|0]"
 cwp_cold_war.1.a: "Brief the cabinet."
 cwp_cold_war.2.t: "[SCOPE.sCountry('cwp_cw_departed').GetName] Leaves the Socialist Camp"
 cwp_cold_war.2.d: "The communist government of [SCOPE.sCountry('cwp_cw_departed').GetName] has fallen, and the country no longer counts itself among the socialist states. Western governments welcome the news; the communist press calls it a counter-revolution."
 cwp_cold_war.2.f: "Communist states in the world: [GetGlobalVariable('cwp_cw_east_count').GetValue|0]"
 cwp_cold_war.2.a: "Brief the cabinet."
 cwp_cold_war.3.t: "The Cold War Is Over"
 cwp_cold_war.3.d: "No communist great power leads a bloc any more. The socialist camp has broken up into states that go their own way, and the ideological contest that shaped every crisis since the Second World War has ended with the victory of the West. Commentators are calling it the end of history."
 cwp_cold_war.3.f: "Fallen to communism since 1946: [GetGlobalVariable('cwp_cw_fallen_count').GetValue|0]. Left the socialist camp: [GetGlobalVariable('cwp_cw_departed_count').GetValue|0]."
 cwp_cold_war.3.a: "A new world order."
 cwp_cold_war.4.t: "The Capitalist World Falls Apart"
 cwp_cold_war.4.d: "No capitalist great power leads a bloc any more. The alliances the Western powers built after 1945 have broken up, and the communist states now set the terms of world politics. Their press calls socialism the wave of the future."
 cwp_cold_war.4.f: "Fallen to communism since 1946: [GetGlobalVariable('cwp_cw_fallen_count').GetValue|0]. Left the socialist camp: [GetGlobalVariable('cwp_cw_departed_count').GetValue|0]."
 cwp_cold_war.4.a: "Adjust to the new order."

