l_english:
 # Journal entries
 je_cwp_institutional_question: "The Institutional Question"
 je_cwp_institutional_question_reason: "The war has discredited the crown of [ROOT.GetCountry.GetNameNoFlag], or left it at the mercy of an occupier. Parties that spent the war in exile or underground blame the monarchy for the dictatorship and the defeat, and want a republic. The monarchists can count on the court, much of the officer corps, the church and the countryside. Sooner or later the government will have to put the institutional question to the people."
 je_cwp_institutional_question_status_republic: "Opinion is leaning toward a republic."
 je_cwp_institutional_question_status_crown: "Opinion is leaning toward keeping the crown."
 je_cwp_institutional_question_status_grace: "The provisional government has asked for time"
 cwp_iq_grace_short_tt: "The vote can be forced in three months."
 cwp_iq_grace_long_tt: "No one can force the vote for eighteen months."
 cwp_iq_grace_over_tt: "The provisional period is over"
 cwp_iq_force_abdication_communists_tt: "Communists hold ministries in the government"
 je_cwp_institutional_question_status_close: "The country is split down the middle."
 cwp_iq_possible_tt: "A monarchy whose future is in question after the war"
 cwp_iq_invalid_tt: "The monarchy has fallen without a referendum"
 cwp_jap_possible_tt: "The prewar constitution is still in force"
 cwp_iq_can_rig_tt: "Soviet pressure is on us and a secret police is in place"
 cwp_iq_referendum_held_tt: "The referendum has been held"
 cwp_iq_republic_tt: "We are a republic"
 cwp_iq_monarchy_tt: "The monarchy remains"
 je_cwp_institutional_question_republic_desc: "The monarchy is gone and [ROOT.GetCountry.GetName] is a republic."
 je_cwp_institutional_question_republic_header: "The #b republic#! is proclaimed if:\n"
 je_cwp_institutional_question_republic_effect_header: "If the #b republic#! is proclaimed:\n$EFFECT$"
 je_cwp_institutional_question_crown_desc: "The crown has survived the institutional question."
 je_cwp_institutional_question_crown_header: "The #b crown survives#! if:\n"
 je_cwp_institutional_question_crown_effect_header: "If the #b crown survives#!:\n$EFFECT$"

 je_cwp_japan_postwar_constitution: "The Postwar Constitution"
 je_cwp_japan_postwar_constitution_reason: "The occupation authorities want the Meiji constitution of 1889 replaced by a democratic charter: sovereignty with the people, the Emperor without power, and no return to militarism. The cabinet would rather revise the old text as little as possible. Meet the occupier's demands and promulgate a new constitution, or try to get the cabinet's revision past them."
 je_cwp_japan_postwar_constitution_status_occupier: "The occupier's demands are not all met yet."
 je_cwp_japan_postwar_constitution_status_ready: "Every demand is met; ready to promulgate"
 cwp_jap_promulgated_tt: "The new constitution has been promulgated"
 cwp_jap_meiji_revised_tt: "The cabinet's revision of the Meiji constitution has been adopted"
 cwp_jap_occupation_over_tt: "The occupation has ended"
 cwp_jap_demand_franchise_tt: "Universal suffrage, women included"
 cwp_jap_demand_shinto_tt: "Shinto separated from the state"
 cwp_jap_demand_army_tt: "No army, or at most a militia"
 cwp_jap_demand_throne_tt: "The throne redefined as a symbol"
 cwp_jap_army_not_powerful_tt: "The Defense Establishment is not powerful"
 cwp_jap_redefine_throne_button: "Redefine the Throne"
 cwp_jap_redefine_throne_button_desc: "The Emperor gives up his divinity and his powers: he will be the symbol of the State and of the unity of the people, nothing more. The officer corps and the old court bitterly oppose it."
 cwp_jap_redefine_throne_tt: "The occupier's demand on the throne is met. The Defense Establishment and Rural Landowners resent it."
 cwp_jap_promulgate_button: "Promulgate the Constitution"
 cwp_jap_promulgate_button_desc: "With every demand met, the Diet adopts a democratic constitution and the Emperor promulgates it. One question remains: how far to renounce war."
 je_cwp_japan_postwar_constitution_adopted_desc: "A new constitution is in force. The Emperor is the symbol of the State, and Article 9 renounces war."
 je_cwp_japan_postwar_constitution_revised_desc: "The Meiji constitution survives, lightly revised."
 je_cwp_japan_postwar_constitution_revised_header: "The #b Meiji constitution#! is only revised if:\n"
 je_cwp_japan_postwar_constitution_revised_effect_header: "If the #b Meiji constitution#! is only revised:\n$EFFECT$"
 je_cwp_japan_postwar_constitution_lapsed_desc: "The occupation ended before a new constitution was agreed; the Meiji constitution remains."
 je_cwp_japan_postwar_constitution_lapsed_header: "The occupation ends #b without a new constitution#! if:\n"
 je_cwp_japan_postwar_constitution_lapsed_effect_header: "If the occupation ends #b without a new constitution#!:\n$EFFECT$"

 # Bars
 cwp_iq_vote_bar: "Projected Vote for a Republic"
 cwp_iq_vote_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_iq_vote_bar_explain_tt Projected vote for a republic#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]%#!"
 cwp_iq_vote_bar_explain_tt: "The share of voters expected to choose a republic if the referendum were held today. It drifts toward a point set by the interest groups, the crown's own record and the campaign."
 cwp_iq_vote_bar_drift_tt: "Drift toward the balance of interest groups, the crown's record and the campaign"
 cwp_iq_pivot_base_tt: "Undecided electorate"
 cwp_iq_pivot_republican_igs_tt: "Interest groups opposed to the monarchy"
 cwp_iq_pivot_monarchist_igs_tt: "Interest groups loyal to the monarchy"
 cwp_iq_pivot_crown_record_tt: "The crown's wartime record"
 cwp_iq_pivot_campaign_tt: "Campaigning"


 # Buttons
 cwp_iq_campaign_republic_button: "Campaign for the Republic"
 cwp_iq_campaign_republic_button_desc: "Put the government's weight behind the republican campaign: rallies, posters and the parties' press."
 cwp_iq_campaign_republic_tt: "Moves the projected vote 3 points toward a republic."
 cwp_iq_campaign_crown_button: "Rally Behind the Crown"
 cwp_iq_campaign_crown_button_desc: "Back the monarchist campaign: the Church, the officers' clubs, the provinces that never stopped cheering the royal family."
 cwp_iq_campaign_crown_tt: "Moves the projected vote 3 points toward the crown."
 cwp_iq_campaign_cap_tt: "The campaign has already gone as far as it can"
 cwp_iq_heir_button: "Abdicate in Favor of the Heir"
 cwp_iq_heir_button_desc: "A monarch compromised by the war steps aside so that the crown can face the vote with an heir untouched by it. In June 1944 Victor Emmanuel III had already handed his powers to Crown Prince Umberto as Lieutenant General of the Realm."
 cwp_iq_heir_tt: "The monarch goes into exile and the heir takes the throne. Moves the projected vote 3 points toward the crown."
 cwp_iq_call_referendum_button: "Call the Referendum"
 cwp_iq_call_referendum_button_desc: "Set a date for the people to choose between monarchy and republic. The result follows the projected vote on polling day, give or take a few points."
 cwp_iq_call_referendum_tt: "The referendum will be held in a month."
 cwp_iq_campaign_time_tt: "Some months must pass to organize a vote"
 cwp_iq_rig_referendum_button: "Rig the Referendum"
 cwp_iq_rig_referendum_button_desc: "With the interior ministry and the police in the right hands, the count can be made to say what the government needs. Western governments and observers will protest."
 cwp_iq_rig_referendum_tt: "The referendum result gains 30 points for a republic. Legitimacy and relations with the United States and Britain suffer once it is held."
 cwp_iq_force_abdication_button: "Demand the King's Abdication"
 cwp_iq_force_abdication_button_desc: "Skip the vote. Surround the palace, present the King with a deed of abdication and let him understand the alternative."
 cwp_iq_force_abdication_tt: "The monarch is forced to abdicate and a people's republic is proclaimed."

 cwp_jap_submit_government_draft_button: "Submit the Cabinet's Draft"
 cwp_jap_submit_government_draft_button_desc: "Send the occupation authorities the cabinet's own revision of the Meiji constitution, which keeps the Emperor's sovereignty and changes as little as possible. A democratic occupier that is pushing for reform will reject it."
 cwp_jap_occupier_draft_tt: "The occupation authorities will present a draft of their own."

 # Modifiers
 cwp_iq_campaigned_against: "Opposed by the Government"
 cwp_iq_campaign_ally: "Backed by the Government"
 cwp_iq_lost_the_referendum: "Defeated in the Referendum"
 cwp_iq_republic_proclaimed: "Republic Proclaimed"
 cwp_iq_crown_confirmed: "Monarchy Retained by Referendum"
 cwp_iq_contested_result: "Contested Referendum"
 cwp_iq_rigged_referendum: "Rigged Referendum"
 cwp_iq_forced_abdication: "Forced Abdication"
 cwp_jap_constitution_rejected: "Occupation Draft Rejected"
 cwp_jap_new_constitution: "New Constitution"

 # Amendments
 cwp_amendment_symbol_emperor: "Symbol of the State"
 cwp_amendment_symbol_emperor_desc: "The Emperor is the symbol of the State and of the unity of the people, deriving his position from the will of the people, and has no powers related to government."
 cwp_amendment_article_9: "Article 9"
 cwp_amendment_article_9_desc: "The people forever renounce war as a sovereign right of the nation, and land, sea and air forces will never be maintained."
 cwp_amendment_article_9_ashida: "Article 9 (Ashida Reading)"
 cwp_amendment_article_9_ashida_desc: "War is renounced, but the Ashida amendment's opening words leave room to argue that forces for self-defense are allowed."

 # Events
 cwp_iq.1.t: "The Institutional Question"
 cwp_iq.1.d: "The war has broken the old settlement. Parties that spent years in exile or underground say the crown cannot survive its record, and the monarchists answer that only the throne can hold the country together. The government has promised to let the people decide."
 cwp_iq.1.d.ITA: "For twenty years Victor Emmanuel III reigned beside Mussolini, and in September 1943 he fled Rome for Brindisi, leaving the army without orders. The parties of the Committee of National Liberation will not serve a king they blame for Fascism. The truce of Salerno only postponed the question: after liberation, Italians are to choose between monarchy and republic."
 cwp_iq.1.d.BUL: "Tsar Simeon II is eight years old. His regents of the war years were shot in February 1945, and the new regency answers to the Fatherland Front government, in which the communists hold the interior ministry and Georgi Dimitrov is back from Moscow. With the Red Army still in the country, few doubt that the monarchy's days are numbered, but the Front still wants the people's blessing."
 cwp_iq.1.d.ROM: "King Michael overthrew Antonescu in August 1944 and took Romania out of the war, and he remains the most popular figure in the country. Since Vyshinsky forced Petru Groza's government on him in March 1945, the King has refused to sign its decrees. The communists and their Soviet patrons now see the crown as the last obstacle to their control of the state."
 cwp_iq.1.d.GRE: "King George II is still in London. Archbishop Damaskinos rules as regent, the Varkiza agreement has not ended the violence between the right and the communist-led left, and British troops keep order in Athens. The republicans remember that the King put his name to the Metaxas dictatorship, and the royalists present the crown as the only defense against the communists. A plebiscite on his return has been promised."
 cwp_iq.1.f: "\"...they respect the right of all peoples to choose the form of government under which they will live.\"\n— Atlantic Charter, August 1941"
 cwp_iq.1.f.ITA: "\"La Repubblica o il caos!\"\n— Pietro Nenni, Italian Socialist Party"
 cwp_iq.1.f.ROM: "In August 1945 King Michael began what Romanians called the 'royal strike', refusing to sign any law put to him by the Groza government."
 cwp_iq.1.a: "Let the people decide, and soon."
 cwp_iq.1.b: "Reconstruction first. The crown can wait."

 cwp_iq.2.t: "The People Have Voted"
 cwp_iq.2.d.republic: "The count is in: [ROOT.GetCountry.MakeScope.Var('cwp_iq_result_var').GetValue|0]% for a republic. [SCOPE.sCharacter('cwp_iq_monarch').GetFullName] must leave the throne, and the parties must now agree on what kind of republic will replace the monarchy."
 cwp_iq.2.d.crown: "The count is in: only [ROOT.GetCountry.MakeScope.Var('cwp_iq_result_var').GetValue|0]% for a republic. The monarchist vote in the provinces has kept the crown. The republican papers cry fraud, but the result stands, and [SCOPE.sCharacter('cwp_iq_monarch').GetFullName] remains on the throne."
 cwp_iq.2.d.rigged: "The interior ministry has announced the result: [ROOT.GetCountry.MakeScope.Var('cwp_iq_result_var').GetValue|0]% for a republic. Opposition observers were kept out of the counting rooms, and Western diplomats are drafting their protests, but the figure is on the front page of every newspaper."
 cwp_iq.2.f.republic: "The royal family leaves for exile, and the crown is taken down from public buildings, coins and stamps."
 cwp_iq.2.f.crown: "Church bells ring in the provinces, and the republican parties demand a recount."
 cwp_iq.2.a: "A parliamentary republic."
 cwp_iq.2.b: "A people's republic."
 cwp_iq.2.c: "The crown stays."

 cwp_iq.3.t: "The Vote Can Wait No Longer"
 cwp_iq.3.d: "Ministers threaten to resign, crowds gather in the squares and the occupation authorities are asking when the vote will be held. The government can no longer postpone the referendum, and a date has to be set."
 cwp_iq.3.f: "Provisional governments across liberated Europe had promised that the people would decide the form of the state once the war was over."
 cwp_iq.3.a: "Set the date."
 cwp_iq.3.b: "There will be no vote. The King will sign."

 cwp_iq.4.t: "Abdication at the Palace"
 cwp_iq.4.d: "Troops loyal to the government have surrounded the palace and cut its telephone lines. The prime minister and the party leader arrive with a deed of abdication already typed. [SCOPE.sCharacter('cwp_iq_monarch').GetFullName] is told that if he does not sign, the blood that follows will be on his hands. By evening a people's republic is proclaimed on the radio."
 cwp_iq.4.f: "The radio announces the abdication as the monarch's own free decision."
 cwp_iq.4.a: "Long live the People's Republic."

 cwp_jap_constitution.1.t: "Revising the Meiji Constitution"
 cwp_jap_constitution.1.d: "On New Year's Day the Emperor told the nation that the ties between the throne and the people do not rest on his divinity. The occupation authorities want much more: a constitution that puts sovereignty with the people. In October 1945 the cabinet gave the task to a committee under Matsumoto Joji, a conservative jurist who believes the 1889 charter needs only careful amendment."
 cwp_jap_constitution.1.f: "\"The ties between Us and Our people have always stood upon mutual trust and affection. They do not depend upon mere legends and myths.\"\n— Imperial Rescript, 1 January 1946"
 cwp_jap_constitution.1.a: "Revise the old charter carefully."
 cwp_jap_constitution.1.b: "Open the debate to the reformers."

 cwp_jap_constitution.2.t: "The Cabinet's Draft"
 cwp_jap_constitution.2.d.rejected: "The cabinet's draft keeps the Emperor sovereign and changes little else. The occupation authorities read it in a day and reject it as a restatement of the old order. Their Government Section has already begun writing a constitution of its own, and the cabinet will be handed the result."
 cwp_jap_constitution.2.d.accepted: "The cabinet's draft keeps the Emperor sovereign and trims the military's prerogatives. The occupation authorities, busy elsewhere, let it pass with a few comments. The Diet adopts it as a revision of the Meiji constitution, and reformers complain that nothing of substance has changed."
 cwp_jap_constitution.2.f: "\"The Emperor is sacred and inviolable.\"\n— Constitution of the Empire of Japan, 1889, Article 3"
 cwp_jap_constitution.2.a: "We will see what they propose."
 cwp_jap_constitution.2.b: "The revised charter will serve."

 cwp_jap_constitution.3.t: "The Occupier's Draft"
 cwp_jap_constitution.3.d: "The occupation authorities have presented a complete draft, written in English in a matter of days: sovereignty rests with the people, the Emperor becomes a symbol, and the nation renounces war and the forces to wage it. The cabinet is told that the draft is the best guarantee of the Emperor's own position. In the Diet committee, Ashida Hitoshi proposes words that may leave room for self-defense."
 cwp_jap_constitution.3.f: "\"War as a sovereign right of the nation is abolished.\"\n— Government Section draft of the Constitution of Japan, Article VIII"
 cwp_jap_constitution.3.a: "Accept the draft as written."
 cwp_jap_constitution.3.b: "Accept it, with the Ashida amendment."
 cwp_jap_constitution.3.c: "Refuse. Japan will write its own constitution."

 cwp_jap_constitution.4.t: "A Constitution Written in Tokyo"
 cwp_jap_constitution.4.d: "Reformers in the Diet, the universities and the unions have carried a democratic draft through the cabinet without waiting for the occupier: sovereignty with the people, a symbolic throne, a cabinet answerable to an elected Diet. The reformers are still divided over the clause on war. Some want armed forces abolished outright, and others want to keep the right of self-defense."
 cwp_jap_constitution.4.f: "\"We, the Japanese people ... resolved that never again shall we be visited with the horrors of war through the action of government.\"\n— Preamble of the Constitution of Japan"
 cwp_jap_constitution.4.a: "Renounce war and armed forces outright."
 cwp_jap_constitution.4.b: "Renounce war, but keep the right of self-defense."
 cwp_iq.4.b: "A republic, but the coalition parties stay in it."
 cwp_iq.2.d: "A presidential republic with a strong executive."
 cwp_iq.2.e: "The crown stays, but the court gives up its political role."
 cwp_jap_constitution.2.c: "Protest to the occupation authorities."
 cwp_jap_constitution.2.d: "Accept it, and promise further reform."
