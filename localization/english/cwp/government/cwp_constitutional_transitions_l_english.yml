l_english:
 # Journal entries
 je_cwp_institutional_question: "The Institutional Question"
 je_cwp_institutional_question_reason: "The war has left the crown discredited, or at the mercy of an occupier. Whether [ROOT.GetCountry.GetName] keeps its monarchy is now an open question, and sooner or later the government will have to put it to the people. How the vote goes depends on who holds power, who campaigns, and how much the monarchy is still trusted."
 je_cwp_institutional_question_goal: "Settle the future of the monarchy, by referendum or otherwise."
 je_cwp_institutional_question_status_republic: "Opinion is leaning towards a republic."
 je_cwp_institutional_question_status_crown: "Opinion is leaning towards keeping the crown."
 je_cwp_institutional_question_status_close: "The country is split down the middle."
 je_cwp_institutional_question_republic_desc: "The monarchy is gone and [ROOT.GetCountry.GetName] is a republic."
 je_cwp_institutional_question_crown_desc: "The crown has survived the institutional question."

 je_cwp_japan_postwar_constitution: "The Postwar Constitution"
 je_cwp_japan_postwar_constitution_reason: "The occupation authorities want the Meiji constitution of 1889 replaced by a democratic charter: sovereignty with the people, the Emperor without power, and no return to militarism. The cabinet would rather revise the old text as little as possible. Japanese reformers, and how hard the occupier pushes, will decide which constitution [ROOT.GetCountry.GetName] ends up with."
 je_cwp_japan_postwar_constitution_goal: "Adopt a new constitution, or keep a revised Meiji constitution."
 je_cwp_japan_postwar_constitution_status_reform: "Japanese reformers are strong enough to carry a democratic draft of their own."
 je_cwp_japan_postwar_constitution_status_occupier: "The cabinet's conservatives still set the pace of revision."
 je_cwp_japan_postwar_constitution_adopted_desc: "A new constitution is in force. The Emperor is the symbol of the State, and Article 9 renounces war."
 je_cwp_japan_postwar_constitution_revised_desc: "The Meiji constitution survives, lightly revised."
 je_cwp_japan_postwar_constitution_lapsed_desc: "The occupation ended before a new constitution was agreed; the Meiji constitution remains."

 # Bars
 cwp_iq_vote_bar: "Projected Vote for a Republic"
 cwp_iq_vote_bar_desc: "The share of voters expected to choose a republic if the referendum were held today. It moves each month towards a point set by the interest groups that oppose or support the monarchy, the crown's own record and the campaign. On polling day the count can still swing a few points either way."
 cwp_iq_vote_bar_drift_tt: "Opinion drifts towards the balance of interest groups, the crown's record and the campaign"
 cwp_iq_pressure_bar: "Pressure for a Vote"
 cwp_iq_pressure_bar_desc: "How hard parties, occupiers and the street are pushing to settle the question. When it is full the government can no longer postpone the referendum."
 cwp_iq_pressure_base_tt: "The question cannot be left open forever"
 cwp_iq_pressure_republicans_tt: "Republican interest groups in government"
 cwp_iq_pressure_occupier_tt: "The occupation authorities want the matter settled"
 cwp_iq_pressure_communists_tt: "Communists in government"
 cwp_iq_pressure_monarchists_tt: "Monarchist interest groups in government stall"
 cwp_iq_pivot_base_tt: "Undecided electorate"
 cwp_iq_pivot_republican_igs_tt: "Interest groups opposed to the monarchy"
 cwp_iq_pivot_monarchist_igs_tt: "Interest groups loyal to the monarchy"
 cwp_iq_pivot_crown_record_tt: "The crown's wartime record"
 cwp_iq_pivot_campaign_tt: "Campaigning"

 cwp_jap_reform_bar: "Support for a Democratic Constitution"
 cwp_jap_reform_bar_desc: "How far Japanese opinion and the parties back a constitution built on popular sovereignty rather than a revised Meiji charter. It moves towards a point set by the interest groups that want or fear universal suffrage and by the reformers' campaign."
 cwp_jap_reform_bar_drift_tt: "Opinion drifts towards the balance of interest groups and the reformers' campaign"
 cwp_jap_occupation_bar: "Occupation Pressure"
 cwp_jap_occupation_bar_desc: "How hard the occupation authorities push for a new constitution. When it is full they stop waiting for the cabinet and hand it a draft of their own."
 cwp_jap_occupation_democratic_occupier_tt: "A democratic occupier demands reform"
 cwp_jap_occupation_other_occupier_tt: "The occupier has other priorities"
 cwp_jap_occupation_japanese_reformers_tt: "Japanese reformers lobby the occupation authorities"
 cwp_jap_pivot_base_tt: "Postwar mood"
 cwp_jap_pivot_reformist_igs_tt: "Interest groups for universal suffrage"
 cwp_jap_pivot_conservative_igs_tt: "Interest groups against universal suffrage"
 cwp_jap_pivot_campaign_tt: "Reformers' campaign"

 # Buttons
 cwp_iq_campaign_republic_button: "Campaign for the Republic"
 cwp_iq_campaign_republic_button_desc: "Put the government's weight behind the republican campaign: rallies, posters and the parties' press."
 cwp_iq_campaign_republic_tt: "Moves the projected vote 4 points towards a republic."
 cwp_iq_campaign_crown_button: "Rally Behind the Crown"
 cwp_iq_campaign_crown_button_desc: "Back the monarchist campaign: the Church, the officers' clubs, the provinces that never stopped cheering the royal family."
 cwp_iq_campaign_crown_tt: "Moves the projected vote 4 points towards the crown."
 cwp_iq_campaign_cap_tt: "The campaign has already gone as far as it can"
 cwp_iq_heir_button: "Abdicate for the Heir"
 cwp_iq_heir_button_desc: "A monarch compromised by the war steps aside so the crown can face the vote with a fresh face, as Victor Emmanuel III did for Umberto II in May 1946."
 cwp_iq_heir_tt: "The ruler goes into exile and the heir takes the throne. Moves the projected vote 5 points towards the crown."
 cwp_iq_call_referendum_button: "Call the Referendum"
 cwp_iq_call_referendum_button_desc: "Set a date for the people to choose between monarchy and republic. The result follows the projected vote on polling day, give or take a few points."
 cwp_iq_call_referendum_tt: "The referendum will be held in a month."
 cwp_iq_campaign_time_tt: "Some months must pass to organise a vote"
 cwp_iq_rig_referendum_button: "Have the Ministry Count the Votes"
 cwp_iq_rig_referendum_button_desc: "With the interior ministry and the police in the right hands, the count can be made to say what the government needs. The West will notice."
 cwp_iq_rig_referendum_tt: "The referendum result gains 30 points for a republic. Legitimacy and relations with the United States and Britain suffer once it is held."
 cwp_iq_force_abdication_button: "Demand the King's Abdication"
 cwp_iq_force_abdication_button_desc: "Skip the vote. Surround the palace, present the King with a deed of abdication and let him understand the alternative."
 cwp_iq_force_abdication_pressure_tt: "Pressure for a vote is at least 60"
 cwp_iq_force_abdication_tt: "The monarch is forced to abdicate and a people's republic is proclaimed."

 cwp_jap_reform_campaign_button: "Back the Reformers"
 cwp_jap_reform_campaign_button_desc: "Give the parties, scholars and unions who want a democratic constitution room to make their case: public debate, a constitution research association, the press."
 cwp_jap_reform_campaign_tt: "Support for a democratic constitution rises by 5."
 cwp_jap_submit_government_draft_button: "Submit the Cabinet's Draft"
 cwp_jap_submit_government_draft_button_desc: "Send the occupation authorities the cabinet's own revision of the Meiji constitution, which keeps the Emperor's sovereignty and changes as little as possible. If the occupier is pushing hard, it will be rejected."
 cwp_jap_adopt_own_draft_button: "Draft a Democratic Constitution"
 cwp_jap_adopt_own_draft_button_desc: "With reformers in the majority, write a democratic constitution in Tokyo instead of waiting for one from the occupier."
 cwp_jap_reform_majority_tt: "Support for a democratic constitution is at least 60"
 cwp_jap_occupier_draft_tt: "The occupation authorities will present a draft of their own."

 # Modifiers
 cwp_iq_campaigned_against: "Campaigned Against"
 cwp_iq_campaign_ally: "Campaign Ally"
 cwp_iq_lost_the_referendum: "Lost the Constitutional Question"
 cwp_iq_republic_proclaimed: "Republic Proclaimed"
 cwp_iq_crown_confirmed: "Crown Confirmed by the People"
 cwp_iq_contested_result: "Contested Referendum"
 cwp_iq_rigged_referendum: "Rigged Referendum"
 cwp_iq_forced_abdication: "Forced Abdication"
 cwp_jap_constitution_rejected: "Defied the Occupier"
 cwp_jap_new_constitution: "New Constitution"

 # Amendments
 cwp_amendment_symbol_emperor: "Symbol of the State"
 cwp_amendment_symbol_emperor_desc: "The Emperor is the symbol of the State and of the unity of the people, deriving his position from the will of the people, and has no powers related to government."
 cwp_amendment_article_9: "Article 9"
 cwp_amendment_article_9_desc: "The people forever renounce war as a sovereign right of the nation, and land, sea and air forces will never be maintained."
 cwp_amendment_article_9_ashida: "Article 9 (Ashida Reading)"
 cwp_amendment_article_9_ashida_desc: "War is renounced, but the Ashida amendment's opening words leave room to argue that forces for self-defence are allowed."

 # Events
 cwp_iq.1.t: "The Institutional Question"
 cwp_iq.1.d: "The war has broken the old settlement. Parties that spent years in exile or underground now ask aloud whether the crown deserves to survive, and the throne's defenders answer that only the monarchy can hold the country together. The question will not go away until the people are asked."
 cwp_iq.1.d.ITA: "For twenty years Victor Emmanuel III reigned beside Mussolini, and in September 1943 he fled Rome for Brindisi, leaving the army without orders. The parties of the Committee of National Liberation will not serve a king they blame for Fascism. The truce of Salerno only postponed the question: after liberation, Italians are to choose between monarchy and republic."
 cwp_iq.1.d.BUL: "Tsar Simeon II is eight years old. His regents of the war years were shot in February 1945, and the new regency answers to the Fatherland Front government, in which the communists hold the interior ministry and Georgi Dimitrov is back from Moscow. With the Red Army still in the country, few doubt that the monarchy's days are numbered, but the Front still wants the people's blessing."
 cwp_iq.1.d.ROM: "King Michael overthrew Antonescu in August 1944 and took Romania out of the war, and he remains the most popular man in the country. Since Vyshinsky imposed Petru Groza's government in March 1945, the King has refused to sign its decrees. The communists and their Soviet patrons see the crown as the last obstacle; the King sees it as the last guarantee."
 cwp_iq.1.d.GRE: "King George II is still in London. Archbishop Damaskinos rules as regent, the Varkiza agreement has not ended the violence between the right and the communist-led left, and British troops keep the peace in Athens. Many Greeks remember that the King put his name to the Metaxas dictatorship; many more fear what the left would do with a republic. A plebiscite on his return is promised."
 cwp_iq.1.f: "Every party has an answer to the institutional question. None of them agree."
 cwp_iq.1.f.ITA: "\"La Repubblica o il caos!\"\n- Pietro Nenni, Italian Socialist Party"
 cwp_iq.1.f.ROM: "The palace guard is loyal. The army is less sure. The Soviet garrison is certain."
 cwp_iq.1.a: "Let the people decide, and soon."
 cwp_iq.1.b: "Reconstruction first. The crown can wait."

 cwp_iq.2.t: "The People Have Voted"
 cwp_iq.2.d.republic: "The count is in: [ROOT.GetCountry.MakeScope.Var('cwp_iq_result_var').GetValue|0]% for a republic. The cities and the industrial regions voted against the crown, and the countryside could not save it. [SCOPE.sCharacter('cwp_iq_monarch').GetFullName] has to decide whether to accept the verdict quietly or to challenge it, and the new state has to decide what kind of republic it will be."
 cwp_iq.2.d.crown: "The count is in: only [ROOT.GetCountry.MakeScope.Var('cwp_iq_result_var').GetValue|0]% for a republic. The provinces, the Church and the memory of better days have kept the crown. The republican parties cry fraud in their newspapers, but the result stands, and [SCOPE.sCharacter('cwp_iq_monarch').GetFullName] remains on the throne."
 cwp_iq.2.d.rigged: "The interior ministry has announced the result: [ROOT.GetCountry.MakeScope.Var('cwp_iq_result_var').GetValue|0]% for a republic. Opposition observers were kept from the counting rooms, and Western diplomats are already drafting their protests. None of that changes the figure on the front page of every newspaper."
 cwp_iq.2.f.republic: "The crown leaves the country by sea. The flags on the public buildings are changed by the afternoon."
 cwp_iq.2.f.crown: "The bells ring in the provinces. In the cities, the posters are torn down in silence."
 cwp_iq.2.a: "A parliamentary republic."
 cwp_iq.2.b: "A people's republic."
 cwp_iq.2.c: "The crown stays."

 cwp_iq.3.t: "The Vote Can Wait No Longer"
 cwp_iq.3.d: "Ministers threaten to resign, crowds gather in the squares and the occupation authorities ask pointed questions. Every week the government postpones the referendum costs it more than the referendum itself could. A date has to be set."
 cwp_iq.3.f: "A provisional government can only stay provisional for so long."
 cwp_iq.3.a: "Set the date."
 cwp_iq.3.b: "There will be no vote. The King will sign."

 cwp_iq.4.t: "Abdication at the Palace"
 cwp_iq.4.d: "Troops loyal to the government have surrounded the palace and cut its telephone lines. The prime minister and the party leader arrive with a deed of abdication already typed. [SCOPE.sCharacter('cwp_iq_monarch').GetFullName] is told that if he does not sign, the blood that follows will be on his hands. By evening a people's republic is proclaimed on the radio."
 cwp_iq.4.f: "There was no referendum. There was a pen, a document and an ultimatum."
 cwp_iq.4.a: "Long live the People's Republic."

 cwp_jap_constitution.1.t: "Revising the Meiji Constitution"
 cwp_jap_constitution.1.d: "On New Year's Day the Emperor told the nation that he was not a living god. The occupation authorities want much more: a constitution that puts sovereignty with the people. Prime Minister Shidehara has given the task to a cabinet committee under Matsumoto Joji, a conservative jurist who believes the 1889 charter needs only careful amendment."
 cwp_jap_constitution.1.f: "The ties between Us and Our people have always stood upon mutual trust and affection. They do not depend upon mere legends and myths.\n- Imperial Rescript, 1 January 1946"
 cwp_jap_constitution.1.a: "Revise the old charter carefully."
 cwp_jap_constitution.1.b: "Open the debate to the reformers."

 cwp_jap_constitution.2.t: "The Cabinet's Draft"
 cwp_jap_constitution.2.d.rejected: "The cabinet's draft keeps the Emperor sovereign and changes little else. The occupation authorities read it in a day and reject it as a restatement of the old order. Their Government Section has already begun writing a constitution of its own, and the cabinet will be handed the result."
 cwp_jap_constitution.2.d.accepted: "The cabinet's draft keeps the Emperor sovereign and trims the military's prerogatives. The occupation authorities, busy elsewhere, let it pass with a few comments. The Diet adopts it as a revision of the Meiji constitution, and reformers complain that nothing of substance has changed."
 cwp_jap_constitution.2.f: "A constitution can be amended in a committee room. Whether it changes anything is another matter."
 cwp_jap_constitution.2.a: "We will see what they propose."
 cwp_jap_constitution.2.b: "The revised charter will serve."

 cwp_jap_constitution.3.t: "The Occupier's Draft"
 cwp_jap_constitution.3.d: "The occupation authorities have presented a complete draft, written in English in a matter of days: sovereignty rests with the people, the Emperor becomes a symbol, and the nation renounces war and the forces to wage it. The cabinet is told that the draft is the best guarantee of the Emperor's own position. In the Diet committee, Ashida Hitoshi proposes words that may leave room for self-defence."
 cwp_jap_constitution.3.f: "\"Aspiring sincerely to an international peace based on justice and order, the Japanese people forever renounce war as a sovereign right of the nation.\"\n- Draft Article 9"
 cwp_jap_constitution.3.a: "Accept the draft as written."
 cwp_jap_constitution.3.b: "Accept it, with the Ashida amendment."
 cwp_jap_constitution.3.c: "Refuse. Japan will write its own constitution."

 cwp_jap_constitution.4.t: "A Constitution Written in Tokyo"
 cwp_jap_constitution.4.d: "Reformers in the Diet, the universities and the unions have carried a democratic draft through the cabinet without waiting for the occupier: sovereignty with the people, a symbolic throne, a cabinet answerable to an elected Diet. One question remains, and it divides even the reformers: how far should the new Japan renounce war?"
 cwp_jap_constitution.4.f: "\"We, the Japanese people ... resolved that never again shall we be visited with the horrors of war through the action of government.\"\n- Draft preamble"
 cwp_jap_constitution.4.a: "Renounce war and armed forces outright."
 cwp_jap_constitution.4.b: "Renounce war, but keep the right of self-defence."
