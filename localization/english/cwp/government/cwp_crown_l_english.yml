l_english:
  # Parliamentary crowns: common/character_roles/cwp_crown_roles.txt, common/scripted_effects/cwp_crown_effects.txt.
  character_role_cwp_monarch:0 "Monarch"
  character_role_cwp_monarch_title:0 "Monarch"
  character_role_cwp_crown_heir:0 "Heir to the Throne"
  character_role_cwp_crown_heir_title:0 "Heir to the Throne"
  character_role_cwp_regent:0 "Regent"
  character_role_cwp_regent_title:0 "Regent"
  character_role_cwp_governor_general:0 "Governor-General"
  character_role_cwp_governor_general_title:0 "Governor-General"
  cwp_title_heir_presumptive:0 "Heir Presumptive"
  cwp_title_hereditary_grand_duke:0 "Hereditary Grand Duke"
  cwp_crown_monarchism_stamped_out_tt:0 "The monarchy can no longer be restored, and the exiled royal house loses its claim to the throne"
  cwp_crown_has_monarchy_tradition_tt:0 "Is a monarchy, or has a royal house that still claims the throne"

  gov_cwp_dominion:0 "Dominion"
  gov_cwp_dominion_desc:0 "An autonomous community within the British Commonwealth, united with the United Kingdom by a common allegiance to the Crown. The [Concept('concept_ruler','$RULER_TITLE_PRIME_MINISTER|q$')] governs and answers to the elected parliament; a $RULER_TITLE_GOVERNOR_GENERAL$ represents the Crown.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
  gov_cwp_dominion_provincial:0 "$gov_cwp_dominion$"
  gov_cwp_dominion_provincial_desc:0 "$gov_cwp_dominion_desc$"
  gov_cwp_self_governing_colony:0 "Self-Governing Colony"
  gov_cwp_self_governing_colony_desc:0 "A colony with responsible government under the Crown. The [Concept('concept_ruler','$RULER_TITLE_PRIME_MINISTER|q$')] governs and answers to the elected legislature; a $RULER_TITLE_GOVERNOR$ represents the Crown, and London keeps control of foreign affairs.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
  gov_cwp_self_governing_colony_provincial:0 "$gov_cwp_self_governing_colony$"
  gov_cwp_self_governing_colony_provincial_desc:0 "$gov_cwp_self_governing_colony_desc$"
  gov_cwp_occupied_constitutional_monarchy:0 "Occupied Constitutional Monarchy"
  gov_cwp_occupied_constitutional_monarchy_desc:0 "A constitutional monarchy under military occupation. The [Concept('concept_ruler','$RULER_TITLE_PRIME_MINISTER|q$')] governs under the supervision of the occupation authorities; the monarch reigns but does not rule.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
  gov_cwp_occupied_constitutional_monarchy_provincial:0 "$gov_cwp_occupied_constitutional_monarchy$"
  gov_cwp_occupied_constitutional_monarchy_provincial_desc:0 "$gov_cwp_occupied_constitutional_monarchy_desc$"
  gov_cwp_executive_monarchy:0 "Executive Monarchy"
  gov_cwp_executive_monarchy_desc:0 "A monarchy with an elected parliament in which the [Concept('concept_ruler','$RULER_TITLE_KING|q$')] or [Concept('concept_ruler','$RULER_TITLE_QUEEN|q$')] still governs, appointing and dismissing the ministers.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
  gov_cwp_executive_monarchy_provincial:0 "$gov_cwp_executive_monarchy$"
  gov_cwp_executive_monarchy_provincial_desc:0 "$gov_cwp_executive_monarchy_desc$"

  cwp_crown_accession:0 "Accession to the Throne"
  cwp_crown_accession_desc:0 "The country rallies around its new monarch."
  cwp_crown.1.t:0 "Accession to the Throne"
  cwp_crown.1.d:0 "[SCOPE.sCharacter('cwp_crown_scope_event_monarch').GetFullName] has succeeded to the throne. The accession is proclaimed, and the government of [ROOT.GetCountry.GetRuler.GetFullName] remains in office. Ministers still answer to parliament, and the new monarch acts on their advice."
  cwp_crown.1.f:0 "\"The sovereign has, under a constitutional monarchy such as ours, three rights: the right to be consulted, the right to encourage, the right to warn.\"\n— Walter Bagehot, The English Constitution (1867)"
  cwp_crown.1.a:0 "Long live the [SCOPE.sCharacter('cwp_crown_scope_event_monarch').GetCustom('character_role_cwp_monarch_custom_loc')]."
  cwp_crown.2.t:0 "The Regency Ends"
  cwp_crown.2.d:0 "[SCOPE.sCharacter('cwp_crown_scope_event_monarch').GetFullName] has come of age and takes the oath to the constitution before parliament. The regency ends, and the monarch now receives the Prime Minister in person."
  cwp_crown.2.f:0 "\"If the Sovereign is, at His Accession, under the age of eighteen years, then, until He attains that age, the royal functions shall be performed in the name and on behalf of the Sovereign by a Regent.\"\n— Regency Act 1937"
  cwp_crown.2.a:0 "Long live the [SCOPE.sCharacter('cwp_crown_scope_event_monarch').GetCustom('character_role_cwp_monarch_custom_loc')]."