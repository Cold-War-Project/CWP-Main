 # Buttons
 cwp_rs_loyalty_review_button: "Loyalty Review Program"
 cwp_rs_loyalty_review_button_desc: "Screen every civil servant and teacher for disloyal associations. It reassures the public, but the boards rarely say what the evidence is."
 cwp_rs_investigate_unions_button: "Investigate the Unions"
 cwp_rs_investigate_unions_button_desc: "Require union officers to swear they are not communists, and open hearings into the unions the communists are said to control. Employers welcome it, and union leaders, anti-communists among them, resent it."
 cwp_rs_blacklist_button: "Blacklist the Fellow Travelers"
 cwp_rs_blacklist_button_desc: "Encourage studios, broadcasters, newspapers and universities to drop anyone suspected of communist sympathies. It needs no law, because employers act on their own for fear of being accused themselves."
 cwp_rs_defend_liberties_button: "Defend Civil Liberties"
 cwp_rs_defend_liberties_button_desc: "Rein in the investigators and insist on due process: end the loyalty review, the union investigations and the blacklists. Civil libertarians and the courts will approve, and the officer corps and the anti-communist press will call the government soft on communism."
 cwp_rs_ban_party_button: "Ban the Communist Party"
 cwp_rs_ban_party_button_desc: "Outlaw the party outright, seize its newspapers and close its offices. Few democracies have gone this far against a legal political party."

