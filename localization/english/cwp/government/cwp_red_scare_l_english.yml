l_english:
 # Journal entry
 je_cwp_red_scare: "The Red Scare"
 je_cwp_red_scare_reason: "Fear of communist subversion has become a force in the politics of [ROOT.GetCountry.GetNameNoFlag]. Spy cases, communist strength in the trade unions and the advance of communism abroad have brought demands for loyalty programs, investigations and a ban on the Communist Party. Civil libertarians answer that such measures punish belief and association rather than acts."
 je_cwp_red_scare_status_unease: "Unease: public anxiety about subversion, short of panic."
 je_cwp_red_scare_status_hysteria: "Hysteria: accusations are taken as proof, and few dare to speak against them."
 je_cwp_red_scare_status_purge: "Purges: loyalty boards, hearings and blacklists reach deep into public life."
 je_cwp_red_scare_subsided_desc: "The Red Scare subsided"
 je_cwp_red_scare_witch_hunt_desc: "The Red Scare became a witch hunt"
 je_cwp_red_scare_discredited_desc: "The accusers were discredited"

 # Bars
 cwp_rs_fear_bar: "Fear of Subversion"
 cwp_rs_fear_bar_desc: "How afraid the public is of communist infiltration. It grows while communists are active at home and a communist power is our rival, and fades on its own. When it falls to #v 5#!, the scare is over. The repressive measures are not on this bar: they are the modifiers actually in force on our interest groups, and all four at once is a witch hunt."
 cwp_rs_fear_home_tt: "Communists are active at home"
 cwp_rs_fear_rival_tt: "A communist power is our rival"
 cwp_rs_fear_war_tt: "We are at war"
 cwp_rs_fear_fades_tt: "The panic fades with time"
 cwp_rs_fear_free_press_tt: "A free press questions the accusations"

 # Tooltips
 cwp_rs_fear_20_tt: "#v Fear of Subversion#! is at least #v 20#!"
 cwp_rs_fear_30_tt: "#v Fear of Subversion#! is at least #v 30#!"
 cwp_rs_fear_60_tt: "#v Fear of Subversion#! is at least #v 60#!"
 cwp_rs_fear_below_30_tt: "#v Fear of Subversion#! is below #v 30#!"
 cwp_rs_accusers_discredited_tt: "The investigators have been censured in public"
 cwp_rs_no_measures_tt: "No repressive measure is in force"
 cwp_rs_any_measure_tt: "At least one repressive measure is in force"
 cwp_rs_loyalty_review_active_tt: "The civil service is under #v Loyalty Review#!"
 cwp_rs_unions_investigated_active_tt: "The #v Trade Unions#! are under investigation"
 cwp_rs_blacklist_active_tt: "The #v Intelligentsia#! are blacklisted"
 cwp_rs_party_banned_active_tt: "The Communist Party is banned"
 cwp_rs_fear_low_tt: "#v Fear of Subversion#! has fallen to #v 5#! or less"

 # Buttons
 cwp_rs_loyalty_review_button: "Loyalty Review Program"
 cwp_rs_loyalty_review_button_desc: "Screen every civil servant and teacher for disloyal associations. It reassures the public, but the boards rarely say what the evidence is."
 cwp_rs_investigate_unions_button: "Investigate the Unions"
 cwp_rs_investigate_unions_button_desc: "Require union officers to swear they are not communists, and open hearings into the unions the communists are said to run. Business applauds; the labor movement does not forget."
 cwp_rs_blacklist_button: "Blacklist the Fellow Travelers"
 cwp_rs_blacklist_button_desc: "Encourage studios, broadcasters, newspapers and universities to drop anyone suspected of communist sympathies. It needs no law, only the fear of being next."
 cwp_rs_defend_liberties_button: "Defend Civil Liberties"
 cwp_rs_defend_liberties_button_desc: "Rein in the investigators and insist on due process: end the loyalty review, the union investigations and the blacklists. The courts and the press will thank us; the generals and the papers that sell fear will call us soft on communism."
 cwp_rs_ban_party_button: "Ban the Communist Party"
 cwp_rs_ban_party_button_desc: "Outlaw the party outright, seize its papers and close its offices. It is the most drastic step a democracy can take against a political movement, and it divides the country."

 # Modifiers
 cwp_rs_loyalty_review: "Loyalty Review"
 cwp_rs_unions_investigated: "Unions Under Investigation"
 cwp_rs_business_reassured: "Business Reassured"
 cwp_rs_blacklisted: "Blacklisted"
 cwp_rs_liberties_defended: "Civil Liberties Defended"
 cwp_rs_soft_on_communism: "Soft on Communism"
 cwp_rs_party_banned_ig: "Communist Party Banned"
 cwp_rs_party_banned: "Communist Party Banned"
 cwp_rs_scare_subsided: "End of the Red Scare"
 cwp_rs_chilled_society: "Chilling Effect"
 cwp_rs_witch_hunt: "Witch Hunt"

 # Events
 cwp_rs.1.t: "The Red Scare"
 cwp_rs.1.d: "Communists and their 'fellow travelers' hold posts in the trade unions, the press and the universities of [ROOT.GetCountry.GetNameNoFlag], and abroad communist power is spreading. Newspapers ask how many party members work in the ministries, and politicians of every party have found that the question wins votes."
 cwp_rs.1.f: "\"Communist fifth columns are established and work in complete unity and absolute obedience to the directions they receive from the Communist centre.\"\n— Winston Churchill, Fulton, Missouri"
 cwp_rs.1.a: "We must be vigilant, but not afraid."

 cwp_rs.2.t: "The Spy Ring"
 cwp_rs.2.d: "Counter-intelligence has uncovered a network passing secrets to a communist power: a clerk in the foreign ministry, an engineer at a defense laboratory, a courier who met them in a public park. The papers want a trial in open court. The intelligence services would rather turn the agents quietly and keep watching who else comes to the park."
 cwp_rs.2.f: "\"We did not lose those secrets to their cleverness. We lost them to our carelessness.\""
 cwp_rs.2.a: "Put them on trial for all to see."
 cwp_rs.2.b: "Handle it quietly."

 cwp_rs.3.t: "Oaths for the Classroom"
 cwp_rs.3.d: "Legislators have proposed that every teacher and professor in [ROOT.GetCountry.GetNameNoFlag] sign an oath swearing that they do not belong to the Communist Party or any group that advocates the overthrow of the government. Supporters argue that parents have a right to know who teaches their children. Many faculty object that a political test for employment violates academic freedom, and some say they will resign rather than sign."
 cwp_rs.3.f: "\"Where suspicion fills the air and holds scholars in line for fear of their jobs, there can be no exercise of the free intellect.\"\n— Justice William O. Douglas, dissenting, Adler v. Board of Education"
 cwp_rs.3.a: "Require the oath."
 cwp_rs.3.b: "Academic freedom must be protected."

 cwp_rs.4.t: "The List"
 cwp_rs.4.d: "In a speech that has made every front page, a little-known legislator waved a sheet of paper and claimed it held the names of communists still working in the government. He will not show the list, and the number on it changes from speech to speech, but the crowds grow larger each time. Our own party is split on whether to ride the wave or stop it."
 cwp_rs.4.f: "\"I have here in my hand a list of names...\""
 cwp_rs.4.a: "Open an inquiry into his claims."
 cwp_rs.4.b: "Censure him for reckless smears."

 cwp_rs.5.t: "Affidavits for the Unions"
 cwp_rs.5.d: "A new bill would deny legal protection to any union whose officers will not swear in writing that they are not communists. Employers' associations support it warmly. Union leaders, including many who have fought the communists in their own ranks for years, say it lets the government decide who workers may elect."
 cwp_rs.5.f: "\"Throw the communists out of the unions, by all means. But let the members do the throwing.\""
 cwp_rs.5.a: "Pass the affidavit requirement."
 cwp_rs.5.b: "Let the unions police themselves."

 cwp_rs.6.t: "The Blacklist"
 cwp_rs.6.d: "The film studios, broadcasters and several major newspapers have quietly agreed to stop hiring anyone named as a communist sympathizer. No law requires it and no court has ruled on it, but writers, actors and journalists in [ROOT.GetCountry.GetNameNoFlag] are finding that their contracts are not renewed and their calls are not returned."
 cwp_rs.6.f: "\"Nobody fired me. They just stopped calling.\""
 cwp_rs.6.a: "Private companies may hire whom they please."
 cwp_rs.6.b: "Condemn the blacklist publicly."

 cwp_rs.7.t: "A Defector Testifies"
 cwp_rs.7.d: "A former communist courier has come over to our side and offered to testify. His story is sensational: secret meetings, microfilm hidden in unlikely places, sympathizers in respectable positions. Some of it may even be true. Testimony in public would electrify the country; a closed hearing would let the services check his claims first."
 cwp_rs.7.f: "\"I was one of them. I know how they work, and I know where they are.\""
 cwp_rs.7.a: "Let him testify in public."
 cwp_rs.7.b: "Hear him behind closed doors."

 cwp_rs.8.t: "The Hearings Backfire"
 cwp_rs.8.d: "The televised hearings were meant to expose communists. Instead the country has watched an investigator bully decorated veterans and ruin careers on the strength of rumour. A single question from a witness's lawyer, \"Have you no sense of decency?\", has been printed in every newspaper, and the mood has turned against the inquisitors."
 cwp_rs.8.f: "\"Until this moment I think I never really gauged your cruelty or your recklessness.\""
 cwp_rs.8.a: "Censure the investigators and close the hearings."
 cwp_rs.8.b: "The work must go on."

 cwp_rs.20.t: "The End of the Red Scare"
 cwp_rs.20.d: "The panic has passed. The communists at home are a fringe, the hearings have closed, and the papers have found other stories to sell. [ROOT.GetCountry.GetNameNoFlag] came through its Red Scare with its institutions intact, and many who stood up to the accusers are now remembered as the ones who kept their heads."
 cwp_rs.20.d_chilled: "The panic has passed, but it has left its mark. Careers were ended without trial, unions and faculties have learned to keep their heads down, and a generation has taken the lesson that some opinions are best kept private. [ROOT.GetCountry.GetNameNoFlag] is calmer, and quieter, than it was."
 cwp_rs.20.f: "\"We will not walk in fear, one of another.\""
 cwp_rs.20.a: "Let us hope we have learned something."

 cwp_rs.21.t: "The Witch Hunt"
 cwp_rs.21.d: "The hunt for communists has consumed the politics of [ROOT.GetCountry.GetNameNoFlag]. Loyalty boards answer to no court, accusations end careers before any evidence is heard, and anyone who objects is asked whether they have something to hide. The communists were few. The damage to trust in the state will take years to repair."
 cwp_rs.21.f: "\"In the end, they came for those who had asked questions.\""
 cwp_rs.21.a: "What have we done?"
