l_english:
 cwp_spa_law_of_succession_decision: "The Law of Succession"
 cwp_spa_law_of_succession_decision_desc: "Declare Spain a Catholic, social and representative state constituted as a kingdom, with the Caudillo as head of state for life and the right to name the king who will succeed him. The monarchists get their crown in principle; the pretender in Estoril gets nothing in practice."
 cwp_spa_law_of_succession_decision_tooltip: "Spain becomes a kingdom. The monarchist interest groups are placated."
 cwp_spa_monarchists_matter_tt: "An interest group of some weight supports the monarchy"
 cwp_spa_kingdom_without_a_king: "A Kingdom Without a King"

 je_cwp_ending_the_occupation: "Ending the Occupation"
 je_cwp_ending_the_occupation_reason: "Foreign troops still govern [ROOT.GetCountry.GetName] from behind a native government. Every year the occupation lasts it costs the occupier more and convinces fewer people at home. A peace treaty will come when the occupier believes that a sovereign [ROOT.GetCountry.GetName] is safe, and useful, to let go."
 je_cwp_ending_the_occupation_status: "Meet the occupier's conditions, then ask for a peace treaty."
 je_cwp_ending_the_occupation_status_refused: "The occupier refused our last request. We must wait before asking again."
 cwp_occ_request_treaty_button: "Request a Peace Treaty"
 cwp_occ_request_treaty_button_desc: "Send the prime minister to the occupation authorities with a request: end the occupation, sign a treaty, and let us govern ourselves. They will say yes only if they trust what comes after them."
 cwp_occ_request_treaty_tt: "The occupier will decide whether to sign."
 cwp_occ_constitution_tt: "A democratic constitution or universal suffrage"
 cwp_occ_no_communists_tt: "No communists in the cabinet"
 cwp_occ_years_tt: "At least four years of occupation have passed"
 cwp_occ_not_refused_tt: "The occupier has not refused us in the last two years"
 je_cwp_ending_the_occupation_success_desc: "The occupation is over. [ROOT.GetCountry.GetName] is sovereign again."
 cwp_occ_sovereignty_restored: "Sovereignty Restored"
 cwp_occ_treaty_refused: "Peace Treaty Refused"

 cwp_occ.1.t: "A Peace Treaty"
 cwp_occ.1.d: "Our occupation of [SCOPE.sCountry('cwp_occ_subject').GetName] has outlived its purpose. Its government is stable, its people are tired of foreign soldiers, and our own people are tired of paying for them. Diplomats have drafted a treaty that would end the occupation and restore its sovereignty."
 cwp_occ.1.d.JAP: "The occupation of Japan has rebuilt its institutions from top to bottom. The State Department has drafted a peace treaty of reconciliation, without reparations that would cripple the economy, and a separate security pact would keep our bases on the islands. Signing it would turn a defeated enemy into an ally."
 cwp_occ.1.f: "Occupations are easy to begin and hard to end."
 cwp_occ.1.f.JAP: "\"The Japanese Delegation gladly accepts this fair and generous Treaty.\"\n- Yoshida Shigeru, San Francisco, September 1951"
 cwp_occ.1.a: "Sign the treaty."
 cwp_occ.1.b: "Not yet."
