l_english:
 cwp_spa_law_of_succession_decision: "The Law of Succession"
 cwp_spa_law_of_succession_decision_desc: "Declare Spain a Catholic, social and representative state constituted as a kingdom, with the Caudillo as head of state for life and the right to name his royal successor. The monarchists get a kingdom in principle, and the exiled claimant to the throne gets no date for his return."
 cwp_spa_law_of_succession_decision_tooltip: "Spain becomes a kingdom. The monarchist interest groups are placated."
 cwp_spa_monarchists_matter_tt: "An interest group of some weight supports the monarchy"
 cwp_spa_kingdom_without_a_king: "A Kingdom Without a King"

 je_cwp_ending_the_occupation: "Ending the Occupation"
 je_cwp_ending_the_occupation_reason: "[ROOT.GetCountry.GetName] is under military occupation. Its government sits under the supervision of foreign officials, and only a peace treaty can restore its sovereignty. The occupying power will sign once it trusts the government it leaves behind: a democratic constitution or universal suffrage, no communists in the cabinet, and enough years of occupation for its reforms to take hold."
 je_cwp_ending_the_occupation_status: "Meet the occupier's terms, then ask for a treaty"
 cwp_occ_possible_tt: "We are under military occupation"
 je_cwp_ending_the_occupation_status_refused: "The occupier refused; we must wait to ask again"
 cwp_occ_request_treaty_button: "Request a Peace Treaty"
 cwp_occ_request_treaty_button_desc: "Send the prime minister to the occupation authorities to ask for a peace treaty that ends the occupation and restores self-government. They will agree only if they trust the government that will remain."
 cwp_occ_request_treaty_tt: "The occupier will decide whether to sign."
 cwp_occ_constitution_tt: "A democratic constitution or universal suffrage"
 cwp_occ_no_communists_tt: "No communists in the cabinet"
 cwp_occ_years_tt: "At least four years of occupation have passed"
 cwp_occ_not_refused_tt: "The occupier has not refused us in the last two years"
 je_cwp_ending_the_occupation_success_desc: "The occupation is over. [ROOT.GetCountry.GetName] is sovereign again."
 cwp_occ_sovereignty_restored: "Sovereignty Restored"
 cwp_occ_treaty_refused: "Peace Treaty Refused"

 cwp_occ.1.t: "A Peace Treaty"
 cwp_occ.1.d: "[SCOPE.sCountry('cwp_occ_subject').GetName] has asked for a peace treaty. Its government is stable, and the occupation has lasted four years or more, at a growing cost to our treasury and with less and less support at home. Our diplomats have drafted a treaty that would end the occupation and restore its sovereignty."
 cwp_occ.1.d.JAP: "[SCOPE.sCountry('cwp_occ_subject').GetName] has asked for a peace treaty after four years or more of occupation. Our diplomats have drafted a treaty of reconciliation, without reparations that would cripple its economy, and a separate security pact would keep our bases on the islands. Signing it would turn a defeated enemy into an ally."
 cwp_occ.1.f: "\"Territory is considered occupied when it is actually placed under the authority of the hostile army.\"\n— Hague Regulations, 1907, Article 42"
 cwp_occ.1.f.JAP: "\"The occupying forces of the Allies shall be withdrawn from Japan as soon as these objectives have been accomplished and there has been established in accordance with the freely expressed will of the Japanese people a peacefully inclined and responsible government.\"\n— Potsdam Declaration, July 1945"
 cwp_occ.1.a: "Sign the treaty."
 cwp_occ.1.b: "Not yet."
 cwp_occ_stable_tt: "A government with some legitimacy (25 or more)"
