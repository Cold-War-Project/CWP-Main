l_english:
 gov_cwp_peoples_republic:0 "People's Republic"
 gov_cwp_peoples_republic_desc:0 "A single ruling communist party directs the state and the economy. Other parties are banned or reduced to satellites of the vanguard."
 gov_cwp_peoples_democracy:0 "People's Democracy"
 gov_cwp_peoples_democracy_desc:0 "A communist-led front holds power behind a façade of coalition government. Rival parties survive in name while the security services and key ministries answer to the party."
 gov_cwp_islamic_republic:0 "Islamic Republic"
 gov_cwp_islamic_republic_desc:0 "Elected institutions operate under the guardianship of religious jurists, whose leader holds final authority over the state."
 gov_cwp_islamic_emirate:0 "Islamic Emirate"
 gov_cwp_islamic_emirate_desc:0 "Religious authorities rule directly according to their reading of Islamic law, without elected institutions."
 gov_cwp_minority_rule_republic:0 "Herrenvolk Democracy"
 gov_cwp_minority_rule_republic_desc:0 "Republican institutions and elections exist, but the franchise and citizenship are reserved for a privileged minority of the population."
 gov_cwp_minority_rule_dominion:0 "Herrenvolk Democracy"
 gov_cwp_minority_rule_dominion_desc:0 "A self-governing state under the crown whose parliament is elected by, and answers to, a privileged minority of the population."
 RULER_TITLE_CWP_HEAD_OF_STATE:0 "Head of State"
 RULER_TITLE_CWP_SUPREME_LEADER:0 "Supreme Leader"
