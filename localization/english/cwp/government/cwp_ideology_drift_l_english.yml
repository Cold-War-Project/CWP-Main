l_english:
 cwp_ideo_internal_strife: "Factional Split"

 cwp_ideo.1.t: "Union Deradicalization"
 cwp_ideo.1.d: "At its congress the [SCOPE.gsInterestGroup('cwp_ideo_ig').GetName] is debating a new program. Its younger leaders point out that the members own houses and cars, vote in free elections and win more at the bargaining table than they ever did on the barricades. They want to drop the language of class war and the common ownership of industry, and present the movement as a partner in a prosperous mixed economy."
 cwp_ideo.1.f: "\"The final goal, whatever it may be, is nothing to me; the movement is everything.\"\n— Eduard Bernstein, 1898"
 cwp_ideo.1.a: "The movement adopts the new program."
 cwp_ideo.1.b: "The old guard defeats the motion."

 cwp_ideo.2.t: "Union Radicalization"
 cwp_ideo.2.d: "Wages have fallen behind prices for years, the factories lay off workers, and the [SCOPE.gsInterestGroup('cwp_ideo_ig').GetName] has lost patience with leaders who promised that negotiation would deliver. Militant shop stewards are taking over the branches, and the talk at meetings is of general strikes and taking the factories into the workers' hands."
 cwp_ideo.2.f: "\"The proletarians have nothing to lose but their chains.\"\n— Karl Marx and Friedrich Engels, The Communist Manifesto, 1848"
 cwp_ideo.2.a: "The movement turns militant."

 cwp_ideo.3.t: "Christian Democracy"
 cwp_ideo.3.d: "Now that it sits in government, the [SCOPE.gsInterestGroup('cwp_ideo_ig').GetName] is changing. Its leaders speak less of the rights of the church and more of family allowances, housing and a social market economy, drawing on religious social teaching to compete with the socialists for working-class votes. Some of the clergy are uneasy at the change."
 cwp_ideo.3.f: "\"Capital cannot do without labor, nor labor without capital.\"\n— Pope Leo XIII, Rerum Novarum, 1891"
 cwp_ideo.3.a: "Embrace social solidarity."
 cwp_ideo.3.b: "Faith comes before politics."

 cwp_ideo.4.t: "Church-State Conflict"
 cwp_ideo.4.d: "Seminaries are closed, priests are arrested and the faithful are told that religion is a relic of the old order. Under this pressure the [SCOPE.gsInterestGroup('cwp_ideo_ig').GetName] has abandoned its social programs and its dialogue with the state, and closed ranks around tradition, discipline and its persecuted clergy."
 cwp_ideo.4.f: "\"The blood of Christians is seed.\"\n— Tertullian, Apologeticus"
 cwp_ideo.4.a: "The faithful close ranks."

 cwp_ideo.5.t: "Employers’ Federation"
 cwp_ideo.5.d: "With the state steering investment and the unions too strong to break, the leading figures of the [SCOPE.gsInterestGroup('cwp_ideo_ig').GetName] have concluded that it is cheaper to bargain than to fight. A national employers' federation is negotiating wage agreements, productivity deals and a seat on the planning councils."
 cwp_ideo.5.f: "In the Saltsjöbaden Agreement of 1938, the Swedish Employers' Confederation and the trade union confederation LO agreed on rules for bargaining and for settling disputes without the state."
 cwp_ideo.5.a: "Sit down with the unions."
 cwp_ideo.5.b: "Fight them in every factory."

 cwp_ideo.6.t: "Commercialization of Agriculture"
 cwp_ideo.6.d: "Land reform has broken up the old estates or made them unprofitable to run the old way. The families that remain in the [SCOPE.gsInterestGroup('cwp_ideo_ig').GetName] now farm for the market with tractors, fertilizer and hired hands, and care more about crop prices and export subsidies than about their tenants' deference."
 cwp_ideo.6.f: "Lenin called it the 'Prussian path' to capitalism in agriculture, in which the great estate becomes a commercial farm and the landlord its manager."
 cwp_ideo.6.a: "The landowners modernize."
