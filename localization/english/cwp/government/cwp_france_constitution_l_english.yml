l_english:
 je_cwp_fra_constituent_assembly: "The Constituent Assembly"
 je_cwp_fra_constituent_assembly_reason: "The Third Republic died at Vichy in July 1940, and in October 1945 the French voted overwhelmingly not to bring it back. A constituent assembly dominated by the Communists, the Socialists and the Christian Democrats of the MRP must now write a new constitution, and the people must approve it. General de Gaulle, who led the provisional government from 1944, wants a strong president; the left wants a sovereign assembly."
 je_cwp_fra_constituent_assembly_status_first: "Drafting a single-chamber constitution"
 cwp_fra_possible_tt: "France is a republic"
 cwp_fra_invalid_tt: "France has become a monarchy"
 cwp_fra_referendum_held_tt: "The draft has gone to a referendum"
 cwp_fra_adopted_tt: "Voters approved it"
 cwp_fra_rejected_tt: "Voters rejected it"
 je_cwp_fra_constituent_assembly_status_second: "A second assembly is drafting a new text"
 je_cwp_fra_constituent_assembly_status_gaullist: "The draft gives the president strong powers"
 je_cwp_fra_constituent_assembly_success_desc: "France has a new constitution, approved by the people."
 je_cwp_fra_constituent_assembly_failure_desc: "France could not agree on a constitution; the provisional institutions carry on."

 cwp_fra_draft_bar: "Support for the Draft"
 cwp_fra_draft_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_fra_draft_bar_explain_tt Support for the draft#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]%#!"
 cwp_fra_draft_bar_explain_tt: "The share of voters expected to approve the current draft constitution. It drifts toward a point set by the left, the center and right, and the compromises written into the text."
 cwp_fra_draft_bar_drift_tt: "Opinion drifts toward the balance of the parties and the compromises in the text"
 cwp_fra_pivot_base_tt: "Undecided voters"
 cwp_fra_pivot_left_tt: "Communists and Socialists"
 cwp_fra_pivot_right_tt: "The MRP, Radicals and the right"
 cwp_fra_pivot_compromise_tt: "Compromises in the draft"
 cwp_fra_pivot_campaign_tt: "Campaigning"
 cwp_fra_assembly_bar: "Assembly Deliberations"
 cwp_fra_assembly_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_fra_assembly_bar_explain_tt Assembly deliberations#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 cwp_fra_assembly_bar_explain_tt: "The constituent assembly's progress on its draft. When it is complete the text goes to a referendum."
 cwp_fra_assembly_bar_second_desc: "Referendum at #v 100#!"
 cwp_fra_assembly_sitting_tt: "The assembly sits"
 cwp_fra_assembly_tripartisme_tt: "Tripartisme keeps the committees working"

 cwp_fra_council_of_republic_button: "Concede a Second Chamber"
 cwp_fra_council_of_republic_button_desc: "Give the MRP what it asks: a Council of the Republic to revise the assembly's laws, and a president elected by both chambers."
 cwp_fra_council_of_republic_tt: "Moves support for the draft 4 points up. The Communist-led unions resent it."
 cwp_fra_strong_presidency_button: "Follow the Bayeux Program"
 cwp_fra_strong_presidency_button_desc: "Rewrite the draft around de Gaulle's ideas: a head of state above the parties who appoints the government and can dissolve the assembly. The Communists and Socialists will campaign against it with everything they have."
 cwp_fra_strong_presidency_tt: "If approved, the presidential republic stays instead of a parliamentary one. Support for the draft falls 6 points."
 cwp_fra_tripartisme_button: "Govern by Tripartisme"
 cwp_fra_tripartisme_button_desc: "Share the ministries between Communists, Socialists and the MRP so that the assembly's committees can get on with the text."
 cwp_fra_tripartisme_tt: "The assembly finishes its draft faster."
 cwp_fra_campaign_yes_button: "Campaign for a Yes"
 cwp_fra_campaign_yes_button_desc: "The government parties call on voters to approve the draft and end the provisional regime."
 cwp_fra_campaign_yes_tt: "Moves support for the draft 4 points up."
 cwp_fra_new_assembly_tt: "A second constituent assembly is elected. Its draft starts 6 points more acceptable."

 cwp_fra_constitution.1.t: "A Constitution for the Fourth Republic"
 cwp_fra_constitution.1.d: "The provisional government rests on the three great parties, and General de Gaulle has less and less patience with them. The constituent assembly elected in October 1945 has seven months to produce a constitution and put it to the people. The Communists and Socialists want a single chamber with full powers, the MRP wants a second chamber to check it, and de Gaulle wants a president strong enough to govern above the parties."
 cwp_fra_constitution.1.f: "In the referendum of 21 October 1945, 96 percent of voters refused to restore the Third Republic."
 cwp_fra_constitution.1.a: "To work."

 cwp_fra_constitution.2.t: "The Constitutional Referendum"
 cwp_fra_constitution.2.d.yes: "The draft is approved with [ROOT.GetCountry.MakeScope.Var('cwp_fra_result_var').GetValue|0]% of the vote. The provisional regime is over, and elections for the new National Assembly follow."
 cwp_fra_constitution.2.d.no_again: "The draft is rejected: only [ROOT.GetCountry.MakeScope.Var('cwp_fra_result_var').GetValue|0]% voted yes. A new constituent assembly must be elected and start again."
 cwp_fra_constitution.2.d.no_final: "Only [ROOT.GetCountry.MakeScope.Var('cwp_fra_result_var').GetValue|0]% voted yes. After three failed drafts the parties give up the attempt, and France goes on under the provisional law of November 1945."
 cwp_fra_constitution.2.f: "\"Any society in which the guarantee of rights is not assured, nor the separation of powers determined, has no Constitution.\"\n— Declaration of the Rights of Man and of the Citizen, 1789, Article 16"
 cwp_fra_constitution.2.a: "Vive la Quatrième République."
 cwp_fra_constitution.2.b: "Elect a new assembly."
 cwp_fra_constitution.2.c: "The provisional order stays."
