l_english:
 je_cwp_newfoundland_future: "The Future of Newfoundland"
 je_cwp_newfoundland_future_reason: "Newfoundland gave up self-government in 1934, bankrupt, and has been run since by a Commission appointed from London. The war brought American bases and full employment; peace brings the question of what comes next. An elected National Convention will send delegations to London and Ottawa and advise on the ballot: Confederation with Canada, a return to Responsible Government, or more years of Commission rule."
 je_cwp_newfoundland_future_status_poll: "Polls: Confederation [ROOT.GetCountry.MakeScope.ScriptValue('cwp_nf_confederation_pivot')|0]%, Responsible Government [ROOT.GetCountry.MakeScope.ScriptValue('cwp_nf_responsible_share')|0]%, Commission [ROOT.GetCountry.MakeScope.ScriptValue('cwp_nf_commission_share')|0]%."
 cwp_nf_london_delegation_button: "Send a Delegation to London"
 cwp_nf_london_delegation_button_desc: "Ask the British government what help a self-governing Newfoundland could expect: debt relief, a trade treaty, anything at all."
 cwp_nf_london_tt: "If Britain is bankrupt, London offers nothing, and Confederation gains 2 points; otherwise Responsible Government gains 2."
 cwp_nf_ottawa_delegation_button: "Send a Delegation to Ottawa"
 cwp_nf_ottawa_delegation_button_desc: "Ask Canada what terms of union it would offer: family allowances, old-age pensions, the railway, the federal dole."
 cwp_nf_ottawa_tt: "Canada's terms are published. Confederation gains 4 points."
 cwp_nf_canada_listens_tt: "Canada is at least on cordial terms with Newfoundland"
 cwp_nf_convention_sat_tt: "The Convention has sat for four months"
 cwp_nf_convention_report_button: "The Convention Reports"
 cwp_nf_convention_report_button_desc: "Close the debates and send London the Convention's recommendation for the ballot."
 cwp_nf_convention_report_tt: "The referendum is held in two months."
 cwp_nf_london_done_tt: "The delegation to London has reported"
 cwp_nf_debate_done_tt: "The Convention has debated for a year"
 cwp_nf_runoff_tt: "No option has a majority. The Commission drops out, and a runoff is held in six weeks."
 cwp_nf.2.d.confederation: "The count is in: [ROOT.GetCountry.MakeScope.Var('cwp_nf_result_var').GetValue|0]% for Confederation with Canada, an outright majority on the first ballot. The outports voted for family allowances and the old-age pension. It now falls to Ottawa to agree the Terms of Union."
 cwp_nf.2.d.responsible: "The count is in: [ROOT.GetCountry.MakeScope.Var('cwp_nf_rg_result_var').GetValue|0]% for Responsible Government, an outright majority. Newfoundland will govern itself again as a dominion, poorer than its neighbour but answerable to no one in Ottawa."
 cwp_nf.2.d.runoff: "No option has won a majority: Responsible Government [ROOT.GetCountry.MakeScope.Var('cwp_nf_rg_result_var').GetValue|0]%, Confederation [ROOT.GetCountry.MakeScope.Var('cwp_nf_result_var').GetValue|0]%, Commission of Government [ROOT.GetCountry.MakeScope.Var('cwp_nf_cm_result_var').GetValue|0]%. The Commission drops off the ballot, and its voters will decide the runoff."
 cwp_nf.2.c: "To the runoff."
 cwp_nf.4.t: "The Second Referendum"
 cwp_nf.4.d.confederation: "Confederation has won the runoff with [ROOT.GetCountry.MakeScope.Var('cwp_nf_runoff_var').GetValue|0]% of the vote. Most of the Commission's voters chose Canadian money over a return to the self-government that went bankrupt in 1933. St. John's is in mourning; the outports celebrate."
 cwp_nf.4.d.responsible: "Responsible Government has won the runoff: only [ROOT.GetCountry.MakeScope.Var('cwp_nf_runoff_var').GetValue|0]% chose Confederation. Newfoundland will govern itself again."
 cwp_nf.4.f: "Six weeks after the first ballot, the island voted again. This time there were only two lines."
 je_cwp_newfoundland_future_settled_desc: "Newfoundland's future has been decided."

 cwp_nf_pivot_base_tt: "Loyalty to the old Dominion"
 cwp_nf_pivot_prosperity_tt: "Canadian family allowances and pensions"
 cwp_nf_pivot_outports_tt: "Outport fishermen and workers"
 cwp_nf_pivot_church_tt: "The Catholic Church fears Confederation"
 cwp_nf_pivot_merchants_tt: "The St. John's merchants"
 cwp_nf_pivot_campaign_tt: "Campaigning"

 cwp_nf_smallwood_button: "Smallwood Takes to the Air"
 cwp_nf_smallwood_button_desc: "Joey Smallwood, the former Barrelman of the radio, broadcasts the Convention's debates into every outport kitchen and argues for Confederation night after night."
 cwp_nf_smallwood_tt: "Moves the projected vote 4 points towards Confederation."
 cwp_nf_responsible_government_button: "Back the Responsible Government League"
 cwp_nf_responsible_government_button_desc: "Peter Cashin and the League call Confederation a sale of the country to Ottawa and demand that Newfoundland govern itself again."
 cwp_nf_responsible_government_tt: "Moves the projected vote 4 points towards Responsible Government."
 cwp_nf_terms_of_union_tt: "Canada will decide whether to accept the Terms of Union."

 cwp_nf.1.t: "The National Convention"
 cwp_nf.1.d: "For the first time since 1934, Newfoundlanders have elected representatives. Forty-five delegates meet in the Colonial Building in St. John's to examine the country's finances and recommend the forms of government to put before the people. The sessions are broadcast, and the whole island listens."
 cwp_nf.1.f: "Few outside St. John's had heard of the delegates. Within a year everyone had an opinion of them."
 cwp_nf.1.a: "Let the Convention begin."

 cwp_nf.2.t: "Newfoundland Decides"
 cwp_nf.2.f: "The ballot was a single cross beside a single line. The arguments behind it filled two years."
 cwp_nf.2.a: "On to Ottawa."
 cwp_nf.2.b: "Responsible Government is restored."

 cwp_nf.3.t: "The Terms of Union"
 cwp_nf.3.d: "Newfoundland has voted to join Confederation. Its delegation has come to Ottawa to settle the Terms of Union: federal programmes for the island, transitional grants, the railway and the fisheries. Accepting brings Canada a tenth province, Labrador's iron and the American bases' coastline, along with the debts of a poor colony."
 cwp_nf.3.f: "Canada would at last stretch from the Atlantic to the Pacific in fact as well as on the map."
 cwp_nf.3.a: "Welcome the tenth province."
 cwp_nf.3.b: "The terms are too costly."
