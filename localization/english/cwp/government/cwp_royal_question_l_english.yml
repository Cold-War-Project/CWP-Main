l_english:
 je_cwp_royal_question: "The Royal Question"
 je_cwp_royal_question_reason: "In May 1940 Leopold III surrendered the army against his government's advice and stayed in occupied Belgium as a prisoner, then married in wartime. The government in London called his conduct a betrayal. Liberated in Austria in 1945, he waits in Switzerland while his brother Charles rules as regent. Catholic Flanders wants him back; the Socialist and Walloon left swears he will never reign again. To bring him home, his supporters need the Catholic party in government, a won consultation, and a country that will accept the result."
 je_cwp_royal_question_status_for: "The newspapers' polls give the King [ROOT.GetCountry.MakeScope.ScriptValue('cwp_rq_return_pivot')|0]% of the vote: a majority for his return."
 je_cwp_royal_question_status_against: "The newspapers' polls give the King only [ROOT.GetCountry.MakeScope.ScriptValue('cwp_rq_return_pivot')|0]% of the vote."
 je_cwp_royal_question_status_returned: "The King is back at Laeken. Whether he can stay depends on the unions and on how much authority the government still has."
 je_cwp_royal_question_reigns_desc: "Leopold III reigns again, and the country has accepted it."
 je_cwp_royal_question_abdication_desc: "The King has abdicated for his son. The dynasty survives."
 je_cwp_royal_question_divided_desc: "The King stayed, but Wallonia has not forgiven the crown."
 cwp_rq_king_back_tt: "The King has returned after winning the consultation"
 cwp_rq_unions_not_powerful_tt: "Organized Labor is not powerful enough to paralyze the country"
 cwp_rq_abdicated_tt: "The King has abdicated in favor of his son"
 cwp_rq_stood_firm_tt: "The King stayed on through a general strike"
 cwp_rq_catholics_in_government_tt: "Religious Groups are in government"
 cwp_rq_king_returns_tt: "The King comes home. If Organized Labor is powerful, expect a general strike."
 cwp_rq_consultation_button: "Hold the Popular Consultation"
 cwp_rq_consultation_button_desc: "Ask the voters whether the King should resume his powers. The result follows the polls on the day, give or take a few points."
 cwp_rq_consultation_tt: "The consultation will be held in a month."


 cwp_rq_campaign_return_button: "Campaign for the King"
 cwp_rq_campaign_return_button_desc: "Back the Catholic campaign: the King saved the army from slaughter in 1940 and shared his people's captivity."
 cwp_rq_campaign_return_tt: "The King gains 3 points in the polls."
 cwp_rq_campaign_against_button: "Campaign Against the Return"
 cwp_rq_campaign_against_button_desc: "Back the Socialist and liberal campaign: the King defied his ministers, met Hitler at Berchtesgaden and abandoned the Allies."
 cwp_rq_campaign_against_tt: "The King loses 3 points in the polls."
 cwp_rq_campaign_cap_tt: "The campaign has already gone as far as it can"
 cwp_rq_abdicate_for_son_button: "Propose Abdication for Prince Baudouin"
 cwp_rq_abdicate_for_son_button_desc: "Ask the King to step aside for his son before the country splits along the language line."
 cwp_rq_time_tt: "At least a year has passed since the question opened"
 cwp_rq_abdication_tt: "The King abdicates in favor of his heir."

 cwp_rq_king_returns: "The King Returns"
 cwp_rq_new_king: "Royal Succession"
 cwp_rq_divided_kingdom: "Royal Question Crisis"
 cwp_rq_campaigned_against: "Opposed by the Government"

 cwp_rq.1.t: "The Royal Question"
 cwp_rq.1.d: "Leopold III is free, but he has not come home. From his villa at Pregny he waits for the country to call him back, and the country cannot agree whether to. In Flanders the Catholics hang his portrait in their windows; in the Walloon industrial towns the Socialists and the unions talk of a general strike if he sets foot in Brussels. Prince Charles governs as regent and avoids taking sides."
 cwp_rq.1.f: "The war had ended for Belgium. The argument about how its King had fought it had not."
 cwp_rq.1.a: "Let the politicians find a way out."

 cwp_rq.2.t: "The Popular Consultation"
 cwp_rq.2.d.yes: "[ROOT.GetCountry.MakeScope.Var('cwp_rq_result_var').GetValue|0]% of Belgians have voted for the King's return. Flanders voted heavily yes; Wallonia and Brussels voted no. The Catholics claim a national mandate, the Socialists say a majority of one community cannot impose a king on the other, and Leopold prepares to come home."
 cwp_rq.2.d.no: "Only [ROOT.GetCountry.MakeScope.Var('cwp_rq_result_var').GetValue|0]% of Belgians have voted for the King's return. Even many Catholics stayed away. Leopold has said he will not reign over a country that does not want him, and his advisers speak of abdication in favor of his son."
 cwp_rq.2.f: "The ballot asked whether the King should resume his powers. Every voter knew it asked much more."
 cwp_rq.2.a: "The King comes home."
 cwp_rq.2.b: "He will step aside."

 cwp_rq.3.t: "The King Comes Home"
 cwp_rq.3.d.strikes: "Leopold III has returned to Laeken, and Wallonia has risen against him. The unions have called a general strike, steelworks and mines stand idle, and at Grâce-Berleur the gendarmerie fired on a crowd. Socialist leaders talk of marching on Brussels. The government asks the King whether the crown is worth a civil war."
 cwp_rq.3.f: "The King had won the vote. Now he had to win the country."
 cwp_rq.3.a: "Abdicate for Prince Baudouin."
 cwp_rq.3.b: "The King stays."

 cwp_rq.4.t: "Abdication"
 cwp_rq.4.d: "To keep the crown from breaking the country, the King has agreed to step aside for his son. Prince Baudouin, barely twenty, takes the oath before both chambers. The Socialists accept the new king; the Catholics mourn the old one; the dynasty survives."
 cwp_rq.4.f: "The father gave up the throne so that the son could keep it."
 cwp_rq.4.a: "Long live King Baudouin."
