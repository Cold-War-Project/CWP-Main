 je_cwp_royal_question: "The Royal Question"
 je_cwp_royal_question_reason: "In May 1940 Leopold III surrendered our army against his government's advice and stayed in occupied Belgium as a prisoner, then married in wartime. His ministers, who carried on the war from London, condemned his conduct. Liberated in Austria in 1945, he waits in Switzerland while his brother Charles rules as regent. Catholic Flanders wants him back, and the Socialists and the Walloon left say he must never reign again. His return needs the Catholic party in government and a won popular consultation."
 je_cwp_royal_question_status_for: "Polls give the King a majority: #v [ROOT.GetCountry.MakeScope.ScriptValue('cwp_rq_return_pivot')|0]%#!"
 je_cwp_royal_question_status_against: "Polls give the King #v [ROOT.GetCountry.MakeScope.ScriptValue('cwp_rq_return_pivot')|0]%#!"
 je_cwp_royal_question_status_returned: "The King is back at Laeken"
 cwp_rq_possible_tt: "The King's return is in question"
 cwp_rq_invalid_tt: "The monarchy has been abolished"
