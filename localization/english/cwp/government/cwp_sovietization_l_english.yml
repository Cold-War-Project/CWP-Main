l_english:
 je_cwp_peoples_democracy: "The People's Democracy"
 je_cwp_peoples_democracy_reason: "The Red Army liberated [ROOT.GetCountry.GetName] and has not left. The government is a coalition of the parties that fought the fascists, but the communists hold the interior ministry, the occupier stands behind them, and the peasant and middle-class parties that won the last free vote are being pushed aside. Whether a single party ends up owning the state depends on who holds the police, how strong the opposition remains, and how long the occupier stays."
 je_cwp_peoples_democracy_status_monarchy: "The crown still stands in the way of a people's republic."
 je_cwp_peoples_democracy_status_communists: "Communist ministers hold the key ministries."
 je_cwp_peoples_democracy_status_coalition: "The coalition still answers to the non-communist parties."
 je_cwp_peoples_democracy_success_desc: "The communists hold the state. [ROOT.GetCountry.GetName] is a people's republic."
 je_cwp_peoples_democracy_failure_desc: "The occupier withdrew before the communists could take the state. Pluralism survives in [ROOT.GetCountry.GetName]."
 cwp_sov_control_full_tt: "Communist control is complete"
 cwp_sov_no_crown_tt: "The monarchy has been abolished"
 cwp_sov_occupation_over_tt: "The country is no longer occupied by a council republic"
 cwp_sov_control_40_tt: "Communist control is at least 40"
 cwp_sov_no_communist_majority_tt: "Opposition interest groups hold at least 30% of clout"

 cwp_sov_control_bar: "Communist Control"
 cwp_sov_control_bar_desc: "How far the communists hold the interior ministry, the police, the army and the press. When it is full, and no crown remains, the country becomes a single-party people's republic."
 cwp_sov_control_occupier_tt: "The occupation authorities back the communists"
 cwp_sov_control_ministries_tt: "Communists hold key ministries"
 cwp_sov_control_police_tt: "The secret police"
 cwp_sov_control_interior_tt: "Communists run the interior ministry"
 cwp_sov_control_merged_tt: "A single workers' party"
 cwp_sov_control_opposition_tt: "The opposition parties resist"
 cwp_sov_resistance_bar: "Resistance"
 cwp_sov_resistance_bar_desc: "Underground fighters, strikes and peasant boycotts. When it is full the country is in open revolt."
 cwp_sov_resistance_exhaustion_tt: "Exhaustion after the war"
 cwp_sov_resistance_radicals_tt: "Radicals"
 cwp_sov_resistance_trials_tt: "Show trials"
 cwp_sov_resistance_land_reform_tt: "Land reform has won over the peasants"

 cwp_sov_salami_button: "Salami Tactics"
 cwp_sov_salami_button_desc: "Split the strongest opposition party: expose its 'reactionary' wing, arrest a few leaders for conspiracy, invite the rest into the government bloc. Then do it again, slice by slice."
 cwp_sov_merge_parties_button: "Merge the Workers' Parties"
 cwp_sov_merge_parties_button_desc: "Absorb the Social Democrats into a single party of the working class. Those who refuse are purged as right-wing deviationists."
 cwp_sov_land_reform_button: "Land to the Tiller"
 cwp_sov_land_reform_button_desc: "Break up the great estates and give the land to the peasants who work it, before collectivisation is ever mentioned."
 cwp_sov_show_trials_button: "Show Trials"
 cwp_sov_show_trials_button_desc: "Put opposition leaders, clergy and 'saboteurs' on trial for conspiracy with foreign intelligence. Confessions are guaranteed."
 cwp_sov_appeal_west_button: "Appeal to the West"
 cwp_sov_appeal_west_button_desc: "Remind Washington and London of the Yalta promise of free elections, and let the occupier know the world is watching."

 cwp_sov_salami_target: "Sliced Away"
 cwp_sov_merged_party: "United Workers' Party"
 cwp_sov_land_reform: "Land Reform"
 cwp_sov_show_trials: "Show Trials"
 cwp_sov_peoples_republic: "People's Republic"
 cwp_sov_soviet_intervention: "Foreign Intervention"
 cwp_sov_democracy_survives: "Pluralism Survives"

 cwp_sov.1.t: "A Coalition Under Occupation"
 cwp_sov.1.d: "The war is over, but the occupation is not. Troops of [SCOPE.sCountry('cwp_sov_occupier').GetName] garrison our cities, and their political advisers sit in our ministries. The coalition government promises land reform, reconstruction and free elections. Everyone knows which party holds the interior ministry, and everyone wonders how long the other parties will be allowed to share power."
 cwp_sov.1.f: "\"It's got to look democratic, but we must have everything in our hands.\"\n- attributed to Walter Ulbricht, 1945"
 cwp_sov.1.a: "We will see whose patience runs out first."

 cwp_sov.2.t: "The People's Republic"
 cwp_sov.2.d: "The last opposition party has dissolved itself or been banned. Its leaders are in prison, in exile or in the government bloc. The new constitution, closely modelled on the Soviet one of 1936, declares the leading role of the working class and its party. Elections will continue, with a single list of candidates."
 cwp_sov.2.f: "The ballot had one name on it. Turnout was ninety-eight per cent."
 cwp_sov.2.a: "Forward to socialism."

 cwp_sov.3.t: "Open Revolt"
 cwp_sov.3.d: "Strikes have spread from the factories to the railways, and in the hills the underground fights on. Peasants hide their grain, students march with the national flag, and the police no longer go into some districts at night. The government must decide whether to call on the occupation troops or to give the people what they demand."
 cwp_sov.3.f: "The tanks were parked at the edge of the city, their engines running."
 cwp_sov.3.a: "Call in the troops."
 cwp_sov.3.b: "Concede free elections."
