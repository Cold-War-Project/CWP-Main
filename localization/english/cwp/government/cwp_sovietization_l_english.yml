l_english:
 je_cwp_peoples_democracy: "The People's Democracy"
 je_cwp_peoples_democracy_reason: "Troops of a communist power occupy [ROOT.GetCountry.GetName], and its political advisers sit in the ministries. The government is a coalition of the parties that opposed the old regime, like the national fronts formed across Eastern Europe in 1944 and 1945. The communists hold or demand the interior ministry and the police, while the peasant, liberal and social democratic parties find themselves pushed aside."
 je_cwp_peoples_democracy_status_monarchy: "The crown still blocks a people's republic"
 je_cwp_peoples_democracy_status_communists: "Communist ministers hold the key ministries."
 je_cwp_peoples_democracy_status_coalition: "The coalition answers to non-communist parties"
 je_cwp_peoples_democracy_success_desc: "The communists hold the state. [ROOT.GetCountry.GetName] is a people's republic."
 je_cwp_peoples_democracy_failure_desc: "The occupier withdrew before the communists could take the state. Pluralism survives in [ROOT.GetCountry.GetName]."
 cwp_sov_control_full_tt: "Communist control is complete"
 cwp_sov_no_crown_tt: "The monarchy has been abolished"
 cwp_sov_occupation_over_tt: "The country is no longer occupied by a council republic"
 cwp_sov_control_40_tt: "Communist control is at least 40"
 cwp_sov_no_communist_majority_tt: "Opposition interest groups hold at least 30% of clout"

 cwp_sov_control_bar: "Communist Control"
 cwp_sov_control_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_sov_control_bar_explain_tt Communist control#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 cwp_sov_control_bar_explain_tt: "How far the communists hold the interior ministry, the police, the army and the press. When it is full and no crown remains, the country becomes a single-party people's republic."
 cwp_sov_control_occupier_tt: "The occupation authorities back the communists"
 cwp_sov_control_ministries_tt: "Communists hold key ministries"
 cwp_sov_control_police_tt: "The secret police"
 cwp_sov_control_interior_tt: "Communists run the interior ministry"
 cwp_sov_control_merged_tt: "A single workers' party"
 cwp_sov_control_consolidation_tt: "The party consolidates its hold"
 cwp_sov_control_opposition_tt: "The opposition parties resist, less as the party takes the state"
 cwp_sov_resistance_bar: "Anti-Communist Resistance"
 cwp_sov_resistance_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_sov_resistance_bar_explain_tt Resistance#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#! (revolt at 100)"
 cwp_sov_resistance_bar_explain_tt: "Underground fighters, strikes and peasant boycotts. When it is full the country is in open revolt."
 cwp_sov_resistance_exhaustion_tt: "Exhaustion after the war"
 cwp_sov_resistance_radicals_tt: "Radicals"
 cwp_sov_resistance_trials_tt: "Show trials"
 cwp_sov_resistance_land_reform_tt: "Land reform has won over the peasants"

 cwp_sov_salami_button: "Salami Tactics"
 cwp_sov_salami_button_desc: "Split the strongest opposition party: expose its 'reactionary' wing, arrest a few leaders for conspiracy, invite the rest into the government bloc. Then do it again, slice by slice."
 cwp_sov_merge_parties_button: "Merge the Workers' Parties"
 cwp_sov_merge_parties_button_desc: "Absorb the Social Democrats into a single party of the working class. Those who refuse are purged as right-wing deviationists."
 cwp_sov_land_reform_button: "Land to the Tiller"
 cwp_sov_land_reform_button_desc: "Break up the great estates and give the land to the peasants who work it, before collectivization is ever mentioned."
 cwp_sov_show_trials_button: "Show Trials"
 cwp_sov_show_trials_button_desc: "Put opposition leaders, clergy and 'saboteurs' on trial for conspiring with foreign intelligence services. The security police prepare the confessions in advance."
 cwp_sov_appeal_west_button: "Appeal to the West"
 cwp_sov_appeal_west_button_desc: "Remind Washington and London of the promise of free elections made at Yalta, and ask them to protest to the occupier."

 cwp_sov_salami_target: "Targeted by Salami Tactics"
 cwp_sov_merged_party: "United Workers' Party"
 cwp_sov_land_reform: "Land Reform"
 cwp_sov_show_trials: "Show Trials"
 cwp_sov_peoples_republic: "People's Republic"
 cwp_sov_soviet_intervention: "Military Intervention by the Occupier"
 cwp_sov_democracy_survives: "Multi-Party System Preserved"

 cwp_sov.1.t: "A Coalition Under Occupation"
 cwp_sov.1.d: "The war is over, but the occupation is not. Troops of [SCOPE.sCountry('cwp_sov_occupier').GetName] garrison our cities, and their political advisers sit in our ministries. The coalition government promises land reform, reconstruction and free elections, but the communists hold the interior ministry, and the other parties suspect they will not be allowed to share power for long."
 cwp_sov.1.f: "\"It's got to look democratic, but we must have everything in our hands.\"\n— Walter Ulbricht, 1945 (attributed)"
 cwp_sov.1.a: "Work within the coalition."

 cwp_sov.2.t: "The People's Republic"
 cwp_sov.2.d: "The last opposition party has dissolved itself or been banned. Its leaders are in prison, in exile or in the government bloc. The new constitution, closely modeled on the Soviet constitution of 1936, declares the leading role of the working class and its party. Elections will continue, with a single list of candidates."
 cwp_sov.2.f: "\"...the All-Union Communist Party (Bolsheviks), which is the vanguard of the working people ... is the leading core of all organizations of the working people, both public and state.\"\n— Constitution of the USSR, 1936, Article 126"
 cwp_sov.2.a: "Forward to socialism."

 cwp_sov.3.t: "Open Revolt"
 cwp_sov.3.d: "Strikes have spread from the factories to the railways, and in the hills the underground fights on. Peasants hide their grain, students march with the national flag, and the police no longer go into some districts at night. The government must decide whether to call on the occupation troops or to give the people what they demand."
 cwp_sov.3.f: "\"...the earliest possible establishment through free elections of governments responsive to the will of the people.\"\n— Declaration on Liberated Europe, Yalta, February 1945"
 cwp_sov.3.a: "Call in the troops."
 cwp_sov.3.b: "Concede free elections."
