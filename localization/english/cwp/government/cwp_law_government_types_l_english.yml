l_english:
 gov_absolute_monarchy:0 "Absolute Monarchy"
 gov_absolute_monarchy_desc:0 "The monarch rules in person. Ministers serve at the pleasure of the crown, and no elected body can overrule them."
 gov_absolute_monarchy_provincial:0 "$gov_absolute_monarchy$"
 gov_absolute_monarchy_provincial_desc:0 "$gov_absolute_monarchy_desc$"
 gov_technocratic_monarchy:0 "Technocratic Monarchy"
 gov_technocratic_monarchy_desc:0 "The crown governs through appointed ministers and senior civil servants chosen for their expertise, without a parliament that can hold them to account."
 gov_technocratic_monarchy_provincial:0 "$gov_technocratic_monarchy$"
 gov_technocratic_monarchy_provincial_desc:0 "$gov_technocratic_monarchy_desc$"
 gov_aristocratic_monarchy:0 "Aristocratic Monarchy"
 gov_aristocratic_monarchy_desc:0 "The crown shares power with a narrow circle of great families, courtiers and senior officers who fill its councils and its cabinets."
 gov_aristocratic_monarchy_provincial:0 "$gov_aristocratic_monarchy$"
 gov_aristocratic_monarchy_provincial_desc:0 "$gov_aristocratic_monarchy_desc$"
 gov_landed_constitutional_monarchy:0 "Landed Constitutional Monarchy"
 gov_landed_constitutional_monarchy_desc:0 "A constitutional monarchy whose parliament is elected by landowners, so that the great estates dominate the chamber and the cabinets that answer to it."
 gov_landed_constitutional_monarchy_provincial:0 "$gov_landed_constitutional_monarchy$"
 gov_landed_constitutional_monarchy_provincial_desc:0 "$gov_landed_constitutional_monarchy_desc$"
 gov_plutocratic_constitutional_monarchy:0 "Plutocratic Constitutional Monarchy"
 gov_plutocratic_constitutional_monarchy_desc:0 "A constitutional monarchy whose franchise rests on wealth or taxes paid, giving property owners and business control of parliament."
 gov_plutocratic_constitutional_monarchy_provincial:0 "$gov_plutocratic_constitutional_monarchy$"
 gov_plutocratic_constitutional_monarchy_provincial_desc:0 "$gov_plutocratic_constitutional_monarchy_desc$"
 gov_limited_constitutional_monarchy:0 "Limited Constitutional Monarchy"
 gov_limited_constitutional_monarchy_desc:0 "The monarch reigns but does not rule. Ministers answer to a parliament elected only by citizens who meet a literacy, property or tax qualification."
 gov_limited_constitutional_monarchy_provincial:0 "$gov_limited_constitutional_monarchy$"
 gov_limited_constitutional_monarchy_provincial_desc:0 "$gov_limited_constitutional_monarchy_desc$"
 gov_democratic_constitutional_monarchy:0 "Democratic Constitutional Monarchy"
 gov_democratic_constitutional_monarchy_desc:0 "The monarch reigns but does not rule. Ministers answer to a parliament elected by all adult citizens."
 gov_democratic_constitutional_monarchy_provincial:0 "$gov_democratic_constitutional_monarchy$"
 gov_democratic_constitutional_monarchy_provincial_desc:0 "$gov_democratic_constitutional_monarchy_desc$"
 gov_party_led_monarchy:0 "Party-Led Monarchy"
 gov_party_led_monarchy_desc:0 "The crown remains, but a single legal party controls parliament, the administration and the press."
 gov_party_led_monarchy_provincial:0 "$gov_party_led_monarchy$"
 gov_party_led_monarchy_provincial_desc:0 "$gov_party_led_monarchy_desc$"
 gov_presidential_autocracy:0 "Presidential Autocracy"
 gov_presidential_autocracy_desc:0 "The president rules without effective checks. Elections, where they are held, do not decide who governs."
 gov_presidential_autocracy_provincial:0 "$gov_presidential_autocracy$"
 gov_presidential_autocracy_provincial_desc:0 "$gov_presidential_autocracy_desc$"
 gov_technocratic_republic:0 "Technocratic Republic"
 gov_technocratic_republic_desc:0 "The president governs through appointed experts and senior civil servants, and no elected legislature can overrule them."
 gov_technocratic_republic_provincial:0 "$gov_technocratic_republic$"
 gov_technocratic_republic_provincial_desc:0 "$gov_technocratic_republic_desc$"
 gov_oligarchic_republic:0 "Oligarchic Republic"
 gov_oligarchic_republic_desc:0 "A president governs on behalf of a narrow circle of great families, landowners and senior officers who control the councils of state."
 gov_oligarchic_republic_provincial:0 "$gov_oligarchic_republic$"
 gov_oligarchic_republic_provincial_desc:0 "$gov_oligarchic_republic_desc$"
 gov_landed_presidential_republic:0 "Landed Presidential Republic"
 gov_landed_presidential_republic_desc:0 "An elected president heads a republic whose voters are landowners, so that the great estates dominate the legislature."
 gov_landed_presidential_republic_provincial:0 "$gov_landed_presidential_republic$"
 gov_landed_presidential_republic_provincial_desc:0 "$gov_landed_presidential_republic_desc$"
 gov_plutocratic_presidential_republic:0 "Plutocratic Presidential Republic"
 gov_plutocratic_presidential_republic_desc:0 "A presidential republic whose franchise rests on wealth or taxes paid, giving property owners and business control of the legislature."
 gov_plutocratic_presidential_republic_provincial:0 "$gov_plutocratic_presidential_republic$"
 gov_plutocratic_presidential_republic_provincial_desc:0 "$gov_plutocratic_presidential_republic_desc$"
 gov_limited_presidential_republic:0 "Limited Presidential Republic"
 gov_limited_presidential_republic_desc:0 "A presidential republic in which only citizens who meet a literacy, property or tax qualification may vote."
 gov_limited_presidential_republic_provincial:0 "$gov_limited_presidential_republic$"
 gov_limited_presidential_republic_provincial_desc:0 "$gov_limited_presidential_republic_desc$"
 gov_democratic_presidential_republic:0 "Democratic Presidential Republic"
 gov_democratic_presidential_republic_desc:0 "A president elected by all adult citizens heads the government and shares power with an elected legislature."
 gov_democratic_presidential_republic_provincial:0 "$gov_democratic_presidential_republic$"
 gov_democratic_presidential_republic_provincial_desc:0 "$gov_democratic_presidential_republic_desc$"
 gov_one_party_presidential_republic:0 "One-Party Presidential Republic"
 gov_one_party_presidential_republic_desc:0 "A president heads a republic in which a single legal party controls the legislature, the administration and the press."
 gov_one_party_presidential_republic_provincial:0 "$gov_one_party_presidential_republic$"
 gov_one_party_presidential_republic_provincial_desc:0 "$gov_one_party_presidential_republic_desc$"
 gov_parliamentary_autocracy:0 "Parliamentary Autocracy"
 gov_parliamentary_autocracy_desc:0 "A prime minister rules without effective checks. Parliament still meets, but it no longer decides who governs."
 gov_parliamentary_autocracy_provincial:0 "$gov_parliamentary_autocracy$"
 gov_parliamentary_autocracy_provincial_desc:0 "$gov_parliamentary_autocracy_desc$"
 gov_technocratic_parliamentary_republic:0 "Technocratic Parliamentary Republic"
 gov_technocratic_parliamentary_republic_desc:0 "A cabinet of appointed experts and senior civil servants governs, and parliament has little say over its policies."
 gov_technocratic_parliamentary_republic_provincial:0 "$gov_technocratic_parliamentary_republic$"
 gov_technocratic_parliamentary_republic_provincial_desc:0 "$gov_technocratic_parliamentary_republic_desc$"
 gov_oligarchic_parliamentary_republic:0 "Oligarchic Parliamentary Republic"
 gov_oligarchic_parliamentary_republic_desc:0 "A prime minister governs on behalf of a narrow circle of great families, landowners and senior officers who control parliament."
 gov_oligarchic_parliamentary_republic_provincial:0 "$gov_oligarchic_parliamentary_republic$"
 gov_oligarchic_parliamentary_republic_provincial_desc:0 "$gov_oligarchic_parliamentary_republic_desc$"
 gov_landed_parliamentary_republic:0 "Landed Parliamentary Republic"
 gov_landed_parliamentary_republic_desc:0 "A parliamentary republic whose voters are landowners, so that the great estates dominate the chamber and the cabinet."
 gov_landed_parliamentary_republic_provincial:0 "$gov_landed_parliamentary_republic$"
 gov_landed_parliamentary_republic_provincial_desc:0 "$gov_landed_parliamentary_republic_desc$"
 gov_plutocratic_parliamentary_republic:0 "Plutocratic Parliamentary Republic"
 gov_plutocratic_parliamentary_republic_desc:0 "A parliamentary republic whose franchise rests on wealth or taxes paid, giving property owners and business control of the chamber."
 gov_plutocratic_parliamentary_republic_provincial:0 "$gov_plutocratic_parliamentary_republic$"
 gov_plutocratic_parliamentary_republic_provincial_desc:0 "$gov_plutocratic_parliamentary_republic_desc$"
 gov_limited_parliamentary_republic:0 "Limited Parliamentary Republic"
 gov_limited_parliamentary_republic_desc:0 "A parliamentary republic in which only citizens who meet a literacy, property or tax qualification may vote for the chamber the cabinet answers to."
 gov_limited_parliamentary_republic_provincial:0 "$gov_limited_parliamentary_republic$"
 gov_limited_parliamentary_republic_provincial_desc:0 "$gov_limited_parliamentary_republic_desc$"
 gov_democratic_parliamentary_republic:0 "Democratic Parliamentary Republic"
 gov_democratic_parliamentary_republic_desc:0 "The cabinet answers to a parliament elected by all adult citizens, and the head of state has mostly ceremonial powers."
 gov_democratic_parliamentary_republic_provincial:0 "$gov_democratic_parliamentary_republic$"
 gov_democratic_parliamentary_republic_provincial_desc:0 "$gov_democratic_parliamentary_republic_desc$"
 gov_one_party_parliamentary_republic:0 "One-Party Parliamentary Republic"
 gov_one_party_parliamentary_republic_desc:0 "A single legal party controls parliament, the cabinet and the administration."
 gov_one_party_parliamentary_republic_provincial:0 "$gov_one_party_parliamentary_republic$"
 gov_one_party_parliamentary_republic_provincial_desc:0 "$gov_one_party_parliamentary_republic_desc$"
