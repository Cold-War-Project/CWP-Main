l_english:
  ######################## Decision for armistice ########################
  propose_armistice_for_chinese_civil_war: "Negotiate an armistice"
  propose_armistice_for_chinese_civil_war_desc: "The ongoing civil war has caused immense suffering and has resulted in a stalemate where a military victory for either side is unlikely. By negotiating an armistice and working towards a peaceful resolution, we can end the bloodshed and begin the long process of rebuilding our nation."
  ######################## Return of Manchuria #####################
  return_manchuria_prc: "Return Manchuria to the Chinese"
  return_manchuria_prc_desc: "We have liberated Manchuria from the Japanese and have taken what we can out of it. Returning the region and its captured stockpiles would transform the Communist position in the northeast."
  ######################## Great Retreat #########################
  roc_great_retreat: "Order the Great Retreat"
  roc_great_retreat_desc: "China is losing this war, soon we will be overrun by the red scourge, we have no choice but to abandon the mainland until we're in a position to retake it."
  WILL_RELOCATE_BUILDINGS_ROC: "Will relocate some critical industries & military to Formosa"
  kuomintang_relocation: "Kuomintang Relocation"
  kuomintang_political_dominance: "Kuomintang Political Dominance"
  WILL_GIVE_UP_MAIN_LAND_ROC: "#n [GetPlayer.GetName] will relocate the national government to Taiwan, but mainland control will be settled by occupation and armistice."
  
  chinese_civil_war_tt: "Chinese Civil War has ended"
  treaty_name_chinese_civil_war_manchuria_handover: "Soviet Handover of Manchuria"

  je_chinese_civil_war: "The Chinese Civil War"
  je_chinese_civil_war_reason: "@information! Early victories in the Chinese Civil War build momentum rather than immediately deciding the war. Communist victories, Soviet support, and control of Manchuria push the struggle toward a People's Liberation Army breakthrough; Nationalist victories, foreign backing, and emergency discipline can stabilize Nanjing.\n$TOOLTIP_DELIMITER$\nJapan's defeat has left China exhausted, armed, and divided. Soviet forces hold the Japanese arsenals of Manchuria, the Communist base areas are expanding from the north, and the Nationalist government must choose between mainland recovery, negotiation, or preparing a last redoubt on Taiwan."
  je_chinese_civil_war_status_manchuria: "The Soviet position in Manchuria remains unresolved."
  je_chinese_civil_war_status_guerilla: "The war is still being fought through mobile columns, local militias, and contested railways."
  je_chinese_civil_war_status_conventional: "The war has entered its decisive conventional phase."
  je_chinese_civil_war_complete: "The Chinese Civil War has reached a decisive settlement."
  je_chinese_civil_war_score_bar: "Civil War Momentum"
  je_chinese_civil_war_score_bar_desc: "Nationalist Momentum: [GetGlobalVariable('roc_chinese_civil_war_score').GetValue|v0]"
  je_chinese_civil_war_score_bar_second_desc: "Communist Momentum: [GetGlobalVariable('prc_chinese_civil_war_score').GetValue|v0]"
  je_chinese_civil_war_decisive_campaign: "Launch the Decisive Campaigns"
  je_chinese_civil_war_decisive_campaign_desc: "Commit the People's Liberation Army to the great campaigns that can break the Nationalist armies in the field."
  je_chinese_civil_war_hold_the_line: "Stabilize the Front"
  je_chinese_civil_war_hold_the_line_desc: "The National Revolutionary Army can still hold if command, finance, and logistics are forced into emergency discipline."
  je_chinese_civil_war_retreat_to_taipei: "Prepare the Taipei Redoubt"
  je_chinese_civil_war_retreat_to_taipei_desc: "Evacuate ministries, reserves, and loyal formations to Taiwan before the mainland position collapses entirely."

  chinese_civil_war_guerilla_phase: "Mobile Civil War"
  chinese_civil_war_yanan_network: "Yan'an Networks"
  chinese_civil_war_nanjing_exhaustion: "Nanjing Exhaustion"
  chinese_civil_war_soviet_arsenals: "Soviet-Arsenal Handover"
  chinese_civil_war_manchurian_base_area: "Manchurian Base Area"
  chinese_civil_war_soviet_advisors: "Soviet Advisors"
  chinese_civil_war_land_reform_drive: "Land Reform Drive"
  chinese_civil_war_decisive_campaign: "Decisive Campaigns"
  chinese_civil_war_hold_the_line: "Emergency Front Stabilization"
  chinese_civil_war_supply_shortages: "Supply Shortages"
  chinese_civil_war_overextended_front: "Overextended Front"
  chinese_civil_war_hyperinflation: "Gold Yuan Crisis"
  chinese_civil_war_taipei_emergency_capital: "Taipei Emergency Capital"
  chinese_civil_war_armistice: "Chinese Civil War Armistice"
  chinese_civil_war_prc_mainland_victory: "Mainland Victory"
  chinese_civil_war_roc_mainland_victory: "Mainland Secured"

  chinese_civil_war.1.t: "China Divided"
  chinese_civil_war.1.d: "[SCOPE.sCharacter('communist_leader').GetFullName] and [SCOPE.sCharacter('nationalist_leader').GetFullName] have emerged from the anti-Japanese war with incompatible claims to China's future. Railways, arsenals, cities, and villages are now the prize."
  chinese_civil_war.1.f: "The truce talks never stopped the columns from moving. Men who had fought Japan yesterday now counted cartridges for a different war."
  chinese_civil_war.1.a: "There can be only one China."
  chinese_civil_war.2.t: "The Manchurian Question"
  chinese_civil_war.2.d: "Soviet occupation forces in Manchuria control Japanese stockpiles, rail hubs, and the industrial shell of Manchukuo. What Moscow leaves behind may decide the Chinese Civil War."
  chinese_civil_war.2.f: "The manifests were written in several hands. Rifles, machine tools, locomotives, medical stores; nothing here was merely cargo."
  chinese_civil_war.2.a: "Turn the arsenals over to the Communists."
  chinese_civil_war.2.b: "Offer advisors, but keep the handover limited."
  chinese_civil_war.2.c: "Avoid a rupture with Nanjing."
  chinese_civil_war.3.t: "The War Changes Shape"
  chinese_civil_war.3.d: "What began as a struggle of base areas, rail corridors, and improvised field armies is becoming a test of national command."
  chinese_civil_war.3.f: "Maps that once showed raids and zones of influence now showed encirclements."
  chinese_civil_war.3.a: "Commit the reserves."
  chinese_civil_war.4.t: "Advisors in the Northeast"
  chinese_civil_war.4.d: "Soviet officers and technicians have offered advice on captured Japanese equipment in Manchuria."
  chinese_civil_war.4.f: "The translator paused over technical words that had no easy equivalent. The meaning was clear enough: make the railways run and the guns fire."
  chinese_civil_war.4.a: "Integrate their lessons."
  chinese_civil_war.4.b: "Keep the movement self-reliant."
  chinese_civil_war.5.t: "Land to the Tiller"
  chinese_civil_war.5.d: "Cadres report that land reform is winning village support, but the process risks excesses that could haunt the revolution."
  chinese_civil_war.5.f: "A landlord's ledger, a peasant's receipt, a rifle leaning against a mud wall; all three seemed to describe the same country."
  chinese_civil_war.5.a: "Press the reform forward."
  chinese_civil_war.5.b: "Temper the campaign."
  chinese_civil_war.6.t: "The Manchurian Bureau"
  chinese_civil_war.6.d: "Gao Gang and the Northeast cadres can turn Manchuria into a disciplined rear area, provided the center accepts their autonomy."
  chinese_civil_war.6.f: "The factories had names from another empire, but the workers at their gates wanted to know who would pay wages tomorrow."
  chinese_civil_war.6.a: "Give the Northeast room to organize."
  chinese_civil_war.6.b: "Keep Soviet liaison close."
  chinese_civil_war.7.t: "The Gold Yuan Crisis"
  chinese_civil_war.7.d: "Nationalist currency reform has not quieted inflation. Soldiers, merchants, and civil servants all demand an answer."
  chinese_civil_war.7.f: "The new notes looked cleaner than the old ones. That was the only thing about them anyone trusted."
  chinese_civil_war.7.a: "Impose emergency controls."
  chinese_civil_war.7.b: "Fund the army first."
  chinese_civil_war.8.t: "An Island Contingency"
  chinese_civil_war.8.d: "Chen Cheng and the Taiwan command warn that the island must be prepared before it is needed, not after."
  chinese_civil_war.8.f: "Crates were labeled as office supplies, archives, gold, machine parts. Everyone knew some labels were lies."
  chinese_civil_war.8.a: "Strengthen the field armies."
  chinese_civil_war.8.b: "Prepare Taiwan quietly."
  chinese_civil_war.9.t: "Retreat to Taipei"
  chinese_civil_war.9.d: "The mainland position is beginning to fail. The government can relocate its ministries and reserves to Taiwan while the armies continue the fight, or keep the national center exposed on the mainland."
  chinese_civil_war.9.f: "The harbor lights burned late. Some boarded with orders, some with families, and some with neither."
  chinese_civil_war.9.a: "Prepare the government on Taiwan."
  chinese_civil_war.9.b: "No retreat from the mainland."
  chinese_civil_war.10.t: "One China Victorious"
  chinese_civil_war.10.d: "The Chinese Civil War has ended in mainland victory. The institutions, armies, and promises forged in war must now govern a wounded country."
  chinese_civil_war.10.f: "The last communiques spoke of liberation, restoration, order, and betrayal. The people mostly asked when the trains would run."
  chinese_civil_war.10.a: "A new era begins."
  chinese_civil_war.11.t: "The Republic on Taiwan"
  chinese_civil_war.11.d: "The Nationalist government has withdrawn to Taiwan. What remains is smaller, harsher, and more defensible."
  chinese_civil_war.11.f: "Taipei was no longer a provincial capital. It was a promise, a bunker, and a question."
  chinese_civil_war.11.a: "Regroup and endure."
  chinese_civil_war.12.t: "Manchuria Opens"
  chinese_civil_war.12.d: "Soviet withdrawal has left the Communists in a position to organize Manchuria's railways, workshops, and arsenals."
  chinese_civil_war.12.f: "Every depot ledger was a campaign plan in disguise."
  chinese_civil_war.12.a: "This changes the war."
  chinese_civil_war.13.t: "Nanjing Protests"
  chinese_civil_war.13.d: "The Soviet handover in Manchuria has shaken Nationalist confidence and strained an already overextended front."
  chinese_civil_war.13.f: "Diplomatic notes moved faster than ammunition trains, and did less."
  chinese_civil_war.13.a: "We must answer on the battlefield."
  chinese_civil_war.14.t: "Armistice Proposal"
  chinese_civil_war.14.d: "The front has hardened and victory is no longer immediate. An armistice could freeze the war before another campaign ruins what remains of China."
  chinese_civil_war.14.f: "The draft used careful words: ceasefire, commission, prisoners, borders. No one wrote surrender."
  chinese_civil_war.14.a: "Send the proposal."
  chinese_civil_war.14.b: "No. The next campaign will decide it."
  chinese_civil_war.15.t: "A Chinese Armistice?"
  chinese_civil_war.15.d: "Our enemies have proposed an armistice along the current lines. Accepting would spare lives and preserve our position, but it would also leave the rival Chinese state intact."
  chinese_civil_war.15.f: "The messenger did not look relieved to carry peace. Peace, too, could be dangerous."
  chinese_civil_war.15.a: "Accept the ceasefire."
  chinese_civil_war.15.b: "Reject it. The war continues."
  chinese_civil_war.16.t: "Armistice in the Chinese Civil War"
  chinese_civil_war.16.d: "The guns are falling silent. The Chinese Civil War has paused under an armistice, leaving two governments to claim China across a guarded frontier while Tibet stands outside the settlement as an independent state."
  chinese_civil_war.16.f: "For the first night in months, railway stations heard more coughing than artillery."
  chinese_civil_war.16.a: "This is survival, not surrender."
  chinese_civil_war.17.t: "Armistice Rejected"
  chinese_civil_war.17.d: "The proposed armistice has been rejected. Both sides now return to the battlefield knowing the next opportunity for compromise may come only after disaster."
  chinese_civil_war.17.f: "The unsigned paper stayed on the table, gathering dust beside the casualty reports."
  chinese_civil_war.17.a: "Then the campaign resumes."
