l_english:
 # Objectives
 objective_cwp_western_bloc: "The Free World"
 objective_cwp_western_bloc_desc: "Rebuild from the ruins of the Second World War around free elections and open markets, bind the democracies together in a common defense, and prove that prosperity and liberty, not revolution, are the future. Your ultimate goal is to lead the strongest bloc on Earth."
 objective_cwp_western_bloc_idle_header: "Hold the line"
 objective_cwp_western_bloc_idle_hint: "More challenges will appear eventually"
 objective_cwp_western_bloc_name_USA: "#v $USA$#!"
 objective_cwp_western_bloc_desc_USA: "#lore The only power to emerge from the war richer than it entered, the United States holds the atomic bomb and half of the world's industrial output. Whether it returns to isolation or underwrites a new world order is a choice for this generation.#!"
 objective_cwp_western_bloc_name_GBR: "#v $GBR$#!"
 objective_cwp_western_bloc_desc_GBR: "#lore Victorious but nearly bankrupt, Britain still governs a quarter of the world's people. Attlee's government must build a welfare state at home while deciding how much of the Empire it can afford to keep.#!"
 objective_cwp_western_bloc_name_FRA: "#v $FRA$#!"
 objective_cwp_western_bloc_desc_FRA: "#lore Liberated but humiliated, France is drafting a new constitution and trying to restore its empire from Indochina to Algeria. Its place among the great powers will have to be earned again.#!"
 objective_cwp_western_bloc_name_ITA: "#v $ITA$#!"
 objective_cwp_western_bloc_desc_ITA: "#lore Italy must choose between monarchy and republic, between Christian Democrats and the largest Communist Party in the West. Its road to the Western camp runs through the ballot box.#!"

 objective_cwp_eastern_bloc: "Workers of the World"
 objective_cwp_eastern_bloc_desc: "Secure the revolution under the leadership of the party, replace the market with the plan, and raise a backward country into an industrial power. Bind the fraternal socialist states together until the socialist camp is the strongest bloc on Earth."
 objective_cwp_eastern_bloc_idle_header: "Continue building socialism"
 objective_cwp_eastern_bloc_idle_hint: "More challenges will appear eventually"
 objective_cwp_eastern_bloc_name_RUS: "#v $RUS$#!"
 objective_cwp_eastern_bloc_desc_RUS: "#lore The Soviet Union broke the Wehrmacht at a cost of more than twenty million dead. Its armies now stand on the Elbe, and Stalin means to turn that victory into a security belt of friendly states and a fourth Five-Year Plan.#!"
 objective_cwp_eastern_bloc_name_PRC: "#v $PRC$#!"
 objective_cwp_eastern_bloc_desc_PRC: "#lore From their base areas in the north, Mao Zedong's Communists face the Nationalists in a renewed civil war. Victory would bring a quarter of humanity into the socialist camp.#!"
 objective_cwp_eastern_bloc_name_POL: "#v $POL$#!"
 objective_cwp_eastern_bloc_desc_POL: "#lore Shifted westward and governed by a Provisional Government of National Unity, Poland is rebuilding Warsaw from rubble while the Communists and Mikołajczyk's Peasant Party contest its future.#!"
 objective_cwp_eastern_bloc_name_CZH: "#v $CZH$#!"
 objective_cwp_eastern_bloc_desc_CZH: "#lore Czechoslovakia's Communists won the largest share of the vote of any party in the 1946 election. The question is whether they will share power in a democracy or take all of it.#!"

 objective_cwp_non_aligned_bloc: "Non-Alignment"
 objective_cwp_non_aligned_bloc_desc: "Refuse to take sides in the quarrel between Washington and Moscow. Secure your independence, reform the land, educate your people, and gather the newly free nations into a movement strong enough to keep both superpowers at arm's length."
 objective_cwp_non_aligned_bloc_idle_header: "Stay the course"
 objective_cwp_non_aligned_bloc_idle_hint: "More challenges will appear eventually"
 objective_cwp_non_aligned_bloc_name_YUG: "#v $YUG$#!"
 objective_cwp_non_aligned_bloc_desc_YUG: "#lore Tito's Partisans liberated Yugoslavia largely by their own efforts, and they owe Moscow less than any other Communist party in Europe. That independence may yet become a foreign policy of its own.#!"
 objective_cwp_non_aligned_bloc_name_HND: "#v $HND$#!"
 objective_cwp_non_aligned_bloc_desc_HND: "#lore Independence is near, but the subcontinent is divided between Congress and the Muslim League. Nehru dreams of a sovereign India that belongs to neither bloc.#!"
 objective_cwp_non_aligned_bloc_name_EGY: "#v $EGY$#!"
 objective_cwp_non_aligned_bloc_desc_EGY: "#lore Nominally independent, Egypt still hosts British troops along the Suez Canal. A generation of young officers resents both the King and the foreigners who keep him on his throne.#!"
 objective_cwp_non_aligned_bloc_name_IDS: "#v $IDS$#!"
 objective_cwp_non_aligned_bloc_desc_IDS: "#lore Sukarno and Hatta proclaimed independence in August 1945, but the Netherlands has returned to reclaim its colony. The republic must first win its freedom before it can choose its friends.#!"

 # Shared
 je_cwp_obj_start_tt: "Begins when this objective is chosen"
 je_cwp_obj_bloc_members_4_tt: "Our [concept_power_bloc] has at least #v 4#! members"
 je_cwp_obj_bloc_members_6_tt: "Our [concept_power_bloc] has at least #v 6#! members"
 je_cwp_obj_bloc_members_8_tt: "Our [concept_power_bloc] has at least #v 8#! members"

 # Western bloc
 je_cwp_obj_west_free_elections: "Free and Fair Elections"
 je_cwp_obj_west_free_elections_reason: "The war was fought against dictatorship. If we are to speak for the free world, our own government must answer to the voters."
 je_cwp_obj_west_reconstruction: "Postwar Reconstruction"
 je_cwp_obj_west_reconstruction_reason: "Factories stand idle, cities lie in ruins and soldiers are coming home to look for work. Hunger and unemployment are the Communists' best recruiters, so recovery is the first line of defense."
 je_cwp_obj_west_reconstruction_gdp_tt: "Our [concept_gdp] has grown by half since this goal began"
 je_cwp_obj_west_collective_security: "Collective Security"
 je_cwp_obj_west_collective_security_reason: "No democracy could stand alone against the Axis, and none will stand alone against the next threat. We need allies bound by treaty, not by goodwill."
 je_cwp_obj_west_affluent_society: "The Affluent Society"
 je_cwp_obj_west_affluent_society_reason: "Cars, refrigerators, television sets and a university place for those who earn it: the best argument against revolution is a working class that has something to lose."
 je_cwp_obj_west_great_power: "Great Power Status"
 je_cwp_obj_west_great_power_reason: "The postwar order is being drawn up by the great powers. If we want a say in it, we must count among them."
 je_cwp_obj_west_alliance_of_free_nations: "An Alliance System"
 je_cwp_obj_west_alliance_of_free_nations_reason: "A handful of allies is a pact. A broad community of nations, sharing markets, bases and intelligence, is a bloc that can outlast the Soviet one."
 je_cwp_obj_west_leader_free_world: "Leader of the Free World"
 je_cwp_obj_west_leader_free_world_reason: "Democracy, prosperity and the strongest alliance in the world: hold all three at once, and the Western way of life will have won the argument."

 # Eastern bloc
 je_cwp_obj_east_vanguard_party: "The Vanguard Party"
 je_cwp_obj_east_vanguard_party_reason: "Bourgeois parliaments only divide the working class. The revolution needs one party, disciplined and united, to lead it."
 je_cwp_obj_east_planned_economy: "Central Planning"
 je_cwp_obj_east_planned_economy_reason: "As long as factories belong to private owners, they will be run for profit and not for need. The commanding heights of the economy must pass into the hands of the people."
 je_cwp_obj_east_collectivization: "Collectivization"
 je_cwp_obj_east_collectivization_reason: "Millions of small plots cannot feed an industrial nation. The land must be gathered into collective farms, worked with tractors and planned like any factory."
 je_cwp_obj_east_five_year_plan: "The Five-Year Plan"
 je_cwp_obj_east_five_year_plan_reason: "Steel, coal, electricity and machines: every target met is proof that the plan can outbuild the capitalists."
 je_cwp_obj_east_five_year_plan_gdp_tt: "Our [concept_gdp] has grown by half since this goal began"
 je_cwp_obj_east_literacy_campaign: "Liquidate Illiteracy"
 je_cwp_obj_east_literacy_campaign_reason: "A worker who cannot read cannot run a machine, study Marx or build socialism. Schools, reading rooms and evening classes must reach every village."
 je_cwp_obj_east_fraternal_states: "The Socialist Camp"
 je_cwp_obj_east_fraternal_states_reason: "Socialism in one country was a necessity. Socialism across a whole camp of fraternal states, bound by mutual aid and common defense, is security."
 je_cwp_obj_east_socialist_world: "The World Socialist System"
 je_cwp_obj_east_socialist_world_reason: "One party, one plan and the strongest bloc in the world. History is on our side, and now it can be seen to be."

 # Non-Aligned
 je_cwp_obj_nam_sovereignty: "Full Sovereignty"
 je_cwp_obj_nam_sovereignty_reason: "We did not throw off one master to accept another. Our foreign policy must be made in our own capital and nowhere else."
 je_cwp_obj_nam_land_reform: "Land to the Tiller"
 je_cwp_obj_nam_land_reform_reason: "As long as landlords own the fields and peasants owe them rent, independence means little in the countryside. The land must belong to those who work it."
 je_cwp_obj_nam_development: "The Development Decade"
 je_cwp_obj_nam_development_reason: "Dams, steel mills and power stations are the temples of a new nation. We must double what our economy produces, with whatever aid we can win from either side."
 je_cwp_obj_nam_development_gdp_tt: "Our [concept_gdp] has doubled since this goal began"
 je_cwp_obj_nam_schools: "A School in Every Village"
 je_cwp_obj_nam_schools_reason: "Colonial rule kept our people illiterate. A free people needs teachers, books and a generation able to govern itself."
 je_cwp_obj_nam_between_the_blocs: "Positive Neutralism"
 je_cwp_obj_nam_between_the_blocs_reason: "Friendship with both superpowers, and dependence on neither, gives us the freedom to take aid from each without paying with our independence."
 je_cwp_obj_nam_lead_the_movement: "Leadership of the Non-Aligned"
 je_cwp_obj_nam_lead_the_movement_reason: "One newly independent nation is easily pressured. Together, the nations that refuse both blocs can speak with a voice the superpowers must hear."
 je_cwp_obj_nam_third_way: "Non-Alignment"
 je_cwp_obj_nam_third_way_reason: "Independent, respected by both superpowers and at the head of a bloc of free nations: we have shown that the world need not be divided in two."

