l_english:

###############################
### Production Technologies ###
###############################

# Era 1:
  industrial_revolution: "Industrial Revolution"
  industrial_revolution_desc: "The Industrial Revolution moved manufacturing from the workshop to the powered factory. Coal, steel and heavy engineering still decide a nation's war potential and the pace of its reconstruction."
  
  industrial_chemistry: "Industrial Chemistry"
  industrial_chemistry_desc: "The great chemical combines of the interwar years, such as IG Farben, ICI and Du Pont, turned coal, salt, air and water into acids, alkalis, dyes, fertilizers and explosives. A modern economy needs a chemical industry of its own to clothe, feed and arm itself."

  petroleum_refining: "Petroleum Refining"
  petroleum_refining_desc: "Refineries separate crude oil by distillation and crack its heavier fractions into gasoline, diesel, kerosene and fuel oil. Catalytic cracking, commercialized by Eugène Houdry in 1937, supplied much of the Allies' high-octane aviation fuel."
  
  railway_system: "Railway System"
  railway_system_desc: "Rail carries most of the world's freight and long-distance passengers. The war wrecked bridges, yards and rolling stock across Europe and Asia, and diesel and electric locomotives are beginning to replace steam."
  
  machine_tooling: "Machine Tooling"
  machine_tooling_desc: "Lathes, mills, drills and grinders are the machines that make every other machine. Precise, interchangeable parts cut by skilled machinists turned wartime production into a science, and no industry can grow faster than its tool shops."
  
  refrigeration: "Refrigeration"
  refrigeration_desc: "Mechanical refrigeration lets meat, dairy and produce travel across continents and keep for weeks in a shop. Cold stores, refrigerated rail cars and the home refrigerator are changing what ordinary families eat."
  
  mass_electrification: "Mass Electrification"
  mass_electrification_desc: "Electrification brings reliable power to factories, farms and homes through national grids fed by coal stations and hydroelectric dams. The Soviet GOELRO plan of 1920 and the Tennessee Valley Authority of 1933 made it a central aim of state economic policy."
  
  industrial_metallurgy: "Industrial Metallurgy"
  industrial_metallurgy_desc: "Blast furnaces, open-hearth works and electrolytic smelters make the steel of tanks and bridges and the aluminum of aircraft on an enormous scale. Steel output is still the standard measure of a country's industrial strength."
  
  synthetic_polymers: "Synthetic Polymers"
  synthetic_polymers_desc: "Nylon, polyethylene, synthetic rubber and other plastics came out of the laboratories of the 1930s and the wartime drive to replace scarce natural materials. Made from oil, coal and chemical feedstocks, they can stand in for silk, rubber, glass and metal in thousands of products."
  
  mechanized_oil_and_gas_extraction: "Mechanized Oil & Gas Extraction"
  mechanized_oil_and_gas_extraction_desc: "Powered drilling rigs, rotary bits and steel well casings reach oil and gas reservoirs that hand methods could never touch. Natural gas, once flared away as a nuisance, is now captured and piped as a fuel in its own right."
  
  catalytic_cracking: "Catalytic Cracking"
  catalytic_cracking_desc: "Passing heavy oil over a hot catalyst breaks long hydrocarbon chains into lighter, more valuable fractions. The fluid catalytic cracker, first run at Baton Rouge in 1942, gets far more high-octane gasoline from each barrel of crude than heat alone."
  
  # combustion_engine: "Combustion Engine"
  # combustion_engine_desc: "TBD"
  
  vacuum_tubes: "Vacuum Tubes"
  vacuum_tubes_desc: "Glass valves that control the flow of electrons make radio, radar, television and the first electronic calculators possible. Fragile and power-hungry though they are, vacuum tubes sit at the heart of every electronic device of the age."
  
  # chemical_synthesis: "Chemical Synthesis"
  # chemical_synthesis_desc: "TBD"
  
  industrial_shaft_mining: "Industrial Shaft Mining"
  industrial_shaft_mining_desc: "Electric hoists, pneumatic drills, mechanical loaders and powered ventilation allow mines to be sunk deeper and worked faster than ever before. Coal, ores and uranium flow to the surface in quantities pick-and-shovel labor could never match."
 
  agricultural_mechanization: "Agricultural Mechanization"
  agricultural_mechanization_desc: "The tractor, the combine harvester and the motor truck let a farm family work far more land with far fewer hired hands. Mechanized farms produce more food with less labor and release workers to the factories and cities."
  
  # automobiles: "Automobiles"
  # automobiles_desc: "TBD"
  
  production_assembly_line: "Production Assembly Line"
  production_assembly_line_desc: "Breaking manufacture into simple, repeated steps along a moving line, as Ford did at Highland Park in 1913, made the mass production of cars, aircraft and weapons possible. Powered tools at every station push output per worker higher still."
  
  industrial_pneumatics_and_hydraulics: "Industrial Pneumatics & Hydraulics"
  industrial_pneumatics_and_hydraulics_desc: "Compressed air and pressurized fluid drive presses, clamps, lifts and valves with great force and fine control. Pneumatic and hydraulic systems mechanize heavy handling work in factories, refineries and rail yards alike."
  
  household_appliances: "Household Appliances"
  household_appliances_desc: "Electric refrigerators, washing machines, vacuum cleaners and cookers cut the hours spent on housework. Owning them is a mark of middle-class comfort, and demand grows with every rise in household income."
  
  mechanical_computers: "Mechanical Computers"
  mechanical_computers_desc: "Electromechanical relays, punched cards and the first room-sized electronic calculators were built to break codes and compute artillery tables. Governments and large firms now put them to work on census returns, payrolls and scientific problems."
  
  gas_turbine_power_plant: "Gas Turbine Power Plant"
  gas_turbine_power_plant_desc: "A gas turbine burns oil or natural gas to drive a generator directly and can start up within minutes. The first gas turbine power station opened at Neuchâtel in Switzerland in 1939, and improved water turbines raise the output of existing dams."
  
  electric_arc_furnace: "Electric Arc Furnace"
  electric_arc_furnace_desc: "An electric arc struck between graphite electrodes can melt scrap steel without the coke and iron ore of a blast furnace. Smaller, cheaper and more flexible, arc furnaces let steelmaking spread beyond the great integrated works."

# Era 2:
  intensive_fertilizer: "Intensive Fertilizer"
  intensive_fertilizer_desc: "The Haber-Bosch process fixes nitrogen from the air to make cheap ammonia fertilizer, and synthetic pesticides and high-yielding seed varieties add to its effect. Together they can double or triple what a field produces, at a cost to soil and water."

  chemical_batteries: "Chemical Batteries"
  chemical_batteries_desc: "Improved dry cells and rechargeable chemical batteries store electrical energy in a compact, portable form. They power radios, flashlights, field equipment and a growing range of devices cut loose from the wall socket."

  polyester: "Polyester"
  polyester_desc: "First spun in the 1940s, polyester fibers resist creasing, shrinking and wear far better than natural cloth. Blended with cotton or worn on their own, they are reshaping the clothing industry and the wardrobes of ordinary people."

  industrial_kraft_pulping: "Industrial Kraft Pulping"
  industrial_kraft_pulping_desc: "The kraft process cooks wood chips in caustic chemicals to produce strong pulp from almost any timber, while recovering most of the chemicals for reuse. It supplies the paper, cardboard and packaging a consumer economy consumes in ever larger amounts."

  silicone_rubber: "Silicone Rubber"
  silicone_rubber_desc: "Silicone elastomers stay flexible in extreme heat and cold and resist oil, ozone and age. Seals, insulation and specialty fabrics made from them find uses from jet aircraft to textile mills."

  inorganic_synthesis: "Inorganic Synthesis"
  inorganic_synthesis_desc: "New catalysts and high-pressure processes make it possible to manufacture precise compounds and high-performance polymers at industrial scale. The same chemistry yields better plastics, stronger explosives and more productive chemical plants."

  offshore_extraction: "Offshore Extraction"
  offshore_extraction_desc: "Fixed steel platforms anchored in shallow coastal waters open the oil and gas fields beneath the continental shelf. Offshore production frees a nation from relying solely on its onshore reserves."

  hydraulic_fracking: "Hydraulic Fracking"
  hydraulic_fracking_desc: "Pumping fluid at high pressure into rock fractures the formation and releases trapped oil and gas, while waterflooding pushes more crude toward the wells. Pipelines carry the increased output to refineries and consumers."

  high_octane_blending: "High-Octane Blending"
  high_octane_blending_desc: "Blending and treating gasoline to raise its octane rating lets engines run at higher compression and greater power without knocking. Better fuels also open the way for diesel-electric locomotives to replace steam on the railways."

  bucket_wheel_excavators: "Bucket-Wheel Excavators"
  bucket_wheel_excavators_desc: "Giant rotating wheels of steel buckets strip away earth and coal in open-pit mines at a rate of thousands of tonnes an hour. Among the largest machines ever built, they make surface mining of low-grade deposits profitable."

  industrial_fermentation: "Industrial Fermentation"
  industrial_fermentation_desc: "Controlled fermentation in large steel vessels, followed by continuous column distillation, turns grain and sugar into spirits and industrial alcohol on a factory scale. The same techniques are basic to food processing and the pharmaceutical industry."

  mechanized_forestry: "Mechanized Forestry"
  mechanized_forestry_desc: "Gasoline chainsaws, tracked skidders and logging trucks replace the axe, the crosscut saw and the horse team. A small crew can now fell and haul timber that once took a whole lumber camp."

  automotive_industry: "Automotive Industry"
  automotive_industry_desc: "Car makers turn out family cars, trucks and buses on dedicated lines, and higher-compression engines make them faster and more economical. Each year more households can afford a private motor car."

  conveyor_belt: "Conveyor Belt"
  conveyor_belt_desc: "Continuous conveyors carry parts, packages and raw materials automatically through every stage of production. Linking machines together cuts handling labor and keeps the whole factory moving at the pace of the line."

  # gantry_cranes: "Gantry Cranes"
  # gantry_cranes_desc: "TBD"

  streamlined_furnishings: "Streamlined Furnishings"
  streamlined_furnishings_desc: "Molded plywood, tubular steel and new plastics let furniture be designed for mass production, as Marcel Breuer's steel chairs and Alvar Aalto's bent plywood showed before the war. Light, simple pieces suit small modern apartments and new suburban houses."

  solid_state_electronics: "Solid-State Electronics"
  solid_state_electronics_desc: "Advances in electronic circuitry bring television sets, electronic appliances and the first commercial mainframe computers into production. Electronics is moving out of the laboratory and the military into the living room and the office."

  civil_nuclear_power: "Civil Nuclear Power"
  civil_nuclear_power_desc: "A nuclear reactor sustains a controlled chain reaction, first achieved in Chicago in 1942, and uses the heat to raise steam for a generator. A little uranium replaces enormous quantities of coal, and utility-scale wind turbines join the grid as well."

  oxygen_steelmaking_process: "Oxygen Steelmaking Process"
  oxygen_steelmaking_process_desc: "Blowing pure oxygen through molten pig iron turns it into steel in under an hour, against many hours in an open-hearth furnace. Basic oxygen converters need less fuel and labor and are smaller and cheaper to build."

  float_glass: "Float Glass"
  float_glass_desc: "Pouring molten glass onto a bath of molten tin produces sheets that are flat and smooth on both sides without grinding or polishing. Float glass makes large plate windows cheap enough for ordinary buildings and cars."

  modern_food_packaging: "Modern Food Packaging"
  modern_food_packaging_desc: "Automated sorting, sealed cans, plastic films and insulated containers keep food fresh from the factory to the kitchen table. Packaging allows processed food to be shipped and stored on a national scale."

  containerization: "Containerization"
  containerization_desc: "Standard steel boxes that move unopened between ship, truck and train cut loading times from days to hours and greatly reduce the cost of shipping. Ports built around container cranes replace the crowded docks of the break-bulk trade."

  transistors: "Transistors"
  transistors_desc: "The transistor does the work of a vacuum tube in a sliver of semiconductor, using a fraction of the power and almost never burning out. Mounted on printed circuit boards, it becomes the basic building block of modern electronics."

  mechanical_process_control: "Mechanical Process Control"
  mechanical_process_control_desc: "Centralized control rooms with analog instruments, pneumatic regulators and feedback loops let a handful of operators run an entire refinery, steel mill or chemical works. Processes once guided by eye and hand now run steadily to precise settings."

# Era 3:
  no_tillage_agriculture: "No-Tillage Agriculture"
  no_tillage_agriculture_desc: "Planting directly into the stubble of the last crop, without plowing, saves soil, water, fuel and labor. Powerful self-propelled machinery and herbicides make no-till farming practical on large fields."

  alkaline_batteries: "Alkaline Batteries"
  alkaline_batteries_desc: "Alkaline cells last several times longer than older zinc-carbon batteries and deliver steady power under heavy load. They fuel the boom in portable radios, cameras, toys and household gadgets."

  carbon_fibers: "Carbon Fibers"
  carbon_fibers_desc: "Threads of almost pure carbon, woven and set in resin, are stronger than steel at a fraction of the weight. Expensive to make, carbon fiber goes first into aircraft and rockets and later into sporting goods and industry."

  alkaline_papermaking: "Alkaline Papermaking"
  alkaline_papermaking_desc: "Making paper under neutral or alkaline conditions with mineral fillers produces stronger, brighter sheets that do not yellow and crumble with age. Mills save fiber and chemicals, and the paper lasts far longer."

  bulk_petrochemical_production: "Bulk Petrochemical Production"
  bulk_petrochemical_production_desc: "Vast integrated complexes crack oil and gas into ethylene, propylene and other building blocks by the million tonnes. They feed plastics, solvents, fertilizers and explosives, making petrochemicals the core of the modern chemical industry."

  semi_submersible_platforms: "Semi-Submersible Platforms"
  semi_submersible_platforms_desc: "Floating platforms held steady by submerged pontoons and anchors can drill and produce in waters too deep for fixed structures. Combined with enhanced recovery techniques, they extend the life and reach of offshore fields."

  long_distance_pipelines: "Long-Distance Pipelines"
  long_distance_pipelines_desc: "High-pressure trunk lines carry oil and gas thousands of kilometers from remote fields to distant markets. The wartime Big Inch line moved Texas crude to the US East Coast out of reach of U-boats, and in peacetime a pipeline's route is often a political decision."

  ethanol_fuels: "Ethanol Fuels"
  ethanol_fuels_desc: "Alcohol distilled from sugar cane or grain can be burned in engines alone or blended with gasoline. For countries short of oil but rich in farmland, ethanol promises a measure of energy independence."

  tunnel_boring: "Tunnel Boring"
  tunnel_boring_desc: "Rotary boring machines and safer, more controlled blasting techniques drive shafts and galleries through hard rock quickly and with fewer accidents. Mines reach deeper deposits at lower cost."

  specialized_forestry_machinery: "Specialized Forestry Machinery"
  specialized_forestry_machinery_desc: "Feller bunchers and whole-tree harvesting systems cut, gather and stack trees in one operation. Logging becomes a heavy-machine industry run by a handful of skilled operators."

  synthetic_food_additives: "Synthetic Food Additives"
  synthetic_food_additives_desc: "Preservatives, emulsifiers, colorings and flavorings made in the laboratory extend shelf life and make processed foods look and taste uniform. Continuous-flow processing lines turn out packaged food in enormous quantities."

  transverse_engines: "Transverse Engines"
  transverse_engines_desc: "Mounting the engine sideways across the front of the car frees up interior space and makes small front-wheel-drive cars practical. Numerically controlled machining produces the precise parts the new designs require."

  articulated_industrial_robot: "Articulated Industrial Robot"
  articulated_industrial_robot_desc: "Multi-jointed robot arms that repeat a programmed motion without tiring can weld car bodies and handle hot castings. They take over some of the most dangerous and monotonous work in the factory."

  intermodal_logistics: "Intermodal Logistics"
  intermodal_logistics_desc: "Coordinating ships, trains and trucks around the standard container lets goods move from factory gate to customer without being handled. Purpose-built container ships and prefabricated sections lower costs across the supply chain."

  industrialized_fishing: "Industrialized Fishing"
  industrialized_fishing_desc: "Purse seines, powered winches, echo sounders and freezing plants let fleets find, catch and preserve whole shoals of fish at once. Catches rise steeply, and with them the risk of overfishing."

  high_speed_rail: "High-Speed Rail"
  high_speed_rail_desc: "Dedicated electrified lines and streamlined trains running at over 200 kilometers an hour make rail competitive with air travel between cities a few hundred kilometers apart. The lines are costly to build but carry large numbers of passengers quickly."

  ergonomic_design: "Ergonomic Design"
  ergonomic_design_desc: "Designing furniture, tools and workplaces around the human body reduces fatigue and injury while raising productivity. Office chairs, desks and kitchens are reshaped by careful study of how people actually work and live."

  monolithic_integrated_circuit: "Monolithic Integrated Circuit"
  monolithic_integrated_circuit_desc: "Building many transistors and their connections on a single chip of silicon shrinks whole circuits to the size of a fingernail. With each advance in manufacturing more components fit on a chip, and electronics grow smaller, cheaper and more reliable."

  heavy_industrial_process_automation: "Heavy Industrial Process Automation"
  heavy_industrial_process_automation_desc: "Distributed control systems and computerized instruments supervise furnaces, refineries and chemical reactors continuously. Plants run closer to their limits with less waste, fewer accidents and fewer operators."

  oxygen_concentrators: "Oxygen Concentrators"
  oxygen_concentrators_desc: "Equipment that separates oxygen from air on site supplies steel converters, glass furnaces and smelters with the pure oxygen they consume in bulk. Improved carbon anodes raise the efficiency of aluminum smelting at the same time."

  variety_plastics: "Variety Plastics"
  variety_plastics_desc: "Engineering plastics with tailored strength, heat resistance and flexibility can replace metal, glass and wood in thousands of products. The same polymer chemistry gives the armed forces stable, moldable explosives."

  biofuel_refining: "Biofuel Refining"
  biofuel_refining_desc: "Large industrial distilleries turn sugar and grain into fuel ethanol continuously and efficiently. Biofuel production becomes an industry of its own, closely tied to agricultural policy and the price of oil."

  full_conversion_refining: "Full-Conversion Refining"
  full_conversion_refining_desc: "Hydrocracking and deep conversion units break down even the heaviest residues into light, valuable fuels. A modern refinery leaves almost nothing of the barrel unused."

  intensive_factory_farming: "Intensive Factory Farming"
  intensive_factory_farming_desc: "Livestock kept indoors in large numbers on concentrated feed grow faster and cost less to raise. Cheap meat, eggs and milk fill the shops, at the price of manure pollution, heavy antibiotic use and complaints about animal welfare."

  compact_vehicles: "Compact Vehicles"
  compact_vehicles_desc: "Small, fuel-efficient cars built with computer-integrated machining suit crowded city streets and high fuel prices. They sell best wherever gasoline is heavily taxed or oil is expensive."

  lean_manufacturing: "Lean Manufacturing"
  lean_manufacturing_desc: "Lean production cuts waste, keeps inventories to a minimum and makes every worker responsible for quality. Parts arrive just in time for use, and the line is improved in small steps by the people who work on it."

  industrial_lasers: "Industrial Lasers"
  industrial_lasers_desc: "Concentrated beams of light cut, weld and engrave metal, plastic and fabric with unmatched precision. Lasers move from physics laboratories onto the factory floor."

  factory_trawlers: "Factory Trawlers"
  factory_trawlers_desc: "Large stern trawlers that haul their nets up a ramp and process, fillet and freeze the catch on board can stay at sea for months. Distant-water fleets now fish the oceans of the world far from their home ports."

  home_media_devices: "Home Media Devices"
  home_media_devices_desc: "Cassette players, video recorders and stereo systems bring recorded music and film into the home. Entertainment is no longer bound to the broadcaster's schedule or the cinema's program."

  third_generation_computers: "Third-Generation Computers"
  third_generation_computers_desc: "Computers built from integrated circuits are smaller, faster and cheaper than their transistor predecessors. Minicomputers find their way into laboratories, universities, factories and medium-sized businesses."

  microprocessors: "Microprocessors"
  microprocessors_desc: "An entire central processor on a single chip puts programmable computing into appliances, machines and instruments of every kind. It makes the personal computer possible."

# Era 4:
  genetically_modified_crops: "Genetically Modified Crops"
  genetically_modified_crops_desc: "Inserting genes directly into plants produces crops that resist pests, diseases and herbicides. Seed companies promise higher yields with fewer chemicals; environmental groups and many farmers' organizations question the risks to health, ecosystems and small farms."

  nickel_cadmium_batteries: "Nickel-Cadmium Batteries"
  nickel_cadmium_batteries_desc: "Sealed nickel-cadmium cells can be recharged hundreds of times, making cordless tools and portable electronics practical. Workers are freed from the trailing cable, though the cadmium they contain is toxic."

  conductive_fibers: "Conductive Fibers"
  conductive_fibers_desc: "Fabrics woven with conductive threads can carry current, sense heat or block electromagnetic signals. High-performance textiles find uses in protective clothing, sportswear and military equipment."

  twin_wire_forming_process: "Twin-Wire Forming Process"
  twin_wire_forming_process_desc: "Forming the paper web between two moving wire meshes drains water from both sides at once, allowing much faster machines and more uniform sheets. Paper mills grow in speed and output."

  advanced_chemical_synthesis: "Advanced Chemical Synthesis"
  advanced_chemical_synthesis_desc: "Sophisticated catalysts and tightly controlled reactions produce complex molecules with high purity. The chemical and pharmaceutical industries can now manufacture compounds, including sterile injectable drugs, that were once impossible to make in bulk."

  designer_polymers: "Designer Polymers"
  designer_polymers_desc: "Polymers engineered at the molecular level for a particular task yield specialty compounds, treated fibers and insensitive explosives that are safer to handle and store."

  deep_sea_extraction: "Deep-Sea Extraction"
  deep_sea_extraction_desc: "Tension-leg platforms tethered to the seabed by steel tendons can produce oil and gas in water hundreds of meters deep. Fields beneath the continental slope come within reach."

  geosteering_precision_recovery: "Geosteering & Precision Recovery"
  geosteering_precision_recovery_desc: "Steering the drill bit through the reservoir by real-time measurements, and drilling long horizontal wells, extracts far more oil and gas from each field. Deepwater systems and modern pipelines bring the output to market."

  biodiesel: "Biodiesel"
  biodiesel_desc: "Biodiesel is made by reacting vegetable oils or animal fats with alcohol, and enzymes that break plant matter into fermentable sugars raise the ethanol yield of every tonne of crops. Biofuels come closer to competing on price with fuels made from petroleum."

  deep_subterranean_mining: "Deep Subterranean Mining"
  deep_subterranean_mining_desc: "Computer-aided mine planning and deep-vein extraction techniques reach ore bodies kilometers below the surface. Modeling the rock in advance makes deep mining safer and more productive."

  managed_sustainable_forestry: "Managed Sustainable Forestry"
  managed_sustainable_forestry_desc: "Harvesting no more timber than grows back each year, using cut-to-length machines that leave the forest standing, turns logging into long-term management. Forests become a renewable resource rather than a frontier to be cleared."

  hyperprocessed_foods: "Ultra-Processed Foods"
  hyperprocessed_foods_desc: "Industrial foods engineered for long shelf life, low cost and strong flavor, sealed in aseptic packaging, fill supermarket aisles. Nutritionists link diets high in them to obesity and diabetes."

  bottom_blown_converters: "Bottom-Blown Converters"
  bottom_blown_converters_desc: "Injecting oxygen and gases through the bottom of the converter stirs the molten metal more evenly, improving the quality and yield of steel and glass. Combined with automation, it makes the modern steelworks faster and cleaner."

  lithium_ion_batteries: "Lithium-Ion Batteries"
  lithium_ion_batteries_desc: "Light, powerful and rechargeable, lithium-ion cells store far more energy for their weight than older batteries. They power phones and laptops, make cordless tools practical and open the road to the electric car."

  chemithermomechanical_pulping: "Chemithermomechanical Pulping"
  chemithermomechanical_pulping_desc: "Softening wood chips with chemicals and heat before grinding them yields far more pulp from each tree than chemical pulping alone. Paper mills get strong fiber at lower cost and with less waste."

  universal_barcode_system: "Universal Barcode System"
  universal_barcode_system_desc: "A pattern of printed bars read by a laser scanner identifies every product at the checkout and in the warehouse. High-speed automated packaging and inventory systems are built around the barcode."

  hybrid_vehicles: "Hybrid Vehicles"
  hybrid_vehicles_desc: "Pairing a gasoline engine with an electric motor and battery cuts fuel consumption, especially in city traffic. Together with variable valve timing and lighter bodies, hybrids make the family sedan cleaner and more economical."

  programmable_industrial_robots: "Programmable Industrial Robots"
  programmable_industrial_robots_desc: "Robots that can be reprogrammed by computer for new tasks, guided by computer-aided design, switch quickly between products and models. Flexible automation reaches every branch of manufacturing and even the farm."

  globalized_logistics: "Globalized Logistics"
  globalized_logistics_desc: "Computer-planned shipping networks, ever larger container ships and double-stacked trains move goods around the world at minimal cost. Production can be spread across continents and still arrive on time."

  ultraprecision_measuring: "Ultraprecision Measuring"
  ultraprecision_measuring_desc: "Laser interferometers and electronic gauges measure parts to fractions of a micrometer. Such precision underpins advanced mechatronics, optics and semiconductor equipment."

  composite_glassmaking: "Composite Glassmaking"
  composite_glassmaking_desc: "Laminated and composite glass, combined with new photovoltaic materials and composite blades, opens the way to solar farms and modern wind turbines. Glassmaking becomes part of the energy industry."

  deep_sea_industrial_fishing: "Deep-Sea Industrial Fishing"
  deep_sea_industrial_fishing_desc: "Super trawlers with automated processing lines can catch and freeze hundreds of tonnes of fish a day in the deep ocean. Fishing on this scale can exhaust stocks that once seemed limitless."

  magnetic_levitation_rail: "Magnetic Levitation Rail"
  magnetic_levitation_rail_desc: "Trains suspended and propelled by magnetic fields glide above the track without friction, reaching speeds no wheel-on-rail system can match. Maglev lines cost far more to build than conventional high-speed track."

  self_assembly: "Self-Assembly"
  self_assembly_desc: "Flat-packed furniture that the customer carries home and assembles slashes the costs of transport, storage and labor. Well-designed furniture becomes affordable to students, young families and first-time homeowners."

  video_game_consoles: "Video Game Consoles"
  video_game_consoles_desc: "Dedicated computers built for play, connected to the family television, turn video games from an arcade novelty into a household pastime. Hardware makers and software publishers build a new entertainment industry around them."

  fourth_generation_computers: "Fourth-Generation Computers"
  fourth_generation_computers_desc: "Microprocessor-based personal computers put computing power on the desks of offices, schools and homes. Smart appliances and computer-managed power systems spread the same technology through the whole economy."

  central_processing: "Central Processing Units"
  central_processing_desc: "Ever more powerful central processing units, mounted on standardized circuit boards, become a mass-produced commodity. Performance roughly doubles every couple of years while prices fall."

  computerized_heavy_industrial_processes: "Computerized Heavy Industrial Processes"
  computerized_heavy_industrial_processes_desc: "Computer models and real-time optimization software run refineries, furnaces and chemical plants at peak efficiency around the clock, cutting fuel use, waste and downtime."

  vacuum_arc_remelting: "Vacuum Arc Remelting"
  vacuum_arc_remelting_desc: "Remelting metal under vacuum with an electric arc removes impurities and produces alloys of exceptional purity for aircraft, turbines and reactors. Modern electric arc furnaces and high-amperage smelting cells raise output across the metals industry."

# Era 5:
  designer_chemical_synthesis: "Designer Chemical Synthesis"
  designer_chemical_synthesis_desc: "Chemists design molecules for a precise purpose, from controlled-release medicines to hormone treatments, and manufacture them at industrial scale. Specialty chemicals become one of the most valuable branches of industry."

  autonomous_industrial_robots: "Autonomous Industrial Robots"
  autonomous_industrial_robots_desc: "Robots equipped with sensors and machine intelligence can adapt to their surroundings, inspect their own work and cooperate with human workers. Fully automated production lines need people mainly to supervise and maintain them."

  high_performance_personal_computers: "High-Performance Personal Computers"
  high_performance_personal_computers_desc: "Powerful workstations, servers and pocket-sized smartphones carry more computing power than the mainframes of earlier decades. Digital tools transform research, medicine, energy management and daily life."

  flash_drive_storage: "Flash Drive Storage"
  flash_drive_storage_desc: "Solid-state flash memory stores large amounts of data without moving parts, in chips small enough to fit anywhere. Dense electronic assemblies and complete systems on a single chip follow."


############################
### Society Technologies ###
############################

# Era 1:
  modern_urbanism: "Modern Urbanism"
  modern_urbanism_desc: "Rebuilding bomb-damaged cities and housing the people moving in from the countryside are jobs for professional planners, builders and administrators. Modern urbanism organizes housing, offices, services and public works on a metropolitan scale."

  bus_and_tramways: "Bus & Tramways"
  bus_and_tramways_desc: "Motor buses and electric tramways carry millions of workers between home and workplace each day. Cheap, reliable public transport lets cities grow beyond walking distance of the factory gate."

  # radio: "Radio"
  # radio_desc: "TBD"

  # telephone: "Telephone"
  # telephone_desc: "TBD"

  economic_science: "Economic Science"
  economic_science_desc: "National income accounting and the ideas of John Maynard Keynes give governments tools to measure the economy, manage demand and plan investment. Central banks, chartered companies and a competent tax administration put them into practice."

  # academia: "Academia"
  # academia_desc: "TBD"

  medical_science: "Medical Science"
  medical_science_desc: "Penicillin, sulfa drugs, blood transfusion and mass vaccination transformed military medicine in the last war and are now reaching civilian hospitals. Governments are expected to organize public health and pay for much of it."

  controlled_access_highway: "Controlled-Access Highway"
  controlled_access_highway_desc: "Highways without crossroads or traffic lights, entered only by ramps, let motor traffic travel fast and safely over long distances. Germany's Reichsautobahn and the Pennsylvania Turnpike, opened in 1940, showed how such roads speed both commerce and troops."

  early_highrises: "Early Highrises"
  early_highrises_desc: "Steel frames, elevators and reinforced concrete let office and apartment towers rise dozens of stories. New York's Empire State Building, finished in 1931, stands 102 stories high."

  suburbanization: "Suburbanization"
  suburbanization_desc: "Rising incomes, cheap mortgages and the private car carry families out of crowded city centers into new suburbs of detached houses. Roads, utilities and services must follow them."

  enclosed_arcades: "Enclosed Arcades"
  enclosed_arcades_desc: "Covered arcades, department stores, nightclubs and entertainment venues make the city center a place to spend money and leisure time. Construction firms grow with the demand for new commercial space."

  subterranean_railways: "Subterranean Railways"
  subterranean_railways_desc: "Underground railways move large numbers of people beneath congested streets, quickly and in any weather. London opened the first in 1863, and the Moscow Metro, opened in 1935, was built as a showpiece of Soviet planning."

  civilian_airlines: "Civilian Airlines"
  civilian_airlines_desc: "Surplus wartime transports such as the DC-3 and trained pilots let airlines expand quickly, under rules agreed at the Chicago Convention of 1944. Airports connect capitals and regional centers, carrying passengers, mail and cargo in hours rather than days."

  terrestrial_broadcasting: "Terrestrial Broadcasting"
  terrestrial_broadcasting_desc: "Networks of transmitters bring radio and the new medium of television to the whole country. A broadcaster reaches millions of listeners at once, so governments license, fund or run the networks themselves."

  # macroeconomics: "Macroeconomics"
  # macroeconomics_desc: "TBD"

  international_relations_theory: "International Relations Theory"
  international_relations_theory_desc: "The study of power, diplomacy and international law became a university discipline after the First World War, and E. H. Carr's The Twenty Years' Crisis (1939) argued for studying power as it is. Statesmen draw on it to build alliances, negotiate treaties and manage rivals."

  # antibiotics: "Antibiotics"
  # antibiotics_desc: "TBD"

# Era 2:
  automotive_cities: "Automotive Cities"
  automotive_cities_desc: "Cities redesigned around the private car, with ring roads, parking garages and wide arterial roads, let traffic flow from suburb to center. Urban life is reorganized around the automobile."

  modular_tower_crane: "Modular Tower Crane"
  modular_tower_crane_desc: "Tower cranes assembled from standard sections and raised with the building let construction reach great heights quickly. Their steel masts become a fixture of growing city skylines."

  planned_cities: "Planned Cities"
  planned_cities_desc: "New towns and satellite cities designed from scratch, with housing, industry, green space and services laid out in advance, take in the overflow of crowded metropolises. The idea goes back to Ebenezer Howard's garden cities, such as Letchworth, begun in 1903."

  unified_public_transport_networks: "Unified Public Transport Networks"
  unified_public_transport_networks_desc: "Integrating buses, trams, metros and suburban trains under one authority, with shared timetables and tickets, makes public transport cheaper to run and easier to use. London Transport, formed in 1933, brought the capital's buses, trams and Underground under one board."

  automated_telephone_switchboard: "Automated Telephone Switchboard"
  automated_telephone_switchboard_desc: "Electromechanical exchanges connect calls automatically when the subscriber dials a number, without an operator. The telephone network can grow to serve millions of users."

  vertical_organization: "Vertical Organization"
  vertical_organization_desc: "Large corporations that control every stage of production, from raw materials to the finished product, gain security of supply and economies of scale. Professional managers run these industrial empires."

  international_monetary_policy: "International Monetary Policy"
  international_monetary_policy_desc: "The agreements signed at Bretton Woods in 1944 tied exchange rates to the dollar and the dollar to gold, and created the International Monetary Fund and the World Bank to oversee the system. Access to credit and currency support also gives lenders leverage over borrowers."

  political_internationalism: "Political Internationalism"
  political_internationalism_desc: "Ideologies and movements that cross national borders, from liberal internationalism to the international communist movement, bind states into blocs. Leadership of such a cause brings influence far beyond a nation's own frontiers."

  game_theory: "Game Theory"
  game_theory_desc: "Game theory, set out by John von Neumann and Oskar Morgenstern in Theory of Games and Economic Behavior (1944), models decisions in which each side's best choice depends on the other's. Strategists apply it to bargaining, deterrence and the arms race."

  paracetamol: "Paracetamol"
  paracetamol_desc: "Paracetamol, known in North America as acetaminophen, relieves pain and fever with few side effects at normal doses. Cheap to make and safe enough to sell without a prescription, it suits mass use far better than older painkillers."

  chemotherapy: "Chemotherapy"
  chemotherapy_desc: "Drugs that kill rapidly dividing cells offer the first treatment for cancers that surgery and radiation cannot reach. Wartime research on mustard gas led to the first of them, and their side effects are severe."

  clean_air_measures: "Clean Air Measures"
  clean_air_measures_desc: "Coal smoke, soot and exhaust cause deadly smogs in industrial cities, such as the 1930 fog in Belgium's Meuse Valley that killed about sixty people. Smoke control laws, smokeless zones and cleaner fuels clear the air."

  prefabricated_buildings: "Prefabricated Buildings"
  prefabricated_buildings_desc: "Walls, floors and whole building sections made in factories and assembled on site let housing and offices go up quickly and cheaply. Britain's Housing (Temporary Accommodation) Act of 1944 ordered factory-built 'prefab' bungalows for bombed-out families."

  shopping_malls: "Shopping Malls"
  shopping_malls_desc: "Large enclosed shopping centers with department stores, chain shops and restaurants under one roof serve the new suburbs. Shopping becomes a leisure activity and the mall a center of community life."

  jetliners: "Jetliners"
  jetliners_desc: "Jet airliners fly higher, faster and more smoothly than propeller planes, halving the time of long journeys. The jet age brings intercontinental travel within reach of business travelers and the well-off."

  undersea_galvanic_cables: "Undersea Galvanic Cables"
  undersea_galvanic_cables_desc: "Modern submarine cables with repeaters carry telephone calls and telegraph traffic across oceans. Continents are linked by cable telephone service for the first time."

  microwave_broadcasting: "Microwave Broadcasting"
  microwave_broadcasting_desc: "Chains of microwave relay towers carry television signals and telephone traffic across the country without cables. Cable television networks extend the reach of broadcasters even further."

  sovereign_wealth_fund: "Sovereign Wealth Fund"
  sovereign_wealth_fund_desc: "State-owned investment funds, often financed by revenues from oil and other natural resources, invest abroad and at home on behalf of the nation. They secure wealth for future generations and give the state a powerful financial instrument."

  international_institutions: "International Institutions"
  international_institutions_desc: "The United Nations, international financial bodies and regional organizations provide forums for diplomacy and cooperation. Membership and leadership in them bring prestige and allow nations to take part in several alliances at once."

  in_vitro_fertilization: "In-Vitro Fertilization"
  in_vitro_fertilization_desc: "Fertilizing an egg outside the body and implanting the embryo lets couples who cannot conceive naturally have children. Churches and ethicists debate the status of the embryo, while fertility clinics multiply."

# Era 3:
  catalytic_convertors: "Catalytic Convertors"
  catalytic_convertors_desc: "Devices that convert the toxic gases in car exhaust into less harmful substances become mandatory in many countries. Air quality improves, though car makers must adapt their engines and pay the cost."

  bundled_tube_architecture: "Bundled Tube Architecture"
  bundled_tube_architecture_desc: "Grouping several structural steel tubes into one bundle lets skyscrapers rise higher while using less steel. Towers built this way are among the tallest in the world."

  universal_product_code: "Universal Product Code"
  universal_product_code_desc: "A standard code printed on every product allows supermarkets to scan their goods at the checkout and track their stock automatically. Retail becomes faster, cheaper and driven by data."

  elevated_track: "Elevated Track"
  elevated_track_desc: "Elevated railways and integrated metro lines carry passengers above congested streets and link city districts with shopping and business centers. Modern rolling stock makes the service faster and more comfortable."

  package_vacation: "Package Vacation"
  package_vacation_desc: "Holidays sold as a package, with flights, hotels and transfers included, bring foreign travel within reach of ordinary working families. Mass tourism transforms coastal regions and resort towns."

  fiber_optic_cable: "Fiber Optic Cable"
  fiber_optic_cable_desc: "Pulses of light sent through thin strands of glass carry vastly more information than copper wire. Fiber optics become the backbone of modern telecommunications networks."

  packet_switching: "Packet Switching"
  packet_switching_desc: "Breaking data into small packets that travel independently through a network and are reassembled at their destination makes communication networks robust and efficient. The idea underlies modern computer networking."

  automated_teller_machines: "Automated Teller Machines"
  automated_teller_machines_desc: "Machines that dispense cash and take deposits at any hour, outside the bank's opening times, change how people use their banks. For many customers they are the first computer terminal they ever use."

  horizontal_organization: "Horizontal Organization"
  horizontal_organization_desc: "Corporations that expand across markets and product lines by acquiring competitors and diversifying into new industries become conglomerates. Flatter management structures give their divisions more independence."

  standardized_global_exchange: "Standardized Global Exchange"
  standardized_global_exchange_desc: "Common standards for trade, finance and accounting make it easier to exchange goods, capital and currency between countries. A truly global market begins to take shape."

  brinkmanship: "Brinkmanship"
  brinkmanship_desc: "Brinkmanship is the practice of pushing a confrontation to the edge of war in the hope that the other side backs down first. Used with skill it can win concessions without a shot fired; misjudged, it can start the war it was meant to avoid."

  management_cybernetics: "Management Cybernetics"
  management_cybernetics_desc: "The science of control and communication in complex systems promises to make the management of firms and even whole national economies more efficient. Computer-assisted planning and feedback loops reach into the offices of government."

  valium: "Valium"
  valium_desc: "Tranquilizers of the benzodiazepine family, such as diazepam, ease anxiety and insomnia and are far safer in overdose than the barbiturates they replace. Prescribed to millions, they turn out to be habit-forming."

  climate_sciences: "Climate Sciences"
  climate_sciences_desc: "Scientists studying the atmosphere and oceans find that carbon dioxide from burning fossil fuels is warming the planet, as Svante Arrhenius first calculated in 1896. Their findings shape environmental policy and international negotiations."

  sky_lobbies: "Sky Lobbies"
  sky_lobbies_desc: "Express elevators carry people to intermediate lobbies high in a skyscraper, where they change to local elevators. Very tall buildings become practical without filling their lower floors with elevator shafts."

  digitalized_identification: "Digitalized Identification"
  digitalized_identification_desc: "Computerized registers of citizens, taxpayers and businesses make the work of the state faster and cheaper, and taxes are collected more reliably. Civil liberties groups object to the amount of personal data the state holds."

  wide_body_jetliners: "Wide-Body Jetliners"
  wide_body_jetliners_desc: "Huge wide-body airliners carrying hundreds of passengers bring down the cost of flying dramatically. International airports, luxury resorts and integrated travel packages flourish."

  color_television_broadcasting: "Color Television Broadcasting"
  color_television_broadcasting_desc: "Color television makes news, sport and entertainment more vivid, and a color set becomes a sought-after consumer good. Broadcasters must re-equip their studios and transmitters, and households replace their sets."

  satellite_communication: "Satellite Communication"
  satellite_communication_desc: "Communications satellites in orbit relay television and telephone signals across the globe. Arthur C. Clarke proposed relay stations in geostationary orbit in 1945, and live broadcasts from the other side of the world become routine."

  intranet: "Intranet"
  intranet_desc: "Private computer networks connect government departments, universities and companies, letting them share data and messages electronically. E-mail and shared databases replace much of the internal paper memo."

  floated_exchange_rates: "Floated Exchange Rates"
  floated_exchange_rates_desc: "When governments stop defending fixed parities, currencies float, their values set daily by the markets. Central banks gain freedom over interest rates but must live with volatile exchange rates and currency speculation."

  detente_politics: "Detente Politics"
  detente_politics_desc: "An easing of tensions between the superpowers, built on arms control agreements, trade and cultural exchange, reduces the risk of nuclear war. Diplomacy and negotiation take the place of confrontation."

  immunosuppressants: "Immunosuppressants"
  immunosuppressants_desc: "Drugs that suppress the immune system prevent the rejection of transplanted organs and treat autoimmune diseases. Organ transplants become a realistic treatment for patients with failing hearts, kidneys and livers."

# Era 4:
  urban_ecology: "Urban Ecology"
  urban_ecology_desc: "Green spaces, cleaner industry, waste management and environmental planning make cities healthier places to live. Urban growth is balanced against its impact on nature."

  highrise_shopping_complexes: "Highrise Shopping Complexes"
  highrise_shopping_complexes_desc: "Towers combining shops, offices and apartments in a single building make the most of expensive land in dense city centers. Modern workstations and vertical shopping malls define the new urban landscape."

  digitized_point_of_sale: "Digitized Point of Sale"
  digitized_point_of_sale_desc: "Electronic cash registers and computerized sales systems track every transaction, manage stock and speed up the checkout. Retail needs fewer staff to serve more customers."

  monorails: "Monorails"
  monorails_desc: "Trains running on a single beam need little ground space and can be threaded above existing streets, and Wuppertal's suspended monorail has run since 1901. Modern rolling stock makes urban rail cleaner and faster."

  internet: "Internet"
  internet_desc: "Linking computer networks around the world into a single network of networks allows data, messages and files to flow freely between universities, businesses and governments. Broadband connections and internet servers spread quickly."

  digital_financial_transactions: "Digital Financial Transactions"
  digital_financial_transactions_desc: "Electronic payment systems, card networks and computerized banking let money move instantly between accounts and across borders. A shrinking share of payments is made in cash."

  modern_multinational_structure: "Modern Multinational Structure"
  modern_multinational_structure_desc: "Corporations with operations, subsidiaries and supply chains spread across dozens of countries manage their global business from a single headquarters. Multinationals become powers in the world economy in their own right."

  economic_globalization: "Economic Globalization"
  economic_globalization_desc: "Falling trade barriers, mobile capital and global supply chains tie national economies more closely together. Trade grows, and a crisis in one market spreads faster to the others."

  antiviral_drugs: "Antiviral Drugs"
  antiviral_drugs_desc: "Drugs that target viruses offer treatment for diseases once untouchable by medicine, including herpes and HIV. Combination therapies turn some deadly infections into manageable conditions."

  hyperdense_urbanism: "Hyperdense Urbanism"
  hyperdense_urbanism_desc: "Megacities of tens of millions, with towering residential blocks and dense transport networks, pack more people into less space than ever before. Careful planning is needed to keep them livable."

  world_wide_web: "World Wide Web"
  world_wide_web_desc: "The World Wide Web links documents across the internet so that anyone with a simple browser can read and publish them. Businesses, governments, universities and individuals put their information online."

  supernational_unions: "Supernational Unions"
  supernational_unions_desc: "Groupings of states that pool their sovereignty in common institutions, laws and markets give their members a greater voice in world affairs. National governments accept limits on their power in exchange for collective strength."

  stem_cell_therapy: "Stem Cell Therapy"
  stem_cell_therapy_desc: "Stem cells, which can develop into many different kinds of tissue, offer a way to repair damaged organs and treat degenerative diseases. Research advances quickly, and governments set limits on the use of human embryos."

# Era 5:
  wifi: "Wi-Fi"
  wifi_desc: "Wireless networking frees computers and phones from cables, connecting them to the internet anywhere within range of a transmitter. Laptops, phones and appliances stay online wherever there is a signal."

  digital_commerce: "Digital Commerce"
  digital_commerce_desc: "Online shops, internet banking and digital services let people buy, sell and manage money from home at any hour. High-street shops and bank branches close as customers move online."

  equity_crowdfunding: "Equity Crowdfunding"
  equity_crowdfunding_desc: "Online platforms let ordinary people invest small sums directly in start-ups and businesses. Capital becomes accessible to entrepreneurs outside the traditional channels of banks and investors."


#############################
### Military Technologies ###
#############################

# Era 1:
  industrial_warfare: "Industrial Warfare"
  industrial_warfare_desc: "The Second World War was won by mass armies of conscripts, armed with semi-automatic rifles and backed by artillery and factories working around the clock. Its lessons in mobilization, supply and firepower shape every army that emerges from it."

  naval_warfare: "Naval Warfare"
  naval_warfare_desc: "Fleets of carriers, cruisers, destroyers and submarines decided the war at sea, and command of the oceans remains the mark of a great power. A modern navy must protect sea lanes, project force abroad and carry armies across the world."

# Era 2:
  divisional_organization: "Divisional Organization"
  divisional_organization_desc: "Organizing an army into standardized divisions, each with its own infantry, artillery, engineers, medics and supply columns, lets it fight and sustain itself as a self-contained force. Codified doctrine and instruction make the whole army predictable to its commanders."

  armored_warfare: "Armored Warfare"
  armored_warfare_desc: "Tanks massed in armored and mechanized formations, supported by motorized infantry, broke through fronts and encircled whole armies in the last war. No modern army can do without them."

  # military_aviation: "Military Aviation"
  # military_aviation_desc: "TBD"

  screening_vessels: "Screening Vessels"
  screening_vessels_desc: "Destroyers, frigates and corvettes screen the larger ships of a fleet from submarines, aircraft and torpedo boats. These smaller escorts are the workhorses of any navy, guarding convoys and patrolling coasts."

  submarines: "Submarines"
  submarines_desc: "German U-boats nearly cut Britain's supply lines in both world wars, and American submarines sank most of Japan's merchant fleet. Snorkels, streamlined hulls and larger batteries, pioneered in the German Type XXI, let a boat stay submerged far longer."

  squad_specialist_weapons: "Squad Specialist Weapons"
  squad_specialist_weapons_desc: "Light machine guns, recoilless rifles and portable anti-tank weapons give each infantry squad the firepower to fight on its own. Non-commissioned officers trained to lead small units become the backbone of the army."

  mobile_warfare: "Mobile Warfare"
  mobile_warfare_desc: "Trucks, half-tracks and self-propelled guns allow infantry and artillery to keep pace with the tanks. Fast-moving, motorized forces with their own reconnaissance can exploit a breakthrough before the enemy can react."

  rocketry: "Rocketry"
  rocketry_desc: "Soviet Katyusha salvoes and the German V-2, the first long-range ballistic missile, showed what rockets could do in the last war. The same science points toward missiles that cross continents and launchers that reach orbit."

  jet_engine: "Jet Engine"
  jet_engine_desc: "The jet engine, developed separately by Frank Whittle in Britain and Hans von Ohain in Germany, pushes aircraft far beyond the speed of any propeller plane. The Messerschmitt Me 262 and the Gloster Meteor were both in service by 1944."

  naval_aviation: "Naval Aviation"
  naval_aviation_desc: "Aircraft flown from carriers sank battleships and decided the great sea battles of the Pacific. The carrier and its air wing have replaced the battleship as the capital ship of the modern navy."

  anti_submarine_warfare: "Anti-Submarine Warfare"
  anti_submarine_warfare_desc: "Sonar, depth charges, patrol aircraft and hunter-killer groups are the tools for finding and sinking enemy submarines. Together they broke the U-boat offensive in the North Atlantic in May 1943."

  assault_rifle: "Assault Rifle"
  assault_rifle_desc: "A rifle firing an intermediate cartridge, capable of single shots and automatic fire, gives every infantryman the firepower of a submachine gun at rifle range. Germany fielded the first, the StG 44, in the last years of the war."

  main_battle_tanks: "Main Battle Tanks"
  main_battle_tanks_desc: "A single type of tank that combines the firepower of a heavy tank with the mobility of a medium one is replacing the specialized designs of the war. The main battle tank becomes the core of every armored force."

  heavy_jet_engines: "Heavy Jet Engines"
  heavy_jet_engines_desc: "More powerful turbojets and turbofans carry heavy bomb loads, long-range transports and tactical bombers at jet speed. Air forces can now strike deep behind the front line."

  utility_helicopters: "Utility Helicopters"
  utility_helicopters_desc: "Helicopters land troops, supplies and medical teams anywhere, without runways or roads, and evacuate the wounded straight from the battlefield. An American Sikorsky R-4 flew the first helicopter combat rescue, in Burma in 1944."

  naval_jet_aircraft: "Naval Jet Aircraft"
  naval_jet_aircraft_desc: "Adapting jet aircraft for carrier operations requires stronger airframes, angled flight decks, steam catapults and better arresting gear. The modern carrier air wing is born from these innovations."

  anti_submarine_rockets: "Anti-Submarine Rockets"
  anti_submarine_rockets_desc: "Rocket-thrown depth charges and homing torpedoes let escorts attack a submarine at a distance instead of having to pass over it. The wartime Hedgehog, which threw its charges ahead of the ship, was the forerunner."

# Era 3:
  flak_jackets: "Flak Jackets"
  flak_jackets_desc: "Vests of nylon and steel plates protect soldiers from shell splinters and fragments, the cause of most wounds on the modern battlefield. Body armor becomes standard issue for front-line infantry."

  armored_personnel_carriers: "Armored Personnel Carriers"
  armored_personnel_carriers_desc: "Armored, tracked or wheeled vehicles carry infantry into battle under protection from shell fire and small arms. The infantry can now keep pace with the tanks and fight alongside them."

  guided_anti_tank_weapons: "Guided Anti-Tank Weapons"
  guided_anti_tank_weapons_desc: "Wire-guided missiles fired by a two-man team can destroy a tank kilometers away. In the hands of infantry, they threaten the dominance of armor on the battlefield."

  aerial_napalm: "Aerial Napalm"
  aerial_napalm_desc: "Jellied gasoline, developed at Harvard in 1942 and dropped in incendiary bombs, spreads fire across wide areas, burning out entrenched troops and dense cover. Its effect on people, soldiers and civilians alike, makes it deeply controversial."

  marine_reactor: "Marine Reactor"
  marine_reactor_desc: "A compact nuclear reactor can drive a ship or submarine for years without refueling. Nuclear-powered submarines can stay submerged almost indefinitely, and nuclear carriers can sail anywhere on the globe."

  anti_ship_missile: "Anti-Ship Missile"
  anti_ship_missile_desc: "Guided missiles that skim the waves and strike ships far beyond gun range can sink a warship in a single hit. Even small missile boats now pose a deadly threat to the largest fleets."

  composite_armor: "Composite Armor"
  composite_armor_desc: "Layers of ceramics, steel and other materials defeat shaped-charge warheads and armor-piercing shells far better than steel alone. A new generation of tanks is built around it."

  multi_role_jets: "Multi-Role Jets"
  multi_role_jets_desc: "Supersonic jets equipped with radar, guided missiles and precision bombs can fight for air superiority and strike ground targets in the same mission. One airframe now does the work of several specialized types."

  cargo_jets: "Cargo Jets"
  cargo_jets_desc: "Large jet transports can fly troops, vehicles and supplies across oceans in hours. Airlift capacity lets a power reinforce distant allies and sustain forces far from home."

  thermobarics: "Thermobarics"
  thermobarics_desc: "Fuel-air and thermobaric explosives disperse a cloud of fuel and ignite it, producing a blast and pressure wave far more destructive than conventional explosives. They are especially lethal against fortifications, caves and buildings."

  helicopter_gunships: "Helicopter Gunships"
  helicopter_gunships_desc: "Helicopters armed with machine guns, rockets and anti-tank missiles support the infantry from the air and hunt armor. Attack helicopters become a weapon in their own right."

  electronic_command_and_control: "Electronic Command & Control"
  electronic_command_and_control_desc: "Radar networks, computerized data links and secure communications connect ships, aircraft and command centers into a single picture of the battle, shared in real time with commanders."

  surface_raiders: "Surface Raiders"
  surface_raiders_desc: "Fast warships armed with long-range missiles can strike enemy shipping and naval forces far from home. Such raiders force the enemy to spread its fleet thin to defend its sea lanes."

# Era 4:
  ballistic_vests: "Ballistic Vests"
  ballistic_vests_desc: "Vests of aramid fiber and ceramic plates stop rifle and pistol bullets as well as fragments. The individual soldier has better protection than at any time since the age of plate armor."

  depleted_uranium_rounds: "Depleted Uranium Rounds"
  depleted_uranium_rounds_desc: "Extremely dense penetrators made of depleted uranium pierce armor that tungsten and steel cannot. Veterans' groups and some governments question the health effects of the uranium dust they leave behind."

  thermal_guidance: "Thermal Guidance"
  thermal_guidance_desc: "Infrared sensors detect the heat of engines and bodies through darkness, smoke and camouflage. Thermal sights and guided munitions allow tanks and aircraft to fight at night as well as by day."

  portable_anti_air_systems: "Portable Anti-Air Systems"
  portable_anti_air_systems_desc: "Shoulder-fired surface-to-air missiles let a single soldier bring down a helicopter or low-flying jet. Guerrillas can use them as easily as armies, so aircraft near the front must carry flares and fly higher."

  airmobile_warfare: "Airmobile Warfare"
  airmobile_warfare_desc: "Brigades carried by helicopter can be landed behind enemy lines, jump over obstacles and be withdrawn just as quickly. Artillery, supplies and marines move into battle by air as well."

  radar_resistant_design: "Radar-Resistant Design"
  radar_resistant_design_desc: "Shaping hulls and airframes and coating them with absorbent materials reduces their radar signature. Ships and aircraft that cannot easily be detected gain a decisive advantage."

  integrated_air_defense: "Integrated Air Defense"
  integrated_air_defense_desc: "Networks of radars, missiles, interceptors and command centers linked together defend the airspace of a whole country. Penetrating them is one of the hardest tasks an air force can face."

  tactical_ballistic_weapons: "Tactical Ballistic Weapons"
  tactical_ballistic_weapons_desc: "Mobile launchers firing short-range ballistic missiles can strike airfields, depots and command posts deep behind the front. Conventional or nuclear, they are difficult to intercept and difficult to find."

  stealth_aircraft: "Stealth Aircraft"
  stealth_aircraft_desc: "Aircraft designed from the outset to be nearly invisible to radar can strike heavily defended targets without warning. Stealth changes the balance between air defense and air attack."

# Era 5:
  carbine_assault_rifles: "Carbine Assault Rifles"
  carbine_assault_rifles_desc: "Shorter, lighter carbines with optical sights and modular accessories suit soldiers fighting from vehicles and in cities. Optics make the ordinary rifleman far more accurate at combat ranges."

  recon_drones: "Recon Drones"
  recon_drones_desc: "Unmanned aircraft relay live video of the battlefield to commanders without risking a pilot. Reconnaissance becomes constant and cheap, and forces in the field find it much harder to hide."

  modern_aircraft_carriers: "Modern Aircraft Carriers"
  modern_aircraft_carriers_desc: "Supercarriers with nuclear propulsion, advanced sensors and integrated defenses carry air wings capable of fighting a war on their own. Only a few navies can afford to build and operate them."

  infantry_combat_drones: "Infantry Combat Drones"
  infantry_combat_drones_desc: "Small armed drones controlled by infantry units can scout and strike targets out of sight. Cheap and expendable, they are used in large numbers."

  fourth_generation_warfare: "Fourth-Generation Warfare"
  fourth_generation_warfare_desc: "Fourth-generation warfare is the term military theorists use for conflict in which the lines between war and politics, and between soldier and civilian, are blurred. Networked brigades with drones, precision weapons and stealth must be ready to fight both conventional armies and insurgents."
