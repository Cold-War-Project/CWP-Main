l_english:
# Cold War Project: country flavor text from dev (keys vanilla does not have).
 ITA_FLAVOR_TEXT: "In July 1943 the Grand Council of Fascism voted against Mussolini and the king had him arrested. Italy signed an armistice with the Allies that September and fought the rest of the war as a co-belligerent, while partisans fought the Germans and the fascist Italian Social Republic in the north. After the liberation the parties of the National Liberation Committee, from the Christian Democrats to the Communists, governed together under a monarchy that many Italians blamed for twenty years of fascism."
 YUG_FLAVOR_TEXT: "Yugoslavia's communists came to power through their own war. Tito's Partisans fought the Axis occupiers and their local allies and took Belgrade in October 1944 alongside the Red Army. The war had also been a civil war: the Ustaše state killed hundreds of thousands of Serbs, Jews and Roma, and Chetniks massacred Muslims and Croats. In November 1945 a Constituent Assembly elected on a single People's Front list abolished the monarchy and proclaimed a federal people's republic of the South Slav nations."
 EUROPE_FLAVOR_TEXT: "The war left much of Europe in ruins. Cities from Rotterdam to Warsaw had been bombed or fought over, millions of displaced persons waited in camps, and through the winter of 1945 food and coal were short across the continent. Even the countries that had stayed neutral, such as Sweden, Switzerland, Ireland and Portugal, depended on trade with neighbors whose economies would take years to rebuild."
 IRE_FLAVOR_TEXT: "$EUROPE_FLAVOR_TEXT$"
 VAT_FLAVOR_TEXT: "$EUROPE_FLAVOR_TEXT$"
 MLT_FLAVOR_TEXT: "$EUROPE_FLAVOR_TEXT$"
 GRN_FLAVOR_TEXT: "$EUROPE_FLAVOR_TEXT$"
 ICL_FLAVOR_TEXT: "$EUROPE_FLAVOR_TEXT$"
 AOZ_FLAVOR_TEXT: "$GERMAN_FLAVOR_TEXT$"
 BOZ_FLAVOR_TEXT: "$GERMAN_FLAVOR_TEXT$"
 FOZ_FLAVOR_TEXT: "$GERMAN_FLAVOR_TEXT$"
 DDR_FLAVOR_TEXT: "$GERMAN_FLAVOR_TEXT$"
 EASTBLOC_FLAVOR_TEXT: "The Red Army's advance in 1944 and 1945 carried Soviet power deep into Central Europe and the Balkans. Soviet troops stayed on in Poland, Hungary, Romania and Bulgaria, the last three under Allied Control Commissions chaired by Soviet officers. Coalition governments of national fronts included peasant, socialist and liberal parties, but nearly everywhere the communists held the interior ministry and with it the police. In Albania, liberated by its own partisans, the communist-led Democratic Front ruled alone."
 CZH_FLAVOR_TEXT: "$EASTBLOC_FLAVOR_TEXT$"
 ROM_FLAVOR_TEXT: "$EASTBLOC_FLAVOR_TEXT$"
 BUL_FLAVOR_TEXT: "$EASTBLOC_FLAVOR_TEXT$"
 ALB_FLAVOR_TEXT: "$EASTBLOC_FLAVOR_TEXT$"
 PRC_FLAVOR_TEXT: "In 1927 Chiang Kai-shek's Nationalists turned on their communist allies, and the Communist Party of China survived in rural soviets and on the Long March of 1934 and 1935 to a new base at Yan'an. During the war against Japan its Eighth Route and New Fourth Armies built guerrilla base areas behind Japanese lines across north China. Talks with the Nationalists at Chongqing in 1945 failed to settle the question of the armies, and communist troops moved into Manchuria while Soviet forces still occupied it."
 ROC_FLAVOR_TEXT: "China ended the war with Japan as one of the victorious Big Four and a permanent member of the United Nations Security Council, but more than ten million Chinese had died since 1937. Taiwan returned to Chinese rule in October 1945. The Nationalist government of Chiang Kai-shek, still based at the wartime capital of Chongqing, faced runaway inflation, charges of corruption among its officials and communist armies in control of much of north China."
 KOREA_FLAVOR_TEXT: "Japan ruled Korea as a colony from 1910 until its surrender in 1945. Soviet troops then occupied the peninsula north of the 38th parallel and American troops the south. The Soviets worked through local people's committees and promoted Kim Il Sung, a former guerrilla commander in Manchuria. The US Army Military Government refused to recognize the Korean People's Republic proclaimed in Seoul in September 1945 and governed directly."
 NRK_FLAVOR_TEXT: "$KOREA_FLAVOR_TEXT$"
 STK_FLAVOR_TEXT: "$KOREA_FLAVOR_TEXT$"
 EASTASIA_FLAVOR_TEXT: "These lands lay within or on the edge of the old Qing empire. Britain returned to Hong Kong in August 1945 after the Japanese occupation, and Portugal still held Macao, which had stayed neutral through the war. In Tibet the government of the young Dalai Lama had ruled as an independent state since 1913, which China had never accepted, and in Xinjiang a Soviet-backed rising in 1944 had proclaimed an East Turkestan Republic in the Ili valley."
 TRH_FLAVOR_TEXT: "$EASTASIA_FLAVOR_TEXT$"
 HKN_FLAVOR_TEXT: "$EASTASIA_FLAVOR_TEXT$"
 MAO_FLAVOR_TEXT: "$EASTASIA_FLAVOR_TEXT$"
 HND_FLAVOR_TEXT: "Britain's Labour government had promised India early self-government. Elections to the central legislature in December 1945 gave the Indian National Congress most of the general seats and the Muslim League, campaigning for a separate Pakistan, every Muslim seat. The Simla Conference of June 1945 had broken down over the League's claim to speak for all Muslims, and the Red Fort trials of officers of the Indian National Army brought protesting crowds into the streets."
 INDUS_FLAVOR_TEXT: "Around British India lay states whose position rested on British power. More than five hundred princely states, among them Hyderabad, Kashmir and Kalat in Baluchistan, were ruled by their own princes under British paramountcy. Ceylon was a Crown colony, where the Soulbury Commission recommended a new constitution in 1945, and the Maldives were a British protectorate. A British withdrawal from India would end paramountcy and leave each of them to make its own terms."
 SRI_FLAVOR_TEXT: "$INDUS_FLAVOR_TEXT$"
 BUH_FLAVOR_TEXT: "$INDUS_FLAVOR_TEXT$"
 NPA_FLAVOR_TEXT: "$INDUS_FLAVOR_TEXT$"
 BLH_FLAVOR_TEXT: "$INDUS_FLAVOR_TEXT$"
 KAS_FLAVOR_TEXT: "$INDUS_FLAVOR_TEXT$"
 VNM_FLAVOR_TEXT: "France ruled Indochina from the nineteenth century, with Cochinchina as a colony and Annam, Tonkin, Cambodia and Laos as protectorates. In March 1945 Japan overthrew the French administration. After Japan's surrender the Viet Minh took Hanoi, Emperor Bao Dai abdicated, and on September 2 Ho Chi Minh proclaimed the Democratic Republic of Vietnam. Chinese Nationalist troops occupied the north, while British troops in the south helped the French retake Saigon, and by the end of 1945 French forces were fighting the Viet Minh in Cochinchina."
 IDS_FLAVOR_TEXT: "Dutch rule over the East Indies, built up over three centuries, collapsed when Japan conquered the islands in 1942. On August 17, 1945, two days after Japan's surrender, Sukarno and Mohammad Hatta proclaimed the independence of the Republic of Indonesia. British and Indian troops landed in Java to accept the Japanese surrender and fought the republic's militias at Surabaya in November, while the Dutch returned intending to restore their authority."
 THA_FLAVOR_TEXT: "Siam, renamed Thailand in 1939, was the only country in Southeast Asia never ruled by a European power. The revolution of 1932 ended absolute monarchy and gave power to the army and officials of the People's Party. Under Field Marshal Plaek Phibunsongkhram Thailand allied with Japan in 1941, while the Free Thai movement worked with the Allies. After the war leaders of the Free Thai formed the government, and the young King Ananda Mahidol returned from Switzerland in December 1945."
 SOUTHASIA_FLAVOR_TEXT: "By 1900 all of Southeast Asia except Siam was under Western rule, and in 1941 and 1942 Japan overran it. The region's rubber, tin and oil had made fortunes for European and American firms, but little of the profit stayed with the people who produced it. The colonial powers came back to nationalist movements that had organized and armed during the occupation. In the Philippines the Tydings-McDuffie Act of 1934 had scheduled independence for July 1946."
 MYM_FLAVOR_TEXT: "$SOUTHASIA_FLAVOR_TEXT$"
 MYY_FLAVOR_TEXT: "$SOUTHASIA_FLAVOR_TEXT$"
 WPP_FLAVOR_TEXT: "$SOUTHASIA_FLAVOR_TEXT$"
 AST_FLAVOR_TEXT: "Australia and New Zealand went to war beside Britain in 1939, as they had in 1914. Japan's advance in the Pacific brought air raids on Darwin, and after the fall of Singapore in 1942 Australia relied on the United States for its defense. Both countries took an active part in writing the United Nations Charter at San Francisco in 1945, and both remained closely tied to Britain by trade, migration and the Crown."
 NZL_FLAVOR_TEXT: "$AST_FLAVOR_TEXT$"
 NEW_FLAVOR_TEXT: "$CAN_FLAVOR_TEXT$"
 CAN_FLAVOR_TEXT: "Canada declared war on Germany in its own name in September 1939, a week after Britain, and its forces fought in Italy, landed on Juno Beach in Normandy and liberated much of the Netherlands. The war tied its economy closely to the United States. Next door, Newfoundland had given up self-government in 1934 after its finances collapsed and was ruled by a commission appointed from London, while the United States built bases on the island under the destroyers-for-bases deal of 1940."
 CARRIBEAN_FLAVOR_TEXT: "Haiti won its independence from France in 1804, and the Dominican Republic and Cuba followed later, but in the twentieth century the United States occupied all three, and it had ruled Puerto Rico since 1898. Britain, France and the Netherlands still held most of the smaller islands, and sugar remained the main export. The labor riots that swept the British West Indies in the late 1930s gave rise to new trade unions and parties, and in 1944 Jamaica held its first elections under universal adult suffrage."
 JAM_FLAVOR_TEXT: "$CARRIBEAN_FLAVOR_TEXT$"
 DCR_FLAVOR_TEXT: "$CARRIBEAN_FLAVOR_TEXT$"
 ETH_FLAVOR_TEXT: "Italy invaded Ethiopia in 1935 and occupied it until 1941, when British, Commonwealth and Ethiopian patriot forces drove the Italians out and Emperor Haile Selassie returned to Addis Ababa. Anglo-Ethiopian agreements in 1942 and 1944 gave Britain a large say in the country's affairs, and British military administration still covered the Ogaden and the former Italian colony of Eritrea. The emperor's government claimed Eritrea and with it access to the sea."
 AFRICA_FLAVOR_TEXT: "At the start of 1946 nearly all of Africa was under European rule, divided among Britain, France, Belgium, Portugal and Spain, with Italy's former colonies under British and French military administration. Only Ethiopia, Liberia, Egypt and the Union of South Africa were independent. African soldiers had served in North Africa, Italy and Burma, and in October 1945 the Fifth Pan-African Congress at Manchester demanded independence for Africa's peoples."
 SDN_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 SML_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 SLL_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 DJI_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 ERI_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 TNZ_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 MKU_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 MGS_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 ESW_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 CNG_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 EQA_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 GLC_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 LIB_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 SIL_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 GNB_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 GAM_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 CVD_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 LBY_FLAVOR_TEXT: "$AFRICA_FLAVOR_TEXT$"
 FEZ_FLAVOR_TEXT: "$LBY_FLAVOR_TEXT$"
 MIDEAST_FLAVOR_TEXT: "The collapse of the Ottoman Empire after 1918 left most of the Arab lands under British and French mandates. Iraq gained formal independence in 1932, and Syria and Lebanon won theirs from France during the Second World War. Britain still governed Palestine, Aden and Cyprus, handled the foreign relations of the Gulf sheikhdoms by treaty, and kept troops from Egypt to Iraq. The Arab League was founded in Cairo in March 1945, and in December a Soviet-backed government took power in Iranian Azerbaijan."
 KUW_FLAVOR_TEXT: "$MIDEAST_FLAVOR_TEXT$"
 PAL_FLAVOR_TEXT: "$MIDEAST_FLAVOR_TEXT$"
 EOT_FLAVOR_TEXT: "$MIDEAST_FLAVOR_TEXT$"
