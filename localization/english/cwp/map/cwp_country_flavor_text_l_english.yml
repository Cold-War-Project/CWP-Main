 IRQ_FLAVOR_TEXT: "$MIDEAST_FLAVOR_TEXT$"
 AFH_FLAVOR_TEXT: "$MIDEAST_FLAVOR_TEXT$"
 KUR_FLAVOR_TEXT: "$MIDEAST_FLAVOR_TEXT$"
 AZR_FLAVOR_TEXT: "$MIDEAST_FLAVOR_TEXT$"
 CYP_FLAVOR_TEXT: "$MIDEAST_FLAVOR_TEXT$"
 ADE_FLAVOR_TEXT: "$YEM_FLAVOR_TEXT$"
 SOUTHAM_FLAVOR_TEXT: "Spanish and Portuguese rule in South America ended in the 1810s and 1820s, in the wars led by Simón Bolívar and José de San Martín and in Brazil's break with Portugal. Since then the republics had lived through caudillo rule, border wars such as the Chaco War between Bolivia and Paraguay, and booms and busts in exports such as beef, copper, tin and coffee. British capital built many of the railways, but by 1945 the United States was the leading trading partner and investor for most of the continent."
 PRG_FLAVOR_TEXT: "$SOUTHAM_FLAVOR_TEXT$"
 URU_FLAVOR_TEXT: "$SOUTHAM_FLAVOR_TEXT$"
 PEU_FLAVOR_TEXT: "$SOUTHAM_FLAVOR_TEXT$"
 CENTAM_FLAVOR_TEXT: "The Federal Republic of Central America broke apart in 1838. In the twentieth century American fruit companies, above all United Fruit, owned great banana plantations, railways and ports, and US Marines occupied Nicaragua for most of the years from 1912 to 1933. Dictators ruled most of the isthmus in the 1930s, but in 1944 protests forced out Maximiliano Hernández Martínez in El Salvador and Jorge Ubico in Guatemala, where Juan José Arévalo was elected president that December. British Honduras remained a British colony."
 GUA_FLAVOR_TEXT: "$CENTAM_FLAVOR_TEXT$"
