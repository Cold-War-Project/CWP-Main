l_english:
 # Journal entry group
 je_group_cwp_international_organizations: "International Organizations"

 # Shared template text
 cwp_io_support_bar: "Support"
 cwp_io_support_bar_desc: "Yes votes"
 cwp_io_support_bar_second_desc: "Share of members voting yes or no"
 cwp_io_vote_yes_button: "Vote in favour"
 cwp_io_vote_no_button: "Vote against"
 cwp_io_vote_abstain_button: "Abstain"
 cwp_io_proposal_can_open_tt: "The proposal is not already before the members and was not rejected in the last two years"
 cwp_io_open_proposal_tt: "Puts the proposal to a vote of all members for six months"
 cwp_io_proposal_passes_tt: "When the vote closes, at least the required share of members voting yes or no are in favour, and no permanent member has vetoed it"
 cwp_io_can_vote_tt: "We are a member and have not yet voted on this"
 cwp_io_veto_tt: "As a permanent member of the Security Council, our vote against is a #b veto#!"

 # The United Nations
 je_cwp_un: "The United Nations"
 je_cwp_un_reason: "Founded at San Francisco in 1945 to save succeeding generations from the scourge of war, the United Nations gathers its members in a General Assembly where each state has one vote. Five permanent members of the Security Council hold a veto over the admission of new members. Members may table resolutions; a resolution passes with two thirds of the members present and voting."
 je_cwp_un_status: "Members: #v [GetGlobalVariable('cwp_io_un_members').GetValue|0]#!\nResolutions pass with #v [GetGlobalVariable('cwp_io_un_threshold').GetValue|0]%#! of the yes and no votes."
 je_cwp_un_status_rotating: "Members: #v [GetGlobalVariable('cwp_io_un_members').GetValue|0]#!\nThe presidency rotates among the members."
 cwp_un_member_modifier: "United Nations Member"
 cwp_un_human_rights_modifier: "Universal Declaration of Human Rights"
 cwp_un_law_of_the_sea_modifier: "Conventions on the Law of the Sea"

 cwp_un_propose_human_rights_button: "Table a Declaration of Human Rights"
 cwp_un_propose_human_rights_button_desc: "Propose that the General Assembly adopt a common standard of rights for all peoples and all nations."
 cwp_un_propose_law_of_the_sea_button: "Table Conventions on the Law of the Sea"
 cwp_un_propose_law_of_the_sea_button_desc: "Propose that the members codify the territorial sea, fishing rights and the continental shelf."
 cwp_un_withdraw_button: "Withdraw from the United Nations"
 cwp_un_withdraw_button_desc: "Leave the organization. We may apply again after a year."

 # Admission
 je_cwp_un_admission: "Admission of [GetGlobalVariable('cwp_un_admission_target').GetCountry.GetName] to the United Nations"
 je_cwp_un_admission_concluded: "Admission of a new member"
 je_cwp_un_admission_reason: "[GetGlobalVariable('cwp_un_admission_target').GetCountry.GetName] has applied to join the United Nations. Admission needs two thirds of the members voting, and no permanent member of the Security Council may oppose it."
 je_cwp_un_admission_status: "In favour: #v [GetGlobalVariable('cwp_io_un_admission_yes').GetValue|0]#! · Against: #v [GetGlobalVariable('cwp_io_un_admission_no').GetValue|0]#! · Abstaining: #v [GetGlobalVariable('cwp_io_un_admission_abstain').GetValue|0]#!"
 cwp_un_admission_vote_yes_button: "Support the application"
 cwp_un_admission_vote_yes_button_desc: "Vote to admit the applicant."
 cwp_un_admission_vote_no_button: "Oppose the application"
 cwp_un_admission_vote_no_button_desc: "Vote against admission. A permanent member's vote against is a veto."
 cwp_un_admission_vote_abstain_button: "Abstain on the application"
 cwp_un_admission_vote_abstain_button_desc: "Take no side. Abstentions do not count toward the result."

 cwp_un_apply_for_membership_decision: "Apply to the United Nations"
 cwp_un_apply_for_membership_decision_desc: "Ask the members of the United Nations to admit us. Our application will come to a vote once no other is pending."
 cwp_un_apply_for_membership_decision_tooltip: "Our application goes to a vote of the members. A permanent member of the Security Council can veto it."
 cwp_un_apply_tt: "We apply for membership of the #b United Nations#!"
 cwp_un_not_applicant_tt: "Our application is not already waiting for a vote"
 cwp_un_not_rejected_tt: "We have not been turned down or left in the past few years"

 # Universal Declaration of Human Rights
 je_cwp_un_res_human_rights: "Universal Declaration of Human Rights"
 je_cwp_un_res_human_rights_reason: "A draft declaration is before the General Assembly: a common standard of achievement for all peoples and all nations, setting out civil, political, economic and social rights. It binds no one, but every member must say where it stands."
 je_cwp_un_res_human_rights_status: "In favour: #v [GetGlobalVariable('cwp_io_un_human_rights_yes').GetValue|0]#! · Against: #v [GetGlobalVariable('cwp_io_un_human_rights_no').GetValue|0]#! · Abstaining: #v [GetGlobalVariable('cwp_io_un_human_rights_abstain').GetValue|0]#!"
 je_cwp_un_res_human_rights_passed_desc: "The General Assembly has adopted the Universal Declaration of Human Rights."
 cwp_un_res_human_rights_effect_tt: "All United Nations members gain #b Universal Declaration of Human Rights#!, and keep it while they are members"
 cwp_un_human_rights_vote_yes_button_desc: "Vote for the declaration."
 cwp_un_human_rights_vote_no_button_desc: "Vote against the declaration."
 cwp_un_human_rights_vote_abstain_button_desc: "Abstain: the declaration's rights do not fit our order, but we will not stand against it."

 # Law of the Sea
 je_cwp_un_res_law_of_the_sea: "Conventions on the Law of the Sea"
 je_cwp_un_res_law_of_the_sea_reason: "Coastal states are claiming ever wider seas, and fleets clash over fishing grounds and the riches of the seabed. Draft conventions on the territorial sea, the high seas, fishing and the continental shelf are before the members."
 je_cwp_un_res_law_of_the_sea_status: "In favour: #v [GetGlobalVariable('cwp_io_un_law_of_the_sea_yes').GetValue|0]#! · Against: #v [GetGlobalVariable('cwp_io_un_law_of_the_sea_no').GetValue|0]#! · Abstaining: #v [GetGlobalVariable('cwp_io_un_law_of_the_sea_abstain').GetValue|0]#!"
 je_cwp_un_res_law_of_the_sea_passed_desc: "The members have adopted the Conventions on the Law of the Sea."
 cwp_un_res_law_of_the_sea_effect_tt: "All United Nations members gain #b Conventions on the Law of the Sea#!, and keep it while they are members"
 cwp_un_law_of_the_sea_vote_yes_button_desc: "Vote for the conventions."
 cwp_un_law_of_the_sea_vote_no_button_desc: "Vote against the conventions."
 cwp_un_law_of_the_sea_vote_abstain_button_desc: "Abstain on the conventions."

 # Events
 cwp_intl_org_un.1.t: "Admitted to the United Nations"
 cwp_intl_org_un.1.d: "The General Assembly has voted to admit us. Our flag now flies with the others in front of the Assembly hall, and our delegation takes its seat."
 cwp_intl_org_un.1.f: "\"A seat at the table is not yet a voice in the room.\""
 cwp_intl_org_un.1.a: "A proud day."
 cwp_intl_org_un.1.a.tt: "We are a member of the #b United Nations#!"
 cwp_intl_org_un.2.t: "Application Rejected"
 cwp_intl_org_un.2.d: "Our application to the United Nations did not win the two thirds it needed."
 cwp_intl_org_un.2.d_veto: "Our application to the United Nations was vetoed by a permanent member of the Security Council."
 cwp_intl_org_un.2.f: "\"The door is open to all peace-loving states, they say. Apparently not to us.\""
 cwp_intl_org_un.2.a: "We will apply again."
 cwp_intl_org_un.2.a.tt: "We may apply again in three years"
