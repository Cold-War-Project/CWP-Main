l_english:
 # Shared template text (organizations after the UN)
 cwp_io_not_applicant_tt: "Our application is not already waiting for a vote"
 cwp_io_not_rejected_tt: "We have not been turned down or left in the past few years"
 cwp_io_presidency_modifier: "Presidency of the North Atlantic Council"

 # North Atlantic founding conference
 je_cwp_nato_founding: "Negotiations on a North Atlantic Treaty"
 je_cwp_nato_founding_reason: "[GetGlobalVariable('cwp_nato_conf_caller').GetCountry.GetName] has called the free nations of Europe and North America to negotiate a treaty of mutual defense: an armed attack against one of them shall be considered an attack against them all. Each invited government must decide whether to sign."
 je_cwp_nato_founding_status: "Signed: #v [GetGlobalVariable('cwp_io_nato_conf_yes').GetValue|0]#! · Declined: #v [GetGlobalVariable('cwp_io_nato_conf_no').GetValue|0]#!\nThe conference closes after six months. If it fails but at least three European governments signed, they form a Western Union of their own."
 je_cwp_nato_founding_done_desc: "The North Atlantic Treaty has been signed, and the North Atlantic Treaty Organization is born."
 cwp_nato_founding_passes_tt: "The six months of negotiation are over"
 cwp_nato_conf_cond_signers_tt: "At least #v 5#! governments have signed"
 cwp_nato_conf_cond_majority_tt: "Most of the governments that answered have signed"
 cwp_nato_conf_cond_transatlantic_tt: "A North American government has signed: the treaty must span the Atlantic"
 cwp_nato_conf_cond_europe_tt: "A European great power has signed"
 cwp_nato_founding_effect_tt: "The signatories found the #b North Atlantic Treaty Organization#!"
 cwp_nato_conf_sign_button: "Sign the North Atlantic Treaty"
 cwp_nato_conf_sign_button_desc: "Bind ourselves to the common defense of the North Atlantic area."
 cwp_nato_conf_decline_button: "Decline to sign"
 cwp_nato_conf_decline_button_desc: "Keep our hands free and stay outside the alliance."
 cwp_nato_call_conference_decision: "Call for a North Atlantic Treaty"
 cwp_nato_call_conference_decision_desc: "Invite the governments of Europe and North America to bind themselves to a common defense against attack from the East."
 cwp_nato_call_conference_decision_tooltip: "Opens a six-month conference. Every eligible country in Europe and North America is invited to sign."
 cwp_nato_call_conference_tt: "We call a conference on a #b North Atlantic Treaty#!, and sign it ourselves"
 cwp_nato_threat_tt: "Relations with a leader of the eastern camp are no better than neutral"

 # NATO
 je_cwp_nato: "The North Atlantic Treaty Organization"
 je_cwp_nato_reason: "The members of the North Atlantic Treaty have agreed that an armed attack against one of them shall be considered an attack against them all. The North Atlantic Council decides by consensus, and its chair rotates among the members each year. New members are admitted only with the agreement of all."
 je_cwp_nato_status: "Members: #v [GetGlobalVariable('cwp_io_nato_members').GetValue|0]#!\nChair of the North Atlantic Council: [GetGlobalVariable('cwp_io_nato_president').GetCountry.GetName]"
 je_cwp_nato_status_plain: "Members: #v [GetGlobalVariable('cwp_io_nato_members').GetValue|0]#!"
 je_cwp_nato_status_article5: "#n [GetGlobalVariable('cwp_nato_article5_victim').GetCountry.GetName] has been attacked and invokes Article 5.#!\nMembers: #v [GetGlobalVariable('cwp_io_nato_members').GetValue|0]#!"
 cwp_nato_member_modifier: "North Atlantic Treaty"
 cwp_nato_article5_button: "Honor Article 5"
 cwp_nato_article5_button_desc: "Join the war on the side of our attacked ally."
 cwp_nato_article5_possible_tt: "Our ally is still at war, and we are not yet in that war"
 cwp_nato_article5_effect_tt: "We join every war of [GetGlobalVariable('cwp_nato_article5_victim').GetCountry.GetName] on its side"
 cwp_nato_withdraw_button: "Withdraw from NATO"
 cwp_nato_withdraw_button_desc: "Leave the alliance. We may apply again after five years."
 cwp_nato_apply_decision: "Apply to join NATO"
 cwp_nato_apply_decision_desc: "Ask the members of the North Atlantic Treaty to admit us. Every member must agree."
 cwp_nato_apply_decision_tooltip: "Our application comes to a vote once no other is pending. A single vote against blocks it."
 cwp_nato_apply_tt: "We apply to join the #b North Atlantic Treaty Organization#!"

 je_cwp_nato_admission: "Accession of [GetGlobalVariable('cwp_nato_admission_target').GetCountry.GetName] to NATO"
 je_cwp_nato_admission_concluded: "Accession of a new member to NATO"
 je_cwp_nato_admission_reason: "[GetGlobalVariable('cwp_nato_admission_target').GetCountry.GetName] has asked to join the North Atlantic Treaty. Every member voting must agree."
 je_cwp_nato_admission_status: "In favor: #v [GetGlobalVariable('cwp_io_nato_admission_yes').GetValue|0]#! · Against: #v [GetGlobalVariable('cwp_io_nato_admission_no').GetValue|0]#! · Abstaining: #v [GetGlobalVariable('cwp_io_nato_admission_abstain').GetValue|0]#!"
 cwp_nato_admission_vote_yes_button: "Support accession"
 cwp_nato_admission_vote_yes_button_desc: "Vote to admit the applicant."
 cwp_nato_admission_vote_no_button: "Oppose accession"
 cwp_nato_admission_vote_no_button_desc: "Vote against. A single vote against blocks accession."
 cwp_nato_admission_vote_abstain_button: "Abstain on accession"
 cwp_nato_admission_vote_abstain_button_desc: "Take no side. Abstentions do not block accession."

 # Warsaw founding conference
 je_cwp_wp_founding: "Conference on Safeguarding Peace and Security in Europe"
 je_cwp_wp_founding_reason: "Alarmed by the growth of the North Atlantic alliance, [GetGlobalVariable('cwp_wp_conf_caller').GetCountry.GetName] has invited the states of the eastern camp to a treaty of friendship, cooperation and mutual assistance, under a unified military command."
 je_cwp_wp_founding_status: "Signed: #v [GetGlobalVariable('cwp_io_wp_conf_yes').GetValue|0]#! · Declined: #v [GetGlobalVariable('cwp_io_wp_conf_no').GetValue|0]#!\n[GetGlobalVariable('cwp_wp_conf_caller').GetCountry.GetName] may proclaim the treaty once enough governments have signed. The conference lapses after a year."
 cwp_wp_conf_proclaim_button: "Proclaim the Warsaw Treaty"
 cwp_wp_conf_proclaim_button_desc: "Declare the treaty in force among the governments that have signed, under a unified command."
 cwp_wp_conf_cond_signers_tt: "At least #v 4#! governments have signed"
 cwp_wp_conf_cond_majority_tt: "Most of the governments that answered have signed"
 je_cwp_wp_founding_done_desc: "The Warsaw Treaty has been signed, and the Warsaw Pact is born."
 cwp_wp_founding_passes_tt: "The treaty has been proclaimed"
 cwp_wp_founding_effect_tt: "The signatories found the #b Warsaw Pact#!"
 cwp_wp_conf_sign_button: "Sign the Warsaw Treaty"
 cwp_wp_conf_sign_button_desc: "Join the treaty of friendship, cooperation and mutual assistance."
 cwp_wp_conf_decline_button: "Decline to sign"
 cwp_wp_conf_decline_button_desc: "Stay outside the eastern alliance."
 cwp_wp_call_conference_decision: "Answer the North Atlantic alliance"
 cwp_wp_call_conference_decision_desc: "The Western alliance grows and rearms. Bind the states of our camp into a treaty of mutual assistance under a unified command."
 cwp_wp_call_conference_decision_tooltip: "Opens a six-month conference. Every country of the eastern camp in Europe is invited to sign."
 cwp_wp_call_conference_tt: "We call a conference on a #b mutual assistance treaty#!, and sign it ourselves"
 cwp_wp_threat_tt: "A North Atlantic alliance exists and has taken in a new member since its founding"

 # Warsaw Pact
 je_cwp_wp: "The Warsaw Pact"
 je_cwp_wp_reason: "The members of the Warsaw Treaty have pledged mutual assistance and placed their armed forces under a unified command. The Political Consultative Committee decides by a majority weighted by each member's economic weight, which leaves the strongest member in charge."
 je_cwp_wp_status: "Members: #v [GetGlobalVariable('cwp_io_wp_members').GetValue|0]#!"
 je_cwp_wp_status_rotating: "Members: #v [GetGlobalVariable('cwp_io_wp_members').GetValue|0]#!\nChair: [GetGlobalVariable('cwp_io_wp_president').GetCountry.GetName]"
 cwp_wp_member_modifier: "Warsaw Treaty"
 cwp_wp_withdraw_button: "Withdraw from the Warsaw Pact"
 cwp_wp_withdraw_button_desc: "Declare our neutrality and leave the Pact. The leading member will not take it lightly."
 cwp_wp_apply_decision: "Apply to join the Warsaw Pact"
 cwp_wp_apply_decision_desc: "Ask the members of the Warsaw Treaty to admit us."
 cwp_wp_apply_decision_tooltip: "Our application comes to a vote of the members, weighted by their economic weight."
 cwp_wp_apply_tt: "We apply to join the #b Warsaw Pact#!"

 je_cwp_wp_admission: "Accession of [GetGlobalVariable('cwp_wp_admission_target').GetCountry.GetName] to the Warsaw Pact"
 je_cwp_wp_admission_concluded: "Accession of a new member to the Warsaw Pact"
 je_cwp_wp_admission_reason: "[GetGlobalVariable('cwp_wp_admission_target').GetCountry.GetName] has asked to join the Warsaw Treaty. A majority weighted by economic weight decides."
 je_cwp_wp_admission_status: "In favor: #v [GetGlobalVariable('cwp_io_wp_admission_yes').GetValue|0]#! · Against: #v [GetGlobalVariable('cwp_io_wp_admission_no').GetValue|0]#! · Abstaining: #v [GetGlobalVariable('cwp_io_wp_admission_abstain').GetValue|0]#!"
 cwp_wp_admission_vote_yes_button: "Support accession"
 cwp_wp_admission_vote_yes_button_desc: "Vote to admit the applicant."
 cwp_wp_admission_vote_no_button: "Oppose accession"
 cwp_wp_admission_vote_no_button_desc: "Vote against admission."
 cwp_wp_admission_vote_abstain_button: "Abstain on accession"
 cwp_wp_admission_vote_abstain_button_desc: "Take no side."

 # Events
 cwp_intl_org_nato.1.t: "Admitted to NATO"
 cwp_intl_org_nato.1.d: "Every member of the North Atlantic Council has agreed to our accession. Our forces now take their place in the alliance's defense plans."
 cwp_intl_org_nato.1.f: "\"...an armed attack against one or more of them in Europe or North America shall be considered an attack against them all...\"\n— North Atlantic Treaty, Article 5"
 cwp_intl_org_nato.1.a: "Take our place in the alliance."
 cwp_intl_org_nato.1.a.tt: "We are a member of the #b North Atlantic Treaty Organization#!"
 cwp_intl_org_nato.2.t: "NATO Application Blocked"
 cwp_intl_org_nato.2.d: "Our bid to join the North Atlantic Treaty did not win the agreement of every member."
 cwp_intl_org_nato.2.f: "\"The Parties may, by unanimous agreement, invite any other European State in a position to further the principles of this Treaty and to contribute to the security of the North Atlantic area to accede to this Treaty.\"\n— North Atlantic Treaty, Article 10"
 cwp_intl_org_nato.2.a: "We will try again."
 cwp_intl_org_nato.2.a.tt: "We may apply again in three years"
 cwp_intl_org_nato.3.t: "Admitted to the Warsaw Pact"
 cwp_intl_org_nato.3.d: "The members of the Warsaw Treaty have accepted us. Our army now answers to the unified command."
 cwp_intl_org_nato.3.f: "#italic Treaty of Friendship, Co-operation and Mutual Assistance#!"
 cwp_intl_org_nato.3.a: "For the common defense."
 cwp_intl_org_nato.3.a.tt: "We are a member of the #b Warsaw Pact#!"
 cwp_intl_org_nato.4.t: "Warsaw Pact Application Rejected"
 cwp_intl_org_nato.4.d: "The members of the Warsaw Treaty have turned down our application."
 cwp_intl_org_nato.4.f: "The Political Consultative Committee has voted against our accession."
 cwp_intl_org_nato.4.a: "Accept the decision."
 cwp_intl_org_nato.4.a.tt: "We may apply again in three years"
 cwp_weu_member_modifier: "Western Union"
 cwp_intl_org_nato.5.t: "A Western Union"
 cwp_intl_org_nato.5.d: "The North Atlantic conference has broken up without the transatlantic treaty its sponsors wanted. The European governments that signed have bound themselves to each other's defense all the same."
 cwp_intl_org_nato.5.f: "#italic Treaty of Economic, Social and Cultural Collaboration and Collective Self-Defence#!"
 cwp_intl_org_nato.5.a: "Join the Western Union."
 cwp_intl_org_nato.5.a.tt: "We join the #b Western Union#!"
