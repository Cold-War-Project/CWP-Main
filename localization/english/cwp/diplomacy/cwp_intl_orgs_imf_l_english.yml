l_english:
 je_cwp_imf: "The International Monetary Fund"
 je_cwp_imf_reason: "Created at Bretton Woods to keep exchange rates stable and lend to members in balance-of-payments difficulties. Each member's votes follow its quota, so the largest economies carry the most weight; ordinary decisions need a majority of the votes cast. A member in difficulty may ask for a stand-by arrangement: money now, in return for policy conditions."
 je_cwp_imf_status: "Members: #v [GetGlobalVariable('cwp_io_imf_members').GetValue|0]#!\nDecisions need #v [GetGlobalVariable('cwp_io_imf_threshold').GetValue|0]%#! of the weighted votes cast."
 je_cwp_imf_status_rotating: "Members: #v [GetGlobalVariable('cwp_io_imf_members').GetValue|0]#!\nChair: [GetGlobalVariable('cwp_io_imf_president').GetCountry.GetName]"
 cwp_imf_request_standby_button: "Request a stand-by arrangement"
 cwp_imf_request_standby_button_desc: "Ask the Executive Board for a loan to steady our finances. The conditions will bind our spending for five years."
 cwp_imf_in_difficulty_tt: "We are in default, deep in debt, or less than a year from bankruptcy"
 cwp_imf_no_request_tt: "We have no request pending and have not had one granted or refused recently"
 cwp_imf_request_standby_tt: "Our request goes to a weighted vote of the members once no other is pending"
 cwp_imf_withdraw_button: "Withdraw from the Fund"
 cwp_imf_withdraw_button_desc: "Leave the IMF. We cannot leave while a stand-by arrangement binds us."
 cwp_imf_apply_decision: "Apply to join the IMF"
 cwp_imf_apply_decision_desc: "Ask the members of the International Monetary Fund to admit us."
 cwp_imf_apply_decision_tooltip: "Our application goes to a vote of the members, weighted by their quotas."
 cwp_imf_apply_tt: "We apply to join the #b International Monetary Fund#!"
 cwp_imf_conditionality_modifier: "IMF Conditionality"

 je_cwp_imf_admission: "Membership of [GetGlobalVariable('cwp_imf_admission_target').GetCountry.GetName] in the IMF"
 je_cwp_imf_admission_concluded: "Membership of a new member in the IMF"
 je_cwp_imf_admission_reason: "[GetGlobalVariable('cwp_imf_admission_target').GetCountry.GetName] has applied to join the International Monetary Fund. A majority of the weighted votes cast decides."
 je_cwp_imf_admission_status: "In favour: #v [GetGlobalVariable('cwp_io_imf_admission_yes').GetValue|1]#! · Against: #v [GetGlobalVariable('cwp_io_imf_admission_no').GetValue|1]#! · Abstaining: #v [GetGlobalVariable('cwp_io_imf_admission_abstain').GetValue|1]#! (weighted votes)"
 cwp_imf_admission_vote_yes_button: "Support membership"
 cwp_imf_admission_vote_yes_button_desc: "Vote to admit the applicant."
 cwp_imf_admission_vote_no_button: "Oppose membership"
 cwp_imf_admission_vote_no_button_desc: "Vote against admission."
 cwp_imf_admission_vote_abstain_button: "Abstain on membership"
 cwp_imf_admission_vote_abstain_button_desc: "Take no side."

 je_cwp_imf_loan: "Stand-by Arrangement for [GetGlobalVariable('cwp_imf_loan_target').GetCountry.GetName]"
 je_cwp_imf_loan_concluded: "A stand-by arrangement"
 je_cwp_imf_loan_reason: "[GetGlobalVariable('cwp_imf_loan_target').GetCountry.GetName] has asked the Fund for a stand-by arrangement. If the weighted majority agrees, it receives a loan worth a share of its GDP and must keep to the Fund's conditions for five years."
 je_cwp_imf_loan_status: "In favour: #v [GetGlobalVariable('cwp_io_imf_loan_yes').GetValue|1]#! · Against: #v [GetGlobalVariable('cwp_io_imf_loan_no').GetValue|1]#! · Abstaining: #v [GetGlobalVariable('cwp_io_imf_loan_abstain').GetValue|1]#! (weighted votes)"
 cwp_imf_loan_vote_yes_button: "Approve the arrangement"
 cwp_imf_loan_vote_yes_button_desc: "Vote to lend, on the Fund's conditions."
 cwp_imf_loan_vote_no_button: "Refuse the arrangement"
 cwp_imf_loan_vote_no_button_desc: "Vote against the loan."
 cwp_imf_loan_vote_abstain_button: "Abstain on the arrangement"
 cwp_imf_loan_vote_abstain_button_desc: "Take no side."

 cwp_intl_org_imf.1.t: "Admitted to the IMF"
 cwp_intl_org_imf.1.d: "The members of the International Monetary Fund have accepted our application. Our quota is fixed, and the Fund's resources are open to us in time of need."
 cwp_intl_org_imf.1.f: "\"To promote international monetary cooperation...\"\n#italic Article I of the IMF Articles of Agreement#!"
 cwp_intl_org_imf.1.a: "Good."
 cwp_intl_org_imf.1.a.tt: "We are a member of the #b International Monetary Fund#!"
 cwp_intl_org_imf.2.t: "IMF Application Rejected"
 cwp_intl_org_imf.2.d: "The weighted vote of the Fund's members has gone against us."
 cwp_intl_org_imf.2.f: "Votes in the Fund follow each member's quota."
 cwp_intl_org_imf.2.a: "We will apply again."
 cwp_intl_org_imf.2.a.tt: "We may apply again in three years"
 cwp_intl_org_imf.3.t: "Stand-by Arrangement Approved"
 cwp_intl_org_imf.3.d: "The Executive Board has approved our request. The money arrives at once; the conditions will follow us for five years."
 cwp_intl_org_imf.3.f: "\"...making the general resources of the Fund temporarily available to them under adequate safeguards...\"\n#italic Article I of the IMF Articles of Agreement#!"
 cwp_intl_org_imf.3.a: "We accept the conditions."
 cwp_intl_org_imf.3.a.tt: "We receive the loan and take on #b IMF Conditionality#! for five years"
 cwp_intl_org_imf.4.t: "Stand-by Arrangement Refused"
 cwp_intl_org_imf.4.d: "The Executive Board has turned down our request for a stand-by arrangement."
 cwp_intl_org_imf.4.f: "The Executive Board has declined the request."
 cwp_intl_org_imf.4.a: "Then we will manage alone."
 cwp_intl_org_imf.4.a.tt: "We may ask again in two years"
 je_cwp_imf_programme: "Fund-Supported Programme"
 je_cwp_imf_programme_reason: "We have drawn on the Fund. For as long as the programme lasts we must keep to its conditions: lower public wages and a firm hand on the budget. The Fund's reviewers will judge us on what our accounts show, not on what our ministers promise."
 je_cwp_imf_programme_done_desc: "The Fund's review found our finances restored. The programme is closed, and lenders trust us again."
 je_cwp_imf_programme_failed_desc: "We stayed in default past the grace period. The Fund has suspended the programme."
 je_cwp_imf_programme_expired_desc: "The stand-by arrangement has run its course."
 cwp_imf_programme_review_tt: "The first programme review, two years in, has taken place"
 cwp_imf_programme_grace_tt: "The grace year is over"
 cwp_imf_programme_expired_tt: "The conditions lapse"
 cwp_imf_credit_restored_modifier: "IMF Programme Completed"
 cwp_imf_programme_suspended_modifier: "IMF Programme Off Track"
