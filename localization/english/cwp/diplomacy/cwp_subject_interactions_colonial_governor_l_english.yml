l_english:
# Subject Interaction: da_appoint_colonial_governor - Appointing a Governor
  subject_interactions_colonial_governor.1.title: "Appointing a Governor"
  subject_interactions_colonial_governor.1.desc: "There are several potential types of candidates that we can consider for the head of administration in [SCOPE.sCountry('target_country').GetName]. What type of leader are we looking for?"
  subject_interactions_colonial_governor.1.flavor: ""Governance is a very delicate thing. Every state has its own precise pressures, its lobbies, and its concerns. It's our job to ensure that all these issues are effectively swept off the board, never to interfere with our aims again.""
  subject_interactions_colonial_governor.1.a: "Mr. [SCOPE.sCharacter('colonial_governor_plantation_scope').GetLastName], the [GetCharacterTrait('special_character_colonial_plantation').GetName] will take charge."
  subject_interactions_colonial_governor.1.b: "Let us go with a [GetCharacterTrait('special_character_colonial_local').GetName]: Mr. [SCOPE.sCharacter('colonial_governor_local_scope').GetLastName]."
  subject_interactions_colonial_governor.1.c: "Award the office to Mr. [SCOPE.sCharacter('colonial_governor_extraction_scope').GetLastName], the [GetCharacterTrait('special_character_colonial_extraction').GetName]."
  subject_interactions_colonial_governor.1.d: "Mr. [SCOPE.sCharacter('colonial_governor_business_scope').GetLastName], the [GetCharacterTrait('special_character_colonial_business').GetName], is the best choice."
  subject_interactions_colonial_governor.1.e: "The [GetCharacterTrait('special_character_colonial_military').GetName] [SCOPE.sCharacter('colonial_governor_military_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('colonial_governor_military_scope').GetLastName] will ensure stability."

# Subject Interaction: da_request_colonial_governor - Requesting a Governor
  subject_interactions_colonial_governor.2.title: "Requesting a Governor"
  subject_interactions_colonial_governor.2.desc: "Deeming [SCOPE.sCharacter('relevant_character').GetPrimaryRoleTitle] [SCOPE.sCharacter('relevant_character').GetLastName]'s handling of [ROOT.GetCountry.GetAdjective] affairs inadequate, the political establishment of [ROOT.GetCountry.GetCapital.GetCityHubName] has requested that [SCOPE.sCountry('relevant_country').GetName] appoint a new governor more aligned with its objectives."
  subject_interactions_colonial_governor.2.flavor: ""Governance is a very delicate thing. Every state has its own precise pressures, its lobbies, and its concerns. It's our job to ensure that all these issues are effectively swept off the board, never to interfere with our aims again.""
  subject_interactions_colonial_governor.2.a: "Mr. [SCOPE.sCharacter('colonial_governor_plantation_scope').GetLastName], the [GetCharacterTrait('special_character_colonial_plantation').GetName] will take charge."
  subject_interactions_colonial_governor.2.b: "Let us go with a [GetCharacterTrait('special_character_colonial_local').GetName]: Mr. [SCOPE.sCharacter('colonial_governor_local_scope').GetLastName]."
  subject_interactions_colonial_governor.2.c: "Award the office to Mr. [SCOPE.sCharacter('colonial_governor_extraction_scope').GetLastName], the [GetCharacterTrait('special_character_colonial_extraction').GetName]."
  subject_interactions_colonial_governor.2.d: "Mr. [SCOPE.sCharacter('colonial_governor_business_scope').GetLastName], the [GetCharacterTrait('special_character_colonial_business').GetName], is the best choice."
  subject_interactions_colonial_governor.2.e: "The [GetCharacterTrait('special_character_colonial_military').GetName] [SCOPE.sCharacter('colonial_governor_military_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('colonial_governor_military_scope').GetLastName] will ensure stability."
