l_english:
# Diplomacy Event: Diplomatic Action - Violate Sovereignty: violate_sovereignty
  diplomacy_violate_sovereignty_events.1.title: "Violation of Sovereignty"
  diplomacy_violate_sovereignty_events.1.desc: "[SCOPE.sC('initiator').GetName] has sent an ultimatum to [SCOPE.sC('target_country').GetName] demanding they join them in the [SCOPE.sW('war').GetName|v] war.\nThey refused and sided with [SCOPE.sW('war').GetLeaderOfOppositeSide( SCOPE.sC('initiator') ).GetName]!\nWhat do we do?"
  diplomacy_violate_sovereignty_events.1.flavor: "The smoke coming from the fireplace is enough to stain the windows of the office with a pale smog, now that the sunset is imminent. The street lamps are getting lit, and two men share a concerned look.\n\n"The lamps are going out all over the world, and we shall not see them lit again in our life-time.""
  diplomacy_violate_sovereignty_events.1.a: "We must aid [SCOPE.sC('target_country').GetName]!"
  diplomacy_violate_sovereignty_events.1.b: "Not our business."
