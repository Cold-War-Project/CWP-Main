 cwp_indochina_resistance_war: "War of National Resistance"
 cwp_indochina.3.t: "The Accords Break Down"
 cwp_indochina.3.d: "The agreements that made us a free state within the French Union are not being kept. French troops have occupied the customs house at Haiphong, French warships have shelled the city, and in Paris the conference on our future has ended without result. Our commanders say the army is ready to fight from the hills; our negotiators say one more round of talks might yet save the peace."
 cwp_indochina.3.f: "Let him who has a rifle use his rifle; let him who has a sword use his sword."
 cwp_indochina.3.a: "Appeal for national resistance."
 cwp_indochina.3.b: "Return to the negotiating table."
 cwp_indonesia_milestone_war_fought_tt: "The Netherlands has launched a police action and the war has been fought for at least 18 months"
