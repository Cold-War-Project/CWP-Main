 cwp_indochina_viet_minh_resistance: "Viet Minh Resistance"
 cwp_philippine_independence_promised: "Tydings-McDuffie Act"
 cwp_decolonization.4.t: "The Afro-Asian Conference"
 cwp_decolonization.4.d: "Delegations from the newly independent nations of Asia and Africa have met for the first time without a European power at the table. They have condemned colonialism in all its forms, declared that they will not simply take sides between the two blocs, and promised to support the peoples still under foreign rule. The colonial powers can no longer treat their empires as a private matter."
 cwp_decolonization.4.f: "The voices of the formerly colonized are heard together."
 cwp_decolonization.4.a: "A new force in the world."

