l_english:
 # --- Group and shared ---
 je_group_cwp_decolonization: "Decolonization"
 je_cwp_decolonization_invalid_desc: "The situation no longer applies."
 cwp_button_cooldown_tt: "This was done recently and cannot be repeated yet"
 cwp_bar_metropole_debt: "The metropole is deep in debt"
 cwp_bar_metropole_anticolonial_government: "Labour or the intelligentsia sit in the metropole's government"
 cwp_bar_metropole_imperialist_government: "The army or the landed interest sit in the metropole's government"
 cwp_bar_tide_rising: "Anti-colonial nationalism is growing worldwide"
 cwp_bar_tide_strong: "Anti-colonial nationalism is strong worldwide"

 # --- The Winds of Change ---
 je_cwp_winds_of_change: "The Winds of Change"
 je_cwp_winds_of_change_reason: "The Second World War left the colonial empires shaken. Britain ended it deep in debt to the United States, France and the Netherlands had themselves been occupied, and in Java and Indochina nationalists proclaimed independent republics within weeks of Japan's surrender. In the Atlantic Charter the Allies declared that they 'respect the right of all peoples to choose the form of government under which they will live', and the United Nations Charter speaks of the 'self-determination of peoples'. Colonial nationalists mean to hold the powers to their word."
 je_cwp_winds_of_change_status_0: "Few colonies have won independence"
 je_cwp_winds_of_change_status_1: "Decolonization has begun"
 je_cwp_winds_of_change_status_2: "Decolonization is accelerating"
 je_cwp_winds_of_change_status_3: "Most colonies have won independence"
 je_cwp_winds_of_change_status_4: "Decolonization is largely complete"
 je_cwp_winds_of_change_end_desc: "No colonies remain. The age of the great colonial empires is over."
 je_cwp_winds_of_change_end_tt: "No colonies remain under a colonial power"
 je_cwp_winds_of_change_end_effect_tt: "The Winds of Change ends"

 cwp_tide_bar: "Anti-Colonial Nationalism"
 cwp_tide_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_tide_bar_explain_tt Anti-colonial nationalism#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 cwp_tide_bar_explain_tt: "How strongly the world's opinion presses against colonial rule. At 25, 50, 75 and 100 every colony's #b liberty desire#! grows faster."
 cwp_tide_bar_new_independences: "Nations that won independence last month"
 cwp_tide_bar_free_former_colonies: "The voice of free former colonies"
 cwp_tide_bar_colonial_wars: "Colonies at war with their rulers"
 cwp_tide_bar_usa_champion: "The United States champions self-determination"
 cwp_tide_bar_usa_guardian: "The United States stands by its allies' empires"
 cwp_tide_bar_rus_champion: "The Soviet Union champions national liberation"
 cwp_tide_bar_rus_guardian: "The Soviet Union keeps out of colonial questions"
 cwp_tide_bar_setbacks: "A colonial power crushed a rising last month"

 cwp_anticolonial_tide: "Anti-Colonial Nationalism"
 cwp_colonial_development_funds: "Colonial Development Funds"
 cwp_colonial_development_funds_subject: "Colonial Development Spending"
 cwp_colonial_repression: "Emergency Rule"
 cwp_colonial_repression_metropole: "Colonial Emergency"
 cwp_self_government_promised: "Self-Government Promised"
 cwp_nationalist_campaign: "Nationalist Campaign"
 cwp_champion_of_self_determination: "Champion of Self-Determination"
 cwp_guardian_of_allied_empires: "Support for Allied Empires"
 cwp_new_nation: "Newly Independent State"
 cwp_end_of_empire: "End of Empire"

 cwp_woc_champion_self_determination_button: "Champion Self-Determination"
 cwp_woc_champion_self_determination_button_desc: "Declare that the peoples under colonial rule have the right to choose their own government, and let the new nations know who stood with them. The colonial powers, some of them our partners, will take it badly."
 cwp_woc_guard_allied_empires_button: "Stand by Our Allies"
 cwp_woc_guard_allied_empires_button_desc: "An empire collapsing in disorder helps only our rivals. Quietly support the colonial powers' authority, and accept that the nationalists will remember it."
 cwp_woc_development_funds_button: "Fund Colonial Development"
 cwp_woc_development_funds_button_desc: "Vote money for roads, schools, clinics and power stations in the colonies, as the British Colonial Development and Welfare Acts and the French investment fund for the overseas territories did. Ministers hope that jobs and wages will take the edge off nationalist agitation."
 cwp_woc_promise_self_government_button: "Promise Self-Government"
 cwp_woc_promise_self_government_button_desc: "Announce new constitutions, elected councils and a path to self-rule. The promise calms our colonies for a while, but nationalists in every other colony will ask for the same terms."
 cwp_woc_hold_the_line_button: "Declare an Emergency"
 cwp_woc_hold_the_line_button_desc: "Ban the nationalist parties, detain their leaders and send in the troops. An emergency can restore order, but it costs money and standing abroad, and the detained leaders become martyrs."
 cwp_woc_managed_withdrawal_button: "Transfer Power"
 cwp_woc_managed_withdrawal_button_desc: "Hand over power to the elected leaders of the colony most ready for it, and keep the bases, trade and goodwill that a negotiated transfer of power can preserve."
 cwp_woc_managed_withdrawal_button_possible_tt: "At least one of our colonies has a #b liberty desire#! of 75 or more, or has been promised independence"
 cwp_woc_nationalist_campaign_button: "Mass Nationalist Campaign"
 cwp_woc_nationalist_campaign_button_desc: "Call strikes, boycotts and marches across the country. Every closed shop and empty office tells our rulers that they govern only with our consent."
 cwp_woc_appeal_to_superpowers_button: "Appeal to the Superpowers"
 cwp_woc_appeal_to_superpowers_button_desc: "Send a delegation to the capitals that speak for self-determination and ask them to say so on our behalf."
 cwp_woc_appeal_to_superpowers_button_possible_tt: "The United States or the Soviet Union champions self-determination"

 cwp_decolonization.1.t: "Independence Day"
 cwp_decolonization.1.d: "At midnight the colonial flag was lowered over [ROOT.GetCountry.GetCapital.GetName] and the national flag raised in its place, and crowds filled the streets until morning. The new government inherits ministries, an army and a treasury that the colonial service ran until yesterday. It must also decide where it stands between the Western and Soviet blocs, each of which has already sent its congratulations."
 cwp_decolonization.1.f: "\"We, the people of Indonesia, hereby declare the independence of Indonesia.\"\n— Proclamation of Indonesian Independence, 17 August 1945"
 cwp_decolonization.1.a: "We will steer our own course."
 cwp_decolonization.1.b: "Our future lies with the free nations of the West."
 cwp_decolonization.1.c: "Our future lies with the socialist camp."
 cwp_decolonization.2.t: "The Flag Comes Down"
 cwp_decolonization.2.d: "The last governor of [SCOPE.sCountry('cwp_new_state').GetName] has handed over his seals of office, and the garrison is coming home. The government's critics on the right call it a betrayal of the settlers and soldiers who served there. Ministers reply that the country can no longer pay to hold territories that want to go."
 cwp_decolonization.2.f: "\"Lo, all our pomp of yesterday\nIs one with Nineveh and Tyre!\"\n— Rudyard Kipling, Recessional"
 cwp_decolonization.2.a: "We part as friends."
 cwp_decolonization.2.b: "A humiliation we will not forget."
 cwp_decolonization.3.t: "Decolonization Accelerates"
 cwp_decolonization.3.d_1: "Nationalist leaders across the colonial world are watching each other. Every concession won in one colony is quoted in the speeches of the next, and the colonial powers are learning that they can no longer deal with their territories one at a time."
 cwp_decolonization.3.d_2: "The empires are in retreat. The new nations speak together at international conferences and in the United Nations, and the case for colonial rule is now made only in the metropoles themselves."
 cwp_decolonization.3.d_3: "Colonial rule is breaking down across Asia and Africa. Nationalist parties now argue about the date of independence, not the principle, and the governments still holding colonies are counting the cost in money, soldiers and allies."
 cwp_decolonization.3.d_4: "Few colonies remain, and those that do are held against the opinion of nearly every government in the United Nations."
 cwp_decolonization.3.f_1: "\"To develop friendly relations among nations based on respect for the principle of equal rights and self-determination of peoples.\"\n— Charter of the United Nations, Article 1"
 cwp_decolonization.3.f_2: "\"All the peoples on the earth are equal from birth, all the peoples have a right to live, to be happy and free.\"\n— Declaration of Independence of the Democratic Republic of Vietnam, 1945"
 cwp_decolonization.3.f_3: "\"We are determined to be free.\"\n— Declaration to the Colonial Powers, Fifth Pan-African Congress, Manchester, 1945"
 cwp_decolonization.3.f_4: "\"Colonial and subject peoples of the world, unite!\"\n— Declaration to the Colonial Workers, Farmers and Intellectuals, Fifth Pan-African Congress, 1945"
 cwp_decolonization.3.a: "We must take account of it."

 # --- India ---
 je_cwp_india_transfer_of_power: "The Transfer of Power"
 je_cwp_india_transfer_of_power_reason: "Britain's Labour government took office in 1945 pledged to Indian self-government. The elections to the central legislature in December 1945 divided India between the Congress, which claims to speak for all Indians, and the Muslim League, which won every Muslim seat on the demand for Pakistan. The Red Fort trials of Indian National Army officers turned the accused into national heroes and showed how far British rule depends on Indian soldiers and police."
 je_cwp_india_transfer_of_power_status_united: "A united India is still possible"
 cwp_india_invalid_tt: "India is no longer under British rule"
 cwp_indonesia_invalid_tt: "Indonesia has passed out of Dutch hands"
 cwp_indochina_invalid_tt: "Vietnam has passed out of French hands"
 cwp_algeria_invalid_tt: "France no longer holds Algiers"
 cwp_woc_not_champion_tt: "We have not already taken this stand"
 cwp_india_no_date_tt: "No date for the transfer of power has been set"
 cwp_indochina_no_negotiations_tt: "Negotiations have not yet begun"
 cwp_algeria_no_offer_tt: "Self-determination has not yet been offered"
 cwp_india_still_british_tt: "India is still under British rule"
 cwp_india_communal_below_45_tt: "Communal tension is below #v 45#!"
 cwp_india_communal_45_tt: "Communal tension is #v 45#! or more"
 cwp_india_independent_tt: "India is independent"
 cwp_indonesia_independent_tt: "Indonesia is independent"
 cwp_indonesia_dutch_restored_tt: "The Republic is gone or under Dutch rule again"
 cwp_indochina_negotiations_tt: "France has agreed to negotiate"
 cwp_indochina_dai_independent_tt: "The Democratic Republic of Vietnam is independent"
 cwp_indochina_french_union_tt: "The Viet Minh state is gone, or back in the French Union after a war"
 cwp_algeria_self_determination_tt: "France has offered Algeria self-determination"
 cwp_algeria_no_self_determination_tt: "France has not offered self-determination"
 cwp_algeria_insurgency_100_tt: "The insurgency reaches #v 100#!"
 cwp_algeria_insurgency_0_tt: "The insurgency falls to #v 0#!"
 je_cwp_india_transfer_of_power_status_partition: "Partition looks increasingly likely"
 je_cwp_india_transfer_of_power_status_date: "Britain has announced its withdrawal"
 je_cwp_india_united_desc: "Britain has handed power to a single Indian government."
 je_cwp_india_partition_desc: "Britain has left, and the subcontinent has been partitioned between India and Pakistan."
 je_cwp_india_won_desc: "India has broken free of British rule."

 cwp_india_communal_bar: "Communal Tension"
 cwp_india_communal_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_india_communal_bar_explain_tt Communal tension#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#! (partition at 45)"
 cwp_india_communal_bar_explain_tt: "Distrust between Hindus and Muslims, and the Muslim League's demand for a separate Pakistan. At 45 or more when power is transferred, India is partitioned."
 cwp_india_communal_two_nations: "The two-nation theory"
 cwp_india_communal_muslim_movement: "Muslim nationalist movement"
 cwp_india_communal_hindu_movement: "Hindu nationalist movement"
 cwp_india_communal_unity_talks: "Congress-League talks"
 cwp_india_communal_direct_action: "Communal riots"
 cwp_india_communal_cabinet_mission: "A British mission seeks a federal settlement"
 cwp_india_communal_divide_and_rule: "Divide and rule"
 cwp_india_communal_violence: "Partition Violence"
 cwp_india_cabinet_mission: "Cabinet Mission"

 cwp_india_cabinet_mission_button: "Send a Cabinet Mission"
 cwp_india_cabinet_mission_button_desc: "Send ministers to India to negotiate a federal constitution that both Congress and the League can accept: a weak center, strong provinces, and groupings of Muslim-majority provinces short of a separate state."
 cwp_india_restore_order_button: "Restore Order"
 cwp_india_restore_order_button_desc: "Arrest the agitators and give the army a free hand. It may buy time for the Raj, and the communities will be left to blame each other."
 cwp_india_set_date_button: "Set a Date for Withdrawal"
 cwp_india_set_date_button_desc: "Announce in Parliament that Britain will hand over power by a fixed date, whatever the Indian parties agree among themselves. A deadline forces the issue."
 cwp_india_set_date_button_effect_tt: "India becomes independent. If #b Communal Tension#! is 45 or more, the subcontinent is partitioned between India and Pakistan"
 cwp_india_quit_india_button: "Quit India"
 cwp_india_quit_india_button_desc: "Call the country out against British rule once more, as Congress did in 1942. Hartals, marches and civil disobedience in every province."
 cwp_india_unity_talks_button: "Congress-League Talks"
 cwp_india_unity_talks_button_desc: "Open talks with the Muslim League on guarantees for Muslim provinces within one India. Every concession will be attacked by our own hardliners."

 cwp_india.1.t: "The Question of India"
 cwp_india.1.d_gbr: "India cannot be held as it was before the war. Indian troops fought in Burma and Italy and expect their reward, the Treasury cannot pay for a long struggle, and the elections of December 1945 split the subcontinent between the Congress and the Muslim League. The Cabinet has to decide how to hand over power, and to whom."
 cwp_india.1.d_hnd: "The war is over and the Congress leaders are out of prison. The British say they will leave, as they have said before. The Muslim League has won every Muslim seat in the central legislature on the demand for Pakistan, and each month without an agreement makes a united India harder to save."
 cwp_india.1.f_gbr: "\"I have not become the King's First Minister in order to preside over the liquidation of the British Empire.\"\n— Winston Churchill, Mansion House, 1942"
 cwp_india.1.f_hnd: "\"Swaraj is my birthright, and I shall have it.\"\n— Bal Gangadhar Tilak"
 cwp_india.1.a: "Then let us settle it."
 cwp_india.2.t: "Direct Action"
 cwp_india.2.d: "The Muslim League's Direct Action Day has ended in days of killing between Hindus and Muslims in Calcutta, and the riots are spreading across Bengal. Thousands are dead and many more have fled their homes. Each community blames the other, and the provincial government has lost control of the streets."
 cwp_india.2.f: "\"This day we bid goodbye to constitutional methods.\"\n— Muhammad Ali Jinnah, to the Muslim League Council (attributed)"
 cwp_india.2.a: "Send in the troops."
 cwp_india.2.b: "Appeal to both communities for peace."
 cwp_india.3.t: "The Royal Indian Navy Mutiny"
 cwp_india.3.d: "Ratings of the Royal Indian Navy have seized their ships in Bombay and Karachi, hauled down the ensign and raised the flags of Congress and the League side by side. Dockworkers and mill hands in Bombay have struck in sympathy. The mutiny will be put down, but ministers in London now doubt that the Indian forces can be relied on to hold India for Britain."
 cwp_india.3.f: "The strikers have elected a Naval Central Strike Committee to speak for them."
 cwp_india.3.a: "Stand with the ratings."
 cwp_india.10.t: "Tryst with Destiny"
 cwp_india.10.d_gbr: "At midnight the British Raj ended and power passed to the government of a united India. The new state has kept its ties with Britain, and many British officers and officials are staying on to serve it."
 cwp_india.10.d_hnd: "At midnight India became free, one country from the Himalayas to Cape Comorin. The new government must now give a nation of four hundred million a constitution of its own."
 cwp_india.10.f_gbr: "\"Whenever it comes, it will be the proudest day in English history.\"\n— Thomas Babington Macaulay, House of Commons, 1833"
 cwp_india.10.f_hnd: "\"We believe that it is the inalienable right of the Indian people, as of any other people, to have freedom and to enjoy the fruits of their toil.\"\n— Declaration of Purna Swaraj, 1930"
 cwp_india.10.a: "Celebrate the day."
 cwp_india.11.t: "Partition"
 cwp_india.11.d_gbr: "Britain has left India, and India has been divided. A boundary drawn in weeks runs through Punjab and Bengal, and millions are crossing it in both directions amid massacres that the departing administration cannot stop."
 cwp_india.11.d_hnd: "Freedom has come, and with it partition. Pakistan has been carved from the Muslim-majority provinces of the west and from East Bengal. Refugee columns stretch along every road in Punjab, and the question of Kashmir is still open."
 cwp_india.11.d_pak: "Pakistan exists. A state in two wings a thousand miles apart, born in the middle of one of the largest migrations in history, must now build a government, an army and a capital almost from nothing."
 cwp_india.11.f_gbr: "The new border cuts through the canal colonies of Punjab and the jute country of Bengal."
 cwp_india.11.f_hnd: "Refugee trains are arriving at Amritsar and Lahore with the dead in their carriages."
 cwp_india.11.f_pak: "\"Mussalmans are a nation according to any definition of a nation, and they must have their homelands, their territory and their State.\"\n— Muhammad Ali Jinnah, Lahore, 1940"
 cwp_india.11.a: "May the bloodshed end soon."
 cwp_india.12.t: "Indian Independence"
 cwp_india.12.d_gbr: "Britain tried to hold India and has been driven out. The cost of the struggle will weigh on the Treasury and on Britain's standing in the world for years."
 cwp_india.12.d_hnd: "India has won its independence by struggle. Britain no longer rules here."
 cwp_india.12.f_gbr: "The last British battalions are embarking at Bombay."
 cwp_india.12.f_hnd: "\"We shall either free India or die in the attempt.\"\n— Mahatma Gandhi, Quit India speech, 1942"
 cwp_india.12.a: "The Raj is finished."

 # --- Indonesia ---
 je_cwp_indonesian_revolution: "The Indonesian National Revolution"
 je_cwp_indonesian_revolution_reason: "Two days after Japan's surrender, Sukarno and Hatta proclaimed the Republic of Indonesia. The Republic holds much of Java and Sumatra. The Dutch, returning behind British troops sent to take the Japanese surrender, hold the outer islands and mean to bring the Republic into a union under the Dutch crown. In November 1945 British forces fought Republican fighters for three weeks in Surabaya."
 je_cwp_indonesian_revolution_status_war: "The Republic and the Netherlands are at war"
 je_cwp_indonesian_revolution_status_truce: "A ceasefire is in force"
 je_cwp_indonesia_independence_desc: "No Indonesian territory remains under Dutch rule. The Republic has won its revolution."
 je_cwp_indonesia_restoration_desc: "The Republic has been broken and the Netherlands rules the islands again, for now."
 cwp_indonesia_no_dutch_states_tt: "The Netherlands and its subjects hold no Indonesian state outside western New Guinea"

 cwp_indonesia_police_action: "Police Action"
 cwp_indonesia_marshall_aid_suspended: "American Aid Withheld"

 cwp_indonesia_police_action_button: "Launch a Police Action"
 cwp_indonesia_police_action_button_desc: "Call it a police action, not a war: a sudden offensive to seize the Republic's plantations, ports and capital and arrest its leaders. It will stiffen our war effort, and Washington and the United Nations will treat it as a war."
 cwp_indonesia_talks_button: "Negotiate with the Republic"
 cwp_indonesia_talks_button_desc: "Agree a ceasefire line and talk: recognize the Republic where it already rules in exchange for a federal Indonesia within a Netherlands-Indonesian Union. Both armies will lose some of their appetite for the fight."
 cwp_indonesia_round_table_button: "Convene a Round Table Conference"
 cwp_indonesia_round_table_button_desc: "Accept what can no longer be prevented. Invite the Republic and the federal states to The Hague and transfer sovereignty over the whole archipelago, keeping only western New Guinea. The fighting ends."
 cwp_indonesia_guerrilla_button: "Guerrilla War"
 cwp_indonesia_guerrilla_button_desc: "Abandon the towns, cut the roads and fight from the villages. The Dutch can take the cities, but not hold the country, and every month of it costs them more than it costs us."
 cwp_indonesia_diplomacy_button: "Diplomatic Campaign"
 cwp_indonesia_diplomacy_button_desc: "Send our diplomats to Washington, to the capitals of Asia and to the United Nations. Every government that recognizes the Republic adds to the pressure on The Hague to stop."
 cwp_indonesia_marshall_pressure_button: "Threaten to Withhold Aid"
 cwp_indonesia_marshall_pressure_button_desc: "Tell The Hague that American money for European recovery cannot pay for a colonial war, and that aid will stop unless it negotiates."

 cwp_indonesia.1.t: "Merdeka"
 cwp_indonesia.1.d_net: "Our troops are back in the Indies and hold the outer islands, but Java and Sumatra are in the hands of a Republic whose leaders cooperated with the Japanese. Conservatives in the States General want no dealings with them. The colonial administration in Batavia favors talks on a federal Indonesia linked to the Crown."
 cwp_indonesia.1.d_ids: "The Republic proclaimed in August 1945 has survived its first months and governs Java and Sumatra. The Dutch hold the outer islands and mean to take back the rest. The government must decide how much to win by arms and how much by diplomacy."
 cwp_indonesia.1.f_net: "\"Indië verloren, rampspoed geboren.\" (The Indies lost, disaster born.)\n— Dutch political slogan"
 cwp_indonesia.1.f_ids: "\"Merdeka atau mati!\" (Freedom or death!)\n— Republican slogan"
 cwp_indonesia.1.a: "Prepare for a long struggle."
 cwp_indonesia.10.t: "Sovereignty Transferred"
 cwp_indonesia.10.d_net: "No Dutch authority remains in the archipelago outside western New Guinea. Three centuries of Dutch rule in the Indies are over."
 cwp_indonesia.10.d_ids: "The Dutch are gone. After years of fighting and negotiation the Republic has become the government of all Indonesia."
 cwp_indonesia.10.f_net: "Dutch officials, planters and soldiers are boarding the ships for Europe."
 cwp_indonesia.10.f_ids: "\"We sons and daughters of Indonesia acknowledge one motherland, Indonesia.\"\n— Youth Pledge, 1928"
 cwp_indonesia.10.a: "Mark the transfer of sovereignty."
 cwp_indonesia.11.t: "The Republic Defeated"
 cwp_indonesia.11.d_net: "Our forces have broken the Republic. Its leaders are in custody and its army has scattered into the hills. The islands are ours again, though few believe it will be for long."
 cwp_indonesia.11.d_ids: "The Dutch have broken the Republic. Our leaders are prisoners and our army is scattered, but guerrilla bands still hold out in the hills of Java and Sumatra."
 cwp_indonesia.11.f_net: "Dutch troops hold the towns and the plantation roads."
 cwp_indonesia.11.f_ids: "Republican leaflets still pass from hand to hand in the towns."
 cwp_indonesia.11.a: "For now."

 # --- Indochina ---
 je_cwp_indochina_war: "The War in Indochina"
 je_cwp_indochina_war_reason: "Ho Chi Minh proclaimed the Democratic Republic of Vietnam in Hanoi in September 1945. Chinese Nationalist troops took the Japanese surrender north of the 16th parallel, British troops south of it, and France has since retaken Saigon. In March 1945 Paris promised Indochina self-government within a French Union, not independence. The Viet Minh demand independence, and their army prefers ambushes in the paddies and the hills to open battle."
 je_cwp_indochina_war_status_peoples_war: "Protracted war: the guerrilla stage"
 je_cwp_indochina_war_status_offensive: "The general counter-offensive"
 je_cwp_indochina_partition_desc: "A conference has ended the war. The Viet Minh keep the north, the south of Vietnam is independent of France, and Laos and Cambodia are free."
 je_cwp_indochina_viet_minh_victory_desc: "France holds nothing in Vietnam any more. Laos and Cambodia are free."
 je_cwp_indochina_french_union_desc: "The Viet Minh have been defeated and Indochina remains in the French Union."
 cwp_indochina_no_french_states_tt: "France and its subjects hold no state in Tonkin, Annam or the Mekong delta"
 cwp_indochina_peoples_war_phase_tt: "The war is still a people's war"

 cwp_indochina_peoples_war: "Protracted War"
 cwp_indochina_occupation_peoples_war: "Protracted war in Tonkin"
 cwp_indochina_offensive_momentum: "General Counter-Offensive"
 cwp_indochina_expeditionary_corps: "Far East Expeditionary Corps"
 cwp_indochina_american_aid: "Aid to the French in Indochina"
 cwp_indochina_chinese_aid: "Aid to the Viet Minh"

 cwp_indochina_reinforce_button: "Reinforce the Expeditionary Corps"
 cwp_indochina_reinforce_button_desc: "Send more battalions to the Far East: legionnaires, colonial troops and paratroopers. The army promises that a few more years will finish the Viet Minh."
 cwp_indochina_french_offensive_button: "Seek a Decisive Battle"
 cwp_indochina_french_offensive_button_desc: "Stop chasing guerrillas through the paddies. Build a fortified base deep in Viet Minh country, draw their divisions into open battle and destroy them with artillery and air power."
 cwp_indochina_general_offensive_button: "General Counter-Offensive"
 cwp_indochina_general_offensive_button_desc: "The guerrilla phase has done its work. Bring the main-force divisions down from the hills, with artillery hauled through the jungle, and fight the French in the open."
 cwp_indochina_negotiate_button: "Seek a Negotiated Settlement"
 cwp_indochina_negotiate_button_desc: "Accept that the war cannot be won and ask the great powers to convene a conference. The price will be the north of Vietnam, and the independence of the rest."
 cwp_indochina_negotiate_button_effect_tt: "The war ends. The Viet Minh keep what they hold, Laos and Cambodia become independent kingdoms, and the rest of Vietnam becomes independent of France"
 cwp_indochina_american_aid_button: "Fund the French War"
 cwp_indochina_american_aid_button_desc: "Pay for the weapons, aircraft and supplies France needs to hold Indochina. If Indochina falls, the argument runs, the rest of Southeast Asia will follow."
 cwp_indochina_chinese_aid_button: "Arm the Viet Minh"
 cwp_indochina_chinese_aid_button_desc: "Send rifles, artillery and advisers across the border to our Vietnamese comrades, and give their divisions a place to train."

 cwp_indochina.1.t: "The War Begins"
 cwp_indochina.1.d_fra: "French troops hold Saigon and the south, and the government of the Democratic Republic sits in Hanoi. The talks with it are failing. The high command expects a short campaign against guerrillas. The finance ministry asks where the money and men will come from while France is still rebuilding its own railways and ports."
 cwp_indochina.1.d_dai: "The French will not accept our independence. Our forces are too weak to meet their army in the open, so we will withdraw to the hills of the Viet Bac and fight a long war, until France tires of it."
 cwp_indochina.1.f_fra: "Rubber, rice and the port of Saigon are what France stands to lose."
 cwp_indochina.1.f_dai: "It will be a war of the tiger and the elephant."
 cwp_indochina.1.a: "Prepare for war."
 cwp_indochina.2.t: "From Guerrilla War to Mobile Warfare"
 cwp_indochina.2.d_viet: "The Viet Minh have come down from the hills. Whole divisions, with artillery, are attacking French posts along the frontier and in the deltas. The war of ambushes is over; the war of armies has begun."
 cwp_indochina.2.d_french: "The French command has gone looking for the decisive battle. Paratroopers are dropping into Viet Minh country to build a fortified base and draw the enemy's divisions into the open."
 cwp_indochina.2.f_viet: "The Viet Minh now field regular divisions with their own artillery."
 cwp_indochina.2.f_french: "The base is to be supplied entirely by air."
 cwp_indochina.2.a: "Everything now rides on the battle."
 cwp_indochina.10.t: "Partition at the Conference Table"
 cwp_indochina.10.d_fra: "A conference of the great powers has ended the war. The Viet Minh keep the north, Laos and Cambodia are independent, and the south of Vietnam goes its own way, independent of France. The army blames the politicians, and the politicians blame each other."
 cwp_indochina.10.d_dai: "The conference has ended the war on terms that leave us the north. The French are leaving, but the south remains in other hands, and the government has not given up the reunification of Vietnam."
 cwp_indochina.10.d_vnm: "France has given up Indochina. The south of Vietnam is independent, Laos and Cambodia have gone their own ways, and the Viet Minh rule in Hanoi. Our survival now depends on new friends."
 cwp_indochina.10.f_fra: "The Expeditionary Corps is coming home from the Far East."
 cwp_indochina.10.f_dai: "The army that began in the hills of the Viet Bac now governs the north."
 cwp_indochina.10.f_vnm: "The south must now build an army and a state without French protection."
 cwp_indochina.10.a: "The war is over, for now."
 cwp_indochina.11.t: "The Fall of French Indochina"
 cwp_indochina.11.d_fra: "The Expeditionary Corps has been beaten and France no longer holds any part of Vietnam. Laos and Cambodia have taken their independence. Nothing remains of French Indochina."
 cwp_indochina.11.d_dai: "The French are gone from Vietnam. Laos and Cambodia have taken their own independence."
 cwp_indochina.11.f_fra: "Nothing is left of the empire France rebuilt in Asia after 1945."
 cwp_indochina.11.f_dai: "\"The entire Vietnamese people are determined to mobilize all their physical and mental strength, to sacrifice their lives and property in order to safeguard their independence and liberty.\"\n— Declaration of Independence of the Democratic Republic of Vietnam, 1945"
 cwp_indochina.11.a: "It is over."
 cwp_indochina.12.t: "Indochina Remains in the French Union"
 cwp_indochina.12.d_fra: "The Viet Minh's state has been broken and its army destroyed or scattered. Indochina stays in the French Union. The cost has been enormous, and the survivors have gone back into the hills."
 cwp_indochina.12.d_dai: "The French have broken our state and scattered our army. Indochina remains in the French Union."
 cwp_indochina.12.f_fra: "The Expeditionary Corps holds the deltas and the posts in the hills."
 cwp_indochina.12.f_dai: "The survivors have gone back into the hills of the Viet Bac."
 cwp_indochina.12.a: "For now."

 # --- Algeria ---
 je_cwp_algerian_question: "The Algerian Question"
 je_cwp_algerian_question_reason: "Algeria is not a colony in French law but three departments of France, home to about a million European settlers and some eight million Muslims who are not equal citizens. Since the massacres at Sétif and Guelma in May 1945, many Algerian nationalists have concluded that only armed struggle will move Paris, and an armed rising has now begun."
 je_cwp_algeria_referendum_desc: "Algerians have chosen independence in a referendum, and France has accepted the result."
 je_cwp_algeria_fln_victory_desc: "The FLN has won the war and Algeria is independent."
 je_cwp_algeria_held_desc: "The insurgency has been crushed. Algeria remains French, for now."

 cwp_algeria_insurgency_bar: "Insurgency"
 cwp_algeria_insurgency_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_algeria_insurgency_bar_explain_tt Insurgency#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 cwp_algeria_insurgency_bar_explain_tt: "The strength of the Algerian rising. At 100 the FLN wins; at 0 it has been crushed."
