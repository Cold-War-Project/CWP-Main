l_english:
 # --- Group and shared ---
 je_group_cwp_decolonization: "Decolonization"
 je_cwp_decolonization_invalid_desc: "The situation no longer applies."
 cwp_button_cooldown_tt: "This was done recently and cannot be repeated yet"
 cwp_bar_metropole_debt: "The metropole is deep in debt"
 cwp_bar_metropole_debt_will: "The metropole is deep in debt"
 cwp_bar_metropole_anticolonial_government: "Labour or the intelligentsia sit in the metropole's government"
 cwp_bar_metropole_anticolonial_government_will: "Labour or the intelligentsia sit in the metropole's government"
 cwp_bar_metropole_imperialist_government: "The army or the landed interest sit in the metropole's government"
 cwp_bar_metropole_imperialist_government_will: "The army or the landed interest sit in the metropole's government"
 cwp_bar_colony_liberty_desire_high: "The colony's liberty desire is above 75"
 cwp_bar_colony_liberty_desire: "The colony's liberty desire is above 50"
 cwp_bar_tide_rising: "The anti-colonial tide is rising"
 cwp_bar_tide_strong: "The anti-colonial tide is strong"

 # --- The Winds of Change ---
 je_cwp_winds_of_change: "The Winds of Change"
 je_cwp_winds_of_change_reason: "The war has broken the old empires in all but name. Britain is bankrupt, France and the Netherlands have only just been freed from occupation, and from Delhi to Hanoi the nationalists who waited out the war now demand what they were promised or what they have already seized. The United Nations Charter speaks of self-determination, and both of the new superpowers claim to oppose empire. How fast the colonial order falls depends on what the colonies, the metropoles and the superpowers do now."
 je_cwp_winds_of_change_goal: "The tide grows with every new independence, with the voice of the nations that are already free, with every colonial war, and with the superpowers' backing. It weakens when a metropole crushes a rising."
 je_cwp_winds_of_change_status_0: "The colonial order still stands"
 je_cwp_winds_of_change_status_1: "The tide is rising"
 je_cwp_winds_of_change_status_2: "Empires are in retreat"
 je_cwp_winds_of_change_status_3: "The colonial order is collapsing"
 je_cwp_winds_of_change_status_4: "The age of empire is over"
 je_cwp_winds_of_change_end_desc: "No colony is left for the tide to act on. The age of the great colonial empires is over."
 je_cwp_winds_of_change_end_tt: "No colonies remain under a colonial power"
 je_cwp_winds_of_change_end_effect_tt: "The Winds of Change ends"

 cwp_tide_bar: "Anti-Colonial Tide"
 cwp_tide_bar_desc: "How strongly the world's opinion presses against colonial rule. At 25, 50, 75 and 100 every colony's #b liberty desire#! grows faster."
 cwp_tide_bar_new_independences: "Nations that won independence last month"
 cwp_tide_bar_free_former_colonies: "The voice of free former colonies"
 cwp_tide_bar_colonial_wars: "Colonies at war with their rulers"
 cwp_tide_bar_usa_champion: "The United States champions self-determination"
 cwp_tide_bar_usa_guardian: "The United States stands by its allies' empires"
 cwp_tide_bar_rus_champion: "The Soviet Union champions national liberation"
 cwp_tide_bar_rus_guardian: "The Soviet Union keeps out of colonial questions"
 cwp_tide_bar_setbacks: "A colonial power crushed a rising last month"

 cwp_anticolonial_tide: "Anti-Colonial Tide"
 cwp_colonial_development_funds: "Colonial Development Funds"
 cwp_colonial_development_funds_subject: "Colonial Development Spending"
 cwp_colonial_repression: "Emergency Rule"
 cwp_colonial_repression_metropole: "Colonial Emergency"
 cwp_self_government_promised: "Self-Government Promised"
 cwp_nationalist_campaign: "Nationalist Campaign"
 cwp_champion_of_self_determination: "Champion of Self-Determination"
 cwp_guardian_of_allied_empires: "Guardian of Allied Empires"
 cwp_new_nation: "A New Nation"
 cwp_end_of_empire: "End of Empire"

 cwp_woc_champion_self_determination_button: "Champion Self-Determination"
 cwp_woc_champion_self_determination_button_desc: "Declare that the peoples under colonial rule have the right to choose their own government, and let the new nations know who stood with them. The colonial powers, some of them our partners, will take it badly."
 cwp_woc_guard_allied_empires_button: "Stand by Our Allies"
 cwp_woc_guard_allied_empires_button_desc: "An empire collapsing in disorder helps only our rivals. Quietly support the colonial powers' authority, and accept that the nationalists will remember it."
 cwp_woc_development_funds_button: "Fund Colonial Development"
 cwp_woc_development_funds_button_desc: "Vote money for roads, schools, clinics and power stations in the colonies, as the British Colonial Development and Welfare Acts and the French investment fund for the overseas territories did. Prosperity may buy loyalty, or only time."
 cwp_woc_promise_self_government_button: "Promise Self-Government"
 cwp_woc_promise_self_government_button_desc: "Announce new constitutions, elected councils and a path to self-rule. The promise calms our colonies for a while, but every promise made in one capital is heard in all the others."
 cwp_woc_hold_the_line_button: "Declare an Emergency"
 cwp_woc_hold_the_line_button_desc: "Ban the nationalist parties, detain their leaders and send in the troops. Order can be restored, at a price paid in money, in reputation and in the anger of the next generation."
 cwp_woc_managed_withdrawal_button: "Transfer Power"
 cwp_woc_managed_withdrawal_button_desc: "Hand over power to the elected leaders of the colonies that are ready to go, and part as friends while we still can."
 cwp_woc_managed_withdrawal_button_possible_tt: "At least one of our colonies has a #b liberty desire#! of 75 or more"
 cwp_woc_nationalist_campaign_button: "Mass Nationalist Campaign"
 cwp_woc_nationalist_campaign_button_desc: "Call strikes, boycotts and marches across the country. Every closed shop and empty office tells our rulers that they govern only with our consent."
 cwp_woc_appeal_to_superpowers_button: "Appeal to the Superpowers"
 cwp_woc_appeal_to_superpowers_button_desc: "Send a delegation to the capitals that speak for self-determination and ask them to say so on our behalf."
 cwp_woc_appeal_to_superpowers_button_possible_tt: "The United States or the Soviet Union champions self-determination"

 cwp_decolonization.1.t: "Independence Day"
 cwp_decolonization.1.d: "At midnight the old flag came down over [ROOT.GetCountry.GetCapital.GetName] and ours went up in its place. The crowds have not gone home. They have waited a lifetime for this, and now they want to know what kind of country we will be and with whom we will stand in a world divided between Washington and Moscow."
 cwp_decolonization.1.f: "Freedom is ours. What we make of it is the next question."
 cwp_decolonization.1.a: "We will steer our own course."
 cwp_decolonization.1.b: "Our future lies with the free nations of the West."
 cwp_decolonization.1.c: "Our future lies with the socialist camp."
 cwp_decolonization.2.t: "The Flag Comes Down"
 cwp_decolonization.2.d: "[SCOPE.sCountry('cwp_new_state').GetName] is no longer ours to govern. The last governor has sailed, the garrison is coming home, and the newspapers are divided between those who call it a betrayal and those who say it was long overdue."
 cwp_decolonization.2.f: "An empire is not lost in a day. But it can be seen to end in one."
 cwp_decolonization.2.a: "We part as friends."
 cwp_decolonization.2.b: "A humiliation we will not forget."
 cwp_decolonization.3.t: "The Tide Rises"
 cwp_decolonization.3.d_1: "Nationalist leaders across the colonial world are watching each other. Every concession won in one colony is quoted in the speeches of the next, and the colonial powers are learning that they can no longer deal with their territories one at a time."
 cwp_decolonization.3.d_2: "The empires are in retreat. The new nations speak together at international conferences and in the United Nations, and the case for colonial rule is now made only in the metropoles themselves."
 cwp_decolonization.3.d_3: "The colonial order is collapsing. Independence is no longer a question of whether but of when, and the governments still holding on are counting the cost in money, soldiers and friends."
 cwp_decolonization.3.d_4: "The age of empire is over in all but name. The colonies that remain are held against the opinion of almost the whole world."
 cwp_decolonization.3.f_1: "The idea of self-determination has crossed every border."
 cwp_decolonization.3.f_2: "The idea of self-determination has crossed every border."
 cwp_decolonization.3.f_3: "The idea of self-determination has crossed every border."
 cwp_decolonization.3.f_4: "The idea of self-determination has crossed every border."
 cwp_decolonization.3.a: "Noted."

 # --- India ---
 je_cwp_india_transfer_of_power: "The Transfer of Power"
 je_cwp_india_transfer_of_power_reason: "The war has exhausted Britain and emboldened India. The Congress leaders are out of prison, the 1946 provincial elections have given the Muslim League almost every Muslim seat on the demand for Pakistan, and the loyalty of the Indian army and police can no longer be taken for granted. Whether Britain leaves, how soon, and whether it leaves one India or two will be settled by what London, Congress and the League do next."
 je_cwp_india_transfer_of_power_goal: "Independence comes when Britain sets a date or can no longer hold on. If communal tension stands at 60 or more at that moment, the subcontinent is partitioned."
 je_cwp_india_transfer_of_power_status_united: "A united India is still possible"
 je_cwp_india_transfer_of_power_status_partition: "Partition looks increasingly likely"
 je_cwp_india_transfer_of_power_status_date: "Britain has announced its withdrawal"
 je_cwp_india_united_desc: "Britain has handed power to a single Indian government."
 je_cwp_india_partition_desc: "Britain has left, and the subcontinent has been partitioned between India and Pakistan."
 je_cwp_india_won_desc: "India has broken free of British rule."
 je_cwp_india_raj_holds_desc: "The independence movement has been contained. The Raj endures, for now."

 cwp_india_self_rule_bar: "Self-Rule"
 cwp_india_self_rule_bar_desc: "How close India is to independence. At 100, Britain can no longer hold on; at 0, the movement has been contained."
 cwp_india_communal_bar: "Communal Tension"
 cwp_india_communal_bar_desc: "Distrust between Hindus and Muslims, and the Muslim League's demand for a separate Pakistan. At 60 or more when power is transferred, India is partitioned."
 cwp_india_bar_liberty_desire_high: "India's liberty desire is above 75"
 cwp_india_bar_liberty_desire: "India's liberty desire is above 50"
 cwp_india_bar_quit_india: "Quit India agitation"
 cwp_india_bar_naval_mutiny: "The Royal Indian Navy mutiny"
 cwp_india_bar_restore_order: "British troops restore order"
 cwp_india_communal_two_nations: "The two-nation theory"
 cwp_india_communal_muslim_movement: "Muslim nationalist movement"
 cwp_india_communal_hindu_movement: "Hindu nationalist movement"
 cwp_india_communal_unity_talks: "Congress-League talks"
 cwp_india_communal_direct_action: "Communal riots"
 cwp_india_communal_cabinet_mission: "A British mission seeks a federal settlement"
 cwp_india_communal_divide_and_rule: "Divide and rule"
 cwp_india_communal_violence: "Partition Violence"
 cwp_india_cabinet_mission: "Mission to India"
 cwp_india_raj_holds: "Holding the Raj"

 cwp_india_cabinet_mission_button: "Send a Cabinet Mission"
 cwp_india_cabinet_mission_button_desc: "Send ministers to India to negotiate a federal constitution that both Congress and the League can accept: a weak centre, strong provinces, and groupings of Muslim-majority provinces short of a separate state."
 cwp_india_restore_order_button: "Restore Order"
 cwp_india_restore_order_button_desc: "Arrest the agitators and give the army a free hand. It may buy time for the Raj, and the communities will be left to blame each other."
 cwp_india_set_date_button: "Set a Date for Withdrawal"
 cwp_india_set_date_button_desc: "Announce in Parliament that Britain will hand over power by a fixed date, whatever the Indian parties agree among themselves. A deadline forces the issue."
 cwp_india_set_date_button_possible_tt: "#b Self-Rule#! is at least 75"
 cwp_india_set_date_button_effect_tt: "India becomes independent. If #b Communal Tension#! is 60 or more, the subcontinent is partitioned between India and Pakistan"
 cwp_india_quit_india_button: "Quit India"
 cwp_india_quit_india_button_desc: "Call the country out against British rule once more, as Congress did in 1942. Hartals, marches and civil disobedience in every province."
 cwp_india_unity_talks_button: "Congress-League Talks"
 cwp_india_unity_talks_button_desc: "Open talks with the Muslim League on guarantees for Muslim provinces within one India. Every concession will be attacked by our own hardliners."

 cwp_india.1.t: "The Question of India"
 cwp_india.1.d_gbr: "India cannot be held as it was before the war. The Indian army that fought in Burma and Italy wants its reward, the Treasury cannot pay for a long struggle, and the elections have shown a subcontinent divided between Congress and the Muslim League. The question before the Cabinet is no longer whether to leave India but how, and to whom."
 cwp_india.1.d_hnd: "The war is over and the Congress leaders are free. The British say they will leave, but they said so before. Meanwhile the Muslim League has swept the Muslim seats on the demand for Pakistan, and every month without an agreement makes a united India harder to save."
 cwp_india.1.f_gbr: "The jewel in the crown has become a weight around the neck."
 cwp_india.1.f_hnd: "Freedom is close. Whether it will be one freedom or two is not yet decided."
 cwp_india.1.a: "Then let us settle it."
 cwp_india.2.t: "Direct Action"
 cwp_india.2.d: "The Muslim League called a day of action to press its demand for Pakistan, and in [ROOT.GetCountry.GetCapital.GetName] and the cities of Bengal it turned into days of killing between Hindus and Muslims. Thousands are dead. Each community blames the other, and the violence is spreading to the countryside."
 cwp_india.2.f: "After this, many who never wanted partition say there is no other way."
 cwp_india.2.a: "Send in the troops."
 cwp_india.2.b: "Appeal to both communities for peace."
 cwp_india.3.t: "Mutiny in the Navy"
 cwp_india.3.d: "Ratings of the Royal Indian Navy have seized their ships in Bombay and Karachi, hauled down the ensign and raised the flags of Congress and the League side by side. The mutiny will be put down, but the lesson is plain: the forces that held India for Britain can no longer be relied on."
 cwp_india.3.f: "An empire held by Indian soldiers lasts only as long as they consent."
 cwp_india.3.a: "The end is coming faster than anyone planned."
 cwp_india.10.t: "Tryst with Destiny"
 cwp_india.10.d_gbr: "At midnight the British Raj ended and power passed to the government of a united India. The parting has been more cordial than anyone expected, and the new state has chosen to remain on good terms with London."
 cwp_india.10.d_hnd: "At the stroke of midnight India awoke to freedom, one country from the Himalayas to Cape Comorin. The work of building a nation of four hundred million begins."
 cwp_india.10.f_gbr: "It is easier to lose an empire gracefully than to keep it."
 cwp_india.10.f_hnd: "A moment comes, rarely in history, when a nation finds its voice."
 cwp_india.10.a: "A new age begins."
 cwp_india.11.t: "Partition"
 cwp_india.11.d_gbr: "Britain has left India, and India has been divided. A boundary drawn in weeks runs through Punjab and Bengal, and millions are crossing it in both directions amid massacres that the departing administration cannot stop."
 cwp_india.11.d_hnd: "Freedom has come, and with it partition. Pakistan has been carved from the Muslim-majority provinces of the west and from East Bengal. Refugee columns stretch along every road in Punjab, and the question of Kashmir is still open."
 cwp_india.11.d_pak: "Pakistan exists. A state in two wings a thousand miles apart, born in the middle of the greatest migration in history, must now build a government, an army and a capital almost from nothing."
 cwp_india.11.f_gbr: "We came as traders and leave as referees of a quarrel we helped to sharpen."
 cwp_india.11.f_hnd: "Two nations born in one night, and in blood."
 cwp_india.11.f_pak: "Two nations born in one night, and in blood."
 cwp_india.11.a: "May the bloodshed end soon."
 cwp_india.12.t: "India Breaks Free"
 cwp_india.12.d_gbr: "We tried to hold India, and we have lost it by force. The cost of the struggle will be counted in London for years."
 cwp_india.12.d_hnd: "India has won its independence by struggle. Britain no longer rules here."
 cwp_india.12.f_gbr: "No empire can rule a people who will no longer be ruled."
 cwp_india.12.f_hnd: "No empire can rule a people who will no longer be ruled."
 cwp_india.12.a: "So be it."
 cwp_india.13.t: "The Raj Endures"
 cwp_india.13.d_gbr: "The movement has been broken for now. Its leaders are in prison and the provinces are quiet. Nobody in London believes the quiet will last for ever."
 cwp_india.13.d_hnd: "The British have crushed the movement, for now. The leaders are in prison, but the idea of freedom is not."
 cwp_india.13.f_gbr: "Order has been restored. The question has not been answered."
 cwp_india.13.f_hnd: "Order has been restored. The question has not been answered."
 cwp_india.13.a: "For now."

 # --- Indonesia ---
 je_cwp_indonesian_revolution: "The Indonesian National Revolution"
 je_cwp_indonesian_revolution_reason: "Two days after Japan's surrender, Sukarno and Hatta proclaimed the Republic of Indonesia. The Republic now governs much of Java and Sumatra, while the Dutch, returning behind British troops, hold the cities and the outer islands and mean to restore their authority. Neither side can easily defeat the other, and the outcome will turn on Dutch resolve, Republican resistance and American patience."
 je_cwp_indonesian_revolution_goal: "At +50 the Netherlands must recognise Indonesian independence. At -50 Dutch authority is restored."
 je_cwp_indonesia_independence_desc: "The Netherlands has transferred sovereignty to Indonesia."
 je_cwp_indonesia_won_desc: "Indonesia has won its independence in war."
 je_cwp_indonesia_restoration_desc: "The Republic has been defeated and Dutch authority restored, for now."

 cwp_indonesia_revolution_bar: "The Revolution"
 cwp_indonesia_revolution_bar_desc: "Toward -50, Dutch authority returns. Toward +50, the Republic of Indonesia prevails."
 cwp_indonesia_revolution_bar_second_desc: "The balance between the Republic and the returning Dutch."
 cwp_indonesia_bar_republic: "The Republic holds Java and Sumatra"
 cwp_indonesia_bar_guerrilla: "Republican guerrilla war"
 cwp_indonesia_bar_police_action: "A Dutch police action"
 cwp_indonesia_bar_talks: "Negotiations with the Republic"
 cwp_indonesia_bar_marshall_pressure: "American pressure on The Hague"
 cwp_indonesia_police_action: "Police Action"
 cwp_indonesia_marshall_aid_suspended: "American Aid Withheld"

 cwp_indonesia_police_action_button: "Launch a Police Action"
 cwp_indonesia_police_action_button_desc: "Call it a police action, not a war: drive the Republican forces out of the plantations and the cities and arrest their leaders. Washington and the United Nations will call it what it is."
 cwp_indonesia_talks_button: "Negotiate with the Republic"
 cwp_indonesia_talks_button_desc: "Recognise the Republic's authority where it already rules and negotiate a federal United States of Indonesia linked to the Netherlands, as the Linggadjati agreement tried to do."
 cwp_indonesia_guerrilla_button: "Guerrilla War"
 cwp_indonesia_guerrilla_button_desc: "Abandon the towns, cut the roads and fight from the villages. The Dutch can take the cities, but not hold the country."
 cwp_indonesia_marshall_pressure_button: "Threaten to Withhold Aid"
 cwp_indonesia_marshall_pressure_button_desc: "Tell The Hague that American money for European recovery cannot pay for a colonial war, and that aid will stop unless it negotiates."
 cwp_indonesia_marshall_pressure_button_possible_tt: "The Netherlands has launched a police action"

 cwp_indonesia.1.t: "Merdeka"
 cwp_indonesia.1.d_net: "Our troops are returning to the Indies to find a Republic in place of the colony. Its leaders cooperated with the Japanese, and many in The Hague refuse to deal with them at all. Others warn that the Netherlands can no longer afford a war on the other side of the world."
 cwp_indonesia.1.d_ids: "The Republic proclaimed in August 1945 has survived its first months. The Dutch have returned to the cities with British help, and the young men of the revolution are ready to fight. The government must decide how much to win by arms and how much by diplomacy."
 cwp_indonesia.1.f_net: "Without the Indies, the old saying goes, the Netherlands is only a small country."
 cwp_indonesia.1.f_ids: "Freedom, the crowds shout. Merdeka."
 cwp_indonesia.1.a: "The struggle begins."
 cwp_indonesia.10.t: "The Round Table"
 cwp_indonesia.10.d_net: "At a conference in The Hague the Netherlands has agreed to transfer sovereignty over the Indies to Indonesia. The Dutch keep only western New Guinea, and that only for now."
 cwp_indonesia.10.d_ids: "The Dutch have recognised our independence. After years of fighting and negotiation the Republic has become the government of all Indonesia."
 cwp_indonesia.10.f_net: "Three centuries end at a conference table."
 cwp_indonesia.10.f_ids: "Three centuries end at a conference table."
 cwp_indonesia.10.a: "It is done."
 cwp_indonesia.11.t: "The Republic Defeated"
 cwp_indonesia.11.d_net: "Our forces have broken the Republic. Its leaders are in custody and its army has scattered into the hills. The islands are ours again, though few believe it will be for long."
 cwp_indonesia.11.d_ids: "The Dutch have broken the Republic. Our leaders are prisoners and our army is scattered. But a people that once tasted freedom will not forget it."
 cwp_indonesia.11.f_net: "The colony is restored. The question is not."
 cwp_indonesia.11.f_ids: "The colony is restored. The question is not."
 cwp_indonesia.11.a: "For now."
 cwp_indonesia.12.t: "Indonesia Free"
 cwp_indonesia.12.d_net: "We have lost the Indies in war. The last Dutch troops are leaving the islands."
 cwp_indonesia.12.d_ids: "We have won our independence by force of arms. The Dutch no longer rule in the islands."
 cwp_indonesia.12.f_net: "Freedom won is not easily surrendered."
 cwp_indonesia.12.f_ids: "Freedom won is not easily surrendered."
 cwp_indonesia.12.a: "So be it."

 # --- Indochina ---
 je_cwp_indochina_war: "The War in Indochina"
 je_cwp_indochina_war_reason: "Ho Chi Minh proclaimed the Democratic Republic of Vietnam in Hanoi in September 1945, and France has returned to reclaim Indochina. The Viet Minh are building an army in the hills of Tonkin, Paris is rebuilding its own country at the same time, and the outcome may be decided less in Hanoi than in Beijing and Washington."
 je_cwp_indochina_war_goal: "At +50 France is defeated; if the United States has backed France, a conference partitions Vietnam, otherwise the Viet Minh take it all. At -50 the French Union holds. France may also seek a negotiated settlement once the war turns against it."
 je_cwp_indochina_partition_desc: "A conference has partitioned Vietnam, and Laos and Cambodia are independent."
 je_cwp_indochina_viet_minh_victory_desc: "The Viet Minh have taken all of Vietnam, and Laos and Cambodia are independent."
 je_cwp_indochina_french_union_desc: "The Viet Minh have been defeated and the French Union holds, for now."
 je_cwp_indochina_won_desc: "Indochina has broken free of France in war."

 cwp_indochina_war_bar: "The War in Indochina"
 cwp_indochina_war_bar_desc: "Toward -50, the French Union holds. Toward +50, France is defeated."
 cwp_indochina_war_bar_second_desc: "The balance between France and the Viet Minh."
 cwp_indochina_bar_viet_minh: "The Viet Minh guerrilla war"
 cwp_indochina_bar_chinese_sanctuary: "A sanctuary across the Chinese border"
 cwp_indochina_bar_chinese_aid: "Chinese arms and advisers"
 cwp_indochina_bar_reinforcements: "The Expeditionary Corps is reinforced"
 cwp_indochina_bar_american_aid: "American aid to France"
 cwp_indochina_expeditionary_corps: "Far East Expeditionary Corps"
 cwp_indochina_american_aid: "Aid to the French in Indochina"
 cwp_indochina_chinese_aid: "Aid to the Viet Minh"

 cwp_indochina_reinforce_button: "Reinforce the Expeditionary Corps"
 cwp_indochina_reinforce_button_desc: "Send more battalions to the Far East: legionnaires, colonial troops and paratroopers. The army promises that a few more years will finish the Viet Minh."
 cwp_indochina_negotiate_button: "Seek a Negotiated Settlement"
 cwp_indochina_negotiate_button_desc: "Accept that the war cannot be won and ask the great powers to convene a conference. The price will be the north of Vietnam."
 cwp_indochina_negotiate_button_possible_tt: "#b The War in Indochina#! is at +25 or more"
 cwp_indochina_negotiate_button_effect_tt: "A conference partitions Vietnam: the Viet Minh take Tonkin, Laos and Cambodia become independent, and the rest of Vietnam becomes independent of France"
 cwp_indochina_american_aid_button: "Fund the French War"
 cwp_indochina_american_aid_button_desc: "Pay for the weapons, aircraft and supplies France needs to hold Indochina. If Indochina falls, the argument runs, the rest of Southeast Asia will follow."
 cwp_indochina_chinese_aid_button: "Arm the Viet Minh"
 cwp_indochina_chinese_aid_button_desc: "Send rifles, artillery and advisers across the border to our Vietnamese comrades, and give their divisions a place to train."

 cwp_indochina.1.t: "The Return of France"
 cwp_indochina.1.d_fra: "French troops are back in Saigon, and talks with Ho Chi Minh's government in Hanoi are failing. Our generals expect a short campaign against an army of guerrillas. Others recall that France has not yet rebuilt its own railways and asks where the money and men will come from."
 cwp_indochina.1.d_vnm: "The Viet Minh's Democratic Republic and the returning French cannot share the country. Talks have failed, and the Viet Minh are withdrawing to the hills of Tonkin to fight a long war."
 cwp_indochina.1.f_fra: "A great power does not abandon its empire, say the ministers. Not yet."
 cwp_indochina.1.f_vnm: "It will be a war of the tiger and the elephant."
 cwp_indochina.1.a: "So it will be war."
 cwp_indochina.10.t: "Partition at the Conference Table"
 cwp_indochina.10.d_fra: "A conference of the great powers has ended the war. The Viet Minh take the north, Laos and Cambodia are independent, and the south of Vietnam goes its own way, independent of France. The army blames the politicians, and the politicians blame each other."
 cwp_indochina.10.d_dai: "The conference has given us the north. The French are leaving, but the south remains in other hands. The reunification of Vietnam is postponed, not abandoned."
 cwp_indochina.10.d_vnm: "France has given up Indochina. The south of Vietnam is independent, Laos and Cambodia have gone their own ways, and the Viet Minh rule in Hanoi. Our survival now depends on new friends."
 cwp_indochina.10.f_fra: "A line on a map ends one war and prepares the next."
 cwp_indochina.10.f_dai: "A line on a map ends one war and prepares the next."
 cwp_indochina.10.f_vnm: "A line on a map ends one war and prepares the next."
 cwp_indochina.10.a: "The war is over, for now."
 cwp_indochina.11.t: "The Fall of French Indochina"
 cwp_indochina.11.d_fra: "The Expeditionary Corps has been beaten in the field and the Viet Minh hold all of Vietnam. Laos and Cambodia have declared their independence. Nothing remains of French Indochina."
 cwp_indochina.11.d_dai: "Vietnam is free and united under the Democratic Republic. The French are gone, and Laos and Cambodia have taken their own independence."
 cwp_indochina.11.f_fra: "The tiger has worn down the elephant."
 cwp_indochina.11.f_dai: "The tiger has worn down the elephant."
 cwp_indochina.11.a: "It is over."
 cwp_indochina.12.t: "The French Union Holds"
 cwp_indochina.12.d_fra: "The Viet Minh have been driven from the deltas and their main force destroyed. Indochina stays in the French Union. The cost has been enormous, and the survivors have gone back into the hills."
 cwp_indochina.12.d_vnm: "The French have defeated the Viet Minh. The war is over, for now."
 cwp_indochina.12.f_fra: "A victory, and a costly one."
 cwp_indochina.12.f_vnm: "A victory, and a costly one."
 cwp_indochina.12.a: "For now."
 cwp_indochina.13.t: "Indochina Breaks Free"
 cwp_indochina.13.d_fra: "Indochina has won its independence by force. France no longer rules in Hanoi or Saigon."
 cwp_indochina.13.d_vnm: "We have won our independence by force. The French are gone."
 cwp_indochina.13.f_fra: "Freedom won is not easily surrendered."
 cwp_indochina.13.f_vnm: "Freedom won is not easily surrendered."
 cwp_indochina.13.a: "So be it."

 # --- Algeria ---
 je_cwp_algerian_question: "The Algerian Question"
 je_cwp_algerian_question_reason: "Algeria is not a colony in French law but three departments of France, home to a million European settlers and nine million Muslims who are not equal citizens. Since the massacres at Sétif and Guelma in May 1945, Algerian nationalists have concluded that only arms will move Paris. Now the world around Algeria is moving, and the rising has begun."
 je_cwp_algerian_question_goal: "If the insurgency reaches 100, the FLN wins; if it falls to 0, French Algeria holds. If France's will to hold on reaches 0, France must negotiate. France can also offer Algerians a referendum on self-determination."
 je_cwp_algeria_referendum_desc: "Algerians have chosen independence in a referendum, and France has accepted the result."
 je_cwp_algeria_will_broken_desc: "France no longer has the will to fight for Algeria and has negotiated its independence."
 je_cwp_algeria_fln_victory_desc: "The FLN has won the war and Algeria is independent."
 je_cwp_algeria_held_desc: "The insurgency has been crushed. Algeria remains French, for now."

 cwp_algeria_insurgency_bar: "Insurgency"
 cwp_algeria_insurgency_bar_desc: "The strength of the Algerian rising. At 100 the FLN wins; at 0 it has been crushed."
 cwp_algeria_will_bar: "Will to Hold Algeria"
 cwp_algeria_will_bar_desc: "How much France is still prepared to pay to keep Algeria French. At 0, France must negotiate."
