 cwp_algeria_pacification: "Pacification of Algeria"
 cwp_algeria_constantine_plan: "Constantine Plan"
 cwp_algeria_war_weariness: "War Weariness"
 cwp_algeria_settler_exodus: "Exodus of the Pieds-Noirs"
 cwp_algeria_army_ascendant: "The Army in Politics"

 cwp_algeria_pacification_button: "Pacification"
 cwp_algeria_pacification_button_desc: "Send the paratroopers into the casbah and the conscripts into the mountains, resettle the villages and seal the borders with electrified fences. It works, and the methods will come out in the French press."
 cwp_algeria_constantine_plan_button: "Launch the Constantine Plan"
 cwp_algeria_constantine_plan_button_desc: "Fund housing, jobs, schools and land for Muslim Algerians, and open the civil service to them. If Algerians are to be French, France must at last treat them as French."
 cwp_algeria_referendum_button: "Offer Self-Determination"
 cwp_algeria_referendum_button_desc: "Announce that Algerians will choose their own future in a referendum, and negotiate with the FLN for the terms. The settlers and part of the army will regard it as treason."
 cwp_algeria_referendum_button_effect_tt: "Algeria becomes independent, with good relations with France"

 cwp_algeria.1.t: "All Saints' Day"
 cwp_algeria.1.d: "In the early hours of the morning bombs went off and police posts were attacked across Algeria, from the Aurès mountains to Oran. A tract signed by a National Liberation Front nobody had heard of calls for an independent Algeria. The minister of the interior tells the Assembly that Algeria is France and the only negotiation is war."
 cwp_algeria.1.f: "A few hundred men with old rifles have begun a war."
 cwp_algeria.1.a: "Algeria is France."
 cwp_algeria.2.t: "Crisis of the Republic"
 cwp_algeria.2.d: "Settlers have stormed the government building in Algiers, and the generals have formed a committee of public safety. The army says it will not accept a government that abandons Algeria, and paratroopers are rumored to be preparing to land near Paris. The Assembly is looking for someone the army will obey."
 cwp_algeria.2.f: "The war in Algeria has crossed the Mediterranean."
 cwp_algeria.2.a: "Call on a strong man to save the Republic."
 cwp_algeria.2.b: "The Republic will not be dictated to by its army."
 cwp_algeria.10.t: "Algeria Chooses Independence"
 cwp_algeria.10.d_fra: "Algerians have voted for independence, and France has accepted the result. Hundreds of thousands of settlers are crowding the ports, unwilling to stay in the new Algeria."
 cwp_algeria.10.d_ald: "The referendum has given its verdict: Algeria is independent. After years of war the flag of the revolution flies over Algiers."
 cwp_algeria.10.f_fra: "The suitcase or the coffin, the settlers say, and choose the suitcase."
 cwp_algeria.10.f_ald: "A people has spoken."
 cwp_algeria.10.a: "It is done."
 cwp_algeria.12.t: "Victory of the FLN"
 cwp_algeria.12.d_fra: "The army can no longer hold Algeria. The FLN has driven out French authority, and the officers who swore Algeria would stay French return home bitter and dangerous."
 cwp_algeria.12.d_ald: "We have won our independence on the battlefield. The French are gone."
 cwp_algeria.12.f_fra: "Freedom won is not easily surrendered."
 cwp_algeria.12.f_ald: "Freedom won is not easily surrendered."
 cwp_algeria.12.a: "It is over."
 cwp_algeria.13.t: "Algeria Remains French"
 cwp_algeria.13.d: "The FLN's networks have been broken and its fighters killed, captured or driven over the borders. Algeria remains French. The methods used to win will not be easily forgotten, by Algerians or by the French."
 cwp_algeria.13.f: "The rising is crushed. The question remains."
 cwp_algeria.13.a: "For now."
 cwp_has_tracked_colonies_tt: "We still rule at least one colony"
