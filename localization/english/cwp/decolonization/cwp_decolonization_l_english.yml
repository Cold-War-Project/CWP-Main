 cwp_algeria_will_settlers: "Algeria is France: the settlers and their lobby"
 cwp_algeria_will_war_dragging: "A war without end"
 cwp_algeria_will_insurgency: "A growing insurgency"
 cwp_algeria_will_torture: "Revelations of torture"
 cwp_algeria_will_strongman: "A strong government in Paris"
 cwp_algeria_pacification: "Pacification of Algeria"
