l_english:
 # --- Gold Coast ---
 je_cwp_gold_coast: "Self-Government Now"
 je_cwp_gold_coast_reason: "The Gold Coast is Britain's model colony: rich in cocoa and gold, with an educated elite and African members already sitting on its Legislative Council. Its nationalists want more than seats on a council. Veterans home from Burma, cocoa farmers losing their trees to swollen-shoot disease and young men in the towns are listening to leaders who demand self-government now."
 je_cwp_gold_coast_independence_desc: "Britain has handed power to an elected African government. The Gold Coast is independent."
 cwp_gold_constitution_cost: "Coussey Committee"
 cwp_gold_constitution_button: "Constitutional Reform"
 cwp_gold_constitution_button_desc: "Appoint an all-African committee to draft a new constitution, with elections and African ministers. Sharing power now may let us set the terms on which we hand it over later."
 cwp_gold_detentions_button: "Detain the Agitators"
 cwp_gold_detentions_button_desc: "Arrest the nationalist leaders before they can win an election, and hold them without trial. The colony will be quiet for a year; the prisoners may come out heroes."
 cwp_gold_independence_button: "Grant Independence"
 cwp_gold_independence_button_desc: "Every milestone has been reached. Fix the date and hand over power to the elected government. A peaceful transfer of power would give the rest of British Africa a precedent."
 cwp_gold_independence_button_effect_tt: "The Gold Coast becomes independent, on good terms with Britain"
 cwp_africa.1.t: "Self-Government Now"
 cwp_africa.1.d_gbr: "The Gold Coast was meant to be the colony that never caused trouble. But ex-servicemen home from Burma cannot find work, cocoa farmers are losing their trees to swollen-shoot disease, and educated Africans want more than a few seats on the Legislative Council."
 cwp_africa.1.d_glc: "Our soldiers fought for Britain in Burma and came home to unemployment and rising prices. The old chiefs and lawyers who speak for us in the Legislative Council ask politely for reform. The people want self-government now."
 cwp_africa.1.f_gbr: "The Colonial Office counts the Gold Coast the most advanced colony in tropical Africa."
 cwp_africa.1.f_glc: "Self-government now."
 cwp_africa.1.a: "Take the demand seriously."
 cwp_africa.2.t: "Independence of Ghana"
 cwp_africa.2.d_gbr: "The Union Jack has come down over Christiansborg Castle. The Gold Coast has won its independence by ballot, strike and negotiation rather than war, and other colonies in Africa are watching."
 cwp_africa.2.d_glc: "At midnight our new flag went up and the Gold Coast became [ROOT.GetCountry.GetNameNoFlag]. Our leaders say that our independence means little unless the rest of Africa is free as well."
 cwp_africa.2.f_gbr: "The new state is to keep its place in the Commonwealth."
 cwp_africa.2.f_glc: "The new state takes its name from Ghana, the medieval empire of the western Sudan."
 cwp_africa.2.a: "A new nation is born."

 # --- Kenya ---
 je_cwp_kenya: "Land and Freedom"
 je_cwp_kenya_independence_desc: "A constitutional conference has opened the way to majority rule. Kenya is independent."
 cwp_kenya_emergency_cost: "Kenya Emergency"
 cwp_kenya_land_reform_cost: "Land Consolidation Program"
 cwp_kenya_emergency_button: "Declare a State of Emergency"
 cwp_kenya_emergency_button_desc: "Arrest the nationalist leaders, send in British battalions, screen the Kikuyu and hold the suspects in camps. The rising can be broken, at a price that will be paid in London as well as in Kenya."
 cwp_kenya_land_reform_button: "Land Reform in the Reserves"
 cwp_kenya_land_reform_button_desc: "Consolidate African holdings, grant title deeds and let Africans grow coffee and tea for export. A prosperous African farmer has less reason to take the oath, and less reason to defer to the settlers."
 cwp_kenya_conference_button: "Convene Lancaster House Talks"
 cwp_kenya_conference_button_desc: "Bring the African leaders, the settlers and the government to London and agree a path to majority rule. The settlers will call it betrayal."
 cwp_kenya_conference_button_effect_tt: "Kenya becomes independent under majority rule, on good terms with Britain"
 cwp_africa.10.t: "The Emergency"
 cwp_africa.10.d_gbr: "Settler farms have been attacked, loyalist chiefs murdered, and the oathing has spread through the Kikuyu reserves. The settlers demand action, and the Governor is asking London for troops and emergency powers."
 cwp_africa.10.d_kky: "The oath has been taken in every village. The land the settlers took will be taken back, by force if there is no other way."
 cwp_africa.10.f_gbr: "Land and freedom, the fighters call it. Mau Mau, say the settlers."
 cwp_africa.10.f_kky: "Land and freedom."
 cwp_africa.10.a: "Prepare for the fight."
 cwp_africa.11.t: "The Mau Mau Uprising Defeated"
 cwp_africa.11.d: "The last bands in the forests have been hunted down and their leaders captured or killed. Militarily, the Emergency is over. Politically, the question of who will rule Kenya has not been answered, and the camps have made it harder to answer."
 cwp_africa.11.f: "The detention camps are still full."
 cwp_africa.11.a: "Turn to the political question."
 cwp_africa.12.t: "Uhuru"
 cwp_africa.12.d_gbr: "The conference has ended the settlers' hope of a white man's country. Kenya will be ruled by its African majority, and the nationalist leaders the settlers feared are now its ministers."
 cwp_africa.12.d_kky: "Uhuru! Freedom has come. Kenya's own leaders form the government, and the land question is now for Kenyans to settle."
 cwp_africa.12.f_gbr: "Uhuru."
 cwp_africa.12.f_kky: "Uhuru."
 cwp_africa.12.a: "Freedom."
 cwp_africa.13.t: "Britain Driven Out of Kenya"
 cwp_africa.13.d_gbr: "The rising has overwhelmed the administration. The settlers are leaving and Britain has lost Kenya by force."
 cwp_africa.13.d_kky: "Land and Freedom has won. The British are gone."
 cwp_africa.13.f_gbr: "Settler farms across the Highlands stand abandoned."
 cwp_africa.13.f_kky: "The forest fighters are coming down from the Aberdares and Mount Kenya."
 cwp_africa.13.a: "It is over."

 # --- Belgian Congo ---
 je_cwp_belgian_congo: "The Belgian Congo"
 je_cwp_belgian_congo_reason: "Belgium rules the Congo as a model of paternalism: mission schools, clinics and copper mines, but almost no Congolese doctors, lawyers or officers, and no politics at all. The évolués, the Congolese clerks and teachers educated by the missions, have begun to ask why the independence being promised elsewhere in Africa should not reach them too."
 je_cwp_belgian_congo_independence_desc: "Belgium has granted the Congo its independence. How well the new state works depends on how much Belgium prepared it."
 cwp_congo_cadres_cost: "Training an African Administration"
 cwp_congo_unprepared: "Shortage of Trained Administrators"
 cwp_congo_cadres_button: "Train African Cadres"
 cwp_congo_cadres_button_desc: "Open the university, the officer school and the senior civil service to Congolese. A thirty-year plan for emancipation, its authors say. Each round of training leaves the new state better prepared, whenever independence comes, and two rounds keep Katanga in the Congo."
 cwp_congo_force_publique_button: "The Force Publique"
 cwp_congo_force_publique_button_desc: "Let the colonial army keep order, with Belgian officers and a free hand."
 cwp_congo_round_table_button: "Convene a Round Table"
 cwp_congo_round_table_button_desc: "Invite the Congolese parties to Brussels and agree a date for independence. The less we have prepared, the faster it will come and the harder it will be."
 cwp_congo_round_table_button_effect_tt: "The Congo becomes independent. With fewer than two rounds of cadre training, Katanga breaks away"
 cwp_congo_riots_button: "The Léopoldville Riots"
 cwp_congo_riots_button_desc: "Turn the crowds out in the capital. Belgium must see that the Congo will not wait thirty years."
 cwp_africa.20.t: "The Évolués"
 cwp_africa.20.d_bel: "Our Congo is at peace, its mines productive and its people cared for. But the Congolese clerks and teachers have read of independence won elsewhere, and a manifesto is calling for emancipation. A thirty-year plan for independence, thought daring in Brussels not long ago, already looks too slow."
 cwp_africa.20.d_cng: "Belgium says we are its children and must grow up slowly. We have teachers and clerks, but not one Congolese doctor, lawyer or officer. If freedom is coming to Africa, we must be ready to take ours."
 cwp_africa.20.f_bel: "Belgian officials still speak of the Congolese as wards in their care."
 cwp_africa.20.f_cng: "We will not wait thirty years."
 cwp_africa.20.a: "The question is open."
 cwp_africa.21.t: "Independence for the Congo"
 cwp_africa.21.d_bel: "The Congo is independent. Our officials are staying on for now, because there are too few Congolese trained to replace them, and few in Brussels believe the new state can run without them."
 cwp_africa.21.d_cng: "We are free. Our flag flies over Léopoldville, our ministers sit in the Governor's palace, and now we must run a country the size of western Europe with the few trained men Belgium left us."
 cwp_africa.21.f_bel: "Belgian civil servants are still at their desks in the ministries."
 cwp_africa.21.f_cng: "\"Dipenda!\" (Independence!) is the word in every crowd."
 cwp_africa.21.a: "Get to work."
 cwp_africa.22.t: "Katanga Secedes"
 cwp_africa.22.d_bel: "Katanga, with its copper mines and Belgian companies, has declared itself independent of the Congo. Its leaders are friends of ours, and our officers are helping them. The Congolese government calls it a Belgian plot."
 cwp_africa.22.d_cng: "Katanga has broken away, with Belgian money and Belgian officers behind it. Without its mines the Congo cannot pay its way. We will take it back."
 cwp_africa.22.f_bel: "The copper of the Union Minière pays for Katanga's government and its gendarmerie."
 cwp_africa.22.f_cng: "The country is coming apart."
 cwp_africa.22.a: "Deal with the secession."

 # --- Portuguese Africa ---
 je_cwp_portuguese_africa: "The Overseas Provinces"
 je_cwp_portuguese_africa_decolonized_desc: "Lisbon has accepted self-determination for its African provinces. Angola, Mozambique and Guinea are independent."
 je_cwp_portuguese_africa_revolution_desc: "The colonial wars have brought down the regime in Lisbon. The new government is leaving Africa."
 cwp_portugal_counter_insurgency_cost: "Portuguese Colonial War"
 cwp_portugal_colonatos_cost: "Colonatos"
 cwp_portugal_carnation: "Carnation Revolution"
 cwp_portugal_counter_insurgency_button: "Counter-Insurgency Campaign"
 cwp_portugal_counter_insurgency_button_desc: "Send more conscripts, more helicopters and more political police to the provinces. The guerrillas can be pushed back to the borders, but every campaign is another year the captains spend in the bush, asking what they are fighting for."
 cwp_portugal_colonatos_button: "Settle the Provinces"
 cwp_portugal_colonatos_button_desc: "Pay Portuguese peasants to settle in planned villages in Angola and Mozambique. A province full of Portuguese will stay Portuguese."
 cwp_portugal_decolonize_button: "Grant Self-Determination"
 cwp_portugal_decolonize_button_desc: "Accept that the provinces are colonies after all, and that their peoples may choose their own future."
 cwp_portugal_decolonize_button_effect_tt: "Angola, Mozambique and Portuguese Guinea become independent"
 cwp_africa.30.t: "War in the Provinces"
 cwp_africa.30.d_por: "Attacks on farms and police posts in northern Angola have been followed by risings elsewhere. The liberation movements have bases abroad and friends in Moscow and at the United Nations. The government in Lisbon says Portugal will stand alone if it must."
 cwp_africa.30.d_col: "The liberation movements have taken up arms. Portugal will not negotiate; it will have to be fought."
 cwp_africa.30.f_por: "Proudly alone."
 cwp_africa.30.f_col: "The struggle continues."
 cwp_africa.30.a: "Send the troops."
 cwp_africa.31.t: "Independence from Portugal"
 cwp_africa.31.d_por: "Another of our former provinces has become independent. The settlers are coming home in their hundreds of thousands."
 cwp_africa.31.d_col: "Five centuries of Portuguese rule are over. We are free."
 cwp_africa.31.f_por: "Lisbon must find homes and work for the returning settlers."
 cwp_africa.31.f_col: "The struggle continues."
 cwp_africa.31.a: "Mark the day."
 cwp_africa.32.t: "The Carnation Revolution"
 cwp_africa.32.d_por: "Junior officers, worn out by wars they cannot win, have overthrown the regime in a bloodless coup. Crowds fill the streets of Lisbon and put carnations in the soldiers' rifles. The new government's first promise is to end the colonial wars."
 cwp_africa.32.d_col: "The regime in Lisbon has fallen to its own officers. The new government says it will leave Africa."
 cwp_africa.32.f_por: "Grândola, vila morena."
 cwp_africa.32.f_col: "The war has been won in Lisbon."
 cwp_africa.32.a: "The empire ends."

