l_english:
 # --- Gold Coast ---
 je_cwp_gold_coast: "Self-Government Now"
 je_cwp_gold_coast_reason: "The Gold Coast is Britain's model colony: rich in cocoa and gold, with an educated élite and a Legislative Council that already has an African majority. Its nationalists want more than a majority on a council. Veterans home from Burma, cocoa farmers ruined by swollen-shoot disease and young men in the towns are listening to leaders who demand self-government now."
 je_cwp_gold_coast_independence_desc: "Britain has handed power to an elected African government. The Gold Coast is independent."
 cwp_gold_constitution_cost: "Constitutional Commission"
 cwp_gold_constitution_button: "Constitutional Reform"
 cwp_gold_constitution_button_desc: "Appoint an all-African committee to draft a new constitution, with elections and African ministers. Power shared now may be power handed over later, on our terms."
 cwp_gold_detentions_button: "Detain the Agitators"
 cwp_gold_detentions_button_desc: "Arrest the nationalist leaders before they can win an election, and hold them without trial. The colony will be quiet for a year; the prisoners may come out heroes."
 cwp_gold_independence_button: "Grant Independence"
 cwp_gold_independence_button_desc: "Every milestone has been reached. Fix the date and hand over power to the elected government. If it goes well, the Gold Coast will show the rest of Africa that the road to freedom need not run through war."
 cwp_gold_independence_button_effect_tt: "The Gold Coast becomes independent, on good terms with Britain"
 cwp_africa.1.t: "Self-Government Now"
 cwp_africa.1.d_gbr: "The Gold Coast was meant to be the colony that never caused trouble. Now there are riots in Accra after police fired on a march of ex-servicemen, and a new generation of nationalists talks of self-government within years, not generations."
 cwp_africa.1.d_glc: "Our soldiers fought for Britain in Burma and came home to unemployment and rising prices. The old chiefs and lawyers who speak for us in the Legislative Council ask politely for reform. The people want self-government now."
 cwp_africa.1.f_gbr: "The model colony is asking for its reward."
 cwp_africa.1.f_glc: "Self-government now."
 cwp_africa.1.a: "Let us see where this leads."
 cwp_africa.2.t: "Freedom at Midnight in Accra"
 cwp_africa.2.d_gbr: "The Union Jack has come down over Christiansborg Castle. The Gold Coast is the first colony in black Africa to win its independence, and it has done so by ballot, strike and negotiation rather than war. Other colonies are watching."
 cwp_africa.2.d_glc: "At midnight our new flag went up. We are free, and we are the first. Our independence is meaningless unless it is linked with the liberation of the rest of Africa."
 cwp_africa.2.f_gbr: "A good end to an empire, the Colonial Office says. Others ask whether it is the beginning of the end."
 cwp_africa.2.f_glc: "The first light of a new Africa."
 cwp_africa.2.a: "A new nation is born."

 # --- Kenya ---
 je_cwp_kenya: "Land and Freedom"
 je_cwp_kenya_independence_desc: "A constitutional conference has opened the way to majority rule. Kenya is independent."
 cwp_kenya_emergency_cost: "Kenya Emergency"
 cwp_kenya_land_reform_cost: "Land Consolidation Programme"
 cwp_kenya_emergency_button: "Declare a State of Emergency"
 cwp_kenya_emergency_button_desc: "Arrest the nationalist leaders, send in British battalions, screen the Kikuyu and hold the suspects in camps. The rising can be broken, at a price that will be paid in London as well as in Kenya."
 cwp_kenya_land_reform_button: "Land Reform in the Reserves"
 cwp_kenya_land_reform_button_desc: "Consolidate African holdings, grant title deeds and let Africans grow coffee and tea for export. A prosperous African farmer has less reason to take the oath, and less reason to defer to the settlers."
 cwp_kenya_conference_button: "Call a Constitutional Conference"
 cwp_kenya_conference_button_desc: "Bring the African leaders, the settlers and the government to London and agree a path to majority rule. The settlers will call it betrayal."
 cwp_kenya_conference_button_effect_tt: "Kenya becomes independent under majority rule, on good terms with Britain"
 cwp_africa.10.t: "The Emergency"
 cwp_africa.10.d_gbr: "Settler farms have been attacked, loyalist chiefs murdered, and the oathing has spread through the Kikuyu reserves. The settlers demand action, and the Governor is asking London for troops and emergency powers."
 cwp_africa.10.d_kky: "The oath has been taken in every village. The land the settlers took will be taken back, by force if there is no other way."
 cwp_africa.10.f_gbr: "Land and freedom, the fighters call it. Mau Mau, say the settlers."
 cwp_africa.10.f_kky: "Land and freedom."
 cwp_africa.10.a: "So it has come to this."
 cwp_africa.11.t: "The Forest Fighters Broken"
 cwp_africa.11.d: "The last bands in the forests have been hunted down and their leaders captured or killed. Militarily, the Emergency is over. Politically, the question of who will rule Kenya has not been answered, and the camps have made it harder to answer."
 cwp_africa.11.f: "A war won, and a cause not lost."
 cwp_africa.11.a: "The politics remain."
 cwp_africa.12.t: "Uhuru"
 cwp_africa.12.d_gbr: "The conference has ended the settlers' dream of a white man's country. Kenya will be ruled by its African majority, and the detained leaders are now its ministers."
 cwp_africa.12.d_kky: "Uhuru! Freedom has come. The men Britain jailed are now the government, and the land question is ours to settle."
 cwp_africa.12.f_gbr: "Uhuru."
 cwp_africa.12.f_kky: "Uhuru."
 cwp_africa.12.a: "Freedom."
 cwp_africa.13.t: "Britain Driven Out of Kenya"
 cwp_africa.13.d_gbr: "The rising has overwhelmed the administration. The settlers are leaving and Britain has lost Kenya by force."
 cwp_africa.13.d_kky: "Land and Freedom has won. The British are gone."
 cwp_africa.13.f_gbr: "Freedom won is not easily surrendered."
 cwp_africa.13.f_kky: "Freedom won is not easily surrendered."
 cwp_africa.13.a: "It is over."

 # --- Belgian Congo ---
 je_cwp_belgian_congo: "The Belgian Congo"
 je_cwp_belgian_congo_reason: "Belgium rules the Congo as a model of paternalism: mission schools, clinics and copper mines, but almost no Congolese doctors, lawyers or officers, and no politics at all. The évolués, the Congolese clerks and teachers educated by the missions, have begun to ask why the independence being promised elsewhere in Africa should not reach them too."
 je_cwp_belgian_congo_independence_desc: "Belgium has granted the Congo its independence. How well the new state works depends on how much Belgium prepared it."
 cwp_congo_cadres_cost: "Training an African Administration"
 cwp_congo_unprepared: "Unprepared State"
 cwp_congo_cadres_button: "Train African Cadres"
 cwp_congo_cadres_button_desc: "Open the university, the officer school and the senior civil service to Congolese. A thirty-year plan for emancipation, its authors say. Each round of training leaves the new state better prepared, whenever independence comes, and two rounds keep Katanga in the Congo."
 cwp_congo_force_publique_button: "The Force Publique"
 cwp_congo_force_publique_button_desc: "Let the colonial army keep order, with Belgian officers and a free hand."
 cwp_congo_round_table_button: "Convene a Round Table"
 cwp_congo_round_table_button_desc: "Invite the Congolese parties to Brussels and agree a date for independence. The less we have prepared, the faster it will come and the harder it will be."
 cwp_congo_round_table_button_effect_tt: "The Congo becomes independent. With fewer than two rounds of cadre training, Katanga breaks away"
 cwp_congo_riots_button: "Rise in Léopoldville"
 cwp_congo_riots_button_desc: "Turn the crowds out in the capital. Belgium must see that the Congo will not wait thirty years."
 cwp_africa.20.t: "The Évolués"
 cwp_africa.20.d_bel: "Our Congo is at peace, its mines productive and its people cared for. But the Congolese clerks and teachers have read about Ghana, and a manifesto is calling for emancipation. Some in Brussels say thirty years; others say it may not be so long."
 cwp_africa.20.d_cng: "Belgium says we are its children and must grow up slowly. We have teachers and clerks, but not one Congolese doctor, lawyer or officer. If freedom is coming to Africa, we must be ready to take ours."
 cwp_africa.20.f_bel: "Paternalism has run out of time."
 cwp_africa.20.f_cng: "We will not wait thirty years."
 cwp_africa.20.a: "The question is open."
 cwp_africa.21.t: "Independence for the Congo"
 cwp_africa.21.d_bel: "The Congo is independent. Our officials are staying on for now, because there are too few Congolese to replace them. Everything depends on whether the new state can hold together."
 cwp_africa.21.d_cng: "We are free. Our flag flies over Léopoldville, our ministers sit in the Governor's palace, and now we must run a country the size of western Europe with the few trained men Belgium left us."
 cwp_africa.21.f_bel: "Independence, ready or not."
 cwp_africa.21.f_cng: "Independence, ready or not."
 cwp_africa.21.a: "So it begins."
 cwp_africa.22.t: "Katanga Secedes"
 cwp_africa.22.d_bel: "Katanga, with its copper mines and Belgian companies, has declared itself independent of the Congo. Its leaders are friends of ours, and our officers are helping them. The Congolese government calls it a Belgian plot."
 cwp_africa.22.d_cng: "Katanga has broken away, with Belgian money and Belgian officers behind it. Without its mines the Congo cannot pay its way. We will take it back."
 cwp_africa.22.f_bel: "Copper is thicker than water."
 cwp_africa.22.f_cng: "The country is coming apart."
 cwp_africa.22.a: "A crisis is upon us."

 # --- Portuguese Africa ---
 je_cwp_portuguese_africa: "The Overseas Provinces"
 je_cwp_portuguese_africa_decolonized_desc: "Lisbon has accepted self-determination for its African provinces. Angola, Mozambique and Guinea are independent."
 je_cwp_portuguese_africa_revolution_desc: "The colonial wars have brought down the regime in Lisbon. The new government is leaving Africa."
 cwp_portugal_counter_insurgency_cost: "Colonial Wars"
 cwp_portugal_colonatos_cost: "Settlement Schemes"
 cwp_portugal_carnation: "Carnation Revolution"
 cwp_portugal_counter_insurgency_button: "Counter-Insurgency Campaign"
 cwp_portugal_counter_insurgency_button_desc: "Send more conscripts, more helicopters and more political police to the provinces. The guerrillas can be pushed back to the borders, but every campaign is another year the captains spend in the bush, asking what they are fighting for."
 cwp_portugal_colonatos_button: "Settle the Provinces"
 cwp_portugal_colonatos_button_desc: "Pay Portuguese peasants to settle in planned villages in Angola and Mozambique. A province full of Portuguese will stay Portuguese."
 cwp_portugal_decolonize_button: "Grant Self-Determination"
 cwp_portugal_decolonize_button_desc: "Accept that the provinces are colonies after all, and that their peoples may choose their own future."
 cwp_portugal_decolonize_button_effect_tt: "Angola, Mozambique and Portuguese Guinea become independent"
 cwp_africa.30.t: "War in the Provinces"
 cwp_africa.30.d_por: "Attacks on farms and police posts in northern Angola have been followed by risings elsewhere. The liberation movements have bases abroad and friends in Moscow and at the United Nations. The government in Lisbon says Portugal will stand alone if it must."
 cwp_africa.30.d_col: "The liberation movements have taken up arms. Portugal will not negotiate; it will have to be fought."
 cwp_africa.30.f_por: "Proudly alone."
 cwp_africa.30.f_col: "The struggle continues."
 cwp_africa.30.a: "The war begins."
 cwp_africa.31.t: "Independence from Portugal"
 cwp_africa.31.d_por: "Another of our former provinces has become independent. The settlers are coming home in their hundreds of thousands."
 cwp_africa.31.d_col: "Five centuries of Portuguese rule are over. We are free."
 cwp_africa.31.f_por: "The empire comes home."
 cwp_africa.31.f_col: "The struggle continues."
 cwp_africa.31.a: "A new day."
 cwp_africa.32.t: "The Carnation Revolution"
 cwp_africa.32.d_por: "Junior officers, worn out by wars they cannot win, have overthrown the regime in a bloodless coup. Crowds fill the streets of Lisbon and put carnations in the soldiers' rifles. The new government's first promise is to end the colonial wars."
 cwp_africa.32.d_col: "The regime in Lisbon has fallen to its own officers. The new government says it will leave Africa."
 cwp_africa.32.f_por: "Grândola, vila morena."
 cwp_africa.32.f_col: "The war has been won in Lisbon."
 cwp_africa.32.a: "The empire ends."

 # --- variety rework (2026-11-18) ---
 je_cwp_gold_coast_status_waiting: "The milestones are not all reached"
 je_cwp_gold_coast_status_campaign: "An election campaign is under way"
 je_cwp_gold_coast_status_ready: "Every milestone reached: the decision is Britain's"
 cwp_gold_milestone_constitution_tt: "A constitution with elected African ministers has been adopted"
 cwp_gold_milestone_election_tt: "A nationalist party has won a general election"
 cwp_gold_milestone_precedent_tt: "India is independent and the anti-colonial tide is at least 50"
 cwp_gold_constitution_button_possible_tt: "The anti-colonial tide has begun to rise, or the Gold Coast's #b liberty desire#! is at least 40"
 cwp_gold_election_button: "Contest the Elections"
 cwp_gold_election_button_desc: "Fight the elections under the new constitution on a single demand, self-government now, even if our leaders must campaign from prison."
 cwp_gold_election_button_possible_tt: "Our leaders are not in detention"
 cwp_gold_election_button_effect_tt: "In six months the Gold Coast votes"
 cwp_africa.4.t: "The Election"
 cwp_africa.4.d: "The nationalists have swept the Gold Coast's first general election under the new constitution. Their leader, released from prison to take office, will form the colony's first African government. The Governor has to work with the man he locked up."
 cwp_africa.4.f: "From the prison cell to the Prime Minister's office."
 cwp_africa.4.a: "The people have spoken."

 je_cwp_kenya_status_quiet: "The reserves are restless but quiet"
 je_cwp_kenya_status_rising: "Land and Freedom: the rising in the forests and reserves"
 je_cwp_kenya_status_crushed: "The forest fighters are broken; the politics remain"
 je_cwp_kenya_won_desc: "Kenya has won its independence in war. British rule is over."
 cwp_kenya_emergency_button_possible_tt: "The rising has begun (Kenya's #b liberty desire#! has reached 40)"
 cwp_kenya_forests_button: "Take to the Forests"
 cwp_kenya_forests_button_desc: "Raise the bands in the forests of Mount Kenya and the Aberdares, and strike at the settler farms and the loyalists."

 je_cwp_belgian_congo_status_paternalism: "Belgian paternalism holds the Congo quiet"
 je_cwp_belgian_congo_status_awake: "The Congo is awake: independence cannot be postponed for ever"
 cwp_congo_paternalism: "Belgian Paternalism"
 cwp_congo_cadres_button_possible_tt: "Fewer than three rounds of training have been completed"
 cwp_congo_round_table_button_possible_tt: "Ghana is independent, and the anti-colonial tide is at least 75 or the Congo's #b liberty desire#! is at least 60"
 cwp_congo_riots_button_possible_tt: "Ghana is independent or the anti-colonial tide is at least 50"

 je_cwp_portuguese_africa_won_desc: "Portugal no longer rules any of its African provinces."
 cwp_portugal_no_colonies_tt: "Portugal no longer rules Angola, Mozambique or Portuguese Guinea"
 cwp_portugal_colonatos_colony: "Portuguese Settlers"

 # --- 2026-11-18 rework, part 2 (design patterns guide) ---
 je_cwp_kenya_reason: "Kenya's best farmland, the White Highlands, belongs to a few thousand European settlers, while the Kikuyu who once farmed it are squatters, labourers or crowded into reserves. The settlers dominate the colony's politics. Among the young men of the reserves and the Nairobi slums, oaths are being sworn to take back the land, and everyone, the settlers included, looks to one man as the voice of African Kenya."
 je_cwp_kenya_status_detained: "The nationalist leader is in detention"
 cwp_kenya_detain_leader_tt: "The nationalist leader is arrested and detained without trial"
 cwp_kenya_leader_in_detention: "Leader in Detention"
 cwp_kenya_release_button: "Release the Leader"
 cwp_kenya_release_button_desc: "Let the detained leader go. The settlers called him the leader to darkness and death; the Governor may soon need him as the only man who can speak for African Kenya."
 cwp_kenya_release_button_possible_tt: "The forest fighters are broken, Kenya's #b liberty desire#! is at least 80, or the anti-colonial tide is at least 75"
 cwp_kenya_conference_button_possible_tt: "The nationalist leader is free (or dead), the anti-colonial tide is at least 75, and Labour or the intelligentsia govern Britain, the rising has been broken, the leader has become a martyr, or Kenya's #b liberty desire#! is at least 75"
 cwp_africa.14.t: "Death in Detention"
 cwp_africa.14.d_gbr: "The nationalist leader has died in British custody. Whatever the doctors say, every African in Kenya believes he was killed, and the man we locked up as a danger has become a martyr no one can negotiate with."
 cwp_africa.14.d_kky: "Our leader has died in their prison. They wanted to silence him; they have made him immortal."
 cwp_africa.14.f_gbr: "A martyr is harder to deal with than a prisoner."
 cwp_africa.14.f_kky: "His name will be the oath."
 cwp_africa.14.a: "Kenya mourns."

 cwp_congo_crisis: "Congo Crisis"

 je_cwp_katanga: "The Katanga Secession"
 je_cwp_katanga_reason: "Katanga, the copper province, has declared itself independent of the Congo with Belgian money, Belgian officers and the backing of the mining company. Without its mines the Congo cannot pay its way, and the new government in Léopoldville means to take it back."
 je_cwp_katanga_reunified_desc: "Katanga is part of the Congo again."
 je_cwp_katanga_recognised_desc: "The Congo has recognised Katanga's independence."
 cwp_katanga_reunified_tt: "The Congo holds Katanga again"
 cwp_katanga_un_mission: "United Nations Mission"
 cwp_katanga_belgian_backing: "Belgian Officers"
 cwp_katanga_un_button: "Appeal to the United Nations"
 cwp_katanga_un_button_desc: "Ask the United Nations to send troops to end the secession and get the Belgian officers out."
 cwp_katanga_back_button: "Back Katanga"
 cwp_katanga_back_button_desc: "Keep the Belgian officers and the mining company's money behind Moise Tshombe's government. The copper stays in friendly hands; the rest of Africa will call it neocolonialism."
 cwp_katanga_recognise_button: "Recognise Katanga"
 cwp_katanga_recognise_button_desc: "Accept that Katanga is lost and make peace with the secessionists."
 cwp_katanga_recognise_button_effect_tt: "The Congo gives up its claim to Katanga"
 cwp_africa.23.t: "Katanga Returns"
 cwp_africa.23.d: "The secession is over. Katanga's copper is the Congo's again, and the mercenaries and Belgian officers have gone home."
 cwp_africa.23.f: "One Congo."
 cwp_africa.23.a: "The country is whole."
 cwp_africa.24.t: "Katanga Recognised"
 cwp_africa.24.d: "The Congo has given up the fight. Katanga, and its mines, are independent."
 cwp_africa.24.f: "Copper makes a country."
 cwp_africa.24.a: "So be it."

 je_cwp_portuguese_africa_reason: "Portugal does not admit to having colonies. Angola, Mozambique and Guinea are overseas provinces of one indivisible nation, and the Estado Novo will not negotiate their future. Liberation movements are forming in the bush and in exile, and the army that must fight them is made of conscripts and of captains who did not choose this war."
 je_cwp_portuguese_africa_status_war: "The liberation wars"
 je_cwp_portuguese_africa_status_officers: "The officers are turning against the regime"
 cwp_portugal_officers_discontent: "Officers Tired of the Colonial Wars"
 cwp_portugal_decolonize_button_possible_tt: "Portugal is no longer ruled by an autocracy or a single party"
 cwp_portugal_coup_regime_tt: "The Estado Novo still rules: an autocracy or a single-party state"
 cwp_portugal_coup_officers_tt: "The Armed Forces are unhappy (approval below 0)"
 cwp_portugal_coup_fronts_tt: "Portugal is fighting on at least two fronts (colonies with #b liberty desire#! of 50 or more)"
 cwp_portugal_coup_campaigns_tt: "At least three counter-insurgency campaigns have been fought"

