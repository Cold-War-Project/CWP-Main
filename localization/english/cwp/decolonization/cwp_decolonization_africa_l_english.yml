 cwp_africa.4.t: "The Election"
 cwp_africa.4.d: "The nationalists have swept the Gold Coast's first general election under the new constitution. Their leader will form the colony's first African government, and the Governor must now share power with the party that campaigned against colonial rule."
 cwp_africa.4.f: "The new African ministers take office alongside the Governor's British officials."
 cwp_africa.4.a: "Accept the result."

