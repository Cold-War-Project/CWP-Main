l_english:
# Abolish Monarchy Journal Entry:
  je_abolish_monarchy: "Stamp Out Monarchism"
  je_abolish_monarchy_reason: "It is time to put the outdated system of hereditary rule behind us. The monarchy must be removed and its supporters humbled, and it must be given time to fade into memory."
  je_abolish_monarchy_goal: "The following must be true for 5 total years:"


# Abolish Monarchy Events:
  # Regicide Event:
  je_abolish_monarchy_events.1.t: "The Trial of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]"
  je_abolish_monarchy_events.1.d: "The radical government has imprisoned [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] and hastily organized a trial. The expected outcome is a guilty verdict followed by public execution."
  je_abolish_monarchy_events.1.f: ""Citizen [ROOT.GetCountry.GetRuler.GetLastNameNoFormatting]. The [ROOT.GetCountry.GetAdjectiveNoFormatting] nation accuses you of having committed a multitude of crimes to establish your tyranny, to destroy her freedom. Most egregious among these charges include conspiring with foreign powers, aristocratic corruption, and causing the blood of the people to flow. How do you plead?""
  je_abolish_monarchy_events.1.a: "Guilty! Long live the Republic! Long live [ROOT.GetCountry.GetName]!"
  je_abolish_monarchy_events.1.b: "This is not justice!"

  # Monarchism Stamped Out Event:
  je_abolish_monarchy_events.2.t: "The Last Monarchists"
  je_abolish_monarchy_events.2.d: "[ROOT.GetCountry.GetName] has successfully maintained a republican form of government for many years now. There are few who still remember the old monarchy with any fondness."
  je_abolish_monarchy_events.2.f: ""The days of highborn kings ruling over the meek peasantry atop a gilded throne are over. Let them pass into the realm of story books and fairy tales where they belong, and let nostalgia for those days become an idle fancy, not the grim face of reaction.""
  je_abolish_monarchy_events.2.a: "We must put the past behind us."
  je_abolish_monarchy_events.2.b: "There is no harm in nostalgia."

# Abolish Monarchy Tooltips:
  monarchist_nostalgia_tt: "[GetStaticModifier('monarchist_nostalgia').GetName|v]\n[GetStaticModifier('monarchist_nostalgia').GetDesc]"
  event_effects_je_abolish_monarchy_events.2_tt: "$event_effect_choose_one$ #indent_newline:3 \n$event_effect_all_of_the_following$ #indent_newline:3 \n• The [SCOPE.gsInterestGroup('landowners_ig').GetName] will lose the [GetIdeology('ideology_paternalistic').GetName] [concept_ideology], and gain the [GetIdeology('ideology_republican_paternalistic').GetName] $concept_ideology$\n• $no_more_royalists$\n• All [concept_interest_group] leaders that support [GetLawType('law_monarchy').GetName] will change their ideology to [GetIdeology('ideology_moderate').GetName]#!\n• The [SCOPE.gsInterestGroup('landowners_ig').GetName] get #tooltippable;tooltip:[GetPlayer.GetTooltipTag],monarchist_nostalgia_tt $monarchist_nostalgia$#!#!"
  no_more_royalists: "[concept_interest_group] Leaders will no longer have the [GetIdeology('ideology_royalist').GetName] ideology"

