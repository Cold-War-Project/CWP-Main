l_english:
 # Journal entry
 je_cwp_energy_crisis: "Energy Crisis"
 je_cwp_energy_crisis_reason: "Fuel in our market costs far more than it should. Factories cut shifts, hauliers pass the cost on to every shop in [ROOT.GetCountry.GetNameNoFlag], and motorists queue for hours at the pumps. The public wants the government to do something, but every remedy has a price: rationing angers business, subsidies drain the treasury, and real independence from imported oil takes years."
 je_cwp_energy_crisis_status_severe: "Fuel costs more than twice its normal price."
 je_cwp_energy_crisis_status_high: "Fuel is still well above its normal price."
 je_cwp_energy_crisis_status_easing: "Fuel prices are easing."
 je_cwp_energy_crisis_over_desc: "The energy crisis passed"
 je_cwp_energy_crisis_riots_desc: "The energy crisis ended in fuel riots"

 # Bar
 cwp_ec_anger_bar: "Public Anger"
 cwp_ec_anger_bar_desc: "How angry the public is about fuel prices and shortages. It follows the price of #v Refined Fuel#! in our market. If it reaches #v 100#!, the crisis ends in riots."
 cwp_ec_anger_price_tt: "Fuel costs at least 50% more than normal"
 cwp_ec_anger_price_high_tt: "Fuel costs at least twice its normal price"
 cwp_ec_anger_rationing_tt: "Rationing is in force"
 cwp_ec_anger_controls_tt: "Price controls shield consumers"
 cwp_ec_anger_fades_tt: "People adapt to the new prices"
 cwp_ec_anger_relief_tt: "Prices are easing"

 # Tooltips
 cwp_ec_price_normal_tt: "#v Refined Fuel#! costs less than 20% above its base price in our market"
 cwp_ec_anger_full_tt: "#v Public Anger#! reaches #v 100#!"

 # Buttons
 cwp_ec_conservation_button: "Appeal for Conservation"
 cwp_ec_conservation_button_desc: "Ask the public to save fuel: lower thermostats, slower speed limits, car-free Sundays. It costs nothing and helps a little."
 cwp_ec_rationing_button: "Ration Fuel"
 cwp_ec_rationing_button_desc: "Coupons, odd-even days at the pump and priority for essential services. It cuts demand sharply, and everybody hates it."
 cwp_ec_price_controls_button: "Cap Fuel Prices"
 cwp_ec_price_controls_button_desc: "Cap the retail price of fuel and pay the difference from the treasury. It costs #v 2%#! of our GDP and calms the public for six months."
 cwp_ec_diversify_button: "Energy Independence Programme"
 cwp_ec_diversify_button_desc: "Fund nuclear power, coal and efficiency standards to cut our dependence on oil. It costs #v 5%#! of our GDP now; when this crisis passes, our industry will need less fuel for ten years."

 # Modifiers
 cwp_ec_conservation: "Fuel Conservation"
 cwp_ec_rationing: "Fuel Rationing"
 cwp_ec_price_controls: "Fuel Price Controls"
 cwp_ec_rationing_resented: "Resents Fuel Policy"
 cwp_ec_energy_diversified: "Energy Diversification"
 cwp_ec_fuel_riots: "Fuel Riots"

 # Events
 cwp_ec.1.t: "The Price of Oil"
 cwp_ec.1.d: "The price of fuel in [ROOT.GetCountry.GetNameNoFlag] has shot up, and it shows no sign of coming down. Lorry drivers and taxi owners are the first to feel it, but within weeks every bus fare, every heating bill and every loaf of bread will carry the cost. The newspapers are already asking what the government intends to do."
 cwp_ec.1.f: "\"We built a whole way of life on cheap oil. Nobody asked what would happen if it stopped being cheap.\""
 cwp_ec.1.a: "We will see this through."

 cwp_ec.2.t: "The Hauliers' Blockade"
 cwp_ec.2.d: "Independent truck drivers, squeezed between fuel bills they cannot pay and freight rates they cannot raise, have parked their rigs across the main highways. Deliveries are stalled and shelves are emptying in the cities. Their leaders want a fuel rebate; the transport ministry warns that paying one would invite every other trade to block a road."
 cwp_ec.2.f: "\"We are not striking. We simply cannot afford to drive.\""
 cwp_ec.2.a: "Grant them a rebate."
 cwp_ec.2.b: "Clear the roads."

 cwp_ec.3.t: "Record Profits"
 cwp_ec.3.d: "While motorists queue at the pumps, the oil companies operating in [ROOT.GetCountry.GetNameNoFlag] have announced the best year in their history. The opposition is demanding a windfall tax, and even some of our own backbenchers agree. The companies reply that the profits are needed to find new oil, and that punishing them will only make the shortage worse."
 cwp_ec.3.f: "\"They call it a crisis. Their shareholders call it a dividend.\""
 cwp_ec.3.a: "Levy a windfall tax."
 cwp_ec.3.b: "Profits fund exploration."

 cwp_ec.4.t: "Queues at the Pumps"
 cwp_ec.4.d: "Filling stations are running dry by mid-morning, and the queues stretch around the block before dawn. Fights have broken out at several forecourts, and some stations now sell only to regular customers. The ministry proposes a Sunday driving ban to stretch supplies; motorists' clubs call it an attack on the freedom of the open road."
 cwp_ec.4.f: "\"Full tank, please.\" \"Ten litres, and be grateful.\""
 cwp_ec.4.a: "Ban driving on Sundays."
 cwp_ec.4.b: "Let the market sort it out."

 cwp_ec.5.t: "The Small Car"
 cwp_ec.5.d: "High fuel prices are changing how people in [ROOT.GetCountry.GetNameNoFlag] live. Sales of small, economical cars are booming, bicycles are back on the city streets, and householders are insulating their lofts. Economists note that every litre not burned is a litre that no longer has to be bought abroad."
 cwp_ec.5.f: "\"The best barrel of oil is the one you never need.\""
 cwp_ec.5.a: "A sensible adjustment."

 cwp_ec.20.t: "The Crisis Passes"
 cwp_ec.20.d: "Fuel prices have fallen back toward normal. The queues at the pumps are gone, the hauliers are back on the roads, and the ministers who spent months explaining the price of oil can finally talk about something else. The crisis has passed, though few believe it will be the last."
 cwp_ec.20.d_diversified: "Fuel prices have fallen back toward normal, and this time [ROOT.GetCountry.GetNameNoFlag] has something to show for the pain. New power stations, stricter efficiency standards and a leaner industry mean the next shock, when it comes, will hurt less."
 cwp_ec.20.f: "\"Never again, they said. We shall see.\""
 cwp_ec.20.a: "Back to normal, for now."

 cwp_ec.21.t: "Fuel Riots"
 cwp_ec.21.d: "Anger over the price of fuel has spilled into the streets. Filling stations have been looted, buses burned and government offices besieged in several cities. The police have restored order, but the public's faith that [ROOT.GetCountry.GetNameNoFlag]'s government can manage the economy has been badly shaken."
 cwp_ec.21.f: "\"They could not keep the lights on. Why should we trust them with anything else?\""
 cwp_ec.21.a: "Restore order."
