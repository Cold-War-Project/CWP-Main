l_english:
 # Journal entry
 je_cwp_energy_crisis: "Energy Crisis"
 je_cwp_energy_crisis_reason: "Fuel is selling far above its normal price, and our factories, truckers and motorists feel it. Every remedy has a price."
 je_cwp_energy_crisis_status_severe: "Fuel costs over twice its normal price."
 je_cwp_energy_crisis_status_high: "Fuel is well above its normal price."
 je_cwp_energy_crisis_status_easing: "Fuel prices are easing."
 je_cwp_energy_crisis_over_desc: "The energy crisis passed"
 je_cwp_energy_crisis_over_header: "The #b crisis passes#! if:\n"
 je_cwp_energy_crisis_over_effect_header: "If the #b crisis passes#!:\n$EFFECT$"
 je_cwp_energy_crisis_adapted_desc: "The economy adapted to higher fuel prices"
 je_cwp_energy_crisis_adapted_header: "The #b economy adapts#! to dear fuel if:\n"
 je_cwp_energy_crisis_adapted_effect_header: "If the #b economy adapts#! to dear fuel:\n$EFFECT$"
 cwp_ec_adapted_tt: "Fuel under 50% above base price for #v 24#! months running"
 je_cwp_energy_crisis_independence_desc: "Energy independence was declared"
 je_cwp_energy_crisis_independence_header: "We can declare #b energy independence#! if:\n"
 je_cwp_energy_crisis_independence_effect_header: "If we declare #b energy independence#!:\n$EFFECT$"
 je_cwp_energy_crisis_riots_desc: "The energy crisis ended in fuel riots"


 # Tooltips
 cwp_ec_independence_declared_tt: "Energy independence declared"
 cwp_ec_year_of_crisis_tt: "Crisis has lasted #v 12#! months"
 cwp_ec_price_doubled_tt: "Fuel at #v 2x#! its base price"
 cwp_ec_no_price_controls_tt: "No #v Fuel Price Controls#!"
 cwp_ec_clean_power_tt: "A #v Nuclear Power Plant#!, or #v 3#! levels of #v Hydroelectric Power Plant#! in one state"
 cwp_ec_domestic_refining_tt: "#v 3#! levels of #v Oil Refineries#! in one state"
 cwp_ec_demand_cut_tt: "#v Fuel Conservation#! or #v Fuel Rationing#! in force"
 cwp_ec_price_normal_tt: "Fuel under #v 20%#! above its base price"

 # Buttons
 cwp_ec_conservation_button: "Appeal for Conservation"
 cwp_ec_conservation_button_desc: "Ask the public to save fuel: lower thermostats, slower speed limits, car-free Sundays. It costs nothing and helps a little."
 cwp_ec_rationing_button: "Ration Fuel"
 cwp_ec_rationing_button_desc: "Coupons, odd-even days at the pump and priority for essential services. It cuts demand sharply, and shopkeepers and industrialists hate it."
 cwp_ec_price_controls_button: "Cap Fuel Prices"
 cwp_ec_price_controls_button_desc: "Cap the retail price of fuel and pay the difference from the treasury, so that consumers are shielded and the queues at the pumps do not turn into riots."
 cwp_ec_diversify_button: "Energy Independence Program"
 cwp_ec_diversify_button_desc: "Fund nuclear power, hydroelectric dams and domestic refining to cut our dependence on imported fuel. Once the plants are built, we can declare energy independence."
 cwp_ec_declare_independence_button: "Declare Energy Independence"
 cwp_ec_declare_independence_button_desc: "The program has delivered: clean power, our own refineries and a public used to saving fuel. Declare the crisis over for us, whatever the market does next. Our industry will need less fuel for ten years."

 # Modifiers
 cwp_ec_conservation: "Fuel Conservation"
 cwp_ec_rationing: "Fuel Rationing"
 cwp_ec_price_controls: "Fuel Price Controls"
 cwp_ec_rationing_resented: "Opposition to Fuel Rationing"
 cwp_ec_energy_diversified: "Energy Diversification"
 cwp_ec_fuel_riots: "Fuel Riots"
 cwp_ec_unrest: "Fuel Price Protests"

 # Events
 cwp_ec.1.t: "Oil Price Shock"
 cwp_ec.1.d: "The price of fuel in [ROOT.GetCountry.GetNameNoFlag] has risen sharply and shows no sign of falling. Truck drivers and taxi owners feel it first, but within weeks bus fares, heating bills and the price of bread will carry the cost. The newspapers want to know what the government means to do."
 cwp_ec.1.f: "\"A drop of oil is worth a drop of blood.\"\n— Georges Clemenceau (attributed)"
 cwp_ec.1.a: "Ask the ministries for a plan."

 cwp_ec.2.t: "The Hauliers' Blockade"
 cwp_ec.2.d: "Independent truckers, caught between fuel bills they cannot pay and freight rates they cannot raise, have parked their rigs across the main highways. Deliveries have stopped and shelves in the cities are emptying. The drivers' associations want a fuel rebate, and the transport ministry warns that paying one would invite every other trade to block a road."
 cwp_ec.2.f: "A few days without trucks are enough to empty the shops of a modern city."
 cwp_ec.2.a: "Grant them a rebate."
 cwp_ec.2.b: "Clear the roads."

 cwp_ec.3.t: "Record Profits"
 cwp_ec.3.d: "While motorists queue at the pumps, the oil companies operating in [ROOT.GetCountry.GetNameNoFlag] have reported record profits. The opposition is demanding a windfall tax, and some members of the governing party agree. The companies answer that the profits pay for exploration, and that taxing them will only prolong the shortage."
 cwp_ec.3.f: "Britain and the United States both taxed excess profits during the two world wars."
 cwp_ec.3.a: "Levy a windfall tax."
 cwp_ec.3.b: "Profits fund exploration."

 cwp_ec.4.t: "Queues at the Pumps"
 cwp_ec.4.d: "Filling stations run dry by mid-morning, and the queues form before dawn. Fights have broken out on several forecourts, and some stations now sell only to regular customers. The ministry proposes a ban on Sunday driving to stretch supplies; the motoring clubs call it an attack on the freedom of the road."
 cwp_ec.4.f: "Gasoline was rationed in most of the warring countries during the Second World War."
 cwp_ec.4.a: "Ban driving on Sundays."
 cwp_ec.4.b: "Let prices ration the fuel."

 cwp_ec.5.t: "The Small Car"
 cwp_ec.5.d: "High fuel prices are changing how people in [ROOT.GetCountry.GetNameNoFlag] live. Small, economical cars are selling well, bicycles are back on city streets, and householders are insulating their attics. Every liter not burned is a liter that does not have to be bought abroad."
 cwp_ec.5.f: "Dealers report waiting lists for their smallest models."
 cwp_ec.5.a: "Encourage the change."

 cwp_ec.20.t: "End of the Energy Crisis"
 cwp_ec.20.d: "Fuel prices have fallen back toward normal. The queues at the pumps are gone, the truckers are back on the roads, and ministers who spent months explaining the price of oil can turn to other business."
 cwp_ec.20.d_diversified: "Fuel prices have fallen back toward normal, and [ROOT.GetCountry.GetNameNoFlag] comes out of the crisis with new power stations, stricter efficiency standards and an industry that burns less fuel than before. The next price shock will cost the economy less."
 cwp_ec.20.f: "The emergency measures lapse at the end of the month."
 cwp_ec.20.a: "Return to normal business."

 cwp_ec.21.t: "Fuel Riots"
 cwp_ec.21.d: "Anger over fuel prices has spilled into the streets. Filling stations have been looted, buses burned and government offices besieged in several cities. The police have restored order, but confidence in the government's handling of the economy has been badly shaken."
 cwp_ec.21.f: "Shopkeepers along the main streets are boarding up their windows."
 cwp_ec.21.a: "Restore order."
 cwp_ec.22.t: "Energy Independence"
 cwp_ec.22.d: "With new power stations on line, refineries of its own and a public that has learned to save fuel, the government of [ROOT.GetCountry.GetNameNoFlag] has declared the energy crisis over. The next oil shock will still be felt at the pump, but it will no longer stop the factories."
 cwp_ec.22.f: "\"Safety and certainty in oil lie in variety and variety alone.\"\n— Winston Churchill, House of Commons, 1913"
 cwp_ec.22.a: "Announce it to the country."
 cwp_ec_cost_2pct_tt: "Costs #v 2%#! of our GDP"
 cwp_ec_cost_5pct_tt: "Costs #v 5%#! of our GDP"
 cwp_ec_gain_2pct_tt: "Returns #v 2%#! of our GDP to the treasury"
 cwp_ec_candidate_tt: "From 1948: fuel at #v 75%#! or more over its base price in our own market"
