l_english:
# Coup Events
  cwp_coup.1.t: "[SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetLastName]'s Endeavor"
  cwp_coup.1.d: "The [SCOPE.sCharacter('golpista_general').GetCustom('personality_traits_loc')|l] [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetFullName] has begun to make threatening moves towards seizing power over [ROOT.GetCountry.GetName]. [SCOPE.sCharacter('golpista_general').GetSheHe|U] is backed by a faction of the [SCOPE.gsInterestGroup('golpista_ig').GetName]."
  cwp_coup.1.f: "Colonel [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting] lifted the tent flap, and slipped inside. The atmosphere was already heavy with smoke, and the other chairs filled. Maps were spread out across the table - terrain, government facilities, vital infrastructure. He saluted the [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] sitting at the end of the table, and took his seat.\n\nHe was not alone. Colonel [SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting] sat to his left, his pipe merrily contributing to the suffocating haze.\n\n"I apologize for my tardiness," [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting] began. "There was a new gate guard."\n\nThe [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] nodded. "Forgiven. Your report, please. Status of the Twenty-Fourth?""
  cwp_coup.1.a: "Godspeed, [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetLastName]!"
  cwp_coup.1.b: "The present regime must survive."

  cwp_coup.2.t: "Pronunciamento!"
  cwp_coup.2.d: "[SCOPE.sCharacter('golpista_general').GetRankName] [SCOPE.sCharacter('golpista_general').GetFullName] has issued a pronunciamento from [SCOPE.sCharacter('golpista_general').GetHerHis] headquarters in [SCOPE.sState('pronunciamento_state').GetName]. The [SCOPE.sCharacter('golpista_general').GetCustom('getGeneralAdmiral')] and [SCOPE.sCharacter('golpista_general').GetHerHis] allies in the [SCOPE.gsInterestGroup('golpista_ig').GetName] have come into open opposition to our government."
  cwp_coup.2.f: "Fellow citizens,\n\nThe regime in [ROOT.GetCountry.GetCapital.GetCityHubName] has proclaimed a death sentence for [ROOT.GetCountry.GetNameNoFormatting], and has deprived us of any hope of putting an end to civil discord. Nothing remains outside of an appeal to the people.\n\nMy countrymen! Hear the cry of the homeland! Close your ears to the suggestion of a regime which, in its spite and impotence, places all its hope in the disunity of the people and the army.\n\n[SCOPE.sState('pronunciamento_state').GetNameNoFormatting] Headquarters, [TimeKeeper.GetCurrentDate.GetString]\n[SCOPE.sCharacter('golpista_general').GetFullNameNoFormatting]" # Heavily edited version of General Gabriel Valencia's pronunciamento on September 4, 1841
  cwp_coup.2.a: "The military has spoken. Our mandate is done."
  cwp_coup.2.b: "We will not capitulate!"

  cwp_coup.3.t: "For Lack of Interest"
  cwp_coup.3.d: "The conspiracy to overthrow the sitting [ROOT.GetCountry.GetAdjective] government has lost all momentum amongst the [SCOPE.gsInterestGroup('golpista_ig').GetName]. [SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetFullName]'s plot has been abandoned."
  cwp_coup.3.f: ""The trouble with you, [SCOPE.sCharacter('golpista_general').GetLastNameNoFormatting], is that just because you have succeeded in inducing a handful of half-wits to disfigure the [SCOPE.sState('capital_scope').GetCityHubName] scene by going about in black shorts, you think you're someone. You hear them shouting "Hail, [SCOPE.sCharacter('golpista_general').GetLastNameNoFormatting]!" and you imagine it is the Voice of the People. That is where you make your bloomer. What the Voice of the People is saying is: "Look at that frightful ass [SCOPE.sCharacter('golpista_general').GetLastNameNoFormatting] swanking about in footer bags! Did you ever in your puff see such a perfect perisher?"" # - P.G. Wodehouse
  cwp_coup.3.a: "Pray no one will find out what nearly transpired."
  cwp_coup.3.b: "We know what plans [SCOPE.sCharacter('golpista_general').GetSheHe] had in store. Justice will be served."

  cwp_coup.4.t: "Closing In"
  cwp_coup.4.d: "[SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetFullName] has become aware of the state's efforts to reduce the amount of military forces available to [SCOPE.sCharacter('golpista_general').GetHerHim]. [SCOPE.sCharacter('golpista_general').GetSheHe|U] has accused the government of recklessly meddling in military affairs."
  cwp_coup.4.f: "[SCOPE.sCharacter('golpista_general').GetPrimaryRoleTitle] [SCOPE.sCharacter('golpista_general').GetLastNameNoFormatting] paced back and forth across the floor of [SCOPE.sCharacter('golpista_general').GetHerHis] tent. Assembled before [SCOPE.sCharacter('golpista_general').GetHerHim] were [SCOPE.sCharacter('golpista_general').GetHerHis] loyal lieutenants—those who had not yet been forced to relocate. He had not been able to outright refuse the orders that had suddenly arrived from [ROOT.GetCountry.GetCapital.GetCityHubName], reducing him to a skeleton crew of crucial headquarters staff.\n\nThe government was onto him. There was little other explanation. No other command had been targeted so heavily. Were he to recover his positions, he would need to respond. He indicated to two of the men in the front row.\n\n"Colonel [SCOPE.sCharacter('name_a_scope').GetLastNameNoFormatting], Major [SCOPE.sCharacter('name_b_scope').GetLastNameNoFormatting]...""
  cwp_coup.4.a: ""...inform your men to take positions.""
  cwp_coup.4.b: ""...relay the news to our far-flung colleagues.""
