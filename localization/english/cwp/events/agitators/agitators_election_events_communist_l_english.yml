#Place for localization of deprecated vanilla entries
l_english:
  agitators_election_events_communist.1.t: "Ballot or Bullet"
  agitators_election_events_communist.1.d: "The particularly effective agitation that [SCOPE.sCharacter('agitator_scope').GetFullName] has been carrying out in [SCOPE.sState('communist_agitation_state').GetName] has raised questions about the ultimate goal of the [SCOPE.sParty('agitator_party_scope').GetName] in this election cycle."
  agitators_election_events_communist.1.f: ""It is the foremost task of the Communist Party to advance the working class to the revolutionary struggle for power. In determining its line of tactics, it must take into account the concrete internal and external situation, the co-relation of class forces, the degree of stability and strength of the bourgeoisie, the degree of preparedness of the proletariat, the position taken up by the various intermediary strata, etc., in its country. The Party determines slogans and methods of struggle in accordance with these circumstances, with the view to organising and mobilising the masses on the broadest possible scale and on the highest possible level of this struggle."\n\n— #italic Programme of the Communist International#!, 1929"
  agitators_election_events_communist.1.a: "The [SCOPE.sParty('agitator_party_scope').GetName]'s election is the prelude to revolution."
  agitators_election_events_communist.1.b: "Workers' power will be achieved through a [SCOPE.sParty('agitator_party_scope').GetName] parliament."
  agitators_election_events_communist.1.c: "The [SCOPE.sParty('agitator_party_scope').GetName] does not represent the working class."

  agitators_election_events_communist.2.t: "The Revolutionary Line"
  agitators_election_events_communist.2.d: "With the [SCOPE.sParty('agitator_party_scope').GetName]'s campaign funds well-established, [SCOPE.sCharacter('agitator_scope').GetFullName] has proposed to the party leadership that a quantity of these funds may be repurposed for the party's more clandestine activities."
  agitators_election_events_communist.2.f: ""We, as the party of the proletariat, are bound to follow the course that will lead to the realization of socialism in [ROOT.GetCountry.GetNameNoFormatting], and eventually the world. The upper class will not simply step aside peacefully - even if we must follow this parliamentary course, we must develop forces to avert the inevitable coup that will follow our victory.""
  agitators_election_events_communist.2.a: "The funds may be repurposed on training for our Red Guards."
  agitators_election_events_communist.2.b: "The risk of being implicated in a scandal is too high."
  agitators_election_events_communist.2.c: "All available resources must go to fostering revolution."

  agitators_election_events_communist.3.t: "Walking Among the People"
  agitators_election_events_communist.3.d: "[SCOPE.sParty('agitator_party_scope').GetName] organizers led by [SCOPE.sCharacter('agitator_scope').GetFullName] have traveled to the countryside, in order to build class consciousness amongst the [ROOT.GetCountry.GetAdjective] peasantry."
  agitators_election_events_communist.3.f: "Here, lost in the vast expanse between smoke-seared enclaves, lay those whose lives had not changed for five hundred years.\n\nScratching at the soil, sowing seeds to achieve the barest sort of survival and surrendering all surplus to their feudal landlords, they looked only to their present station, unaware of the red-tinted sun that would crest their gentle hills the very next morning."
  agitators_election_events_communist.3.a: "A bold step to advance the worker-peasant alliance."
  agitators_election_events_communist.3.b: "Focus their efforts on organizing against landlordism."

  agitators_election_events_communist.4.t: "Communist Rally in [SCOPE.sState('capital_scope').GetName]"
  agitators_election_events_communist.4.d: "A massive rally led by [SCOPE.sCharacter('agitator_scope').GetFullName] in support of the [SCOPE.sParty('agitator_party_scope').GetName] has been held in [SCOPE.sState('capital_scope').GetName], drawing supporters of the communists from across the region. The rhetoric used at the rally has raised concerns of imminent violence."
  agitators_election_events_communist.4.f: "[SCOPE.sCharacter('agitator_scope').GetLastNameNoFormatting], at the head of the crowd, looked to the thin line of blue and black at the end of the street, and then back to the vast red-tinged mass behind [SCOPE.sCharacter('agitator_scope').GetHerHim]. [SCOPE.sCharacter('agitator_scope').GetSheHe|U] did not hesitate. With the gravitas of one fearlessly claiming the abyss for their own, [SCOPE.sCharacter('agitator_scope').GetSheHe] took another step forward into the wild melee."
  agitators_election_events_communist.4.a: "A wonderful day for the people of [SCOPE.sState('capital_scope').GetName]!"
  agitators_election_events_communist.4.b: "We will show the Reds what violence looks like."
  agitators_election_events_communist.4.c: "The [SCOPE.sParty('fascist_party_scope').GetName]'s partisans will handle these miscreants."

  agitators_election_events_communist.5.t: "The United Front"
  agitators_election_events_communist.5.d: "The ascendance of the [SCOPE.sParty('fascist_party_scope').GetName] in the recent [ROOT.GetCountry.GetAdjective] elections has led [SCOPE.sCharacter('agitator_scope').GetFullName] and the leadership of the [SCOPE.sParty('agitator_party_scope').GetName] to propose a united front amongst the leftist and liberal parties against fascism."
  agitators_election_events_communist.5.f: "And just because he's a human,\na man would like a little bite to eat;\nhe wants no bull and a lot of talk\nthat gives no bread or meat."
  agitators_election_events_communist.5.a: "Anything is better than the [SCOPE.sParty('fascist_party_scope').GetName]'s vision."
  agitators_election_events_communist.5.b: "Social democracy is simply the left wing of fascism."
