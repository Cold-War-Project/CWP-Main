#Place for localization of deprecated vanilla entries
l_english:
  agitators_election_events_radical.1.t: "Rent In This Economy?"
  agitators_election_events_radical.1.d: "The [SCOPE.gsInterestGroup('devout_ig').GetName] have formally censured [SCOPE.sCharacter('agitator_scope').GetFullName] over an unconventional article in a [SCOPE.sParty('agitator_party_scope').GetName] newspaper advocating for disruptive social policies."
  agitators_election_events_radical.1.f: ""I would like to express my sincerest apologies for my article in the gazette on Thursday. At the time, I had been speaking with several fellows about the deplorable state the renting situation has become in [SCOPE.sState('capital_scope').GetNameNoFormatting]. Perhaps it is forever too soon to suggest polygamy as a viable solution for the working class.""
  agitators_election_events_radical.1.a: "The sanctity of marriage must be protected!"
  agitators_election_events_radical.1.b: "Anything to make renting more bearable..."
  agitators_election_events_radical.1.c: "You could just give them money."

  agitators_election_events_radical.2.t: "Popularity Contest"
  agitators_election_events_radical.2.d: "[SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('monarch_scope').GetFullName]'s desperation for the approval of [SCOPE.sCharacter('monarch_scope').GetHerHis] subjects has inspired [SCOPE.sCharacter('agitator_scope').GetFullName] to further the [SCOPE.sParty('agitator_party_scope').GetName]'s views."
  agitators_election_events_radical.2.f: ""Look now at this failed ruler! This appointee of God! A man who barely knows what day it is, let alone how to tie his own shoes. Attended for his every whim by you, you bakers and cobblers, you tailors and butchers. And now, he rewards his favorite flatterers with the sweat of your brow. Your very lives! If God appointed him, then I say God is a fool! No, no, I say... I say God is dead!""
  agitators_election_events_radical.2.a: "Rally the people in the city squares."
  agitators_election_events_radical.2.b: "Address the [SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle]'s loyal 'thinkers.'"
  agitators_election_events_radical.2.c: "Enlighten the faltering [SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle] directly."

  agitators_election_events_radical.3.t: "The Other Voting Methods"
  agitators_election_events_radical.3.d: "[SCOPE.sCharacter('agitator_scope').GetFullName] has taken to the streets, encouraging [SCOPE.sCulture('discriminated_culture_scope').GetName] people to take less conventional means of democracy in order to support the [SCOPE.sParty('agitator_party_scope').GetName]."
  agitators_election_events_radical.3.f: "A riot may be the voice of the unheard, but it is one of many tools to be heard. The simplest of which is a kind word over a drink. Next is art. Many who do not appreciate art often forget how powerful a well-crafted poster is. Of course, there is always the option of a kind word and a gun in a dark alley. The choices are endless when you put your mind to it."
  agitators_election_events_radical.3.a: "And they will be heard when the time is right."
  agitators_election_events_radical.3.b: "Any malcontents ought to be jailed."
  agitators_election_events_radical.3.c: "No democracy is true without everyone's voice."

  agitators_election_events_radical.4.t: "Rights for Me, and for Thee"
  agitators_election_events_radical.4.d: "[SCOPE.sCharacter('agitator_scope').GetFullName] has taken a fiery stand against the [SCOPE.sParty('anti_democratic_party').GetName]'s case for democracy by the enlightened few. Though simple, the case was an effective endorsement of the [SCOPE.sParty('agitator_party_scope').GetName]'s stance on [GetLawType('law_universal_suffrage').GetName]."
  agitators_election_events_radical.4.f: ""The conventionalities of democracy make it impossible for any but the enlightened men among us to vote. I should put it to anyone to disprove that natural course of democracy."\n\n"Ahem. I shall offer a simple refutation. Could any man or woman not in present ownership of property raise their hand if they agree: a child ought to learn to read and write when able."\n\nEvery hand rose.\n\n"And now you have participated in democracy.""
  agitators_election_events_radical.4.a: "Simple and true. Remarkable!"
  agitators_election_events_radical.4.b: "There's more to lawmaking than this."
  agitators_election_events_radical.4.c: "And what about the women?"

  agitators_election_events_radical.5.t: "To Decapitate a Serpent"
  agitators_election_events_radical.5.d: "[SCOPE.sCharacter('agitator_scope').GetFullName] has ambushed a royal appearance in [SCOPE.sState('capital_scope').GetCityHubName] for a simple announcement: the [SCOPE.sParty('agitator_party_scope').GetName] are wholly committed to the establishment of a republic."
  agitators_election_events_radical.5.f: "The divine right of kings is one such justification that the monarch in question should never be questioned. Another is the Mandate of Heaven. Second verse, same as the first, it is the same in principle: do not question the monarch. The funny thing is, once God is dead, who then assures the divine right?"
  agitators_election_events_radical.5.a: "The [SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle] must demonstrate [SCOPE.sCharacter('monarch_scope').GetHerHis] connection to the people."
  agitators_election_events_radical.5.b: "Sedition cannot be tolerated."
  agitators_election_events_radical.5.c: "Our allegiance is to a republic, to democracy!"
