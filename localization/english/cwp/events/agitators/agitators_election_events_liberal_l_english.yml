#Place for localization of deprecated vanilla entries
l_english:
  agitators_election_events_liberal.1.t: "Authorial Intent"
  agitators_election_events_liberal.1.d: "A minor scandal has buzzed around the [SCOPE.sParty('agitator_party_scope').GetName], as a piece of reformist fiction written by [SCOPE.sCharacter('agitator_scope').GetFullName] in [SCOPE.sCharacter('agitator_scope').GetHerHis] youth has begun to circulate once more. Whilst enthusiastically written, that is the work's only merit."
  agitators_election_events_liberal.1.f: "The "plague of superstition and dogma" was the end of [ROOT.GetCountry.GetNameNoFormatting]? If it is so, why are the trains still running? How could they possibly have acquired the coal to fuel it? Your propensity to butcher your characters for cheap tragedy is nothing short of shameful. And to make matters worse... why would [SCOPE.GetRootScope.GetCountry.GetCustom('fiction_cliche')]"
  agitators_election_events_liberal.1.a: "A tragic tale, but there is no reason to harass [SCOPE.sCharacter('agitator_scope').GetHerHim]."
  agitators_election_events_liberal.1.b: "This is [SCOPE.sCharacter('agitator_scope').GetFullName]'s problem, not the party's."
  agitators_election_events_liberal.1.c: "The quality is reflective of... the conservative repression of arts."

  agitators_election_events_liberal.2.t: "The Curse of Shackles"
  agitators_election_events_liberal.2.d: "[SCOPE.sCharacter('agitator_scope').GetFullName] delivered a speech on behalf of the [SCOPE.sParty('agitator_party_scope').GetName] to a crowd of hundreds in one of [SCOPE.sState('capital_scope').GetCityHubName]'s parks. By the end of it, the crowd had soured against any notion of slavery."
  agitators_election_events_liberal.2.f: ""Dozens, if not hundreds, brought upon ships from their homes. Taken in the dead of night or sold to appease a debtor, it does not matter. Then they are arrayed, as if you would stack carpets or chairs, in the holds for months."\n\nA lady brought a handkerchief to her cheek. Her husband's lip stiffened.\n\n"Avert your eyes all you wish, but your hearts know the truth.""
  agitators_election_events_liberal.2.a: "The people chose before; they will choose now."
  agitators_election_events_liberal.2.b: "Bring the matter to the table at once!"

  agitators_election_events_liberal.3.t: "A Rational Discussion"
  agitators_election_events_liberal.3.d: "While meeting to discuss ideas, [SCOPE.sCharacter('agitator_scope').GetFullName] and [SCOPE.gsInterestGroup('opposition_ig_scope').GetLeader.GetFullName] enjoyed a civil and enlightening conversation. Most expected a brawl."
  agitators_election_events_liberal.3.f: "Some say opposites attract, and others say opposites repulse. A few understand that one of the natures of opposites is change: fire and water to steam, spark and gunpowder to explosion, heat and ore to metal. And so it is with a good-faith debate: a leap in thought to form fresh ideas."
  agitators_election_events_liberal.3.a: "Liberal civility is the way forward."
  agitators_election_events_liberal.3.b: "[SCOPE.sCharacter('agitator_scope').GetFullName]'s conduct ought to be commended."
  agitators_election_events_liberal.3.c: "Even the Opposition should be heard."

  agitators_election_events_liberal.4.t: "Our Great Nation"
  agitators_election_events_liberal.4.d: "Seeking to turn the tide of nationalism to the favor of the [SCOPE.sParty('agitator_party_scope').GetName], [SCOPE.sCharacter('agitator_scope').GetFullName] held a patriotic speech in one of [SCOPE.sState('capital_scope').GetCityHubName]'s parks."
  agitators_election_events_liberal.4.f: "Nationalism is the often assumed and unearned superiority of one's place of birth. It is easily mistaken for something approaching the lines of patriotism, but a sharp eye can spot the different. A sharper mind knows how to use it as leverage."
  agitators_election_events_liberal.4.a: "Truly, a hero for the people."
  agitators_election_events_liberal.4.b: "We should ensure the laws are properly secured."
  agitators_election_events_liberal.4.c: "Cease this shameless pandering!"

  agitators_election_events_liberal.5.t: "Speaking on Speech"
  agitators_election_events_liberal.5.d: "Today's speech from [SCOPE.sCharacter('agitator_scope').GetFullName] focuses on the [GetLawType('law_right_of_assembly').GetName], and the efforts of the [SCOPE.sParty('agitator_party_scope').GetName] to secure it. A crowd has flocked from all corners to hear it."
  agitators_election_events_liberal.5.f: ""No true discussion may be had while the law binds us to silence! How is it that we may call ourselves 'great' and 'enlightened' whilst we fear reprisal from the law itself? And for what? Our very words? 'Great' and 'enlightened...' a falsehood, I say! A lie! A travesty! A shameful display!""
  agitators_election_events_liberal.5.a: "[SCOPE.sCharacter('agitator_scope').GetFullName] has a point..."
  agitators_election_events_liberal.5.b: "Fetch the paper and the ink. There's a law to draft!"
  agitators_election_events_liberal.5.c: "Those who wish to speak should know how and when, first."
