#Place for localization of deprecated vanilla entries
l_english:
  agitators_election_events_fascist.1.t: "Practical Opposition"
  agitators_election_events_fascist.1.d: "Viewing the [SCOPE.sParty('communist_party_scope').GetName] as a major threat to the [ROOT.GetCountry.GetAdjective] nation, [SCOPE.sParty('agitator_party_scope').GetName] has encouraged supporters of the [SCOPE.sParty('agitator_party_scope').GetName] to organize into groups and attack suspected communists on the streets."
  agitators_election_events_fascist.1.f: ""There are those in our very own government who believe that the [SCOPE.sParty('communist_party_scope').GetNameNoFormatting] is a party like any other. It is not! This cabal is not truly a political party, but a front for a secret society, admitting within its ranks aliens, spies, and minors. Its attempts to nestle itself into the dark corners of our cities must be met with the only thing these animals understand - the force of good, [ROOT.GetCountry.GetAdjectiveNoFormatting] fists!""
  agitators_election_events_fascist.1.a: "Accost communist partisans wherever they may appear."
  agitators_election_events_fascist.1.b: "Target the communists' leaders, to crush the masses' morale."
  agitators_election_events_fascist.1.c: "This violence will be the death of democracy!"

  agitators_election_events_fascist.2.t: "Collaboration and Capital"
  agitators_election_events_fascist.2.d: "To secure additional support for the [SCOPE.sParty('agitator_party_scope').GetName], [SCOPE.sCharacter('agitator_scope').GetFullName] and several high-ranking party members have approached the [SCOPE.gsInterestGroup('industrialists_scope').GetName] to promote policies designed to ensure collaboration between capital and a [SCOPE.sParty('agitator_party_scope').GetName] government."
  agitators_election_events_fascist.2.f: ""Fascism should more properly be called corporatism, because it is the merger of state and corporate power."\n\n— Benito Mussolini"
  agitators_election_events_fascist.2.a: "The [SCOPE.sParty('agitator_party_scope').GetName] will prove to be excellent allies."
  agitators_election_events_fascist.2.b: "The [SCOPE.gsInterestGroup('industrialists_scope').GetName] do not need their assurances."

  agitators_election_events_fascist.3.t: "For National Unity"
  agitators_election_events_fascist.3.d: "Pointing to the clear and present danger presented to the [ROOT.GetCountry.GetAdjective] nation by "communists and communist-sympathetic groups", [SCOPE.sCharacter('agitator_scope').GetFullName] has called for a campaign of national unity to defeat communism, organized behind the [SCOPE.sParty('agitator_party_scope').GetName]."
  agitators_election_events_fascist.3.f: ""In these times, we, as loyal citizens of the [ROOT.GetCountry.GetAdjectiveNoFormatting] nation, must come together as one, and remain ever vigilant. There exist enemies of government within our borders, foreign agents who wish to tear down everything which makes our country great. But they are small in number, my friends, and we are many...""
  agitators_election_events_fascist.3.a: "The Red threat must not be permitted a foothold here!"
  agitators_election_events_fascist.3.b: "National unity, certainly, but not behind the [SCOPE.sParty('agitator_party_scope').GetName]."

  agitators_election_events_fascist.4.t: "The Red Terror Abroad"
  agitators_election_events_fascist.4.d: "In a recent speech, [SCOPE.sCharacter('agitator_scope').GetFullName] has directly pointed to the state of [SCOPE.sCountry('scary_communist_country').GetName] as an example of what awaits [ROOT.GetCountry.GetAdjective] society if the [SCOPE.sParty('agitator_party_scope').GetName] does not come to power. According to [SCOPE.sCharacter('agitator_scope').GetHerHim], only [SCOPE.sCharacter('agitator_scope').GetSheHe] can save the nation from communism."
  agitators_election_events_fascist.4.f: ""There has been talk amongst certain circles of a strike - an attempt by the Communists to seize power, to transform [ROOT.GetCountry.GetNameNoFormatting] into a blood-Red nightmare! Well, let me remind you of what they want. In [SCOPE.sCountry('scary_communist_country').GetNameNoFormatting], they've made women into state property! They've burned priests alive! They've assaulted banks and small businessmen!\n\nWe shall not allow the communists in this nation to replace us, to rule our affairs. This is [ROOT.GetCountry.GetNameNoFormatting], not [SCOPE.sCountry('scary_communist_country').GetNameNoFormatting]!""
  agitators_election_events_fascist.4.a: "The whole nation must unite against the [SCOPE.sCountry('scary_communist_country').GetAdjectiveNoFormatting] menace!"
  agitators_election_events_fascist.4.b: "Perhaps [SCOPE.sCharacter('agitator_scope').GetSheHe] should focus [SCOPE.sCharacter('agitator_scope').GetHerHis] rhetoric more domestically."
  agitators_election_events_fascist.4.c: "This is nothing but scaremongering nonsense."

  agitators_election_events_fascist.5.t: "Hatred in Action"
  agitators_election_events_fascist.5.d: "Partisans affiliated with the [SCOPE.sParty('agitator_party_scope').GetName] have committed a series of violent and humiliating acts against [SCOPE.sCulture('hate_crime_culture').GetName] people in [SCOPE.sState('hate_crime_state').GetName]. Opponents of the [SCOPE.sParty('agitator_party_scope').GetName] have accused [SCOPE.sCharacter('agitator_scope').GetFullName] of inspiring the attack through [SCOPE.sCharacter('agitator_scope').GetHerHis] extreme rhetoric."
  agitators_election_events_fascist.5.f: "Broken glass and ash, crunched underfoot. Signs marred with the symbols of fascism. Bodies blackened by flame, still lying where the paramilitaries had cut them down. The inspector knew that they would never be identified satisfactorially to press charges.\n\nAs he sat down on a nearby bench, surveying the scene, an acidic thought passed through his mind. Of the men charged with solving this case, how many of them had seen it firsthand, through black masks?"
  agitators_election_events_fascist.5.a: "The [SCOPE.sParty('agitator_party_scope').GetName] are vile purveyors of baseless hatred."
  agitators_election_events_fascist.5.b: "Can anyone truly prove [SCOPE.sCharacter('agitator_scope').GetSheHe] called for this action?"
  agitators_election_events_fascist.5.c: "[SCOPE.sCharacter('agitator_scope').GetSheHe|U] is a true defender of [ROOT.GetCountry.GetName], and the [SCOPE.sCulture('hate_crime_culture').GetName] are its enemies."
