#Place for localization of deprecated vanilla entries
l_english:
  agitators_election_events_industrialist.1.t: "Rich Get Richer"
  agitators_election_events_industrialist.1.d: "[SCOPE.sCharacter('agitator_scope').GetFullName] has thrown a soirée for the cream of the [SCOPE.gsInterestGroup('industrialists_ig').GetName]. Bribes, ill-disguised as donations, traded hands into the [SCOPE.sParty('agitator_party_scope').GetName]."
  agitators_election_events_industrialist.1.f: ""With your help this coming election, we'll make sure that those machines of yours stay greased and those ports stay open!"\n\nOnly two hundred hands were in attendance, yet each clap was a thunderstrike to herald the passage of a thousand ships."
  agitators_election_events_industrialist.1.a: "They're likely to spend it all on champagne."
  agitators_election_events_industrialist.1.b: "Someone ought to inquire about those donations."
  agitators_election_events_industrialist.1.c: "Can't we put this corruption money to better use?"

  agitators_election_events_industrialist.2.t: "Friends Abroad"
  agitators_election_events_industrialist.2.d: "While campaigning for additional support, [SCOPE.sCharacter('agitator_scope').GetFullName] pointed to [SCOPE.sCountry('friendly_country_scope').GetName] as an example of how the [SCOPE.sParty('agitator_party_scope').GetName] would strengthen foreign ties."
  agitators_election_events_industrialist.2.f: "The essence of trade is simple: one party has something the other party needs, and will give it on the basis of mutual exchange. Most commonly, a book for a book, a meal for a meal, a favor for a favor. Less commonly, and arguably more perilous, is the trade by which nations make: human life for material wealth. Otherwise known as economics."
  agitators_election_events_industrialist.2.a: "We welcome our friends from [SCOPE.sCountry('friendly_country_scope').GetName]."
  agitators_election_events_industrialist.2.b: "[SCOPE.sCharacter('agitator_scope').GetSheHe|U] must have a factory there."
  agitators_election_events_industrialist.2.c: "If [SCOPE.sCharacter('agitator_scope').GetLastName] loves [SCOPE.sCountry('friendly_country_scope').GetName] so much, [SCOPE.sCharacter('agitator_scope').GetSheHe] should live there!"

  agitators_election_events_industrialist.3.t: "Saber-Rattling Soldiery"
  agitators_election_events_industrialist.3.d: "Election tensions between the [SCOPE.sParty('agitator_party_scope').GetName] and the [SCOPE.sParty('armed_forces_party').GetName] have run high as [SCOPE.sCharacter('agitator_scope').GetFullName] accused the [SCOPE.gsInterestGroup('armed_forces_ig').GetName] of flagrant warmongering behavior."
  agitators_election_events_industrialist.3.f: ""General! I would have words with you and your saber-rattling tin-men. You and your bully boys have been conspiring to wage war in the very near future. What say you?"\n\n"How else will we use the bullets and the bandages you supply us with, sir? A war makes for greater demand in your wares."\n\n"That's... that's beside the point! Our factories are in the firing line!""
  agitators_election_events_industrialist.3.a: "The [SCOPE.gsInterestGroup('armed_forces_ig').GetName] have been privy to too many decisions."
  agitators_election_events_industrialist.3.b: "[SCOPE.sCharacter('agitator_scope').GetFullName] should concern [SCOPE.sCharacter('agitator_scope').GetHerselfHimself] strictly with the [SCOPE.sParty('agitator_party_scope').GetName]'s matters."
  agitators_election_events_industrialist.3.c: "Perhaps a newly raised regiment will ease [SCOPE.sCharacter('agitator_scope').GetFullName]'s woes."

  agitators_election_events_industrialist.4.t: "Free Trade, Freer Labor"
  agitators_election_events_industrialist.4.d: "[SCOPE.sCharacter('agitator_scope').GetFullName], in [SCOPE.sCharacter('agitator_scope').GetHerHis] campaigning for the [SCOPE.sParty('agitator_party_scope').GetName], has promoted ideals of [GetLawType('law_free_trade').GetName] and [GetLawType('law_no_migration_controls').GetName], that others may share in [ROOT.GetCountry.GetAdjective] success. [SCOPE.sCharacter('trade_union_leader_scope').GetFullName] has accused [SCOPE.sCharacter('agitator_scope').GetHerHim] of exploiting immigrants."
  agitators_election_events_industrialist.4.f: "A truism for anywhere you go: always read the fine print. Anyone unscrupulous enough can swindle you out of anything: your clothes, your bank account, your horse, your house, your land, and even your very life. And especially read the fine print if it seems like someone's offering you everything you need."
  agitators_election_events_industrialist.4.a: "We patrol our borders for a reason."
  agitators_election_events_industrialist.4.b: "[ROOT.GetCountry.GetName]'s successes are for all to share."
  agitators_election_events_industrialist.4.c: "All immigrants should be educated at the gates."

  agitators_election_events_industrialist.5.t: "Get Experience Early!"
  agitators_election_events_industrialist.5.d: "An audacious move by [SCOPE.sCharacter('agitator_scope').GetFullName] saw a crowd publicly divided on a matter close to home: the [SCOPE.sParty('agitator_party_scope').GetName]'s explicit support of child labor."
  agitators_election_events_industrialist.5.f: ""Step right up kids, and enjoy a day in the sun! That's right, you get five bob a day to pick fruit and play in the grass. And you get the time outside your parents are always nagging you about! Get away from them, get out in the sun, and build those strong muscles and birthing hips you'll need for your own families. Help out Old Man Jenkins today!""
  agitators_election_events_industrialist.5.a: "So long as they're kept out of truly dangerous jobs."
  agitators_election_events_industrialist.5.b: "Don't listen to [SCOPE.sCharacter('agitator_scope').GetHerHim], kids. Off to school."
  agitators_election_events_industrialist.5.c: "Perhaps [SCOPE.sCharacter('trade_union_leader_scope').GetFullName] would like to send a delegation to [SCOPE.sCharacter('agitator_scope').GetFullName]'s workplaces"
