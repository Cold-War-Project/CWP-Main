#Place for localization of deprecated vanilla entries
l_english:
  agitators_election_events_conservative.1.t: "Birds of a Feather"
  agitators_election_events_conservative.1.d: "[SCOPE.sCharacter('agitator_scope').GetFullName] and [SCOPE.gsInterestGroup('devout_ig').GetLeader.GetFullName] were spotted in discussions about the coming election. Preachers the next day were extolling virtues of the [SCOPE.sParty('agitator_party_scope').GetName]."
  agitators_election_events_conservative.1.f: "The First Estate and the Second Estate hand-in-hand since the oldest glories of imperium. A more modern appellation of the holy marriage is 'hearts and minds' — a glorious leader to capture their hearts, and a magnificent god to occupy their minds."
  agitators_election_events_conservative.1.a: "The [SCOPE.gsInterestGroup('devout_ig').GetName] are beyond our reach."
  agitators_election_events_conservative.1.b: "Let us hope they do not decide the election."
  agitators_election_events_conservative.1.c: "Never trust a true-believer on worldly matters."

  agitators_election_events_conservative.2.t: "The Defender of Decency"
  agitators_election_events_conservative.2.d: "[SCOPE.sCountry('revolutionary_nation_scope').GetName] has fallen to a revolution amongst the [SCOPE.gsInterestGroup('revolutionary_ig').GetName]. In the campaign materials of the [SCOPE.sParty('agitator_party_scope').GetName], [SCOPE.sCharacter('agitator_scope').GetFullName] has immediately denounced the [SCOPE.gsInterestGroup('patsy_ig').GetName] here, preempting a similar revolt."
  agitators_election_events_conservative.2.f: ""You would name me a traitor?"\n\n"Of that, I'm certain you are. Many abroad in [SCOPE.sCountry('revolutionary_nation_scope').GetNameNoFormatting] would think similarly to you. What's to say you're not a traitor already? Plotting sedition with the members of your book club?"\n\n"You've gone mad!""
  agitators_election_events_conservative.2.a: "Someone must stand against the revolutionary tide!"
  agitators_election_events_conservative.2.b: "[SCOPE.sCountry('revolutionary_nation_scope').GetNameNoFormatting] is far away, and this is here."
  agitators_election_events_conservative.2.c: "The revolution will not be villainized!"

  agitators_election_events_conservative.3.t: "The Good Old Days"
  agitators_election_events_conservative.3.d: "When invited to give a speech on behalf of the [SCOPE.sParty('agitator_party_scope').GetName], [SCOPE.sCharacter('agitator_scope').GetFullName] began extolling the virtues of a strong home, strong borders, and strong men. The public reception was mixed."
  agitators_election_events_conservative.3.f: ""Truly, I dare say, the men are no longer men! They are coddled with books, as if they are any substitute for a #italic real#! adventure! Their mothers swaddle them in cotton and nylon, only for them to be henpecked by their wives! And heaven forbid they take a pint of beer: #italic one sip#!, and they need their fathers to carry them home!""
  agitators_election_events_conservative.3.a: "Won't someone think of the children?"
  agitators_election_events_conservative.3.a1: "Won't someone think of the children?"
  agitators_election_events_conservative.3.b: "Old ways for older times, and even older fools."
  agitators_election_events_conservative.3.c: "Rhetoric cannot disguise what [SCOPE.sCharacter('agitator_scope').GetLastName] wants."

  agitators_election_events_conservative.4.t: "The Levies"
  agitators_election_events_conservative.4.d: "[SCOPE.sCharacter('agitator_scope').GetFullName] has made overtures to the [SCOPE.gsInterestGroup('rf_scope').GetName] for electoral support to the [SCOPE.sParty('agitator_party_scope').GetName]. [SCOPE.sCharacter('rf_leader_scope').GetFullName] has, at least, acknowledged the talks."
  agitators_election_events_conservative.4.f: "Appeals for 'natural allies' makes for a gamble on long odds. Receptive ears to 'natural allies' are often already of like mind. Those who aren't of like mind would, politely, continue on their own way. Impolitely, they might laugh, scoff, or, if they are truly devious, turn the gambler into their own useful idiot."
  agitators_election_events_conservative.4.a: "Old minds think alike."
  agitators_election_events_conservative.4.b: "Grass tends to grow as it pleases."
  agitators_election_events_conservative.4.c: "They should beware [SCOPE.sCharacter('rf_leader_scope').GetFullName]'s shrewdness."

  agitators_election_events_conservative.5.t: "Bishop Takes Black Pawn"
  agitators_election_events_conservative.5.d: "At a soirée for the [SCOPE.sParty('agitator_party_scope').GetName]'s wealthiest supporters, [SCOPE.sCharacter('agitator_scope').GetFullName] began a long-winded rant about the merits of slavery and discrimination."
  agitators_election_events_conservative.5.f: ""As you can plainly see, the development of the skull is directly tied to the civility of a man. One can assuredly determine his fitness for good society by the proper measurement of his circumference-"\n\n"And how do you intend to prove that a man does his thinking with his bones?"\n\n"As I said, you can determine a man's fitness for good society by properly measuring his skull."
  agitators_election_events_conservative.5.a: "People are entitled to their opinions, even if they are wrong."
  agitators_election_events_conservative.5.b: "Civilisation is the means of our equality."
  agitators_election_events_conservative.5.c: "One wonders if [SCOPE.sCharacter('agitator_scope').GetLastName] has ever been flogged before..."
