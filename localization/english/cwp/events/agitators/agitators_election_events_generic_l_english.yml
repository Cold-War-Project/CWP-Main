#Place for localization of deprecated vanilla entries
l_english:
  agitators_election_events_generic.1.t: "Fruitful Endorsements"
  agitators_election_events_generic.1.d: "In a gesture of solidarity with the [SCOPE.sParty('agitator_party_scope').GetName], [SCOPE.sCharacter('agitator_scope').GetFullName] has encouraged [SCOPE.sCharacter('agitator_scope').GetHerHis] supporters to vote for it in the ongoing election."
  agitators_election_events_generic.1.f: "For the interest of all principled people - [SCOPE.sParty('agitator_party_scope').GetNameNoFormatting] has a consistent record of excellence. I cannot speak higher of those brave men and women moving [ROOT.GetCountry.GetNameNoFormatting] forwards under their name."
  agitators_election_events_generic.1.a: "[SCOPE.sCharacter('agitator_scope').GetSheHe|U] has our thanks, certainly."
  agitators_election_events_generic.1.b: "This endorsement would best be more specific."

  agitators_election_events_generic.2.t: "An Unplanned Debate" 
  agitators_election_events_generic.2.d: "Whilst carrying out work in support of the [SCOPE.sParty('agitator_party_scope').GetName] in [SCOPE.sState('debate_state').GetName], [SCOPE.sCharacter('agitator_scope').GetFullName] has come across [SCOPE.sCharacter('agitator_scope_2').GetFullName], representing the [SCOPE.sParty('agitator_2_party_scope').GetName]. A fiery debate has broken out between them."
  agitators_election_events_generic.2.f: "Straightening [SCOPE.sCharacter('agitator_scope').GetHerHis] impressive coattails, [SCOPE.sCharacter('agitator_scope').GetSheHe] stepped forwards, regarding [SCOPE.sCharacter('agitator_scope').GetHerHis] newfound opponent with a look of begrudging respect.\n\n"I'll have you know...""
  agitators_election_events_generic.2.a: "[SCOPE.sCharacter('agitator_scope').GetFullName] is far more convincing."
  agitators_election_events_generic.2.b: "The better arguments clearly belong to [SCOPE.sCharacter('agitator_scope_2').GetFullName]."

  agitators_election_events_generic.3.t: "False Democracy"
  agitators_election_events_generic.3.d: "[SCOPE.sCharacter('agitator_scope').GetFullName] has issued a condemnation of the [ROOT.GetCountry.GetAdjective] electoral system, endorsing abstention from voting in what [SCOPE.sCharacter('agitator_scope').GetSheHe] calls a sham put on to placate the people."
  agitators_election_events_generic.3.f: "In the dictatorship of the reactionary, of the rich and powerful, obscured from the view of the people by a facade of democracy, the best thing one may do is demonstrate the futility of such a guise, so that the people may be spurred into action regardless of concession."
  agitators_election_events_generic.3.a: "The government must know that we see through their system."
  agitators_election_events_generic.3.b: "Discrediting the system is the next step towards revolution!"
  agitators_election_events_generic.3.c: "Their supporters aren't voting? Ours certainly are."

  agitators_election_events_generic.4.t: "Aggressive Campaigning"
  agitators_election_events_generic.4.d: "[SCOPE.sCharacter('agitator_scope').GetFullName], following an address where [SCOPE.sCharacter('agitator_scope').GetSheHe] condemned the [SCOPE.sParty('opposition_party_scope').GetName], has begun to mobilize dedicated partisans to oppose it in the election."
  agitators_election_events_generic.4.f:1 ""An unprincipled morass,"\n"Best served not in [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')], but in prison,"\n"Devoid of positive achievement,"\n"A collective self-parody,"\n"An embarassment to the [ROOT.GetCountry.GetAdjectiveNoFormatting] nation,"\n"Down with the [SCOPE.sParty('opposition_party_scope').GetNameNoFormatting]!""
  agitators_election_events_generic.4.a: "There's certainly a better alternative."
  agitators_election_events_generic.4.b: "A pack of miscreants, indeed!"

  agitators_election_events_generic.5.t: "Misplaced Moderation"
  agitators_election_events_generic.5.d: "[SCOPE.sCharacter('agitator_scope').GetFullName] has criticized numerous decisions made by the leadership of [SCOPE.sCharacter('agitator_scope').GetHerHis] own [SCOPE.sParty('agitator_party_scope').GetName], calling [SCOPE.sCharacter('agitator_ig_leader_scope').GetFullName] excessively cautious and unwilling to address critical issues."
  agitators_election_events_generic.5.f: ""I often wonder, looking at the activities that we carry out - specifically those which are most crucial to expanding our pool of supporters - whether [SCOPE.sCharacter('agitator_ig_leader_scope').GetLastNameNoFormatting] is authentically aware of, or dedicated to, their success. Our fundraising is generally acceptable - the coffers of the party are without complaint, and neither are our accountants - but such resources have yet to be mobilized in a way that benefits the common good."\n\n"And, so, my thesis is this - what does [SCOPE.sCharacter('agitator_ig_leader_scope').GetLastNameNoFormatting] intend, and how best to change [SCOPE.sCharacter('agitator_ig_leader_scope').GetHerHis] mind on the matter?""
  agitators_election_events_generic.5.a: "It would be best to simply do as [SCOPE.sCharacter('agitator_scope').GetSheHe] wishes."
  agitators_election_events_generic.5.b: "Make a point of improving the vigor we put forward."
  agitators_election_events_generic.5.c: "Freeze [SCOPE.sCharacter('agitator_scope').GetHerHim] out of meetings until [SCOPE.sCharacter('agitator_scope').GetSheHe] apologizes."

  agitators_election_events_generic.6.t: "The Rising of the Women"
  agitators_election_events_generic.6.d: "The advocacy of [SCOPE.sCharacter('agitator_scope').GetFullName] has led to the [SCOPE.sParty('agitator_party_scope').GetName] gaining greater electoral popularity among women, who have rushed to exercise their new-found voting rights."
  agitators_election_events_generic.6.f: "As we come marching, marching, in the beauty of the day,\nA million darkened kitchens, a thousand mill-lofts gray\nAre touched with all the radiance that a sudden sun discloses,\nFor the people hear us singing, "Bread and roses, bread and roses."\n\nAs we come marching, marching, we battle, too, for men—\nFor they are women's children and we mother them again.\nOur days shall not be sweated from birth until life closes—\nHearts starve as well as bodies: Give us bread, but give us roses."
  agitators_election_events_generic.6.a: "For the election of the [SCOPE.sParty('agitator_party_scope').GetName]!"
  agitators_election_events_generic.6.b: "For the strengthening of [ROOT.GetCountry.GetAdjective] democracy!"

  agitators_election_events_generic.7.t: "Production and Agitation"
  agitators_election_events_generic.7.d: "In collaboration with the [SCOPE.sParty('agitator_party_scope').GetName], [SCOPE.sCharacter('agitator_scope').GetFullName] has secured a deal for cheap and quickly distributed pamphlets in support of the party."
  agitators_election_events_generic.7.f: "The interior of the carriage held a pleasant surprise - a crate of several thousand pamphlets, printed on an industrial scale, each with instructions on the voting process and a cheaply copied logo of the [SCOPE.sParty('agitator_party_scope').GetNameNoFormatting]. They made a hefty weight - and, [SCOPE.sCharacter('agitator_scope').GetSheHe] hoped, would turn out to be an equally sized benefit."
  agitators_election_events_generic.7.a: "Bury our opponents in a sea of paper!"
  agitators_election_events_generic.7.b: "These connections could be used later."

  agitators_election_events_generic.8.t: "The Party Favorites"
  agitators_election_events_generic.8.d: "The wing of the [SCOPE.sParty('agitator_party_scope').GetName] affiliated with the [SCOPE.gsInterestGroup('snubbed_ig_scope').GetName] has raised complaints about [SCOPE.sCharacter('agitator_scope').GetFullName]'s choice of endorsements leaving their supporters neglected."
  agitators_election_events_generic.8.f: ""I must levy a concern, now that it has come to my attention. Whilst [SCOPE.sCharacter('agitator_scope').GetFullNameNoFormatting]'s actions are undoubtably well-intentioned, the recommendations contained thereof seem to exclude certain members of the party who have demonstrated more than sufficient vigor, good will, and surety of purpose.""
  agitators_election_events_generic.8.a: "Listen to their concerns, and appease the [SCOPE.gsInterestGroup('snubbed_ig_scope').GetName]."
  agitators_election_events_generic.8.b: "Appeasement? Don't they know that was fully intentional?"

  agitators_election_events_generic.9.t: "Democratic Solidarity"
  agitators_election_events_generic.9.d: "In a pro-suffrage gesture, [SCOPE.sCharacter('agitator_scope').GetFullName] has released a positive endorsement of the [SCOPE.sParty('agitator_party_scope').GetName] for its stalwart support of voting rights in [ROOT.GetCountry.GetName]."
  agitators_election_events_generic.9.f: ""There is no issue in our [ROOT.GetCountry.GetGovernment.GetName] greater than that of the franchise - that method through which the people may decide any future issue which comes their way. With this in mind, my endorsement should come to no surprise...""
  agitators_election_events_generic.9.a: "The [SCOPE.sParty('agitator_party_scope').GetName] is the guardian of [ROOT.GetCountry.GetAdjective] franchise!"
  agitators_election_events_generic.9.b: "Perhaps some party members more than others."

  agitators_election_events_generic.10.t: "A Tumultuous Campaign"
  agitators_election_events_generic.10.d: "Whilst campaigning for the [SCOPE.sParty('agitator_party_scope').GetName] in the turmoil-wracked [SCOPE.sState('tumultuous_state_scope').GetName], [SCOPE.sCharacter('agitator_scope').GetFullName] has been attacked and brutally beaten by a group of unknown assailants."
  agitators_election_events_generic.10.f: "When the crowd cleared, and the screaming stopped, all that was left in the street was [SCOPE.sCharacter('agitator_scope').GetHerHis] prostrate form, bruised, cut, and barely recognizable as the titan [SCOPE.sCharacter('agitator_scope').GetSheHe] had represented not five minutes before."
  agitators_election_events_generic.10.a: "Some rest and recuperation would be best."
  agitators_election_events_generic.10.b: "Get back to the trail right away."
  agitators_election_events_generic.10.c: "Of course we know who it was. It was us."
