#Place for localization of deprecated vanilla entries
l_english:
  agitators_election_events_agrarian.1.t: "Franchise for Farmers"
  agitators_election_events_agrarian.1.d: "On behalf of the [SCOPE.sParty('agitator_party_scope').GetName], [SCOPE.sCharacter('agitator_scope').GetFullName] has embarked on a tour of various rural and remote regions in [ROOT.GetCountry.GetName], seeking to enroll voters and ensure ballots are collected in difficult-to-reach communities."
  agitators_election_events_agrarian.1.f: ""Nestled in at the tops of mountains, in the hearts of dark forests, surrounded by empty plains, unmarked on any map... it is here that people are found, nonetheless. It is our duty to empower every one of them.""
  agitators_election_events_agrarian.1.a: "Everyone should hear of the [SCOPE.sParty('agitator_party_scope').GetName]'s mission!"
  agitators_election_events_agrarian.1.b: "One man, one vote - no matter how remote!"

  agitators_election_events_agrarian.2.t: "Rural Values"
  agitators_election_events_agrarian.2.d: "The [SCOPE.sParty('agitator_party_scope').GetName], spearheaded by the organizing efforts of [SCOPE.sCharacter('agitator_scope').GetFullName], has begun a popular campaign focused on their desired preservation of rural values in an age of rapid and frightening change."
  agitators_election_events_agrarian.2.f: ""You may say that it is new and better, that it will give us more to buy, or enrich our children. But what matters is that it is strange and different, it puts us out of work, and we did not ask for it.""
  agitators_election_events_agrarian.2.a: "Stand by your community - vote for the [SCOPE.sParty('agitator_party_scope').GetName]!"
  agitators_election_events_agrarian.2.b: "We must build a broader coalition against these alien tendencies."

  agitators_election_events_agrarian.3.t: "Swords and Plowshares"
  agitators_election_events_agrarian.3.d: "An argument about the people's role in military command between [SCOPE.sCharacter('armed_forces_leader').GetFullName] and [SCOPE.sCharacter('agitator_scope').GetFullName] has prompted a spat between the [SCOPE.sParty('agitator_party_scope').GetName] and the [SCOPE.sParty('armed_forces_party_scope').GetName]."
  agitators_election_events_agrarian.3.f: ""The esteemed [SCOPE.sCharacter('agitator_scope').GetLastNameNoFormatting] has, respectfully, no knowledge of what [SCOPE.sCharacter('agitator_scope').GetSheHe] speaks. There is a reason that the [SCOPE.gsInterestGroup('armed_forces_scope').GetNameNoFormatting] are able to handle their own affairs - we are specially trained to do so, and the common people simply cannot be expected to hold the same level of knowledge.""
  agitators_election_events_agrarian.3.a: "Yes, the people know!"
  agitators_election_events_agrarian.3.b: "Military matters are best left to the generals."

  agitators_election_events_agrarian.4.t: "Anti-Imperial Advocacy"
  agitators_election_events_agrarian.4.d: "An unexpectedly popular campaign of agitation by [SCOPE.sCharacter('agitator_scope').GetFullName] against the [ROOT.GetCountry.GetAdjective] government's colonial policies has led to greatly increased public interest in the [SCOPE.sParty('agitator_party_scope').GetName]'s platform."
  agitators_election_events_agrarian.4.f: "Out of all of the displays, it was by far the depictions of distant atrocities that drew the most spectators. Grown men stood wide-eyed as their gaze traced the origin of rivers of red, and children hid behind their mothers to evade the accusing eyes of the bayoneted men.\n\nIt was not any complex slogan that won the day, or clever turn of rhetoric - it was this, the only phrase that one needed upon seeing such things.\n\n"How can we stop it?""
  agitators_election_events_agrarian.4.a: "Channel this energy to support anti-imperial policies."
  agitators_election_events_agrarian.4.b: "Only the [SCOPE.sParty('agitator_party_scope').GetName] stands against senseless war!"

  agitators_election_events_agrarian.5.t: "Votes for Clear Skies"
  agitators_election_events_agrarian.5.d: "Following the recent expansion of industry into rural communities in [SCOPE.sState('industry_enroachment_state').GetName], [SCOPE.sCharacter('agitator_scope').GetFullName] has begun a local campaign for the [SCOPE.sParty('agitator_party_scope').GetName], stressing desired solutions to the unpleasant smog now common around the region's factories."
  agitators_election_events_agrarian.5.f: "The pall of smoke that obscured the sky seemed to be reflected in the eyes of the villagers, as [SCOPE.sCharacter('agitator_scope').GetSheHe] rode by. Rather than the bright, sunny day that [SCOPE.sCharacter('agitator_scope').GetSheHe] had anticipated, this speech would be accompanied by the everpresent gloom.\n\nIt was no matter. As [SCOPE.sCharacter('agitator_scope').GetFullNameNoFormatting] looked up at the sky, and envisioned the cloud obscuring the hearts of men, a vision for a new sort of rhetoric crossed [SCOPE.sCharacter('agitator_scope').GetHerHis] mind. Whilst the workmen began to raise the stage, [SCOPE.sCharacter('agitator_scope').GetSheHe] picked up a pen, and started to write."
  agitators_election_events_agrarian.5.a: "The [SCOPE.sParty('agitator_party_scope').GetName] will bring back the sun!"
  agitators_election_events_agrarian.5.b: "They stand for nothing but opposition to progress."
