#Place for localization of deprecated vanilla entries
l_english:
  agitators_election_events_social_democrat.1.t: "Against Extremism"
  agitators_election_events_social_democrat.1.d: "As a major part of their electoral platform, [SCOPE.sCharacter('agitator_scope').GetFullName] and the leadership of the [SCOPE.sParty('agitator_party_scope').GetName] have begun an aggressive campaign to distance themselves from the revolutionary socialist ideology of the [SCOPE.sParty('communist_party_scope').GetName]."
  agitators_election_events_social_democrat.1.f: ""Communism is the death of peace, and the death of liberty.""
  agitators_election_events_social_democrat.1.a: "We must present an attractive alternative to the people."
  agitators_election_events_social_democrat.1.b: "Focus our campaign on combating the Communists."

  agitators_election_events_social_democrat.2.t: "Engaging the People"
  agitators_election_events_social_democrat.2.d: "[SCOPE.sCharacter('agitator_scope').GetFullName] has embarked upon a dedicated campaign to organize the poor urban workers in [SCOPE.sState('socdem_agitation_state').GetName], shaping them into a cohesive and powerful pro-[SCOPE.sParty('agitator_party_scope').GetName] voting bloc."
  agitators_election_events_social_democrat.2.f: ""If any man, woman, or child is neglected, abandoned, and left with no voice or hope... how can we say that the [ROOT.GetCountry.GetAdjectiveNoFormatting] nation is truly civilized?""
  agitators_election_events_social_democrat.2.a: "The people of [SCOPE.sState('socdem_agitation_state').GetName] are awakened."
  agitators_election_events_social_democrat.2.b: "This strategy should be repeated nationwide."

  agitators_election_events_social_democrat.3.t: "The Union's Campaign"
  agitators_election_events_social_democrat.3.d: "Utilizing [SCOPE.sCharacter('agitator_scope').GetFullName]'s connections in the [SCOPE.gsInterestGroup('trade_union_ig').GetName], the [SCOPE.sParty('agitator_party_scope').GetName] has gained a much greater share of dedicated and ideologically committed union voters."
  agitators_election_events_social_democrat.3.f: "Stacks of posters exited the printer's shop, each bearing the logo of the [SCOPE.sParty('agitator_party_scope').GetNameNoFormatting], and a slogan. Men with hammers, calls for solidarity, and red ink by the pail splashed across the papers, ready to be pinned up around the city by a veritable army of partisans.\n\nHe took a moment to look with pride at a draft sitting on a workbench, studying the shapes printed on the paper, at the vibrant reds, blacks, and whites. And then, most of all, to the bottom right corner, where that crucial sigil made its appearance:\n"Produced with Union Labor"."
  agitators_election_events_social_democrat.3.a: "Mobilize the union vote for the [SCOPE.sParty('agitator_party_scope').GetName]!"
  agitators_election_events_social_democrat.3.b: "Strong [SCOPE.gsInterestGroup('trade_union_ig').GetName] will serve us for many years."

  agitators_election_events_social_democrat.4.t: "Bourgeois Fears"
  agitators_election_events_social_democrat.4.d: "To avert the fears of the upper class with regards to a potential [SCOPE.sParty('agitator_party_scope').GetName] government, [SCOPE.sCharacter('agitator_scope').GetFullName] has carried out a series of meetings with wealthy influencers, stressing the importance of reform still adhering to [ROOT.GetCountry.GetAdjective] values."
  agitators_election_events_social_democrat.4.f: ""It is simply the case that if there are no reforms to [ROOT.GetCountry.GetAdjectiveNoFormatting] society, there will be a social revolution. I do not embrace this. In fact, I hate it like sin. But this is reality - you must see this as clearly as I do. And so the question comes to this - how do we avert this?""
  agitators_election_events_social_democrat.4.a: "Reform against revolution!"
  agitators_election_events_social_democrat.4.b: "Try as they might, they will always be Reds."

  agitators_election_events_social_democrat.5.t: "Fight for the Franchise"
  agitators_election_events_social_democrat.5.d: "[SCOPE.sCharacter('agitator_scope').GetFullName] has begun a campaign emphasizing the [SCOPE.sParty('agitator_party_scope').GetName]'s pro-franchise platform, promising greatly expanding voting rights for all segments of society if the party is elected."
  agitators_election_events_social_democrat.5.f: ""My esteemed colleagues! What do you have to fear from an empowered people? Can you say that you embrace the people looking upon what you have done, and being as proud as you are?""
  agitators_election_events_social_democrat.5.a: "Form an electoral coalition with other pro-franchise candidates."
  agitators_election_events_social_democrat.5.b: "Only the [SCOPE.sParty('agitator_party_scope').GetName] can truly serve the people!"
