  gov_aristocratic_monarchy_provincial_desc: "$gov_aristocratic_monarchy_desc$"

  gov_landed_constitutional_monarchy: "Landed Constitutional Monarchy"
  gov_landed_constitutional_monarchy_desc: "The monarch's power is limited by a constitution and a parliament, with significant influence from the landed aristocracy."
  gov_landed_constitutional_monarchy_provincial: "$gov_landed_constitutional_monarchy$"
  gov_landed_constitutional_monarchy_provincial_desc: "$gov_landed_constitutional_monarchy_desc$"

  gov_plutocratic_constitutional_monarchy: "Plutocratic Constitutional Monarchy"
  gov_plutocratic_constitutional_monarchy_desc: "The monarch's power is limited by a constitution and a parliament, with significant influence from wealthy elites and plutocrats."
  gov_plutocratic_constitutional_monarchy_provincial: "$gov_plutocratic_constitutional_monarchy$"
  gov_plutocratic_constitutional_monarchy_provincial_desc: "$gov_plutocratic_constitutional_monarchy_desc$"

  gov_limited_constitutional_monarchy: "Limited Constitutional Monarchy"
  gov_limited_constitutional_monarchy_desc: "The monarch's power is limited by a constitution and an elected body, with significant influence from the population who meet the voting requirements."
  gov_limited_constitutional_monarchy_provincial: "$gov_limited_constitutional_monarchy$"
  gov_limited_constitutional_monarchy_provincial_desc: "$gov_limited_constitutional_monarchy_desc$"

  gov_democratic_constitutional_monarchy: "Democratic Constitutional Monarchy"
