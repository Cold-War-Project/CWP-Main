# Localization for government types used in the mod
l_english:

# Monarchies
  gov_absolute_monarchy: "Absolute Monarchy"
  gov_absolute_monarchy_desc: "The monarch holds absolute power over the government and its people, with no legal limitations on their authority.
  gov_absolute_monarchy_provincial: "$gov_absolute_monarchy$"
  gov_absolute_monarchy_provincial_desc: "$gov_absolute_monarchy_desc$"

  gov_technocratic_monarchy: "Technocratic Monarchy"
  gov_technocratic_monarchy_desc: "The monarch's power is limited by a council of experts and technocrats who advise and assist in governing the country."
  gov_technocratic_monarchy_provincial: "$gov_technocratic_monarchy$"
  gov_technocratic_monarchy_provincial_desc: "$gov_technocratic_monarchy_desc$"

  gov_aristocratic_monarchy: "Aristocratic Monarchy"
  gov_aristocratic_monarchy_desc: "The monarch's power is limited by a council of nobles and aristocrats who advise and assist in governing the country."
