l_english:
 cwp_amendment_bill_of_rights: "Bill of Rights"
 cwp_amendment_bill_of_rights_desc: "The first ten amendments to the Constitution guarantee freedom of speech, the press, assembly and worship, and due process of law. No ordinary act of Congress can take them away."
 cwp_amendment_parliamentary_sovereignty: "Parliamentary Sovereignty"
 cwp_amendment_parliamentary_sovereignty_desc: "There is no written constitution and no court above Parliament. What one Parliament enacts, the next may undo, and a government with a majority can legislate quickly."
 cwp_amendment_direct_democracy: "Direct Democracy"
 cwp_amendment_direct_democracy_desc: "Constitutional changes go to the people and cantons, and any law can be challenged by referendum. Change comes slowly, but it comes with the consent of the voters."
 cwp_amendment_assembly_government: "Government by Assembly"
 cwp_amendment_assembly_government_desc: "The government answers to a sovereign assembly that can bring it down at will. Coalitions of rival parties rise and fall in months, and the executive is too weak to impose a programme."
 cwp_amendment_national_pact: "National Pact"
 cwp_amendment_national_pact_desc: "An unwritten compact divides the offices of state among the confessions: a Maronite president, a Sunni prime minister, a Shia speaker, and six Christian seats in parliament for every five Muslim ones."
 cwp_amendment_constitutional_monarchy: "Constitutional Monarchy"
 cwp_amendment_constitutional_monarchy_desc: "The monarch reigns but does not rule. Ministers answer to parliament, and the crown stands above party as a symbol of continuity."
 cwp_amendment_no_reelection: "No Re-election"
 cwp_amendment_no_reelection_desc: "The president may not succeed himself. Whoever holds the office must hand it on, however popular he is."
 cwp_amendment_military_guardianship: "Military Guardianship"
 cwp_amendment_military_guardianship_desc: "The officer corps sees itself as the guardian of the nation above the quarrels of civilians, and claims the right to step in when politicians fail."
 cwp_amendment_leading_role_of_the_party: "Leading Role of the Party"
 cwp_amendment_leading_role_of_the_party_desc: "The Communist Party is the leading core of every organisation of state and society. Within it, democratic centralism binds every member to the decisions of the leadership."
 cwp_amendment_nomenklatura: "Nomenklatura"
 cwp_amendment_nomenklatura_desc: "The party keeps the lists of every important post and of the trusted cadres eligible to fill them. Careers in the state run through the party."
 cwp_amendment_state_of_emergency: "State of Emergency"
 cwp_amendment_state_of_emergency_desc: "In time of war the government rules by emergency regulation. Guarantees are suspended, suspects detained without trial, and the press placed under control."
