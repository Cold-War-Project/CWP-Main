l_english:
 cwp_amendment_bill_of_rights: "Bill of Rights"
 cwp_amendment_bill_of_rights_desc: "The first ten amendments to the Constitution guarantee freedom of speech, the press, assembly and worship, and due process of law. No ordinary act of Congress can take them away."
 cwp_amendment_parliamentary_sovereignty: "Parliamentary Sovereignty"
 cwp_amendment_parliamentary_sovereignty_desc: "There is no written constitution and no court above Parliament. What one Parliament enacts, the next may undo, and a government with a majority can legislate quickly."
 cwp_amendment_direct_democracy: "Direct Democracy"
 cwp_amendment_direct_democracy_desc: "Constitutional changes go to a vote of the people and the cantons, and citizens can force a referendum on any federal law. Change is slow, and every major reform needs the voters' consent."
 cwp_amendment_assembly_government: "Government by Assembly"
 cwp_amendment_assembly_government_desc: "The government answers to a sovereign assembly that can bring it down at will. Coalitions of rival parties rise and fall in months, and the executive is too weak to carry out a program."
 cwp_amendment_national_pact: "National Pact"
 cwp_amendment_national_pact_desc: "An unwritten compact of 1943 divides the offices of state among the confessions: a Maronite president, a Sunni prime minister, a Shia speaker, and six Christian seats in parliament for every five Muslim ones."
 cwp_amendment_constitutional_monarchy: "Constitutional Monarchy"
 cwp_amendment_constitutional_monarchy_desc: "The monarch reigns but does not rule. The Prime Minister governs and answers to parliament, and the crown stands above party as a symbol of continuity. Without this amendment the monarch governs in person."
 cwp_amendment_no_reelection: "No Re-election"
 cwp_amendment_no_reelection_desc: "The president may not succeed himself. In Mexico the rule dates from the revolution of 1910, which Francisco Madero led against Porfirio Díaz under the slogan 'Effective suffrage, no re-election.'"
 cwp_amendment_military_guardianship: "Military Guardianship"
 cwp_amendment_military_guardianship_desc: "The officer corps sees itself as the guardian of the nation above the quarrels of civilians, and claims the right to step in when politicians fail."
 cwp_amendment_leading_role_of_the_party: "Leading Role of the Party"
 cwp_amendment_leading_role_of_the_party_desc: "The ruling party is the leading core of every organization of state and society. Within it, democratic centralism binds every member to the decisions of the leadership."
 cwp_amendment_nomenklatura: "Nomenklatura"
 cwp_amendment_nomenklatura_desc: "The party keeps the lists of every important post and of the trusted cadres eligible to fill them. Careers in the state run through the party."
 cwp_amendment_state_of_emergency: "State of Emergency"
 cwp_amendment_state_of_emergency_desc: "In wartime the government rules by emergency regulation. Constitutional guarantees are suspended, suspects can be detained without trial, and the press is placed under control."
