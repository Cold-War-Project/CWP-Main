l_english:

# Army Model Laws:
  law_disarmed_nation: "Disarmed Nation"
  law_disarmed_nation_desc: "The country keeps no army of its own and has no barracks or conscription centers, as in Germany and Japan after their surrender in 1945. Its security is left to the police and to foreign garrisons."

# Bureaucracy Laws:
  law_politicized_bureaucrats: "Politicized Administration"
  law_politicized_bureaucrats_desc: "Posts and promotions in the civil service go to loyal members of the ruling party, much as under the Soviet nomenklatura system. Officials are disciplined and obedient, and rarely independent."

# Corporate Affairs Laws:
  lawgroup_corporate_affairs: "Corporate Affairs"
  law_no_corporate_regulation: "No Regulation"
  law_no_corporate_regulation_desc: "There is no regulator for companies. They are formed and run under ordinary commercial law, and the state grants no special charters."
  law_national_champions: "National Champions"
  law_national_champions_desc: "The state picks a few large firms to lead key industries and backs them with charters, cheap credit and government contracts."
  law_corporate_deregulation: "Corporate Deregulation"
  law_corporate_deregulation_desc: "The state lifts controls on company formation, mergers and expansion, and stops granting special charters to favored firms."
  law_antitrust_legislation: "Antitrust Legislation"
  law_antitrust_legislation_desc: "Antitrust laws break up cartels and monopolies and police mergers, on the model of the American Sherman Act of 1890."

# Internal Security Laws:
  law_domestic_intelligence_agency: "Domestic Intelligence Agency"
  law_domestic_intelligence_agency_desc: "A permanent security service, like Britain's MI5 or the American FBI, watches for espionage, subversion and sabotage under the authority of the government."

# Judiciary Laws:
  lawgroup_judiciary: "Judiciary"
  law_arbitrary_legalism: "Arbitrary Legalism"
  law_arbitrary_legalism_desc: "Arrests, trials and sentences follow the will of those in power rather than any written law, and opponents face show trials and summary punishment."
  law_puppet_judiciary: "Puppet Judiciary"
  law_puppet_judiciary_desc: "The government appoints and dismisses judges at will, and in any case touching politics the courts rule as they are told. Ordinary civil and criminal cases still go through the courts."
  law_judicial_interference: "Judicial Interference"
  law_judicial_interference_desc: "The courts decide most cases on their own, but the government chooses the judges and leans on them in politically sensitive trials."
  law_independent_judiciary: "Independent Judiciary"
  law_independent_judiciary_desc: "Judges cannot be removed for their rulings, and the courts can hold ministers and officials to the law. Opposition movements can take their grievances to court instead of to the streets."

# Migration Laws:
  law_encourage_migration: "Encourage Migration"
  law_encourage_migration_desc: "The state recruits immigrants with generous quotas, assisted passages and promises of land or work, as Canada and Australia did in the decades before the war."

# Labour Associations (Cold War):
  law_cwp_social_partnership: "Social Partnership"
  law_cwp_social_partnership_desc: "Free trade unions and employers' federations bargain over wages and conditions at national level, with the state as a third partner. The models are Sweden's Saltsjöbaden Agreement of 1938 and the Swiss Peace Agreement of 1937 in the engineering industry."
