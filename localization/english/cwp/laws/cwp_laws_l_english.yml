  law_domestic_intelligence_agency: "Domestic Intelligence Agency"

# Judiciary Laws:
  lawgroup_judiciary: "Judiciary"
  law_arbitrary_legalism: "Arbitrary Legalism"
  law_puppet_judiciary: "Puppet Judiciary"
  law_judicial_interference: "Judicial Interference"
  law_independent_judiciary: "Independent Judiciary"

# Migration Laws:
  law_encourage_migration: "Encourage Migration"
  law_encourage_migration_desc: "The state actively encourages immigration through permissive quotas, migration incentives, and policies meant to attract new arrivals."
