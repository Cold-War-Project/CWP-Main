l_english:
 je_cwp_austrian_state_treaty: "The Austrian State Treaty"
 je_cwp_austrian_state_treaty_reason: "Austria has a government of its own again, under Karl Renner, but its territory is still divided into four occupation zones and Vienna into four sectors. The Allies have promised to restore an independent Austria. The Soviet Union holds the German assets in its zone and will not sign a treaty until it is sure Austria will never stand with the West."
 cwp_at_status_occupation: "Four armies occupy Austria; treaty talks stalled"
 cwp_at_status_neutrality: "Austria has pledged permanent neutrality"
 cwp_at_outcome_treaty_desc: "The four powers have signed the State Treaty and withdrawn their troops. Austria is independent again."
 cwp_at_neutrality_tt: "Austria has pledged permanent neutrality"
 cwp_at_assets_tt: "Austria has agreed to buy back the German assets in the Soviet zone"
 cwp_at_soviet_consent_tt: "The Soviet Union consents to a State Treaty"
 cwp_at_western_consent_tt: "The United States consents to a State Treaty"
 cwp_at_status_bought: "Austria will pay for the German assets"
 cwp_saar_outcome_rejected_effect_header: "If the Saar #b rejoins Germany#!:\n$EFFECT$"
 cwp_saar_outcome_accepted_effect_header: "If the Saar #b accepts the European statute#!:\n$EFFECT$"
 cwp_at_possible_tt: "Austria is still under occupation and the treaty is unsettled"
 cwp_at_invalid_tt: "Austria or the Soviet Union is gone, or Austria is free"
 cwp_saar_possible_tt: "A Federal Republic exists and the Saar question is open"
 cwp_saar_invalid_tt: "France or Germany no longer exists"
 cwp_at_buy_back_button: "Buy Back the German Assets"
 cwp_at_buy_back_button_desc: "Offer the Soviet Union oil and goods over ten years in return for the oil fields, factories and Danube shipping it took as German property."
 cwp_at_buy_back_needs_neutrality_tt: "Austria has pledged neutrality"
 cwp_at_reparation_deliveries: "Payments to Moscow"
 cwp_at_reparation_deliveries_desc: "We are paying for the German assets in oil and goods."
 cwp_at_reparation_income: "Austrian Payments"
 cwp_at_reparation_income_desc: "Austria pays us in oil and goods for the German assets we returned."
 cwp_at_neutrality_button: "Pledge Neutrality"
 cwp_at_neutrality_button_desc: "Promise to stay permanently neutral, on the Swiss model, once the occupying armies leave."
 cwp_at_consent_button: "Consent to a State Treaty"
 cwp_at_consent_button_desc: "Agree to sign a treaty that restores Austria's independence and withdraws our troops."
 cwp_at_usia_button: "Run the German Assets"
 cwp_at_usia_button_desc: "Operate the oil fields, factories and shipping of our zone for the Soviet economy."
 cwp_at_usia: "The USIA Concern"
 cwp_at_usia_desc: "The former German assets in our zone of Austria work for us."
 cwp_at_usia_loss: "Soviet-Run Industry"
 cwp_at_usia_loss_desc: "Our oil and factories in the Soviet zone are run for the Soviet Union."
 cwp_at_neutrality: "Permanent Neutrality"
 cwp_at_neutrality_desc: "Austria has declared itself permanently neutral."
 cwp_at_state_treaty: "The State Treaty"
 cwp_at_state_treaty_desc: "The occupation is over and Austria is free."

 je_cwp_saar: "The Saar Question"
 je_cwp_saar_reason: "France has separated the Saar from its zone of Germany and tied its coal and steel to the French economy, with a government of its own in Saarbrücken. The Federal Republic wants the Saar back. Both may agree to let the Saarlanders decide on a European statute for the territory."
 cwp_saar_status_protectorate: "The Saar's coal and steel work for the French economy."
 cwp_saar_status_agreed: "A referendum on a European statute is under discussion"
 cwp_saar_outcome_rejected: "The Saar #b rejoins Germany#! if:\n"
 cwp_saar_outcome_rejected_desc: "The Saarlanders rejected the European statute, and the Saar is joining the Federal Republic."
 cwp_saar_outcome_rejected_tt: "The Saar has rejected the European statute"
 cwp_saar_outcome_accepted: "The Saar #b accepts the European statute#! if:\n"
 cwp_saar_outcome_accepted_desc: "The Saarlanders accepted a European statute, and the Saar stays apart from Germany."
 cwp_saar_outcome_accepted_tt: "The Saar has accepted the European statute"
 cwp_saar_statute_button: "Agree to a Saar Referendum"
 cwp_saar_statute_button_desc: "Agree with the other side to put a European statute for the Saar to its voters."
 cwp_saar_statute_button_tt: "Once France and the Federal Republic have both agreed, the Saar votes"
 cwp_saar_economic_union: "Saar Economic Union"
 cwp_saar_economic_union_desc: "Saar coal and steel flow into the French economy."
 cwp_saar_returned: "The Saar Returns"
 cwp_saar_returned_desc: "The Saar has joined the Federal Republic."
 cwp_saar_lost: "The European Statute"
 cwp_saar_lost_desc: "The Saar has chosen to stay apart from Germany."

 cwp_austria_saar.1.t: "The Austrian Question"
 cwp_austria_saar.1.d: "Austria has been liberated, but it is not yet free. American, British, French and Soviet troops hold their zones, and the Allied Council in Vienna decides what the Austrian government may do. The Soviet Union treats the German property in its zone as war booty. A State Treaty will need all four powers, and Moscow wants to know which side Austria would stand on."
 cwp_austria_saar.1.f: "Four in a jeep."
 cwp_austria_saar.1.a: "We will see."
 cwp_austria_saar.2.t: "The State Treaty"
 cwp_austria_saar.2.d: "In the Belvedere Palace in Vienna, the foreign ministers of the four powers and of Austria have signed the State Treaty. The occupying armies will leave, and Austria is a sovereign state again."
 cwp_austria_saar.2.f: "\"Österreich ist frei!\" (Leopold Figl, 1955)"
 cwp_austria_saar.2.a: "Austria is free."
 cwp_austria_saar.3.t: "The Saar Votes No"
 cwp_austria_saar.3.d: "Two thirds of the Saar's voters have rejected the European statute. France has accepted the result, and the Saar will join the Federal Republic."
 cwp_austria_saar.3.f: "Die kleine Wiedervereinigung: the little reunification."
 cwp_austria_saar.3.a: "The Saar comes home."
 cwp_austria_saar.4.t: "The Saar Votes Yes"
 cwp_austria_saar.4.d: "The Saar's voters have accepted the European statute. The territory will stay apart from Germany under a European commissioner, with its economy still tied to France."
 cwp_austria_saar.4.f: "The European statute."
 cwp_austria_saar.4.a: "So the Saar has chosen."
