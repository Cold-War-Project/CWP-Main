l_english:
 # Journal entry
 je_cwp_german_question: "The German Question"
 je_cwp_german_question_reason: "Germany has surrendered unconditionally. Its territory east of the Oder and Neisse is under Polish and Soviet administration, and what remains is divided into four occupation zones, governed by the Allied Control Council in Berlin. At Potsdam the victors agreed to treat Germany as a single economic unit, but each power runs its zone its own way. Whether the German people end up with one state, two, or none of their own is still undecided."
 cwp_gq_status_occupation: "Four-power occupation under the Control Council"
 cwp_gq_status_bizone: "The Bizone exists; the Control Council is deadlocked"
 cwp_gq_status_blockade: "West Berlin is under blockade"
 cwp_gq_possible_tt: "Germany is under four-power occupation"
 cwp_gq_invalid_tt: "No German state remains"
 cwp_gq_blockade_on_tt: "West Berlin is under blockade"
 cwp_gq_status_frg: "The Federal Republic is proclaimed in the West"
 cwp_gq_status_two_states: "Two German states, each claiming all of Germany"

 cwp_gq_outcome_effect_header: "The German question is settled for now"
 cwp_gq_outcome_two_states: "Two German States"
 cwp_gq_outcome_two_states_desc: "Germany is divided into a Federal Republic aligned with the West and a Democratic Republic aligned with the East, each sovereign on paper."
 cwp_gq_outcome_two_states_tt: "Both the Federal Republic and the German Democratic Republic are sovereign"
 cwp_gq_outcome_neutral: "A Neutral Germany"
 cwp_gq_outcome_neutral_desc: "The four powers have withdrawn from a united Germany that belongs to neither bloc."
 cwp_gq_outcome_neutral_tt: "Germany has been united as a neutral state"
 cwp_gq_outcome_west: "Germany United in the West"
 cwp_gq_outcome_west_desc: "The Soviet zone is gone, and Germany's future will be decided in the West."
 cwp_gq_outcome_west_tt: "The Soviet zone no longer exists, while the western zones or the Federal Republic remain"
 cwp_gq_outcome_east: "Germany United in the East"
 cwp_gq_outcome_east_desc: "The western zones are gone, and the Soviet zone is the only German state left."
 cwp_gq_outcome_east_tt: "The western zones and the Federal Republic no longer exist, while the Soviet zone remains"
 cwp_gq_soviet_zone_exists_tt: "The Soviet zone still exists under Soviet control"

 # Bars
 cwp_gq_western_bar: "Western Integration"
 cwp_gq_western_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_gq_western_bar_explain_tt Western integration#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 cwp_gq_western_bar_explain_tt: "How far the western zones have grown into a single West German state. At #v 60#! the zones can draft a Basic Law and proclaim a Federal Republic; at #v 100#! it can be given its sovereignty."
 cwp_gq_western_bar_second_desc: "Basic Law at #v 60#!, sovereignty at #v 100#!"
 cwp_gq_western_bar_bizone: "The Bizone"
 cwp_gq_western_bar_trizone: "The Trizone"
 cwp_gq_western_bar_marshall_aid: "Marshall Plan aid"
 cwp_gq_western_bar_currency_reform: "The Deutsche Mark"
 cwp_gq_western_bar_self_government: "Elected Länder governments"
 cwp_gq_western_bar_recovery: "Living standards in the West above the Soviet zone's"
 cwp_gq_western_bar_fear_of_the_east: "Fear of Soviet expansion (Sovietization at 50 or more)"
 cwp_gq_western_bar_airlift: "The Berlin airlift"
 cwp_gq_western_bar_allies_agree: "The western allies agree (US relations with Britain and France 50 or more)"
 cwp_gq_western_bar_allies_quarrel: "The western allies quarrel (Britain or France hostile to the United States)"
 cwp_gq_western_bar_french_reservations: "France keeps its zone apart"
 cwp_gq_western_bar_four_power_hopes: "Hopes for a four-power settlement (all four powers back an all-German government)"
 cwp_gq_western_bar_occupation_statute: "The Occupation Statute"
 cwp_gq_western_bar_berlin_abandoned: "West Berlin was given up"
 cwp_gq_western_bar_radicals: "Radicals in the West (20% or more)"

 cwp_gq_soviet_bar: "Sovietization"
 cwp_gq_soviet_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_gq_soviet_bar_explain_tt Sovietization#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 cwp_gq_soviet_bar_explain_tt: "How firmly the Socialist Unity Party holds the Soviet zone. At #v 60#!, once a western state exists, the zone can proclaim the German Democratic Republic, or at #v 90#! on its own; at #v 100#! Moscow can recognise its sovereignty."
 cwp_gq_soviet_bar_land_reform: "Land reform"
 cwp_gq_soviet_bar_sed: "The Socialist Unity Party"
 cwp_gq_soviet_bar_dismantling: "Reparations dismantling"
 cwp_gq_soviet_bar_antifascist_bloc: "The antifascist bloc"
 cwp_gq_soviet_bar_workers_in_government: "The trade unions in government"
 cwp_gq_soviet_bar_separate_currency: "A separate eastern currency"
 cwp_gq_soviet_bar_blockade: "The Berlin blockade"
 cwp_gq_soviet_bar_radicals: "Radicals in the Soviet zone (20% or more)"
 cwp_gq_soviet_bar_not_held: "The Soviet zone no longer answers to Moscow"


 # Buttons
 cwp_gq_merge_zones_button: "Merge the Zones"
 cwp_gq_merge_zones_button_desc: "Agree to run the American and British zones as one economic area. The merger happens once both Washington and London have agreed."
 cwp_gq_merge_zones_button_tt: "Once the United States and Britain have both agreed, the American and British zones merge into the #b Bizone#!"
 cwp_gq_already_agreed_tt: "We have already agreed"
 cwp_gq_needs_bizone_tt: "The Bizone exists"
 cwp_gq_needs_sed_tt: "The Socialist Unity Party has been founded"
 cwp_gq_needs_currency_reform_tt: "The western zones have introduced their own currency"
 cwp_gq_join_trizone_button: "Join the Trizone"
 cwp_gq_join_trizone_button_desc: "Give up our reservations and bring the French zone into the combined western economy."
 cwp_gq_join_trizone_button_tt: "The French zone joins the Bizone, which becomes the #b Trizone#!"
 cwp_gq_marshall_aid_button: "European Recovery Program"
 cwp_gq_marshall_aid_button_desc: "Extend Marshall Plan aid to the western zones of Germany."
 cwp_gq_currency_reform_button: "Introduce the Deutsche Mark"
 cwp_gq_currency_reform_button_desc: "Replace the worthless Reichsmark with a new currency in the western zones. It will end the black market, and it will end any pretence that Germany is still one economy."
 cwp_gq_self_government_button: "Länder Elections"
 cwp_gq_self_government_button_desc: "Hold elections and hand more of the administration to German governments in the Länder."
 cwp_gq_land_reform_button: "Land Reform"
 cwp_gq_land_reform_button_desc: "Expropriate every estate over 100 hectares and the land of those named as Nazis, and give it to farm labourers and refugees: \"Junkerland in Bauernhand\"."
 cwp_gq_sed_merger_button: "Found the Socialist Unity Party"
 cwp_gq_sed_merger_button_desc: "Merge the Communist and Social Democratic parties of the Soviet zone into one party under Communist leadership."
 cwp_gq_dismantling_button: "Dismantle for Reparations"
 cwp_gq_dismantling_button_desc: "Take factories, rails and machinery from the zone and ship them east as reparations."
 cwp_gq_antifascist_bloc_button: "The Antifascist Bloc"
 cwp_gq_antifascist_bloc_button_desc: "Bind the other permitted parties into a joint bloc that the Socialist Unity Party leads."
 cwp_gq_blockade_button: "Blockade West Berlin"
 cwp_gq_blockade_button_desc: "Close the roads, railways and canals that link the western sectors of Berlin to the western zones."
 cwp_gq_lift_blockade_button: "Lift the Blockade"
 cwp_gq_lift_blockade_button_desc: "Reopen the routes to West Berlin."
 cwp_gq_stalin_note_button: "Offer a Neutral Germany"
 cwp_gq_stalin_note_button_desc: "Propose a peace treaty and a united Germany with its own army, bound to join no alliance, before the West integrates the Federal Republic into its own."
 cwp_gq_stalin_note_button_tt: "The Federal Republic will have to answer the offer"
 cwp_gq_stalin_note_possible_tt: "Western Integration is at #v 70#! or more"

 # Effect tooltips
 cwp_gq_proclaim_frg_tt: "The western zones merge into the #b Federal Republic of Germany#!. A zone held by another player is annexed into it."
 cwp_gq_airlift_won_tt: "The airlift has outlasted the blockade"
 cwp_german_question.5.a_tt: "Each month the airlift holds, the blockade costs the Soviet Union more prestige"
 cwp_german_question.11.a_tt: "The Soviet zone becomes the #b German Democratic Republic#!"

 # Names
 cwp_gq_name_soviet_zone: "Soviet Occupation Zone"
 cwp_gq_name_soviet_zone_adj: "Soviet Occupied"
 cwp_gq_name_gdr: "German Democratic Republic"
 cwp_gq_name_gdr_adj: "East German"
 cwp_gq_name_frg: "Federal Republic of Germany"
 cwp_gq_name_frg_adj: "West German"

 # Modifiers
 cwp_gq_bizone: "Combined Economic Area"
 cwp_gq_bizone_desc: "The western zones share one economic administration."
 cwp_gq_marshall_aid: "Marshall Plan Aid"
 cwp_gq_marshall_aid_desc: "Food, fuel, raw materials and credit arrive under the European Recovery Program."
 cwp_gq_marshall_aid_donor: "Marshall Plan for Germany"
 cwp_gq_marshall_aid_donor_desc: "We are paying for the recovery of the western zones."
 cwp_gq_self_government: "Elected Länder Governments"
 cwp_gq_self_government_desc: "German governments, chosen at the polls, run more of the zone's affairs."
 cwp_gq_french_reservations: "French Reservations"
 cwp_gq_french_reservations_desc: "France keeps its zone apart and will not accept a central German government."
 cwp_gq_dismantling: "Reparations Dismantling"
 cwp_gq_dismantling_desc: "Factories and railway track are being taken apart and shipped to the Soviet Union."
 cwp_gq_reparations: "German Reparations"
 cwp_gq_reparations_desc: "Machinery from our zone of Germany is rebuilding our own industry."
 cwp_gq_land_reform: "Junkerland in Bauernhand"
 cwp_gq_land_reform_desc: "The great estates have been broken up and given to farm labourers and refugees."
 cwp_gq_landowners_expropriated: "Estates Expropriated"
 cwp_gq_landowners_expropriated_desc: "Every estate over 100 hectares has been taken from its owner."
 cwp_gq_antifascist_bloc: "The Antifascist Bloc"
 cwp_gq_antifascist_bloc_desc: "The permitted parties act together under the leadership of the Socialist Unity Party."
 cwp_gq_sed_unity: "SED Merger"
 cwp_gq_sed_unity_desc: "The Communists and the Social Democrats of the zone have been merged into one party."
 cwp_gq_airlift: "Berlin Airlift"
 cwp_gq_airlift_desc: "Our aircraft are supplying a city of two million people from the air."
 cwp_gq_airlift_victory: "Success of the Berlin Airlift"
 cwp_gq_airlift_victory_desc: "The airlift outlasted the Berlin blockade."
 cwp_gq_blockade_failed: "The Blockade Failed"
 cwp_gq_blockade_failed_desc: "Our blockade of West Berlin did not make the West give way."
 cwp_gq_berlin_abandoned: "West Berlin Given Up"
 cwp_gq_berlin_abandoned_desc: "We pulled out of Berlin rather than supply it."
 cwp_gq_berlin_won: "Control of Berlin"
 cwp_gq_berlin_won_desc: "The western powers have left Berlin."
 cwp_gq_uprising_crushed: "The June Uprising Crushed"
 cwp_gq_uprising_crushed_desc: "Soviet tanks put down the workers' uprising."
 cwp_gq_norms_withdrawn: "Work Norms Withdrawn"
 cwp_gq_norms_withdrawn_desc: "The government took back the higher work norms that set off the uprising."
 cwp_gq_neutral_germany: "A Neutral Germany"
 cwp_gq_neutral_germany_desc: "Germany is united, and belongs to neither bloc."
 cwp_gq_sovereignty_denied: "Occupation Statute Prolonged"
 cwp_gq_sovereignty_denied_desc: "The occupying power has refused to end the Occupation Statute."
 cwp_gq_non_aligned: "Neutralism"
 cwp_gq_non_aligned_desc: "The Federal Republic has refused to join either bloc."

 # Events
 cwp_german_question.1.t: "The German Question"
 cwp_german_question.1.d: "The Reich is gone. Its cities are rubble, millions of refugees from the east are on the roads, and four foreign armies govern what remains. At Potsdam the victors promised to run Germany as a single economic unit through the Allied Control Council in Berlin, yet each power is already governing its own zone in its own way. What becomes of Germany will depend on what the occupiers do, and on what the Germans make of it."
 cwp_german_question.1.f: "Stunde Null: the zero hour."
 cwp_german_question.1.a: "We will see what can be built from the ruins."

 cwp_german_question.2.t: "The Bizone"
 cwp_german_question.2.d: "Washington and London have agreed to run their zones of Germany as a single economic area. A joint administration will manage food, transport and industry for the Bizone, which has a larger population than any other zone. The Soviet Union calls it a breach of Potsdam, and the Allied Control Council grows quieter still."
 cwp_german_question.2.f: "Bizonia."
 cwp_german_question.2.a: "A start."

 cwp_german_question.3.t: "The Trizone"
 cwp_german_question.3.d: "France has dropped its objections and brought its zone into the combined western economy. The three western zones now act as one, with one administration and one set of policies, and a West German state is in reach if the Germans will draft its constitution."
 cwp_german_question.3.f: "Trizonesia."
 cwp_german_question.3.a: "Three zones, one Germany in the making."

 cwp_german_question.4.t: "A New Currency in the West"
 cwp_german_question.4.d: "Without consulting us, the western powers have replaced the Reichsmark with a new Deutsche Mark in their zones. The worthless old notes will flood east, and the West has shown that it means to build a separate economy, and with it a separate state."
 cwp_german_question.4.f: "Die Währungsreform."
 cwp_german_question.4.a: "Introduce our own mark in the zone and in all of Berlin."
 cwp_german_question.4.b: "Protest, and keep the door open for talks."

 cwp_german_question.5.t: "The Berlin Blockade"
 cwp_german_question.5.d: "Soviet troops have closed every road, railway and canal into the western sectors of Berlin, \"for technical reasons\". Two million people have food for a few weeks and coal for a few more. We can try to supply the city by air, which no one has ever done on this scale, we can negotiate, or we can leave Berlin to the Soviets."
 cwp_german_question.5.f: "\"Ihr Völker der Welt ... schaut auf diese Stadt!\" (Ernst Reuter, 1948)"
 cwp_german_question.5.a: "Supply the city from the air."
 cwp_german_question.5.b: "Ask Moscow for talks."
 cwp_german_question.5.c: "Berlin is not worth a war. Withdraw."

 cwp_german_question.6.t: "Berlin Cut Off"
 cwp_german_question.6.d: "The Soviet Union has closed the land and water routes to the western sectors of Berlin. The city's two million people depend on what the western powers decide to do."
 cwp_german_question.6.f: "The first Berlin crisis."
 cwp_german_question.6.a: "We will watch closely."


 cwp_german_question.8.t: "The Blockade Ends"
 cwp_german_question.8.d: "The routes to West Berlin are open again."
 cwp_german_question.8.d_airlift: "The routes to West Berlin are open again. The airlift kept the city alive for as long as the blockade lasted, and the western sectors are tied more closely to the West than before."
 cwp_german_question.8.d_abandoned: "The blockade is over because the western powers have left Berlin. The whole city now lies inside the Soviet zone."
 cwp_german_question.8.f: "Die Luftbrücke: the air bridge."
 cwp_german_question.8.a: "So it ends."

 cwp_german_question.9.t: "The Socialist Unity Party"
 cwp_german_question.9.d: "At a joint congress in Berlin, the Communist and Social Democratic parties of the zone have merged into the Socialist Unity Party of Germany. Wilhelm Pieck and Otto Grotewohl shook hands on the stage. Social Democrats in the western zones call it a forced merger, and many of their eastern comrades who objected have been quietly removed."
 cwp_german_question.9.f: "Zwangsvereinigung: the forced merger, as the Social Democrats in the West called it."
 cwp_german_question.9.a: "The working class is united."

 cwp_german_question.10.t: "The Basic Law"
 cwp_german_question.10.d: "The western zones now share an economy, a currency and a common administration, and the four powers can agree on nothing. A Parliamentary Council of the Länder can draft a Basic Law for a Federal Republic of Germany in the West, as a provisional state until all of Germany can decide freely. Doing so would make the division of Germany official."
 cwp_german_question.10.f: "A provisional constitution, until the German people decide freely on one (Article 146)."
 cwp_german_question.10.a: "Proclaim the Federal Republic of Germany."
 cwp_german_question.10.b: "Not yet. Give the four powers one more chance."

 cwp_german_question.11.t: "The German Democratic Republic"
 cwp_german_question.11.d: "The Socialist Unity Party has the zone firmly in hand. The People's Council is ready to turn itself into a provisional parliament and proclaim a German Democratic Republic, with Wilhelm Pieck as President and Otto Grotewohl as Minister-President."
 cwp_german_question.11.f: "Der Arbeiter-und-Bauern-Staat: the workers' and peasants' state."
 cwp_german_question.11.a: "Proclaim the German Democratic Republic."
 cwp_german_question.11.b: "Wait. A separate state would end any hope of unity."

 cwp_german_question.12.t: "The Stalin Note"
 cwp_german_question.12.d: "Moscow has sent the western powers a note. It proposes a peace treaty with a united Germany with its own armed forces, free of foreign troops, which would join no alliance against any of the powers that fought it. Critics say it is a ploy to stop the Federal Republic joining the West. Supporters say the chance of unity may never come again."
 cwp_german_question.12.f: "A missed opportunity, or none? (the Stalin Note debate)"
 cwp_german_question.12.a: "Reject it. Freedom and the West come before unity."
 cwp_german_question.12.b: "Accept it. Germany will be one again, and neutral."

 cwp_german_question.13.t: "A Federal Republic in the West"
 cwp_german_question.13.d: "The western zones have adopted a Basic Law and proclaimed the Federal Republic of Germany. The occupying powers keep their authority under an Occupation Statute, but the West Germans now have a government of their own."
 cwp_german_question.13.f: "The Bonn Republic."
 cwp_german_question.13.a: "Germany is divided in all but name."

 cwp_german_question.14.t: "A Democratic Republic in the East"
 cwp_german_question.14.d: "The Soviet zone has proclaimed the German Democratic Republic, with its capital in East Berlin. Each German state now claims to be the legitimate one."
 cwp_german_question.14.f: "Two German states."
 cwp_german_question.14.a: "So be it."

 cwp_german_question.15.t: "Ending the Occupation Statute"
 cwp_german_question.15.d: "The Federal Republic has become a working democracy and a partner in the rebuilding of western Europe. Its government asks for the Occupation Statute to be ended and for full sovereignty, with our troops staying as allies rather than occupiers."
 cwp_german_question.15.f: "The Paris Agreements."
 cwp_german_question.15.a: "Grant the Federal Republic its sovereignty."
 cwp_german_question.15.b: "Not yet. The occupation continues."

 cwp_german_question.16.t: "A Sovereign Federal Republic"
 cwp_german_question.16.d: "The occupation is over and the Federal Republic answers to no one. The Chancellor wants it firmly in the West, with an army of its own inside the western alliance. The Social Democrats warn that this would close the door to unity for a generation."
 cwp_german_question.16.f: "Westbindung."
 cwp_german_question.16.a: "Join the Western bloc."
 cwp_german_question.16.b: "Stay between the blocs."

 cwp_german_question.17.t: "Sovereignty for the GDR"
 cwp_german_question.17.d: "The German Democratic Republic asks us to recognise it as a sovereign state. Our troops would remain, the Socialist Unity Party would stay in power, and the GDR would stand as an equal member of the socialist camp."
 cwp_german_question.17.f: "Socialist internationalism."
 cwp_german_question.17.a: "Recognise its sovereignty."
 cwp_german_question.17.b: "It is not ready."

 cwp_german_question.18.t: "The June Uprising"
 cwp_german_question.18.d: "The government raised work norms without raising pay, and the workers have had enough. Construction workers in Berlin downed tools and marched on the government quarter, and within a day strikes and demonstrations spread across the country. The crowds want lower norms, then free elections, then the government gone."
 cwp_german_question.18.f: "Der Volksaufstand: the popular uprising."
 cwp_german_question.18.a: "Call in the Soviet tanks."
 cwp_german_question.18.b: "Withdraw the norms and promise a new course."

 cwp_german_question.19.t: "The West Asks for Talks"
 cwp_german_question.19.d: "Instead of trying to supply Berlin, the western powers ask us to negotiate. We can reopen the routes in return for a new round of talks, or tell them that the city's future is ours to decide."
 cwp_german_question.19.f: "Berlin as a bargaining chip."
 cwp_german_question.19.a: "Reopen the routes and talk."
 cwp_german_question.19.b: "Berlin belongs to our zone. Let them leave."

 cwp_german_question.20.t: "A United, Neutral Germany"
 cwp_german_question.20.d: "The Federal Republic has accepted the Soviet offer. The two German states will become one, every occupying army will leave, and the new Germany will join neither bloc."
 cwp_german_question.20.f: "The neutralist alternative."
 cwp_german_question.20.a: "Let us hope it holds."
 cwp_gq_blockade_strain: "Strain of the Blockade"
 cwp_gq_blockade_strain_desc: "Every month the airlift keeps West Berlin supplied, the world watches our blockade fail."
 cwp_amendment_basic_law: "Basic Law"
 cwp_amendment_basic_law_desc: "The Basic Law of 1949 makes the Federal Republic a \"militant democracy\": parties that fight the free democratic order can be banned, and its federal and democratic core can never be amended."
 cwp_gq_central_government_button: "All-German Government"
 cwp_gq_central_government_button_desc: "Back, or stop backing, central German administrations and a single German government agreed by all four powers, as promised at Potsdam. If all four back it before Germany splits, the country is united and neutral."
 cwp_gq_central_government_back_tt: "We back an all-German government"
 cwp_gq_central_government_withdraw_tt: "We no longer back an all-German government"
 cwp_gq_usa_backs_tt: "The United States backs an all-German government"
 cwp_gq_gbr_backs_tt: "Britain backs an all-German government"
 cwp_gq_fra_backs_tt: "France backs an all-German government"
 cwp_gq_rus_backs_tt: "The Soviet Union backs an all-German government"
 cwp_gq_one_currency_tt: "Germany still has one currency"
 cwp_gq_no_separate_state_tt: "No separate German state has been proclaimed"
 cwp_gq_outcome_all_german: "An All-German Government"
 cwp_gq_outcome_all_german_desc: "The four powers have agreed on one government for all of Germany. The zones are being merged into a single, neutral state."
 cwp_german_question.21.t: "An All-German Government"
 cwp_german_question.21.d: "Against every expectation, the four powers have agreed. The zones will be merged under one German government, elected across the whole country, and the occupying armies will leave a Germany that belongs to no bloc."
 cwp_german_question.21.f: "The Potsdam Agreement fulfilled."
 cwp_german_question.21.a: "One Germany, between East and West."
