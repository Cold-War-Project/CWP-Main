l_english:
 je_cwp_die_wende: "Die Wende"
 je_cwp_die_wende_reason: "The Socialist Unity Party has lost the consent of the people it governs. Every Monday the crowds in Leipzig grow larger, chanting \"Wir sind das Volk\". Whether the GDR reforms, collapses or shoots, and whether the four powers that still hold rights over Germany as a whole will let it unite, is being decided now."
 cwp_dw_status_protests: "Mass demonstrations in Leipzig and East Berlin"
 cwp_dw_possible_tt: "Change has begun in the GDR"
 cwp_dw_invalid_tt: "One of the German states no longer exists"
 cwp_dw_wall_closed_tt: "The Wall is still closed"
 cwp_dw_not_consented_tt: "We have not yet consented"
 cwp_dw_not_blocked_tt: "We are not already blocking unity"
 cwp_dw_status_wall_open: "The Wall is open"
 cwp_dw_status_deadlock: "The Two Plus Four talks are deadlocked"
 cwp_dw_usa_consents_tt: "The United States consents to unity"
 cwp_dw_gbr_consents_tt: "Britain consents to unity"
 cwp_dw_fra_consents_tt: "France consents to unity"
 cwp_dw_rus_consents_tt: "The Soviet Union consents to unity"
 cwp_dw_status_crackdown: "The security forces have fired on the demonstrators."

 cwp_dw_outcome_accession: "To achieve #b unity#!:\n"
 cwp_dw_outcome_accession_effect_header: "On #b unity#!:\n$EFFECT$"
 cwp_dw_outcome_accession_desc: "The GDR has acceded to the Federal Republic, and the four powers have given up their rights over Germany. Germany is one state again."
 cwp_dw_outcome_accession_tt: "The Peaceful Revolution is at #v 100#!"
 cwp_dw_outcome_reformed: "To achieve a #b democratic GDR#!:\n"
 cwp_dw_outcome_reformed_effect_header: "On a #b democratic GDR#!:\n$EFFECT$"
 cwp_dw_outcome_reformed_desc: "The East Germans have won free elections, but a power with rights over Germany has refused unification. The GDR goes on as a separate, democratic state."
 cwp_dw_outcome_reformed_tt: "The revolution has won, but one of the four powers has blocked unity for #v 12#! months in a row"
 cwp_dw_outcome_crushed: "The #b regime survives#! if:\n"
 cwp_dw_outcome_crushed_effect_header: "If the #b regime survives#!:\n$EFFECT$"
 cwp_dw_outcome_crushed_desc: "The protests have been broken by force. The Socialist Unity Party rules on, over a people who no longer believe in it."
 cwp_dw_outcome_crushed_result_tt: "The regime rules on; neither #v $je_cwp_die_wende$#! nor #v $je_cwp_two_germanies$#! will return"
 cwp_dw_outcome_crushed_tt: "The Peaceful Revolution has fallen to #v 0#!"

 cwp_dw_revolution_bar: "Peaceful Revolution"
 cwp_dw_revolution_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_dw_revolution_bar_explain_tt Peaceful revolution#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 cwp_dw_revolution_bar_explain_tt: "How far the people of the GDR have pushed their government. At #v 100#! the old regime is finished; at #v 0#! the protests are broken."
 cwp_dw_revolution_bar_protests: "Mass protests (radicals at 10% or more)"
 cwp_dw_revolution_bar_wall_open: "The opening of the Wall"
 cwp_dw_revolution_bar_no_tanks: "Moscow's refusal to send the tanks"
 cwp_dw_revolution_bar_round_table: "The Round Table"
 cwp_dw_revolution_bar_crackdown: "The crackdown"
 cwp_dw_revolution_bar_soviet_troops: "Soviet troops still guaranteeing the regime"


 cwp_dw_open_wall_button: "Open the Border"
 cwp_dw_open_wall_button_desc: "Let East Germans travel to the West without conditions, starting tonight."
 cwp_dw_round_table_button: "The Round Table"
 cwp_dw_round_table_button_desc: "Sit down with the churches, the citizens' movements and the opposition parties, and prepare free elections."
 cwp_dw_crackdown_button: "Crush the Protests"
 cwp_dw_crackdown_button_desc: "Order the police, the army and the Stasi to clear the streets, whatever it takes."
 cwp_dw_consent_button: "Consent to Unity"
 cwp_dw_consent_button_desc: "Accept a united Germany and give up our rights as an occupying power."
 cwp_dw_delay_button: "Wait"
 cwp_dw_delay_button_desc: "Withdraw our stance and see how the situation develops."
 cwp_dw_block_button: "Block Unity"
 cwp_dw_block_button_desc: "Refuse to give up our rights over Germany as a whole."
 cwp_dw_credits_button: "Credits for Moscow"
 cwp_dw_credits_button_desc: "Offer the Soviet Union credits, and pay for the housing of its soldiers when they go home."

 cwp_dw_round_table: "The Round Table"
 cwp_dw_round_table_desc: "Government and opposition negotiate the country's future."
 cwp_dw_crackdown: "The Crackdown"
 cwp_dw_crackdown_desc: "The security forces have turned their weapons on the people."
 cwp_dw_credits: "Credits from Bonn"
 cwp_dw_credits_desc: "West German money is helping our economy and our soldiers' return home."
 cwp_dw_credits_paid: "Credits for Moscow"
 cwp_dw_credits_paid_desc: "We are paying for Soviet consent to German unity."
 cwp_dw_unity: "German Unity"
 cwp_dw_unity_desc: "Germany is one state again."
 cwp_dw_solidarity_surcharge: "Solidarity Surcharge"
 cwp_dw_solidarity_surcharge_desc: "Rebuilding the East costs more than anyone said it would."

 cwp_die_wende.1.t: "Wir sind das Volk"
 cwp_die_wende.1.d: "The GDR's rulers have lost their people. What began as prayers for peace in a Leipzig church has become a march of tens of thousands around the city's ring road every Monday, and the crowds are spreading to Dresden, Plauen and East Berlin. The regime must choose between reform and force, and the four powers that still hold rights over Germany as a whole must decide what they will accept."
 cwp_die_wende.1.f: "\"Wir sind das Volk!\""
 cwp_die_wende.1.a: "History is moving."

 cwp_die_wende.2.t: "The Wall Is Open"
 cwp_die_wende.2.d: "The GDR has opened its border crossings. Tonight, crowds poured through the checkpoints in Berlin, strangers embraced on the Kurfürstendamm, and people climbed on the Wall at the Brandenburg Gate and began to chip at it with hammers."
 cwp_die_wende.2.f: "Der Mauerfall."
 cwp_die_wende.2.a: "Nothing will be the same."

 cwp_die_wende.3.t: "Shots in the GDR"
 cwp_die_wende.3.d: "The East German security forces have been ordered to clear the streets. There are reports of gunfire, of mass arrests and of hospitals filling up. The world is watching, and the GDR's rulers have shown it what they are prepared to do."
 cwp_die_wende.3.f: "The Chinese solution."
 cwp_die_wende.3.a: "A dark day."

 cwp_die_wende.4.t: "German Unity"
 cwp_die_wende.4.d: "The four powers have signed away their rights over Germany as a whole, and the GDR has acceded to the Federal Republic. At midnight the black, red and gold flag rose over the Reichstag, and Germany is one state for the first time in more than four decades."
 cwp_die_wende.4.f: "\"Jetzt wächst zusammen, was zusammengehört.\" (Willy Brandt, 1989)"
 cwp_die_wende.4.a: "One Germany."

 cwp_die_wende.5.t: "A Democratic GDR"
 cwp_die_wende.5.d: "The East Germans have forced free elections and a new constitution, but unification has been refused by a power that still holds rights over Germany. For now, there will be two German democracies."
 cwp_die_wende.5.f: "The third way."
 cwp_die_wende.5.a: "Two German democracies."

 cwp_die_wende.6.t: "The Regime Survives"
 cwp_die_wende.6.d: "The demonstrations have been broken. Their leaders are in prison or in the West, the streets are quiet, and the Socialist Unity Party is still in power. Nobody believes it will last forever."
 cwp_die_wende.6.f: "Stagnation."
 cwp_die_wende.6.a: "For now."
