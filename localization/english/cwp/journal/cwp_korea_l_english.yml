l_english:
 # je_cwp_divided_peninsula (docs/agents/areas/korea.md)
 je_cwp_divided_peninsula: "The Korean Question"
 je_cwp_divided_peninsula_reason: "In August 1945 the United States proposed, and the Soviet Union accepted, the 38th parallel as the line dividing the Japanese surrender in Korea. Soviet troops occupied the north and American troops the south. In December the Allied foreign ministers agreed at Moscow on a trusteeship of up to five years and a US-Soviet Joint Commission to help form a provisional Korean government. The news brought protests from Koreans across the political spectrum, who wanted independence at once."
 je_cwp_divided_peninsula_armistice: "Armistice"
 je_cwp_divided_peninsula_armistice_desc: "An armistice has stopped the fighting along a line that neither Korean government accepts as a border. No peace treaty has been signed, and the two armies face each other across a demilitarized zone."
 je_cwp_divided_peninsula_line_holds: "Mutual Deterrence"
 je_cwp_divided_peninsula_line_holds_desc: "Neither Korean state has been able to conquer the other. The demarcation line has become a fortified frontier, guarded by foreign troops and mutual defense treaties."
 je_cwp_divided_peninsula_north_unifies: "Reunification by Force: the North"
 je_cwp_divided_peninsula_north_unifies_desc: "The southern republic has fallen. The whole peninsula answers to the government in Pyongyang."
 je_cwp_divided_peninsula_south_unifies: "Reunification by Force: the South"
 je_cwp_divided_peninsula_south_unifies_desc: "The northern regime has fallen. The whole peninsula answers to the government in Seoul."
 je_cwp_divided_peninsula_neutral: "Neutralization of Korea"
 je_cwp_divided_peninsula_neutral_desc: "Against every expectation the Joint Commission agreed on a provisional government for all Korea. The occupiers have gone home, and the new state stands between the blocs."

 cwp_korea.3.t: "The Republic of Korea"
 cwp_korea.3.d: "[SCOPE.sCountry('cwp_rok').GetName] has been proclaimed in [SCOPE.sCountry('cwp_rok').GetCapital.GetName], and the American military government has transferred its authority to the new government. Its constitution claims the whole peninsula, and it does not recognize the authorities in the north."
 cwp_korea.3.f: "\"The territory of the Republic of Korea shall consist of the Korean peninsula and its adjacent islands.\"\n— Constitution of the Republic of Korea, Article 4"
 cwp_korea.3.a: "Two governments for one Korea."
 cwp_korea.4.t: "The Democratic People's Republic"
 cwp_korea.4.d: "The Supreme People's Assembly has proclaimed [SCOPE.sCountry('cwp_dprk').GetName] in [SCOPE.sCountry('cwp_dprk').GetCapital.GetName]. Its constitution names Seoul as the capital and claims the whole peninsula, and it denounces the government in the south as an American puppet."
 cwp_korea.4.f: "\"The capital of the D.P.R.K. is Seoul.\"\n— Constitution of the Democratic People's Republic of Korea, Article 103"
 cwp_korea.4.a: "The division deepens."
 cwp_korea_status_commission: "The US-Soviet Joint Commission is negotiating a provisional government for all Korea under a five-year trusteeship. It can only succeed if Washington and Moscow are on good terms and both give ground at once."
 cwp_korea_status_partition: "The Joint Commission has failed. Each occupier is building a Korean government in its own zone."
 cwp_korea_status_two_states: "Two Korean states face each other across the 38th parallel, each claiming the whole peninsula."
 cwp_korea_status_war: "War is being fought on the peninsula."

 cwp_korea_war_over_tt: "The Korean War has ended"
 cwp_korea_dmz_tt: "Both Koreas keep the Demilitarized Zone along the Military Demarcation Line."
 cwp_korea_deterrence_held_tt: "For 24 months in a row, neither Korea could attack the other: something held each side back (foreign troops, a defence treaty or the other side's stronger army)"
 cwp_korea_neutral_tt: "Both Koreas are freed from occupation and merge into a single, neutral Korean state."
 cwp_korea_partition_tt: "Each occupier may now proclaim a Korean government in its zone."
 cwp_korea_commission_deadlocked_tt: "The Joint Commission is deadlocked (US-Soviet relations below 0)"
 cwp_korea_cond_relations_tt: "Washington and Moscow are on good terms (relations 25 or more)"
 cwp_korea_cond_both_concede_tt: "Both delegations are making concessions at the same time"
 cwp_korea_cond_no_un_tt: "The question has not been taken to the United Nations"
 cwp_korea_un_referral_tt: "The Korean question goes to the United Nations General Assembly. The Joint Commission is finished, and a southern government elected under UN supervision gains recognition."
 cwp_korea_us_withdrawal_tt: "American occupation troops leave Korea. The North loses its main deterrent."
 cwp_korea_soviet_withdrawal_tt: "Soviet occupation troops leave Korea."
 cwp_korea_prc_civil_war_over_tt: "The Chinese Civil War is over"
 cwp_korea_china_seat_dispute_tt: "The People's Republic holds the mainland while the Nationalists keep China's seat on the Security Council"
 cwp_korea_sc_boycott_tt: "Soviet delegates walk out of the Security Council over China's seat. While they stay away, no Soviet veto can stop the Council."
 cwp_korea_volunteers_pledge_tt: "If enemy armies overrun most of North Korea, China will be asked to send its volunteers."
 cwp_korea_us_troops_gone_tt: "American troops have left Korea"
 cwp_korea_soviet_troops_gone_tt: "Soviet troops have left Korea"
 cwp_korea_north_advantage_tt: "The balance on the peninsula clearly favours the North (25 or more)"
 cwp_korea_south_advantage_tt: "The balance on the peninsula clearly favours the South (-25 or less)"
 cwp_korea_elections_done_tt: "Elections have been held and the new government has been formed"
 cwp_korea_army_handed_over_tt: "The new Korean army has taken over from the occupation troops"
 cwp_korea_greenlight_tt: "North Korea may now launch its invasion."
 cwp_korea_patron_consent_tt: "Moscow has approved the attack"
 cwp_korea_un_contingents_tt: "Friendly nations are asked to send contingents to the UN Command."
 cwp_korea_talks_proposed_tt: "Armistice terms are put to the other side."
 cwp_korea_armistice_signed_tt: "The war ends where the armies stand."

 # Bars
 cwp_korea_balance_bar: "Inter-Korean Military Balance"
 cwp_korea_balance_bar_desc: "Which Korea holds the military advantage. A strong lead for the North makes an invasion possible; a strong lead for the South makes a march north possible."
 cwp_korea_balance_bar_second_desc: "Left: the South. Right: the North."
 cwp_korea_balance_us_troops: "American troops in Korea"
 cwp_korea_balance_soviet_troops: "Soviet troops in Korea"
 cwp_korea_balance_soviet_arms: "Soviet arms for the Korean People's Army"
 cwp_korea_balance_us_aid: "American aid to the South"
 cwp_korea_balance_returned_divisions: "Korean veterans of the People's Liberation Army"
 cwp_korea_balance_us_treaty: "American defence treaty with the South"
 cwp_korea_balance_southern_insurgency: "Insurgency in the South"
 cwp_korea_balance_north_army: "The northern army is stronger"
 cwp_korea_balance_south_army: "The southern army is stronger"

 # Buttons
 cwp_korea_commission_concessions_button: "Make Concessions in the Joint Commission"
 cwp_korea_commission_concessions_button_desc: "Give ground on which Korean parties may be consulted, at some cost to our standing."
 cwp_korea_un_referral_button: "Refer Korea to the United Nations"
 cwp_korea_un_referral_button_desc: "Take the deadlocked question to the General Assembly and call for elections under UN supervision. The Soviets will not cooperate."
 cwp_korea_southern_elections_button: "Hold Elections in the South"
 cwp_korea_southern_elections_button_desc: "Organise elections in our zone for a constituent assembly, under UN observation if the question has gone to the United Nations. Once the government is formed, months later, the Republic of Korea will be proclaimed."
 cwp_korea_northern_elections_button: "Hold Elections in the North"
 cwp_korea_northern_elections_button_desc: "Organise elections in our zone for a Supreme People's Assembly. Once the government is formed, months later, the Democratic People's Republic will be proclaimed."
 cwp_korea_us_withdrawal_button: "Withdraw American Troops"
 cwp_korea_us_withdrawal_button_desc: "Korea lies outside our defence perimeter and the divisions are needed elsewhere. Leave a military advisory group and bring the rest home."
 cwp_korea_soviet_withdrawal_button: "Withdraw Soviet Troops"
 cwp_korea_soviet_withdrawal_button_desc: "Bring our troops home and challenge the Americans to do the same."
 cwp_korea_us_aid_button: "Aid the Southern Government"
 cwp_korea_us_aid_button_desc: "Fund and equip the southern security forces, though not with the tanks and aircraft an offensive would need."
 cwp_korea_soviet_arms_button: "Arm the Korean People's Army"
 cwp_korea_soviet_arms_button_desc: "Send tanks, artillery and aircraft to the northern army."
 cwp_korea_returned_divisions_button: "Return the Korean Divisions"
 cwp_korea_returned_divisions_button_desc: "Send the ethnic Korean divisions of the People's Liberation Army, veterans of our civil war, home to the northern army."
 cwp_korea_land_reform_button: "Redistribute the Land"
 cwp_korea_land_reform_button_desc: "Buy out the landlords and give the tenants their fields, taking away the insurgents' strongest cause."
 cwp_korea_security_council_boycott_button: "Boycott the Security Council"
 cwp_korea_security_council_boycott_button_desc: "Walk out of the Security Council until China's seat goes to the People's Republic."
 cwp_korea_volunteers_pledge_button: "Pledge Volunteers to Korea"
 cwp_korea_volunteers_pledge_button_desc: "Promise Pyongyang that China will not let enemy armies reach the Yalu."
 cwp_korea_greenlight_button: "Approve the Northern Offensive"
 cwp_korea_greenlight_button_desc: "Pyongyang asks for permission to unite the country by force. With the Americans gone and the northern army stronger, the risk may be worth taking."
 cwp_korea_invasion_button: "Invade the South"
 cwp_korea_invasion_button_desc: "Cross the 38th parallel and unite Korea by force."
 cwp_korea_march_north_button: "March North"
 cwp_korea_march_north_button_desc: "Cross the 38th parallel and unite Korea by force."

 # Modifiers
 cwp_korea_commission_concessions: "Joint Commission Concessions"
 cwp_korea_commission_concessions_desc: "Our delegation has given ground in the Korean negotiations."
 cwp_korea_us_garrison: "Garrison in Korea"
 cwp_korea_us_garrison_desc: "Our troops remain in Korea."
 cwp_korea_soviet_garrison: "Garrison in Korea"
 cwp_korea_soviet_garrison_desc: "Our troops remain in Korea."
 cwp_korea_un_recognition: "UN Recognition"
 cwp_korea_un_recognition_desc: "The United Nations recognizes this government as the lawful government of Korea."
 cwp_korea_soviet_arms: "Soviet Arms"
 cwp_korea_soviet_arms_desc: "Soviet tanks, guns and advisers equip our army."
 cwp_korea_soviet_arms_cost: "Arming Korea"
 cwp_korea_soviet_arms_cost_desc: "We are equipping the Korean People's Army."
 cwp_korea_us_aid: "American Aid"
 cwp_korea_us_aid_desc: "American money and equipment support our government and security forces."
 cwp_korea_us_aid_cost: "Aid to Korea"
 cwp_korea_us_aid_cost_desc: "We are funding the southern Korean government."
 cwp_korea_returned_divisions: "Returned Korean Divisions"
 cwp_korea_returned_divisions_desc: "Battle-hardened Korean veterans of the Chinese Civil War have joined our army."
 cwp_korea_southern_insurgency: "Communist Insurgency"
 cwp_korea_southern_insurgency_desc: "Communist guerrillas and rebellious units fight the government in the countryside."
 cwp_korea_land_reform: "Land Reform"
 cwp_korea_land_reform_desc: "Tenants have received the land they work."
 cwp_korea_landowners_dispossessed: "Expropriated Landlords"
 cwp_korea_landowners_dispossessed_desc: "The landlords resent the redistribution of their estates."
 cwp_korea_security_council_boycott: "Security Council Boycott"
 cwp_korea_security_council_boycott_desc: "Our delegates are boycotting the Security Council."
 cwp_korea_un_command: "United Nations Command"
 cwp_korea_un_command_desc: "We fight in Korea under the flag of the United Nations."
 cwp_korea_chinese_volunteers: "People's Volunteers"
 cwp_korea_chinese_volunteers_desc: "Our volunteers fight in Korea."
 cwp_korea_dmz: "Demilitarized Zone"
 cwp_korea_dmz_desc: "A fortified line divides Korea. No peace treaty has ended the war."
 cwp_korea_unified: "Korean Reunification"
 cwp_korea_unified_desc: "The peninsula is one country again."
 cwp_korea_neutral: "Neutralized Korea"
 cwp_korea_neutral_desc: "Korea stands between the blocs, united by agreement of the occupying powers."
 cwp_korea_state_building: "Forming a Government"
 cwp_korea_state_building_desc: "Elections have been held and a government and constitution are being drawn up."
 cwp_korea_new_army: "Army Still Forming"
 cwp_korea_new_army_desc: "Our army is still being formed and trained to take over from the occupation troops."
 cwp_korea_crackdown_approval: "Counter-Insurgency"
 cwp_korea_crackdown_approval_desc: "The army has been given a free hand against the insurgents."
 cwp_korea_abandoned_korea: "Lost Credibility"
 cwp_korea_abandoned_korea_desc: "We let a friendly government fall without lifting a finger."
 cwp_korea_fight_on: "Rejection of the Armistice"
 cwp_korea_fight_on_desc: "Our government refuses any armistice that leaves the country divided."

 # Diplomatic play
 dp_cwp_korean_war: "Korean War"
 dp_cwp_korean_war_desc: "A war to unite Korea by force."
 cwp_korean_war: "Korean War"

 # Events
 cwp_korea.1.t: "The Korean Question"
 cwp_korea.1.d: "At Moscow in December 1945 the Allied foreign ministers agreed that a US-Soviet Joint Commission would help form a provisional Korean government, followed by a trusteeship of up to five years. Koreans of almost every party are furious at the word trusteeship, and the two occupiers distrust each other. Whatever is decided, Korea's future is now tied to the relations between Washington and Moscow."
 cwp_korea.1.f: "A line drawn on a map in a single night by two American colonels now divides a nation of twenty-five million."
 cwp_korea.1.a: "We shall see what the Commission brings."
 cwp_korea.2.t: "The Joint Commission Fails"
 cwp_korea.2.d: "The Joint Commission has adjourned without agreement. Each side accused the other of choosing which Koreans could be consulted. In each zone the occupiers now prepare a Korean government of their own."
 cwp_korea.2.f: "A temporary line of surrender has become a frontier."
 cwp_korea.2.a: "So be it."
 cwp_korea.10.t: "Uprising in the South"
 cwp_korea.10.d: "Armed rebels, many of them communists, have attacked police stations and government offices in the south. Behind them stand years of land disputes, police brutality and hatred of officials who once served the Japanese. A regiment sent to put down the rising has mutinied and joined it."
 cwp_korea.10.f: "In the hills the guerrillas wait for the army from the north."
 cwp_korea.10.a: "Crush the rebels."
 cwp_korea.10.b: "Promise land reform."
 cwp_korea.20.t: "War in Korea"
 cwp_korea.20.d: "North Korean tanks have crossed the 38th parallel in force. The southern army is falling back towards Seoul, and its government asks for help."
 cwp_korea.20.f: "If we let this pass, who will trust our word anywhere else?"
 cwp_korea.20.a: "Take it to the Security Council."
 cwp_korea.20.b: "The Soviets will veto it. We go in anyway."
 cwp_korea.20.c: "Korea is not worth a world war."
 cwp_korea.21.t: "War on Our Border"
 cwp_korea.21.d: "War has broken out in Korea. If foreign armies march to the Yalu, the industrial heart of Manchuria will lie within their reach."
 cwp_korea.21.f: "When the lips are gone, the teeth are cold."
 cwp_korea.21.a: "We will watch closely."
 cwp_korea.22.t: "Resist America, Aid Korea"
 cwp_korea.22.d: "Enemy armies have overrun most of North Korea and are nearing the Yalu. Pyongyang reminds us of our pledge and begs for help."
 cwp_korea.22.f: "When the lips are gone, the teeth are cold."
 cwp_korea.22.a: "Send the People's Volunteers."
 cwp_korea.22.b: "China cannot fight another war."
 cwp_korea.23.t: "A Call from the UN Command"
 cwp_korea.23.d: "The Security Council has called on member states to help repel the attack on the Republic of Korea. The UN Command asks whether we will send a contingent."
 cwp_korea.23.f: "Collective security means nothing if no one answers the call."
 cwp_korea.23.a: "Send a contingent."
 cwp_korea.23.b: "We cannot spare the troops."
 cwp_korea.30.t: "Armistice Talks"
 cwp_korea.30.d: "The front has stalled and the will to fight on is draining away on both sides. Envoys have proposed talks on an armistice along the line where the armies stand."
 cwp_korea.30.f: "An armistice is not peace, but it is not war either."
 cwp_korea.30.a: "Propose an armistice."
 cwp_korea.30.b: "Fight on."
 cwp_korea.31.t: "Armistice Terms"
 cwp_korea.31.d: "The enemy has offered an armistice along the present front. Accepting would leave the country divided, perhaps for good. Refusing would mean more years of war."
 cwp_korea.31.f: "The armistice will be signed at Panmunjom, in a hut built for the purpose."
 cwp_korea.31.a: "Sign the armistice."
 cwp_korea.31.b: "We will not accept a divided Korea."

 # ---- Chapter 2: je_cwp_two_koreas ----
 je_cwp_two_koreas: "The Two Koreas"
 je_cwp_two_koreas_reason: "The fighting has stopped, but no peace treaty has been signed. Two Korean states, each claiming the whole peninsula, face each other across a fortified line. Whether that line lasts, breaks or fades away depends on the generals, the diplomats and the patrons in Washington, Moscow and Beijing."
 je_cwp_two_koreas_reunified: "Reunification by Agreement"
 je_cwp_two_koreas_reunified_desc: "After decades of division the two Korean governments have agreed to become one. The weaker state is folded into the stronger."
 je_cwp_two_koreas_one_state: "Reunification by Force or Collapse"
 je_cwp_two_koreas_one_state_desc: "Only one Korean state remains on the peninsula."
 cwp_tkor_status_divided: "Korea remains divided along the armistice line."
 cwp_tkor_status_crisis: "The peninsula is in crisis. A new war is possible."
 cwp_tkor_status_thaw: "The leaders of the two Koreas have met. For the first time since the war, reconciliation seems possible."
 cwp_tkor_status_war: "War has returned to the peninsula."
 cwp_tkor_both_agree_tt: "Both Korean governments have agreed to reunify"
 cwp_tkor_reunification_tt: "The state with the larger economy absorbs the other."
 cwp_tkor_tension_high_tt: "Tension on the peninsula is high (70 or more)"
 cwp_tkor_not_in_crisis_tt: "The peninsula is not in a full crisis (tension below 80)"
 cwp_tkor_summit_tt: "With both sides talking, the leaders will meet."
 cwp_tkor_summit_effect_tt: "A summit has been held: one of the conditions for reunification by agreement."
 cwp_tkor_war_crisis_tt: "Tension on the peninsula is at breaking point (80 or more)"
 cwp_tkor_war_gate_tt: "Nothing holds us back: for the North, no American troops or defence treaty and a stronger army; for the South, a North abandoned by its patrons, without the bomb, and a stronger army"
 cwp_tkor_cond_summit_tt: "The leaders of the two Koreas have met at a summit"
 cwp_tkor_cond_calm_tt: "The DMZ is calm (tension below 30)"
 cwp_tkor_cond_engagement_tt: "The North is open to southern aid, investment and visitors"
 cwp_tkor_cond_superpowers_tt: "The superpowers no longer hold the division in place: détente between Washington and Moscow, or a North abandoned by its patrons"
 cwp_tkor_cond_no_bomb_tt: "The North does not have nuclear weapons"
 cwp_tkor_agrees_tt: "Once both governments agree, Korea reunifies."
 cwp_tkor_bomb_talks_tt: "We keep the door to negotiations open."

 cwp_tkor_tension_bar: "Inter-Korean Tension"
 cwp_tkor_tension_bar_desc: "How close the peninsula is to a new war. At 80 or more, either side may decide to fight; below 30, the two Koreas can begin to talk about becoming one."
 cwp_tkor_tension_fading: "Incidents fade from memory"
 cwp_tkor_tension_provocations: "Northern provocations"
 cwp_tkor_tension_retaliation: "Southern retaliation"
 cwp_tkor_tension_nuclear_programme: "The North's nuclear programme"
 cwp_tkor_tension_nuclear_power: "The North has the bomb"
 cwp_tkor_tension_no_guarantee: "No American guarantee for the South"
 cwp_tkor_tension_restraint: "Patrons restrain Pyongyang"
 cwp_tkor_tension_dialogue_both: "Both Koreas are talking"
 cwp_tkor_tension_dialogue_one: "One Korea offers talks"
 cwp_tkor_tension_engagement: "Southern engagement with the North"

 cwp_tkor_provocation_button: "Armed Provocation"
 cwp_tkor_provocation_button_desc: "Send commandos across the line, seize a ship, shell an island. It keeps the South off balance and the army loyal."
 cwp_tkor_restrain_button: "Alliance Restraint"
 cwp_tkor_restrain_button_desc: "Tell our Korean allies that we will not be dragged into a war of their choosing."
 cwp_tkor_station_forces_button: "Station Forces in Korea"
 cwp_tkor_station_forces_button_desc: "Keep American divisions on the peninsula as a tripwire against another invasion."
 cwp_tkor_withdraw_forces_button: "Withdraw Forces from Korea"
 cwp_tkor_withdraw_forces_button_desc: "Bring the troops home and leave the South to defend itself."
 cwp_tkor_dialogue_button: "Offer Talks"
 cwp_tkor_dialogue_button_desc: "Propose talks with the other Korea on family reunions, trade and the principles of reunification."
 cwp_tkor_engagement_button: "Engagement Policy"
 cwp_tkor_engagement_button_desc: "Offer food aid, joint industrial zones and tourism in the hope that contact will change the North, as Seoul's Sunshine Policy later tried."
 cwp_tkor_bomb_button: "Build the Bomb"
 cwp_tkor_bomb_button_desc: "Only nuclear weapons can guarantee that no one invades us. Start a weapons programme of our own."
 cwp_tkor_renew_war_button: "Renew the War"
 cwp_tkor_renew_war_button_desc: "The armistice was never peace. Cross the line and finish what was started."
 cwp_tkor_reunification_button: "Agree to Reunification"
 cwp_tkor_reunification_button_desc: "Accept a single Korean state."

 cwp_tkor_provocations: "Provocations"
 cwp_tkor_provocations_desc: "Our raids and incidents along the DMZ keep the enemy on edge."
 cwp_tkor_retaliation: "Retaliation"
 cwp_tkor_retaliation_desc: "We answered the North's attack in kind."
 cwp_tkor_restraint_shown: "Restraint"
 cwp_tkor_restraint_shown_desc: "We absorbed the North's attack without striking back."
 cwp_tkor_restraint: "Alliance Restraint"
 cwp_tkor_restraint_desc: "Our allies have made it clear they will not back a new war."
 cwp_tkor_dialogue: "Inter-Korean Talks"
 cwp_tkor_dialogue_desc: "We are in talks with the other Korean government."
 cwp_tkor_engagement: "Inter-Korean Economic Cooperation"
 cwp_tkor_engagement_desc: "Aid, investment and tourists arrive from the South."
 cwp_tkor_engagement_cost: "Engagement Policy"
 cwp_tkor_engagement_cost_desc: "We are paying for aid and joint projects in the North."
 cwp_tkor_sanctions: "International Sanctions"
 cwp_tkor_sanctions_desc: "Our nuclear test has brought sanctions down on us."

 cwp_korea.40.t: "Incident on the DMZ"
 cwp_korea.40.d: "Northern commandos have struck across the demilitarized zone. Soldiers and civilians are dead, and the public demands an answer."
 cwp_korea.40.f: "Every few years the line flares up, and every time both sides step back from the edge. So far."
 cwp_korea.40.a: "Strike back."
 cwp_korea.40.b: "Protest, and hold the line."
 cwp_korea.41.t: "Inter-Korean Summit"
 cwp_korea.41.d: "For the first time in years, the leaders of the two Koreas have met. They signed a joint declaration on peaceful reunification, family reunions and economic cooperation."
 cwp_korea.41.f: "Two men shook hands at the line where their armies still face each other."
 cwp_korea.41.a: "A first step."
 cwp_korea.42.t: "North Korea Tests the Bomb"
 cwp_korea.42.d: "Seismographs have picked up an underground nuclear test in the North. Pyongyang has the weapon it says will keep it safe forever."
 cwp_korea.42.f: "The armistice line now runs between a nuclear state and its neighbour."
 cwp_korea.42.a: "Impose sanctions."
 cwp_korea.42.b: "Keep talking."
