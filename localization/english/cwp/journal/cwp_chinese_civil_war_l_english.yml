l_english:
 # Journal entry
 je_cwp_chinese_civil_war: "The Chinese Civil War"
 je_cwp_chinese_civil_war_reason: "Japan has surrendered, but China has not found peace. The Nationalist government in Nanjing commands the larger armies, the cities and the seat at the United Nations. The Communists hold the villages of the north from Yan'an to Shandong, and the Red Army still occupies Manchuria. In Washington and Moscow both great powers say they want a united China. Neither yet knows which China it will get."
 je_cwp_chinese_civil_war_status_peoples_war: "Neither side can yet force a decision"
 je_cwp_chinese_civil_war_status_decisive: "The strategic offensives have begun"
 je_cwp_chinese_civil_war_status_ceasefire: "A US-brokered ceasefire is in force"
 je_cwp_chinese_civil_war_status_strait: "The Nationalists hold only Formosa"
 je_cwp_chinese_civil_war_standoff_desc: "The Communists rule the mainland. The Nationalists rule Formosa, and the strait between them is a frontier that neither side recognizes."
 je_cwp_chinese_civil_war_divided_desc: "China is divided along the line where the armies stopped, with two governments that each claim the whole country."
 je_cwp_chinese_civil_war_communist_desc: "The People's Liberation Army has taken all of China, Formosa included."
 je_cwp_chinese_civil_war_nationalist_desc: "The Nationalist government has destroyed the Communist state and rules a reunified China."
 je_cwp_chinese_civil_war_invalid_desc: "Neither Chinese government survives."

 # Bar
 cwp_ccw_balance_bar: "Balance of the War"
 cwp_ccw_balance_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_ccw_balance_bar_explain_tt Balance of the war#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#! (Nationalists -, Communists +)"
 cwp_ccw_balance_bar_explain_tt: "Which side has the upper hand: below zero the Nationalists, above it the Communists. Battles won between the two move it as well. At a lead of #v 25#! the leading side can launch its strategic offensive."
 cwp_ccw_balance_bar_second_desc: "Offensive at a lead of #v 25#!"
 cwp_ccw_bar_hyperinflation: "Nationalist hyperinflation"
 cwp_ccw_bar_us_aid: "American aid to the Nationalists"
 cwp_ccw_bar_land_reform: "Land reform in the liberated areas"
 cwp_ccw_bar_soviet_aid: "Soviet aid to the Communists"
 cwp_ccw_bar_manchurian_base: "Communist base in Manchuria"
 cwp_ccw_bar_pla_larger: "The People's Liberation Army outnumbers the Nationalists"
 cwp_ccw_bar_nra_larger: "The Nationalist army outnumbers the Communists"

 # War support (per week)
 cwp_ccw_war_support_peoples_war: "People's war"
 cwp_ccw_war_support_strait: "Taiwan Strait"
 cwp_ccw_war_support_balance: "Losing the civil war"
 cwp_ccw_war_support_winning: "Winning the civil war"

 # Buttons
 cwp_ccw_strategic_offensive_button: "Launch the Strategic Offensive"
 cwp_ccw_strategic_offensive_button_desc: "The war of base areas and walled cities has done its work. Concentrate the field armies and force a decision."
 cwp_ccw_land_reform_button: "Land Reform in the Liberated Areas"
 cwp_ccw_land_reform_button_desc: "Divide the landlords' fields among the peasants who work them. Every village that gains land gives the army its sons."
 cwp_ccw_currency_reform_button: "Currency Reform"
 cwp_ccw_currency_reform_button_desc: "Replace the worthless fabi with a new currency backed by gold and enforce price controls in the cities."
 cwp_ccw_currency_reform_holds_tt: "The reform holds only while we are not in default, our debt stays below half our debt ceiling and the war is not being lost."
 cwp_ccw_great_retreat_button: "Retreat to Taiwan"
 cwp_ccw_great_retreat_button_desc: "Move the government, the gold reserves and the best divisions across the strait, and carry on the fight from Formosa."
 cwp_ccw_propose_armistice_button: "Propose an Armistice"
 cwp_ccw_propose_armistice_button_desc: "Offer to stop the fighting where the armies stand. Every state each side controls passes to it whole."
 cwp_ccw_break_ceasefire_button: "Break the Ceasefire"
 cwp_ccw_break_ceasefire_button_desc: "The truce serves only the enemy. Resume the offensive."
 cwp_ccw_soviet_withdrawal_button: "Withdraw from Manchuria"
 cwp_ccw_red_army_withdrawal_desc: "Bring the Red Army home and decide who takes over the north-east."
 cwp_ccw_soviet_aid_button: "Send Material Aid"
 cwp_ccw_soviet_aid_button_desc: "Supply the Chinese comrades with arms, advisers and railway engineers. The first deliveries are the captured stocks of the Kwantung Army."
 cwp_ccw_marshall_mission_button: "The Marshall Mission"
 cwp_ccw_marshall_mission_button_desc: "Send a special envoy to arrange a ceasefire and a coalition government. While talks go on, no American arms will go to Nanjing."
 cwp_ccw_ceasefire_holds_tt: "The ceasefire holds until one side breaks it."
 cwp_ccw_us_aid_button: "China Aid Act"
 cwp_ccw_us_aid_button_desc: "Grant the Nationalist government credits, arms and surplus equipment."
 cwp_ccw_strait_patrol_button: "Patrol the Taiwan Strait"
 cwp_ccw_strait_patrol_button_desc: "Order the Seventh Fleet into the strait to prevent any attack on Formosa."

 # Tooltips
 cwp_ccw_balance_communist_25_tt: "The balance of the war is #v 25#! or more in the Communists' favor"
 cwp_ccw_balance_nationalist_25_tt: "The balance of the war is #v 25#! or more in the Nationalists' favor"
 cwp_ccw_balance_undecided_tt: "Neither side leads by #v 40#! or more"
 cwp_ccw_capital_occupied_tt: "Our capital is occupied"
 cwp_ccw_armistice_cooldown_tt: "No armistice has been proposed in the last year"
 cwp_ccw_war_support_low_tt: "Our war support is below #v 25#!"
 cwp_ccw_exhaustion_tt: "The war has been deadlocked for at least two years"
 cwp_ccw_no_ceasefire_tt: "No American-brokered ceasefire is in force"
 cwp_ccw_roc_no_mainland_tt: "The Nationalists control no state on the mainland"
 cwp_ccw_war_goes_on_tt: "The war goes on."
 cwp_ccw_prepare_crossing_tt: "The war goes on. Formosa falls only if our troops land and hold it."
 cwp_ccw_offer_line_tt: "We offer to end the war where it stands. The Nationalists decide whether to accept."

