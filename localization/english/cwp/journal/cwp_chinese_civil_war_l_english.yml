 cwp_ccw_us_arms_embargo: "American Arms Embargo"
 cwp_ccw_strait_patrolled: "Taiwan Strait Patrol"
 cwp_ccw_strait_patrol_cost: "Taiwan Strait Patrol"
 cwp_ccw_manchurian_garrison: "Occupation of Manchuria"
 cwp_ccw_manchurian_reparations: "Soviet Removals from Manchuria"
 cwp_ccw_stripped_industry: "Dismantled Industry"
 cwp_ccw_relocation: "Retreat to Taiwan"
 cwp_ccw_victory: "Victor of the Civil War"
 cwp_ccw_settlement: "End of the Civil War"

 # Events
 cwp_ccw.1.t: "The Resumption of the Civil War"
 cwp_ccw.1.d_prc: "Our armies came out of the war against Japan stronger than they went in. The base areas reach from the loess hills of Shaanxi to the coast of Shandong, and our troops are marching into Manchuria behind the Red Army. Chiang has the cities, the Americans and the gold. We have the countryside, and the countryside is most of China."
 cwp_ccw.1.d_roc: "Eight years of war against Japan have left the government victorious and exhausted. Our armies are three times the size of the Communists', and American ships are carrying them north to take back the cities. But the treasury pays for them by printing money, and every month the fabi buys less."
 cwp_ccw.1.d_usa: "China is our ally and one of the Big Five, but it is sliding into civil war. A Communist victory would hand Moscow the most populous country on earth. A Nationalist victory may cost more than the Generalissimo's government is worth. We can mediate, arm Chiang, or do both."
 cwp_ccw.1.d_rus: "Our troops hold Manchuria, its railways and the arsenals of the Kwantung Army. By the treaty of August 1945 we recognize Chiang's government and have promised to hand the north-east back to it. The Chinese comrades in the countryside have other hopes, and the Americans are watching."
 cwp_ccw.1.f: "“Political power grows out of the barrel of a gun.”\n- Mao Zedong, 1927"
 cwp_ccw.1.a: "The fight for China begins."

 cwp_ccw.2.t: "The Red Army Leaves Manchuria"
 cwp_ccw.2.d: "Holding Manchuria ties down our troops and sours every conversation with the Americans. The treaty of 1945 obliges us to hand the north-east to the Nationalist government, but it says nothing about the countryside, the stores of captured Japanese weapons, or which Chinese troops happen to arrive first."
 cwp_ccw.2.f: "Withdrawal is a question of timing: who reaches each town as our columns leave it."
 cwp_ccw.2.a: "Honor the treaty, and leave the arsenals behind."
 cwp_ccw.2.b: "Hand Manchuria to the Chinese comrades."
 cwp_ccw.2.c: "Hand Manchuria to the government."

 cwp_ccw.3.t: "The Soviets Withdraw"
 cwp_ccw.3.d: "The last Soviet trains have crossed the border. The north-east, with its railways, its mines and what is left of its factories, is now in Chinese hands. Which Chinese hands will be settled by fighting."
 cwp_ccw.3.f: "Manchuria is the most industrialized region of China. Whoever holds it holds the arsenal of the war."
 cwp_ccw.3.a: "The north-east is ours to win."

 cwp_ccw.4.t: "The Decisive Campaigns"
 cwp_ccw.4.d: "The war of skirmishes and blockades is over. Whole field armies are on the move, and the campaigns now beginning will decide who rules China."
 cwp_ccw.4.f: "From now on each lost campaign costs not a county but a province."
 cwp_ccw.4.a: "Everything is at stake."

 cwp_ccw.5.t: "An Offer of Armistice"
 cwp_ccw.5.d: "The enemy proposes to stop the fighting where the armies stand. Each side would keep the territory it holds, and the border would run along the front line. Peace would leave China divided, but the alternative is more years of war."
 cwp_ccw.5.f: "Both governments would still claim to be the only lawful government of all China."
 cwp_ccw.5.a: "Accept the armistice."
 cwp_ccw.5.b: "No peace with traitors."

 cwp_ccw.6.t: "The Armistice Offer"
 cwp_ccw.6.d_accepted: "The enemy has accepted our offer. The guns have stopped along the front, and the line where they stopped is now the border between two Chinas."
 cwp_ccw.6.d_rejected: "The enemy has rejected our offer. There will be no peace while they think they can still win."
 cwp_ccw.6.f: "A ceasefire line has a way of becoming permanent."
 cwp_ccw.6.a: "So be it."

 cwp_ccw.7.t: "The Strait"
 cwp_ccw.7.d: "The mainland is ours, but the Nationalist government sits on Formosa behind a hundred miles of open sea. Crossing it means a fleet, landing craft and air cover we do not yet have, and the enemy has had time to dig in."
 cwp_ccw.7.f: "The failed landing on Kinmen in October 1949 cost the People's Liberation Army nearly three divisions."
 cwp_ccw.7.a: "Prepare the crossing."
 cwp_ccw.7.b: "Consolidate the mainland first."

 cwp_ccw.8.t: "The Government Moves to Taiwan"
 cwp_ccw.8.d: "The Nationalist government has moved its capital across the strait to Formosa, taking the gold reserves, the air force and what is left of its best divisions. The Generalissimo promises to return to the mainland."
 cwp_ccw.8.f: "About two million soldiers, officials and civilians crossed the strait in 1949."
 cwp_ccw.8.a: "The war is not over."

 cwp_ccw.9.t: "The Currency Reform Collapses"
 cwp_ccw.9.d: "Hoarding, the black market and the government's own printing presses have broken the new currency. Shops in Shanghai are empty, and the middle class that trusted the reform with its savings has lost them."
 cwp_ccw.9.f: "The gold yuan, launched in August 1948, had lost most of its value within a year."
 cwp_ccw.9.a: "Print more money."

 cwp_ccw.10.t: "The Seventh Fleet in the Strait"
 cwp_ccw.10.d: "American warships now patrol the Taiwan Strait with orders to prevent any attack on Formosa, and any attack from it."
 cwp_ccw.10.f: "Truman gave the order on 27 June 1950, two days after the North Korean invasion of the South."
 cwp_ccw.10.a: "The strait is closed."

 cwp_ccw.11.t: "The End of the Civil War"
 cwp_ccw.11.d_standoff: "The People's Republic rules the mainland and the Republic of China rules Formosa. No peace has been signed, and both claim to be the only China. The strait between them is now a front line of the Cold War."
 cwp_ccw.11.d_divided: "The armies have stopped and the front line has become a border. Two Chinese states face each other across it, each calling itself the lawful government of the whole country."
 cwp_ccw.11.d_communist: "The People's Liberation Army has taken the last Nationalist stronghold. For the first time in a century China is united under a single government, and that government is Communist."
 cwp_ccw.11.d_nationalist: "The Communist state has been destroyed and the Nationalist government rules all of China. The question now is whether it can win the peace."
 cwp_ccw.11.f: "The civil war began in the 1920s and paused for the war against Japan. Its last phase has decided the shape of Asia."
 cwp_ccw.11.a: "A new chapter begins."

 cwp_ccw.12.t: "The Marshall Mission"
 cwp_ccw.12.d: "An American envoy has persuaded both sides to agree to a ceasefire and talks on a coalition government. Truce teams of Nationalist, Communist and American officers are going out to the front. Meanwhile Washington has stopped sending arms to the government."
 cwp_ccw.12.f: "General George Marshall arrived in China in December 1945. The ceasefire he brokered came into force on 10 January 1946."
 cwp_ccw.12.a: "We will see how long it lasts."

 cwp_ccw.13.t: "The Ceasefire Breaks Down"
 cwp_ccw.13.d: "The fighting has resumed in earnest. The truce teams have gone home, and the talks on a coalition government are dead."
 cwp_ccw.13.f: "Marshall left China in January 1947 and blamed both sides for the failure."
 cwp_ccw.13.a: "Back to war."

 cwp_ccw.14.t: "A General Goes Over"
 cwp_ccw.14.d: "One of our army commanders has gone over to the Communists with his troops and his equipment, and the city he was ordered to defend has fallen without a fight. His officers say they saw no reason to die for a lost cause."
 cwp_ccw.14.f: "In January 1949 Fu Zuoyi surrendered Peiping and some 200,000 men without a battle."
 cwp_ccw.14.a: "Find out who else is talking to the enemy."

 cwp_ccw.15.t: "Against Hunger and Civil War"
 cwp_ccw.15.d: "Students in Nanjing, Shanghai and Peiping are marching under the banner “Against Hunger, Against Civil War”. Rice costs more each week, their teachers cannot live on their salaries, and they blame the war and the government that wages it."
 cwp_ccw.15.f: "The student movement of May 1947 spread to more than sixty cities."
 cwp_ccw.15.a: "Disperse them."
 cwp_ccw.15.b: "Let them march."

 cwp_ccw.16.t: "An End at the Strait?"
 cwp_ccw.16.d: "The Communists have stopped at the coast. They propose nothing in writing, but their armies are standing down, and if we stop raiding the mainland the war may simply end where it is. Accepting this would not mean giving up our claim. It would mean admitting we cannot make good on it soon."
 cwp_ccw.16.f: "No armistice or peace treaty ever ended the Chinese Civil War."
 cwp_ccw.16.a: "Hold Formosa, and wait."
 cwp_ccw.16.b: "We will return to the mainland."

 # Campaigns
 cwp_ccw_campaign_liaoshen_button: "The Liaoshen Campaign"
 cwp_ccw_campaign_liaoshen_button_desc: "Cut the Nationalist armies in Manchuria off from the sea and take Shenyang and the southern railway. When every part of Shengjing and Southern Manchuria is ours, the north-east is won."
 cwp_ccw_campaign_huaihai_button: "The Huaihai Campaign"
 cwp_ccw_campaign_huaihai_button_desc: "Destroy the armies holding the railway junction at Xuzhou and the plain between the Huai and the Yellow River. Hold all of Jiangsu and Northern Anhui and the road to Nanjing lies open."
 cwp_ccw_campaign_pingjin_button: "The Pingjin Campaign"
 cwp_ccw_campaign_pingjin_button_desc: "Encircle Peiping and Tianjin. Once both are ours, North China is liberated."
 cwp_ccw_campaign_northeast_button: "Recover the North-East"
 cwp_ccw_campaign_northeast_button_desc: "Drive the Communists out of Manchuria, all of it, before they can turn the Japanese arsenals and the Soviet railway into an army."
 cwp_ccw_campaign_shandong_button: "Clear Shandong"
 cwp_ccw_campaign_shandong_button_desc: "Take the whole of Shandong and cut the Communists' road between the north and the coast."
 cwp_ccw_campaign_yanan_button: "Take Yan'an"
 cwp_ccw_campaign_yanan_button_desc: "Seize the Communist capital in northern Shaanxi. The world will see that the bandits have no home."
 cwp_ccw_two_campaigns_lost_tt: "The Communists have won at least #v 2#! great campaigns"
 cwp_ccw_balance_communist_40_tt: "The balance of the war is #v 40#! or more in the Communists' favor"
 cwp_ccw_campaign_defeat: "Lost Campaign"
 cwp_ccw_overextended: "Overextended"
 cwp_ccw_yanan_taken: "Yan'an Taken"
 cwp_ccw.17.t: "A Campaign Decided"
 cwp_ccw.17.d_liaoshen: "Shenyang has fallen and the last Nationalist armies in the north-east have surrendered or been destroyed. Manchuria, its railways and its arsenals belong to the People's Liberation Army."
 cwp_ccw.17.d_huaihai: "On the plains around Xuzhou whole Nationalist army groups have been surrounded and destroyed. Nothing now stands between the People's Liberation Army and the Yangtze."
 cwp_ccw.17.d_pingjin: "Tianjin has been stormed and Peiping has opened its gates. North China is in Communist hands."
 cwp_ccw.17.d_northeast: "The Nationalist armies have cleared Manchuria. The Communists have lost their industrial base and the Soviet border at their backs."
 cwp_ccw.17.d_shandong: "Shandong has been cleared, cutting the Communist base areas of the north off from the coast."
 cwp_ccw.17.d_yanan: "Nationalist troops have marched into Yan'an. The cave headquarters were empty: the Communist leadership had left days before, and the army that took the town must now hold it."
 cwp_ccw.17.f: "The three great campaigns of 1948 and 1949, Liaoshen, Huaihai and Pingjin, cost the Nationalists about one and a half million men."
 cwp_ccw.17.a: "The war turns."
 cwp_ccw_occupation_peoples_war: "People's war in China"
 cwp_ccw_occupation_ceasefire: "Ceasefire in China"
 cwp_ccw_war_support_below_30_tt: "Our war support is below #v 30#!"
