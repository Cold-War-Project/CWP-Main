l_english:
 je_cwp_two_germanies: "The Two Germanies"
 je_cwp_two_germanies_reason: "Two German states now stand where the occupation zones were, each sovereign on paper and each tied to its own bloc. The Federal Republic claims to speak for all Germans and refuses to recognize the GDR. The GDR must win the loyalty of people who can still compare its shops with those across the border and, in Berlin, simply walk to the West."
 cwp_tg_status_open_border: "The border is guarded, but Berlin is still open"
 cwp_tg_status_wall: "The GDR has closed the border, Berlin included."
 cwp_tg_possible_tt: "Both German states are sovereign"
 cwp_tg_invalid_tt: "The GDR no longer exists, or Germany has been reunited"
 cwp_tg_hallstein_tt: "The Hallstein Doctrine is still our policy"
 cwp_tg_status_basic_treaty: "The two German states recognize each other"
 cwp_tg_status_support_withdrawn: "Moscow will no longer guarantee the GDR's rule."

 cwp_tg_outcome_wende: "#b Die Wende#! begins if:\n"
 cwp_tg_outcome_wende_effect_header: "If #b Die Wende#! begins:\n$EFFECT$"
 cwp_tg_outcome_wende_desc: "The Socialist Unity Party has lost the consent of the people. Crowds fill the streets of Leipzig and East Berlin, and the regime has to answer them."
 cwp_tg_outcome_wende_result_tt: "#v $je_cwp_die_wende$#! begins as a new [concept_journal_entry]"
 cwp_tg_outcome_wende_tt: "GDR Legitimacy has fallen to #v 0#!"
 cwp_tg_outcome_lasting: "The division becomes #b lasting#! if:\n"
 cwp_tg_outcome_lasting_effect_header: "If the division becomes #b lasting#!:\n$EFFECT$"
 cwp_tg_outcome_lasting_desc: "East Germans live as well as West Germans, and the two states have signed the Basic Treaty. Germany looks set to stay two states."
 cwp_tg_outcome_lasting_result_tt: "Two German states remain, and #v $je_cwp_die_wende$#! will not begin"
 cwp_tg_outcome_lasting_tt: "GDR legitimacy at #v 100#!, the Basic Treaty in force, and East Germans as well off as West Germans"
 cwp_tg_outcome_one_state: "#b One German state#! remains if:\n"
 cwp_tg_outcome_one_state_effect_header: "If #b one German state#! remains:\n$EFFECT$"
 cwp_tg_outcome_one_state_desc: "Only one German state is left."
 cwp_tg_outcome_one_state_result_tt: "The division is over, and #v $je_cwp_die_wende$#! will not begin"
 cwp_tg_outcome_one_state_tt: "The Federal Republic or the GDR no longer exists"

 cwp_tg_legitimacy_bar: "GDR Legitimacy"
 cwp_tg_legitimacy_bar_desc: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],cwp_tg_legitimacy_bar_explain_tt GDR legitimacy#!: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#! (collapse at 0)"
 cwp_tg_legitimacy_bar_explain_tt: "Whether East Germans accept the rule of the Socialist Unity Party. At #v 0#! the GDR's rule collapses."
 cwp_tg_legitimacy_bar_emigration: "East Germans leaving through Berlin (Republikflucht)"
 cwp_tg_legitimacy_bar_living_worse: "East German living standards below West Germany's"
 cwp_tg_legitimacy_bar_living_better: "East German living standards at least equal to West Germany's"
 cwp_tg_legitimacy_bar_soviet_backing: "Soviet backing"
 cwp_tg_legitimacy_bar_support_withdrawn: "Moscow's withdrawal of its guarantee"
 cwp_tg_legitimacy_bar_wall: "The closed border"
 cwp_tg_legitimacy_bar_stasi: "The Stasi"
 cwp_tg_legitimacy_bar_consumer_socialism: "Consumer socialism"
 cwp_tg_legitimacy_bar_recognition: "Recognition under the Basic Treaty"
 cwp_tg_legitimacy_bar_western_television: "Visits and Western television under the Basic Treaty showing a richer West"
 cwp_tg_legitimacy_bar_radicals: "Radicals in the GDR (20% or more)"


 cwp_tg_wall_button: "Close the Border"
 cwp_tg_wall_button_desc: "Seal the sector border in Berlin with barbed wire, and later concrete, and stop the flight to the West."
 cwp_tg_emigration_active_tt: "East Germans are leaving for the richer West"
 cwp_tg_stasi_button: "Expand the Stasi"
 cwp_tg_stasi_button_desc: "Give the Ministry for State Security more officers, more informers and a freer hand."
 cwp_tg_consumer_socialism_button: "Consumer Socialism"
 cwp_tg_consumer_socialism_button_desc: "Put housing, cars and consumer goods ahead of heavy industry, and buy the people's patience."
 cwp_tg_ostpolitik_button: "Ostpolitik"
 cwp_tg_ostpolitik_button_desc: "Drop the Hallstein Doctrine and seek \"change through rapprochement\" with the East."
 cwp_tg_basic_treaty_button: "Offer a Basic Treaty"
 cwp_tg_basic_treaty_button_desc: "Propose a treaty under which the two German states recognize each other's borders and exchange permanent missions, without either calling the other a foreign country."
 cwp_tg_basic_treaty_button_tt: "The GDR will answer the offer"
 cwp_tg_basic_treaty_detente_tt: "Détente: US-Soviet relations are 20 or more"
 cwp_tg_basic_treaty_border_tt: "The GDR has closed its border, and wants that border recognized"
 cwp_tg_basic_treaty_moscow_tt: "Moscow still stands behind the GDR and lets it negotiate"
 cwp_tg_basic_treaty_pending_tt: "No offer is waiting for an answer"
 cwp_tg_freikauf_button: "Buy Prisoners Free"
 cwp_tg_freikauf_button_desc: "Pay the GDR in hard currency and goods for the release of political prisoners."
 cwp_tg_withdraw_support_button: "The Sinatra Doctrine"
 cwp_tg_withdraw_support_button_desc: "Tell the GDR's leaders that Soviet troops will not save them from their own people."
 cwp_tg_reaffirm_support_button: "The Brezhnev Doctrine"
 cwp_tg_reaffirm_support_button_desc: "Tell the GDR's leaders that the Soviet Union stands behind them after all."

 cwp_tg_republikflucht: "Republikflucht"
 cwp_tg_republikflucht_desc: "Doctors, engineers and skilled workers are leaving for the West."
 cwp_tg_refugees: "Refugees from the East"
 cwp_tg_refugees_desc: "Refugees from the GDR arrive every day, many of them young and skilled."
 cwp_tg_wall: "The Wall"
 cwp_tg_wall_desc: "The border is sealed and guarded by soldiers with orders to shoot."
 cwp_tg_stasi: "The Stasi"
 cwp_tg_stasi_desc: "The Ministry for State Security watches everyone."
 cwp_tg_consumer_socialism: "Consumer Socialism"
 cwp_tg_consumer_socialism_desc: "Investment goes into housing and consumer goods rather than heavy industry."
 cwp_tg_freikauf: "Freikauf"
 cwp_tg_freikauf_desc: "We are paying for the release of political prisoners in the GDR."
 cwp_tg_freikauf_income: "Freikauf Payments"
 cwp_tg_freikauf_income_desc: "The Federal Republic pays hard currency for our prisoners."
 cwp_tg_basic_treaty: "The Basic Treaty"
 cwp_tg_basic_treaty_desc: "The two German states have normalized their relations."
 cwp_tg_support_withdrawn: "The Sinatra Doctrine"
 cwp_tg_support_withdrawn_desc: "We no longer spend troops and money keeping the GDR's leaders in power."

 cwp_two_germanies.1.t: "The Two Germanies"
 cwp_two_germanies.1.d: "The occupation is over, and Germany is two states. The Federal Republic is rebuilding fast and claims to speak for all Germans. The German Democratic Republic is building socialism, and every month thousands of its citizens take the S-Bahn to West Berlin and do not come back. How long the division lasts depends on what each side can offer its people."
 cwp_two_germanies.1.f: "Systemkonkurrenz: the competition of systems."
 cwp_two_germanies.1.a: "We will see which system wins."

 cwp_two_germanies.2.t: "The Border Is Closed"
 cwp_two_germanies.2.d: "Overnight, East German soldiers and workers' militia have strung barbed wire along the sector border in Berlin and torn up the streets that crossed it. Concrete is following. The flight to the West is over, and families on either side of the line no longer know when they will see each other again."
 cwp_two_germanies.2.f: "\"Niemand hat die Absicht, eine Mauer zu errichten.\" (Walter Ulbricht, June 1961)"
 cwp_two_germanies.2.a: "A wall around a people."

 cwp_two_germanies.3.t: "The Basic Treaty"
 cwp_two_germanies.3.d: "Bonn proposes a treaty on the basis of relations between the two German states. Each would respect the other's borders and independence, and they would exchange permanent missions rather than embassies. The Federal Republic still does not call us a foreign country, but it would accept that we exist."
 cwp_two_germanies.3.f: "\"Two states in Germany\" (Willy Brandt, 1969)"
 cwp_two_germanies.3.a: "Sign the treaty."
 cwp_two_germanies.3.b: "Refuse. We demand full recognition as a foreign state."

 cwp_two_germanies.4.t: "The Basic Treaty Is Signed"
 cwp_two_germanies.4.d: "The two German states have signed a treaty that normalizes their relations. Both will join the United Nations, visits across the border will become easier, and the long freeze between Bonn and East Berlin is thawing."
 cwp_two_germanies.4.f: "Wandel durch Annäherung: change through rapprochement (Egon Bahr, 1963)."
 cwp_two_germanies.4.a: "A new chapter."

 cwp_two_germanies.5.t: "Soviet Disengagement"
 cwp_two_germanies.5.d: "Soviet leaders have told us plainly that their troops will not be used to keep us in power. Each socialist country must find its own way, and answer to its own people."
 cwp_two_germanies.5.f: "\"Wer zu spät kommt, den bestraft das Leben.\" (attributed to Mikhail Gorbachev, 1989)"
 cwp_two_germanies.5.a: "We are on our own."
 je_cwp_ostpolitik: "Ostpolitik"
 je_cwp_ostpolitik_reason: "We have given up the Hallstein Doctrine. Instead of isolating the East, we will deal with it: renounce force in a treaty with Moscow, accept Poland's western border, and then settle our relations with the GDR itself."
 cwp_tg_ostpolitik_status_start: "Negotiating a treaty with Moscow"
 cwp_tg_ostpolitik_status_moscow: "The Moscow Treaty is signed. Warsaw is next."
 cwp_tg_ostpolitik_status_warsaw: "Treaties with Moscow and Warsaw signed"
 cwp_tg_ostpolitik_outcome_desc: "Moscow, Warsaw and East Berlin have all signed. The Federal Republic's relations with the East rest on treaties now."
 cwp_tg_moscow_treaty_signed_tt: "The Moscow Treaty is signed"
 cwp_tg_warsaw_treaty_signed_tt: "The Warsaw Treaty is signed"
 cwp_tg_basic_treaty_signed_tt: "The Basic Treaty with the GDR is signed"
 cwp_tg_basic_treaty_moscow_treaty_tt: "The Moscow Treaty is signed"
 cwp_tg_moscow_relations_tt: "Our relations with the Soviet Union are at least neutral"
 cwp_tg_moscow_treaty_button: "The Moscow Treaty"
 cwp_tg_moscow_treaty_button_desc: "Sign a treaty with the Soviet Union in which both sides renounce the use of force and respect the existing borders in Europe."
 cwp_tg_warsaw_treaty_button: "The Warsaw Treaty"
 cwp_tg_warsaw_treaty_button_desc: "Recognize the Oder-Neisse line as Poland's western border and normalize relations with Warsaw."
 cwp_tg_legitimacy_bar_hallstein: "Isolation abroad under the Hallstein Doctrine"
 cwp_tg_oder_neisse_accepted: "The Oder-Neisse Line"
 cwp_tg_oder_neisse_accepted_desc: "We have accepted Poland's western border."
 cwp_tg_ostpolitik_achieved: "The Eastern Treaties"
 cwp_tg_ostpolitik_achieved_desc: "Our relations with the Soviet Union, Poland and the GDR rest on treaties."
 cwp_tg_legitimacy_bar_one_party: "One-party rule without free elections"
