l_english:
 cwp_tvt_own_market_decision: "Trade Test: My Country"
 cwp_tvt_own_market_decision_desc: "Shows this country's trade in money in an event, and writes one row per good of its market to debug.log (rows start with CWP_TVT)."
 cwp_tvt_all_countries_decision: "Trade Test: All Countries"
 cwp_tvt_all_countries_decision_desc: "Writes one row per country to debug.log (rows start with CWP_TVT): engine totals, price-times-quantity totals, and trade with this country."
 cwp_tvt.1.t: "Trade Value Test"
 cwp_tvt.1.d: "#b Route A: engine totals#!\nExports: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_a_exports')|v2]\nImports: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_a_imports')|v2]\nExports plus imports: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_a_trade')|v2]\nBalance: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_a_balance')|+=2]\n\n#b Route B: quantity times base price#!\nExports: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_b_exports_base')|v2]\nImports: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_b_imports_base')|v2]\n\n#b Route B: quantity times market price, treaty transfers left out#!\nExports: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_b_exports_est')|v2]\nImports: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_b_imports_est')|v2]\nBalance: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_b_balance_est')|+=2]\n\n#b Scale#!\nGDP: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_gdp')|v0]\nWeekly income: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_income')|v0]"
 cwp_tvt.1.f: "Route B covers the whole market. Its market-price figures should equal Route A added up over every member of the market. The rows for each good are in debug.log."
 cwp_tvt.1.a: "Noted."
