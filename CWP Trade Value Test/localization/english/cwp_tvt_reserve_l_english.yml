l_english:
 cwp_tvt_reserve_limit: "Reserve Limit Test"
 cwp_tvt_reserve_show_decision: "Reserve Test: Show"
 cwp_tvt_reserve_show_decision_desc: "Shows this country's gold reserve limit beside the figures it is built from, and writes them to debug.log."
 cwp_tvt_reserve_imports_decision: "Reserve Test: Limit = 26 Weeks of Imports"
 cwp_tvt_reserve_imports_decision_desc: "Applies a modifier whose size is computed so that the gold reserve limit becomes 26 weeks of this country's imports."
 cwp_tvt_reserve_fixed_decision: "Reserve Test: Limit = 5,000,000"
 cwp_tvt_reserve_fixed_decision_desc: "Applies a modifier whose size is computed so that the gold reserve limit becomes a fixed 5,000,000, whatever the size of the economy."
 cwp_tvt_reserve_clear_decision: "Reserve Test: Clear"
 cwp_tvt_reserve_clear_decision_desc: "Removes the test modifier, returning the gold reserve limit to normal."
 cwp_tvt_reserve.1.t: "Reserve Limit Test"
 cwp_tvt_reserve.1.d: "#b The engine's figures#!\nGold reserve limit: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_reserve_limit')|v0]\nGold reserves: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_reserves')|v0]\nReserves as a share of the limit: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_reserves_scaled')|v3]\n\n#b What the limit is built from#!\nGDP: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_gdp')|v0]\n20% of GDP: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_reserve_base')|v0]\nLimit divided by 20% of GDP: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_reserve_limit_ratio')|v3]\n\n#b Targets the Set decisions aim at#!\n26 weeks of imports: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_reserve_target_imports')|v0] (multiplier [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_reserve_mult_imports')|v3])\nFixed sum: [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_reserve_target_fixed')|v0] (multiplier [ROOT.GetCountry.MakeScope.ScriptValue('cwp_tvt_reserve_mult_fixed')|v3])"
 cwp_tvt_reserve.1.f: "After a Set decision, let a week pass and take Show again. The limit should then equal the target, and the ratio should have moved away from 1."
 cwp_tvt_reserve.1.a: "Noted."
