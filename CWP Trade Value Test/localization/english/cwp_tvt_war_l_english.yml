l_english:
 cwp_tvt_war_show_decision: "War Test: Show"
 cwp_tvt_war_show_decision_desc: "Counts this country's wars, enemies, truces and occupied provinces, shows them in an event and writes them to debug.log (rows start with CWP_TVT WAR)."
 cwp_tvt_war_end_decision: "War Test 1: End My Wars"
 cwp_tvt_war_end_decision_desc: "Ends every war this country is in with end_play, and nothing else. Take Show a week later to see what became of the occupied provinces and whether a truce exists."
 cwp_tvt_war_freeze_decision: "War Test 2: Freeze the Front"
 cwp_tvt_war_freeze_decision_desc: "Hands every occupied province to the country occupying it. The war goes on."
 cwp_tvt_war_armistice_decision: "War Test 3: Armistice"
 cwp_tvt_war_armistice_decision_desc: "Hands every occupied province to its occupier, ends the wars with end_play, and sets a five-year truce with every enemy."
 cwp_tvt_war_exhaust_decision: "War Test 4: Exhaust Both Sides"
 cwp_tvt_war_exhaust_decision_desc: "Pushes the war support of both war leaders to the floor, so that the game should end the war by itself. Note how many days that takes."
 cwp_tvt_war_armistice_late_decision: "War Test 5: Armistice, Ending First"
 cwp_tvt_war_armistice_late_decision_desc: "Records who occupies what, ends the wars with end_play, then hands each recorded province to its occupier. Compare with Test 3, which hands over first."
 cwp_tvt_war.1.t: "War Test"
 cwp_tvt_war.1.d: "Wars: [ROOT.GetCountry.MakeScope.Var('cwp_tvt_war_wars').GetValue|0] (in stalemate: [ROOT.GetCountry.MakeScope.Var('cwp_tvt_war_stalemates').GetValue|0])\nEnemies: [ROOT.GetCountry.MakeScope.Var('cwp_tvt_war_enemies').GetValue|0]\nTruces: [ROOT.GetCountry.MakeScope.Var('cwp_tvt_war_truces').GetValue|0]\n\n#b Provinces in the scanned area#!\nProvinces this country owns: [ROOT.GetCountry.MakeScope.Var('cwp_tvt_war_owned').GetValue|0]\nEnemy provinces this country occupies: [ROOT.GetCountry.MakeScope.Var('cwp_tvt_war_held').GetValue|0]\nOwn provinces the enemy occupies: [ROOT.GetCountry.MakeScope.Var('cwp_tvt_war_lost').GetValue|0]\nHanded over by the last freeze: [ROOT.GetCountry.MakeScope.Var('cwp_tvt_war_moved').GetValue|0]"
 cwp_tvt_war.1.f: "The figures are those at the moment of the click. After a test, let a week pass and take Show again. The same figures are in debug.log."
 cwp_tvt_war.1.a: "Noted."
