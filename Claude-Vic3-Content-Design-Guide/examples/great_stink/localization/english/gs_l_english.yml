l_english:
 # --- Journal entry ---
 je_gs_great_stink: "The Great Stink"
 je_gs_great_stink_reason: "The capital has outgrown its drains. Every cesspool and gutter in the city empties into the river from which its people drink, and with each hot summer the stench and the sickness grow worse. Only a system of intercepting sewers, built at great cost over many years, can carry the filth away."
 je_gs_great_stink_status_start: "The works await a chief engineer"
 je_gs_great_stink_status_works: "The intercepting sewers are under construction"

 # --- Progress bar ---
 gs_sewer_bar: "Main Drainage Works"
 gs_sewer_bar_desc: "Sewers completed"
 gs_sewer_bar_base: "Board of Works"
 gs_sewer_bar_engineer: "Chief engineer appointed"
 gs_sewer_bar_technology: "[GetTechnology('modern_sewerage').GetName] researched"
 gs_sewer_bar_funded: "Emergency funds voted"
 gs_sewer_bar_war: "At war"
 gs_sewer_bar_default: "In default"

 # --- Buttons ---
 gs_vote_funds_button: "Vote Emergency Funds"
 gs_vote_funds_button_desc: "Lay a bill before the legislature empowering the Board of Works to borrow against the public credit. The loan will weigh on the budget for years, but the contractors can be paid and the tunnels driven on."
 gs_appoint_engineer_button: "Appoint a Chief Engineer"
 gs_appoint_engineer_button_desc: "Place the whole of the works under one engineer, with authority over every parish board in the capital. The local boards have managed their own drains for generations, and managed them badly. They will not thank us."

 # --- Decision ---
 gs_sanitary_survey_decision: "Commission a Sanitary Survey"
 gs_sanitary_survey_decision_desc: "Send surveyors to map every drain, cesspool and well in the capital before the city's growth overwhelms them. Should the worst come, we will have the plans in hand."

 # --- Tooltips ---
 gs_sanitary_survey_decision_tt: "If #b The Great Stink#! begins, the #b Main Drainage Works#! start with #v 15#! progress"
 gs_bar_plus_5_tt: "#b Main Drainage Works#!: #v +5#! progress"
 gs_bar_plus_10_tt: "#b Main Drainage Works#!: #v +10#! progress"
 gs_bar_plus_15_tt: "The Sanitary Survey pays off. #b Main Drainage Works#!: #v +15#! progress"
 gs_bar_minus_5_tt: "#b Main Drainage Works#!: #v -5#! progress"
 gs_bar_funded_tt: "While the loan lasts, the works advance by a further #v +1#! each month"
 gs_engineer_appointed_tt: "The works advance by a further #v +0.5#! each month"
 gs_oversized_tt: "When the works are complete, the city receives #b Built for a Century#! instead of #b The River Runs Clean#!"

 # --- Modifiers ---
 gs_foul_river: "Foul River"
 gs_sanitary_survey: "Sanitary Survey"
 gs_sewer_loan: "Main Drainage Loan"
 gs_grand_design_cost: "Sewers of Double Bore"
 gs_cholera_relief: "Cholera Relief"
 gs_embankment_cost: "Building the Embankment"
 gs_cholera_outbreak: "Cholera Outbreak"
 gs_embankment: "River Embankment"
 gs_vestries_overruled: "Local Boards Overruled"
 gs_nine_hours_won: "Nine Hours Won"
 gs_contractors_squeezed: "Contractors Squeezed"
 gs_miasma_doctrine: "Miasma Doctrine Upheld"
 gs_clean_river: "The River Runs Clean"
 gs_built_for_a_century: "Built for a Century"
 gs_wonder_of_the_age: "Engineering Wonder of the Age"
 gs_dead_river: "Dead River"

 # --- Event 1: opener ---
 gs_events.1.t: "The Great Stink"
 gs_events.1.d_gbr: "The Thames has become an open sewer, and this summer's heat has set it cooking. In [SCOPE.sState('gs_city').GetCityHubName] the stench has driven Parliament from its own committee rooms."
 gs_events.1.d: "The river through [SCOPE.sState('gs_city').GetCityHubName] carries the waste of the whole capital, and this summer's heat has set it cooking. The stench has driven the government from its own chambers."
 gs_events.1.f_gbr: "The windows of the House are hung with sheets soaked in chloride of lime. It does not help.\n\n"That noble river... has really become a Stygian pool, reeking with ineffable and intolerable horrors."\n\n— Benjamin Disraeli, 1858"
 gs_events.1.f: ""We have dosed the windows with lime and it does no good. A man cannot draft a bill with a handkerchief pressed to his face. If the ministers wish to know what the poor of this city drink, they need only breathe in.""
 gs_events.1.a: "The engineers shall have whatever they ask."
 gs_events.1.b: "Hang the windows with lime, and pray for rain."

 # --- Event 2: staged choice ---
 gs_events.2.t: "The Diameter of the Pipes"
 gs_events.2.d: "The engineers of the works have calculated the bore that the new sewers of [SCOPE.sState('gs_city').GetCityHubName] require for the city as it stands. They now ask leave to double it, and the estimates with it."
 gs_events.2.f: ""I took the most crowded quarter of the city and allowed every soul in it the most generous flow I could imagine, and I arrived at a figure. Then I thought: we shall only ever dig up these streets once, and there is always the unforeseen. So I have doubled it.""
 gs_events.2.a: "Double it. We dig these streets once."
 gs_events.2.b: "Build to the estimate, and build now."

 # --- Event 3: pulse ---
 gs_events.3.t: "King Cholera"
 gs_events.3.d: "Cholera has broken out in the districts of [SCOPE.sState('gs_city').GetCityHubName] that the new sewers have not yet reached. The dead are counted by the hundred, and the wells are still in use."
 gs_events.3.f: ""They tell me it is the air. I have stood in that air for thirty years and I am alive. The people who are dying, sir, are the people who drink from that pump, and I can show you the cesspool that weeps into it.""
 gs_events.3.a: "Carry clean water to the stricken parishes."
 gs_events.3.b: "It is the bad air. Burn tar in the streets."

 # --- Event 4: pulse ---
 gs_events.4.t: "Nine Hours"
 gs_events.4.d: "The men digging the sewers of [SCOPE.sState('gs_city').GetCityHubName] have put down their tools. They ask for a working day of nine hours at the same pay, and the contractors refuse to hear of it."
 gs_events.4.f: ""Ten hours in a trench under the street, in the dark, in what runs there. Then they dock us for the candles. Nine hours is not a favour. It is what is left of a man by evening.""
 gs_events.4.a: "Nine hours it is. The work must not stop."
 gs_events.4.b: "There are hungry men enough in the countryside."

 # --- Event 5: pulse ---
 gs_events.5.t: "The Embankment"
 gs_events.5.d: "The engineers propose to wall in the river through [SCOPE.sState('gs_city').GetCityHubName] and to carry the great sewer inside the wall, with a road and gardens laid along the top. It would cost a great deal more than a sewer."
 gs_events.5.f: ""Consider what we hide and what we show. Below, the filth of the whole city goes quietly out to sea. Above, a carriage drive, plane trees, gas lamps, and a river that a gentleman may walk beside. That is not an expense. That is a capital city.""
 gs_events.5.a: "A capital should look like one."
 gs_events.5.b: "Sewers first. Promenades can wait."

 # --- Event 10: ending, works complete ---
 gs_events.10.t: "The Main Drainage"
 gs_events.10.d_gbr: "The Main Drainage of London is complete. Eighty-two miles of intercepting sewers now carry the waste of the capital far downriver, and the Thames at Westminster runs clean."
 gs_events.10.d: "The great intercepting sewers of [SCOPE.sState('gs_city').GetCityHubName] are complete. The waste of the capital is carried far downriver, and the water beneath the windows of the government runs clean."
 gs_events.10.f: ""I walked down to the river last night, at low water, in the heat, and I stood there some time before I understood what was wrong. There was nothing to smell. My father would not have believed it. My children will not believe it was ever otherwise.""
 gs_events.10.a: "Let the engines be started."

 # --- Event 11: ending, timeout ---
 gs_events.11.t: "The River Wins"
 gs_events.11.d: "Twenty years on, the sewers of [SCOPE.sState('gs_city').GetCityHubName] remain a patchwork of half-built tunnels and abandoned contracts. The river is as foul as ever, and those who can afford to are leaving the capital."
 gs_events.11.f: ""Every government has had a plan. I have the plans here, a shelf of them, handsomely bound. What I do not have is a sewer. The river has outlasted four ministries, and it will outlast this one.""
 gs_events.11.a: "We have grown used to it."
