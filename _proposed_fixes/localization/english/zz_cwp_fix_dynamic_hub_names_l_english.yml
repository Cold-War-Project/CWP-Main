l_english:
 # CWP fix: vanilla dynamic hub names miss the port hub for these two name sets, so set_hub_names throws
 # "Attempting to assign a key that does not have localization to a hub" (00_dynamic_state_names_europe.txt STATE_POSEN,
 # 00_dynamic_state_names_africa.txt STATE_TRANSVAAL).
 HUB_NAME_STATE_POSEN_port_polish:0 "$STATE_POSEN_polish$"
 HUB_NAME_STATE_TRANSVAAL_port_zulu:0 "$STATE_TRANSVAAL_zulu$"
