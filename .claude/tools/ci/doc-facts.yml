name: Doc facts

on:
  pull_request:
    branches: [CWP2]

jobs:
  doc-facts:
    name: Agent docs match the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Facts that need the vanilla game files are skipped here; agents run the full check on Forge.
      - run: python3 .claude/tools/check_doc_facts.py
